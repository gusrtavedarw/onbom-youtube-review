다면 먹은 음식의 이름뿐 아니라 양과 증상이 시작된 시간을 비교해 봅니다. 음식 아이 지 지 패널은 음식 알레르기를 진단하는 검사가 아니에요. 먹고 반응했던 적이 있다면 음식과 양, 반응이 시작된 때를 가져가세요. 알레르기가 의심되는 음식은 집에서 다시 먹어 확인하지 말고, 필요한 평가는 의료진과 정하세요.","cues":[{"start":37.0,"end":40.4,"text":"가령 평소 한 그릇을 먹고도 괜찮았는지,"},{"start":40.4,"end":42.5,"text":"요리에 소량 섞였을 때만"},{"start":42.5,"end":45.7,"text":"괜찮았는지는 의미가 다를 수 있죠."},{"start":45.7,"end":48.2,"text":"반응이 있었다면 먹은 음식의"},{"start":48.2,"end":50.5,"text":"이름뿐 아니라 양과 증상이"},{"start":50.5,"end":53.4,"text":"시작된 시간을 비교해 봅니다."},{"start":53.4,"end":55.7,"text":"음식 아이 지 지 패널은 음식"},{"start":55.7,"end":59.3,"text":"알레르기를 진단하는 검사가 아니에요."},{"start":59.3,"end":62.5,"text":"먹고 반응했던 적이 있다면 음식과 양,"},{"start":62.5,"end":65.5,"text":"반응이 시작된 때를 가져가세요."},{"start":65.5,"end":68.0,"text":"알레르기가 의심되는 음식은"},{"start":68.0,"end":70.8,"text":"집에서 다시 먹어 확인하지 말고,"},{"start":70.8,"end":74.0,"text":"필요한 평가는 의료진과 정하세요."}]},{"start":74,"end":81,"text":"검사표 옆에 먼저 쓸 답. ‘그 음식을 먹었을 때, 제 몸에는 무슨 일이 있었나.’","cues":[{"start":74.0,"end":77.1,"text":"검사표 옆에 먼저 쓸 답. ‘그 음식을"},{"start":77.1,"end":81.0,"text":"먹었을 때, 제 몸에는 무슨 일이 있었나.’"}]}],"sources":[{"title":"EAACI guidelines on the diagnosis of IgE-mediated food allergy","url":"https://pure.amsterdamumc.nl/ws/portalfiles/portal/137436001/Eaaci-guidelines-on-the-diagnosis-of-ige-mediated-food-allergy.pdf"},{"title":"Food Allergy Testing and Diagnosis","url":"https://acaai.org/allergies/testing-diagnosis/food-allergy-testing-and-diagnosis/"},{"title":"The Myth of IgG Food Panel Testing","url":"https://www.aaaai.org/tools-for-the-public/conditions-library/allergies/igg-food-test"},{"title":"Oral Allergy Syndrome (OAS) or Pollen Food Syndrome","url":"https://www.aaaai.org/tools-for-the-public/conditions-library/allergies/oral-allergy-syndrome-(oas)"},{"title":"AAAAI–EAACI PRACTALL: Standardizing oral food challenges—2024 Update","url":"https://eaaci.org/guidelines-position-papers/aaaai-eaaci-practall-standardizing-oral-food-challenges-2024-update/"},{"title":"Food Allergy","url":"https://acaai.org/allergies/allergic-conditions/food/"}]},{"id":82,"title":"같은 음식을 먹었는데 운동한 날만 반응했다면","category":"알레르기","original":"같은 음식인데 어떤 날만 반응한다. 음식 말고 무엇이 달랐을까?","length":80,"parts":[{"start":0,"end":2,"text":"같은 음식, 뛴 날만 문제였어요?","cues":[{"start":0.0,"end":2.0,"text":"같은 음식, 뛴 날만 문제였어요?"}]},{"start":2,"end":7,"text":"메뉴 사진 옆에 그날 운동한 시간도 확인해 보세요.","cues":[{"start":2.0,"end":4.6,"text":"메뉴 사진 옆에 그날 운동한"},{"start":4.6,"end":7.0,"text":"시간도 확인해 보세요."}]},{"start":7,"end":48,"text":"어제 먹고 괜찮던 음식이 오늘은 반응과 연결될 수 있습니다. 음식의 양이나 재료가 조금 달랐을 수도 있죠. 또 일부 사람에겐 운동 같은 조건이 더해질 때 알레르기 반응이 나타나기 쉬워질 수 있어요. 음식과 운동이 각각 따로일 땐 괜찮았다는 경험도 진료에서 단서가 됩니다. 가령 점심에 먹자마자 불편했던 날과, 점심 뒤 달리기를 시작하고 나서 반응했던 날을 따로 기록하세요. 음식과 운동의 순서를 알면 두 가지가 각각 영향을 줬는지, 다른 조건이 있었는지 살펴볼 수 있어요.","cues":[{"start":7.0,"end":9.8,"text":"어제 먹고 괜찮던 음식이 오늘은"},{"start":9.8,"end":12.4,"text":"반응과 연결될 수 있습니다."},{"start":12.4,"end":15.3,"text":"음식의 양이나 재료가 조금 달랐을"},{"start":15.3,"end":18.1,"text":"수도 있죠. 또 일부 사람에겐 운동"},{"start":18.1,"end":20.9,"text":"같은 조건이 더해질 때 알레르기"},{"start":20.9,"end":24.1,"text":"반응이 나타나기 쉬워질 수 있어요."},{"start":24.1,"end":26.7,"text":"음식과 운동이 각각 따로일 땐"},{"start":26.7,"end":29.2,"text":"괜찮았다는 경험도 진료에서"},{"start":29.2,"end":31.5,"text":"단서가 됩니다. 가령 점심에"},{"start":31.5,"end":33.6,"text":"먹자마자 불편했던 날과,"},{"start":33.6,"end":36.4,"text":"점심 뒤 달리기를 시작하고 나서"},{"start":36.4,"end":39.4,"text":"반응했던 날을 따로 기록하세요."},{"start":39.4,"end":41.8,"text":"음식과 운동의 순서를 알면"},{"start":41.8,"end":44.3,"text":"두 가지가 각각 영향을 줬는지,"},{"start":44.3,"end":48.0,"text":"다른 조건이 있었는지 살펴볼 수 있어요."}]},{"start":48,"end":53,"text":"확인하고 싶다고 그 조합을 집에서 다시 해보면 위험합니다.","cues":[{"start":48.0,"end":50.8,"text":"확인하고 싶다고 그 조합을 집에서"},{"start":50.8,"end":53.0,"text":"다시 해보면 위험합니다."}]},{"start":53,"end":73,"text":"먹은 시간, 운동을 시작한 시간, 첫 증상이 생긴 때를 순서대로 알려 주세요. 함께 먹은 약이나 술이 있다면 포함하고요. 목이 조이거나 숨쉬기 어려워 아나필락시스가 의심되면 처방된 에피네프린을 쓰고 즉시 일일구에 연락하세요.","cues":[{"start":53.0,"end":55.6,"text":"먹은 시간, 운동을 시작한 시간,"},{"start":55.6,"end":58.1,"text":"첫 증상이 생긴 때를 순서대로"},{"start":58.1,"end":60.7,"text":"알려 주세요. 함께 먹은 약이나"},{"start":60.7,"end":63.1,"text":"술이 있다면 포함하고요."},{"start":63.1,"end":65.7,"text":"목이 조이거나 숨쉬기 어려워"},{"start":65.7,"end":68.0,"text":"아나필락시스가 의심되면"},{"start":68.0,"end":70.4,"text":"처방된 에피네프린을 쓰고"},{"start":70.4,"end":73.0,"text":"즉시 일일구에 연락하세요."}]},{"start":73,"end":80,"text":"기록할 건 메뉴판 한 장이 아니라 시간표 세 칸입니다. 음식, 운동, 첫 증상.","cues":[{"start":73.0,"end":76.1,"text":"기록할 건 메뉴판 한 장이 아니라"},{"start":76.1,"end":80.0,"text":"시간표 세 칸입니다. 음식, 운동, 첫 증상."}]}],"sources":[{"title":"Diagnosis and management of allergy and respiratory disorders in sport: An EAACI task force position paper","url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/all.15431"},{"title":"Wheat-Dependent Cofactor-Augmented Anaphylaxis: A Prospective Study of Exercise, Aspirin, and Alcohol Efficacy as Cofactors","url":"https://pubmed.ncbi.nlm.nih.gov/30599881/"},{"title":"Using a gluten oral food challenge protocol to improve diagnosis of wheat-dependent exercise-induced anaphylaxis","url":"https://pubmed.ncbi.nlm.nih.gov/25269870/"},{"title":"EAACI guidelines on the diagnosis of IgE-mediated food allergy","url":"https://pure.amsterdamumc.nl/ws/portalfiles/portal/137436001/Eaaci-guidelines-on-the-diagnosis-of-ige-mediated-food-allergy.pdf"},{"title":"Food Allergy","url":"https://acaai.org/allergies/allergic-conditions/food/"},{"title":"아나필락시스 응급처치 · 질병관리청","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6684"}]},{"id":83,"title":"알레르기 검사 음성인데 우유 먹고 배가 아픈 이유","category":"알레르기","original":"알레르기 검사는 음성인데 우유를 먹으면 왜 불편할까요?","length":84,"parts":[{"start":0,"end":2,"text":"우유 검사 음성, 배는 아파요.","cues":[{"start":0.0,"end":2.0,"text":"우유 검사 음성, 배는 아파요."}]},{"start":2,"end":8,"text":"검사가 찾는 우유 반응과 장에서 우유를 소화하는 일은 다릅니다.","cues":[{"start":2.0,"end":4.8,"text":"검사가 찾는 우유 반응과 장에서"},{"start":4.8,"end":8.0,"text":"우유를 소화하는 일은 다릅니다."}]},{"start":8,"end":29,"text":"우유 알레르기는 단백질에 대한 면역 반응이에요. 유당은 우유에 든 당입니다. 유당을 분해하는 효소가 충분하지 않으면 일부가 대장으로 가요. 장내 균이 그걸 발효하면서 가스가 생기고, 사람에 따라 배가 더부룩하거나 설사할 수 있습니다.","cues":[{"start":8.0,"end":10.3,"text":"우유 알레르기는 단백질에"},{"start":10.3,"end":12.5,"text":"대한 면역 반응이에요."},{"start":12.5,"end":15.1,"text":"유당은 우유에 든 당입니다."},{"start":15.1,"end":18.0,"text":"유당을 분해하는 효소가 충분하지"},{"start":18.0,"end":20.8,"text":"않으면 일부가 대장으로 가요."},{"start":20.8,"end":23.1,"text":"장내 균이 그걸 발효하면서"},{"start":23.1,"end":25.8,"text":"가스가 생기고, 사람에 따라 배가"},{"start":25.8,"end":29.0,"text":"더부룩하거나 설사할 수 있습니다."}]},{"start":29,"end":36,"text":"그래서 우유가 들어갔다는 사실만큼 얼마를 어떤 형태로 먹었는지도 단서예요.","cues":[{"start":29.0,"end":31.3,"text":"그래서 우유가 들어갔다는"},{"start":31.3,"end":33.8,"text":"사실만큼 얼마를 어떤 형태로"},{"start":33.8,"end":36.0,"text":"먹었는지도 단서예요."}]},{"start":36,"end":77,"text":"예를 들어 우유 한 컵을 마신 뒤 몇 시간에 걸쳐 가스와 설사가 왔는데, 소량이 든 음식은 괜찮을 수 있어요. 같은 우유라고만 적으면 그 차이가 사라집니다. 피부나 호흡의 변화가 있었는지는 별도로 말해 주세요. 한 잔 마신 날과 소량이 든 음식을 먹은 날이 다를 수 있어요. 배가 불편했는지, 두드러기나 호흡 증상이 있었는지도 꼭 구분해서 알려 주세요. 호흡기 증상이 동반된 반응을 집에서 다시 먹어 확인하면 위험합니다. 필요하면 증상에 맞춰 다른 평가를 합니다.","cues":[{"start":36.0,"end":38.8,"text":"예를 들어 우유 한 컵을 마신 뒤 몇"},{"start":38.8,"end":41.9,"text":"시간에 걸쳐 가스와 설사가 왔는데,"},{"start":41.9,"end":45.3,"text":"소량이 든 음식은 괜찮을 수 있어요."},{"start":45.3,"end":48.3,"text":"같은 우유라고만 적으면 그 차이가"},{"start":48.3,"end":51.4,"text":"사라집니다. 피부나 호흡의 변화가"},{"start":51.4,"end":54.5,"text":"있었는지는 별도로 말해 주세요."},{"start":54.5,"end":57.4,"text":"한 잔 마신 날과 소량이 든 음식을"},{"start":57.4,"end":59.9,"text":"먹은 날이 다를 수 있어요."},{"start":59.9,"end":62.9,"text":"배가 불편했는지, 두드러기나 호흡"},{"start":62.9,"end":65.8,"text":"증상이 있었는지도 꼭 구분해서"},{"start":65.8,"end":68.2,"text":"알려 주세요. 호흡기 증상이"},{"start":68.2,"end":71.0,"text":"동반된 반응을 집에서 다시 먹어"},{"start":71.0,"end":73.9,"text":"확인하면 위험합니다. 필요하면"},{"start":73.9,"end":77.0,"text":"증상에 맞춰 다른 평가를 합니다."}]},{"start":77,"end":84,"text":"‘우유 먹으면 아파요’에 덧붙이세요. 얼마를 마셨고, 몸의 어디가 먼저 불편했나.","cues":[{"start":77.0,"end":78.9,"text":"‘우유 먹으면 아파요’에"},{"start":78.9,"end":81.3,"text":"덧붙이세요. 얼마를 마셨고,"},{"start":81.3,"end":84.0,"text":"몸의 어디가 먼저 불편했나."}]}],"sources":[{"title":"Symptoms & Causes of Lactose Intolerance","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/lactose-intolerance/symptoms-causes"},{"title":"Food Intolerance","url":"https://www.allergy.org.au/patients/food-other-adverse-reactions/food-intolerance"},{"title":"The Myth of IgG Food Panel Testing","url":"https://www.aaaai.org/tools-for-the-public/conditions-library/allergies/igg-food-test"},{"title":"Food Allergy","url":"https://acaai.org/allergies/allergic-conditions/food/"},{"title":"Diagnosis of Lactose Intolerance","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/lactose-intolerance/diagnosis"}]},{"id":84,"title":"평생 잘 먹던 음식에 처음 반응한 날","category":"알레르기","original":"평생 먹던 음식에도 성인 알레르기가 생길 수 있을까요?","length":87,"parts":[{"start":0,"end":2,"text":"늘 먹던 음식에 두드러기요?","cues":[{"start":0.0,"end":2.0,"text":"늘 먹던 음식에 두드러기요?"}]},{"start":2,"end":8,"text":"예전에 괜찮았다는 정보와 이번에 생긴 반응을 함께 봐야 해요.","cues":[{"start":2.0,"end":4.5,"text":"예전에 괜찮았다는 정보와"},{"start":4.5,"end":8.0,"text":"이번에 생긴 반응을 함께 봐야 해요."}]},{"start":8,"end":52,"text":"성인이 된 뒤에도 음식에 처음 알레르기 반응이 나타날 수 있습니다. 그렇다고 그날 먹은 음식 하나가 바로 범인이라는 뜻은 아니에요. 예를 들어 꽃가루 알레르기가 있는 사람은 일부 생과일을 먹고 입이 가려울 수 있죠. 같은 메뉴라도 새 재료가 섞였는지, 무엇을 얼마나 먹었는지 확인해야 합니다. 무슨 요리였는지만 기억나면 같이 먹은 사람에게 재료를 확인해 볼 수 있어요. 예전과 같은 메뉴 이름이어도 속에 들어간 재료가 달랐을 수 있거든요. 처음 가려웠던 곳과 그 뒤 증상이 번진 순서도 기록하세요.","cues":[{"start":8.0,"end":10.5,"text":"성인이 된 뒤에도 음식에 처음"},{"start":10.5,"end":14.0,"text":"알레르기 반응이 나타날 수 있습니다."},{"start":14.0,"end":16.8,"text":"그렇다고 그날 먹은 음식 하나가"},{"start":16.8,"end":19.8,"text":"바로 범인이라는 뜻은 아니에요."},{"start":19.8,"end":22.4,"text":"예를 들어 꽃가루 알레르기가"},{"start":22.4,"end":24.7,"text":"있는 사람은 일부 생과일을"},{"start":24.7,"end":27.1,"text":"먹고 입이 가려울 수 있죠."},{"start":27.1,"end":30.1,"text":"같은 메뉴라도 새 재료가 섞였는지,"},{"start":30.1,"end":33.1,"text":"무엇을 얼마나 먹었는지 확인해야"},{"start":33.1,"end":35.4,"text":"합니다. 무슨 요리였는지만"},{"start":35.4,"end":38.0,"text":"기억나면 같이 먹은 사람에게"},{"start":38.0,"end":40.6,"text":"재료를 확인해 볼 수 있어요."},{"start":40.6,"end":43.6,"text":"예전과 같은 메뉴 이름이어도 속에"},{"start":43.6,"end":46.8,"text":"들어간 재료가 달랐을 수 있거든요."},{"start":46.8,"end":48.9,"text":"처음 가려웠던 곳과 그 뒤"},{"start":48.9,"end":52.0,"text":"증상이 번진 순서도 기록하세요."}]},{"start":52,"end":57,"text":"이때 불편함이 어디까지 갔는지가 가장 중요한 단서예요.","cues":[{"start":52.0,"end":54.0,"text":"이때 불편함이 어디까지"},{"start":54.0,"end":57.0,"text":"갔는지가 가장 중요한 단서예요."}]},{"start":57,"end":79,"text":"입 주변에만 머물렀는지, 몸에 두드러기가 번졌는지, 목이나 숨에 변화가 왔는지를 알려 주세요. 숨쉬기 어렵거나 목이 조여 아나필락시스가 의심되면, 처방된 에피네프린을 쓰고 즉시 일일구에 연락하세요. 의심 음식은 집에서 다시 먹어 확인하지 마세요.","cues":[{"start":57.0,"end":59.1,"text":"입 주변에만 머물렀는지,"},{"start":59.1,"end":61.5,"text":"몸에 두드러기가 번졌는지,"},{"start":61.5,"end":64.0,"text":"목이나 숨에 변화가 왔는지를"},{"start":64.0,"end":67.0,"text":"알려 주세요. 숨쉬기 어렵거나 목이"},{"start":67.0,"end":69.7,"text":"조여 아나필락시스가 의심되면,"},{"start":69.7,"end":72.0,"text":"처방된 에피네프린을 쓰고"},{"start":72.0,"end":74.7,"text":"즉시 일일구에 연락하세요."},{"start":74.7,"end":76.8,"text":"의심 음식은 집에서 다시"},{"start":76.8,"end":79.0,"text":"먹어 확인하지 마세요."}]},{"start":79,"end":87,"text":"‘평생 잘 먹었어요’ 다음엔 이번 이야기예요. 무엇을 먹고 몇 분 뒤 어디가 달라졌나.","cues":[{"start":79.0,"end":81.4,"text":"‘평생 잘 먹었어요’ 다음엔"},{"start":81.4,"end":84.3,"text":"이번 이야기예요. 무엇을 먹고"},{"start":84.3,"end":87.0,"text":"몇 분 뒤 어디가 달라졌나."}]}],"sources":[{"title":"Food Allergy","url":"https://acaai.org/allergies/allergic-conditions/food/"},{"title":"Prevalence and Severity of Food Allergies Among US Adults","url":"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2720064"},{"title":"Oral Allergy Syndrome (OAS)","url":"https://www.aaaai.org/tools-for-the-public/conditions-library/allergies/oral-allergy-syndrome-(oas)"},{"title":"Diagnosis and management of allergy and respiratory disorders in sport: An EAACI task force position paper","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/all.15431"},{"title":"Acute Anaphylaxis Clinical Care Standard","url":"https://www.safetyandquality.gov.au/clinical-care-standards/acute-anaphylaxis"},{"title":"아나필락시스 응급처치 · 질병관리청","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6684"}]},{"id":85,"title":"항히스타민제를 쉬고 난 뒤, 원래 가려움인지 새 가려움인지","category":"알레르기","original":"항히스타민제를 끊은 뒤 다시 가렵다면 원래 증상이 돌아온 걸까요?","length":81,"parts":[{"start":0,"end":2,"text":"항히스타민제 끊고, 가렵나요?","cues":[{"start":0.0,"end":2.0,"text":"항히스타민제 끊고, 가렵나요?"}]},{"start":2,"end":8,"text":"원래 가렵던 모습이 돌아온 건지, 전에 없던 가려움인지 확인해 보세요.","cues":[{"start":2.0,"end":4.7,"text":"원래 가렵던 모습이 돌아온 건지,"},{"start":4.7,"end":8.0,"text":"전에 없던 가려움인지 확인해 보세요."}]},{"start":8,"end":32,"text":"항히스타민제는 히스타민 신호가 작용하는 걸 막아 가려움이나 두드러기를 줄일 수 있어요. 약을 쉬었을 때 아직 남아 있던 질환의 증상이 돌아올 수 있죠. 한편 세티리진이나 레보세티리진을 오랫동안 매일 쓰다가 중단한 뒤, 전과 다른 심한 가려움이 드물게 보고됐습니다.","cues":[{"start":8.0,"end":11.0,"text":"항히스타민제는 히스타민 신호가"},{"start":11.0,"end":13.6,"text":"작용하는 걸 막아 가려움이나"},{"start":13.6,"end":16.2,"text":"두드러기를 줄일 수 있어요."},{"start":16.2,"end":18.8,"text":"약을 쉬었을 때 아직 남아 있던"},{"start":18.8,"end":21.6,"text":"질환의 증상이 돌아올 수 있죠."},{"start":21.6,"end":24.9,"text":"한편 세티리진이나 레보세티리진을"},{"start":24.9,"end":27.6,"text":"오랫동안 매일 쓰다가 중단한 뒤,"},{"start":27.6,"end":29.8,"text":"전과 다른 심한 가려움이"},{"start":29.8,"end":32.0,"text":"드물게 보고됐습니다."}]},{"start":32,"end":37,"text":"그래서 약통에 적힌 성분을 확인하는 게 중요합니다.","cues":[{"start":32.0,"end":34.5,"text":"그래서 약통에 적힌 성분을"},{"start":34.5,"end":37.0,"text":"확인하는 게 중요합니다."}]},{"start":37,"end":73,"text":"예를 들어 비염 때문에 먹던 약을 쉬었는데, 원래 없던 온몸 가려움이 새로 생겼어요. 반대로 두드러기 때문에 먹던 사람이 늘 올라오던 자리에 다시 두드러기가 났다면, 예전 질환이 남아 있는지도 살핍니다. 원래와 같은 곳이 가려운지, 발진이 있는지, 약을 쉰 뒤 며칠 만인지 살펴보세요. 같은 ‘가려움’ 안에서도 경과가 다를 수 있습니다. 새로 생긴 심한 증상이라면 복용과 중단 날짜를 들고 처방한 곳에 문의하세요.","cues":[{"start":37.0,"end":39.4,"text":"예를 들어 비염 때문에 먹던"},{"start":39.4,"end":41.5,"text":"약을 쉬었는데, 원래 없던"},{"start":41.5,"end":44.4,"text":"온몸 가려움이 새로 생겼어요."},{"start":44.4,"end":47.0,"text":"반대로 두드러기 때문에 먹던"},{"start":47.0,"end":49.3,"text":"사람이 늘 올라오던 자리에"},{"start":49.3,"end":51.5,"text":"다시 두드러기가 났다면,"},{"start":51.5,"end":55.0,"text":"예전 질환이 남아 있는지도 살핍니다."},{"start":55.0,"end":57.4,"text":"원래와 같은 곳이 가려운지,"},{"start":57.4,"end":59.9,"text":"발진이 있는지, 약을 쉰 뒤 며칠"},{"start":59.9,"end":62.7,"text":"만인지 살펴보세요. 같은 ‘가려움’"},{"start":62.7,"end":66.0,"text":"안에서도 경과가 다를 수 있습니다."},{"start":66.0,"end":68.4,"text":"새로 생긴 심한 증상이라면"},{"start":68.4,"end":70.6,"text":"복용과 중단 날짜를 들고"},{"start":70.6,"end":73.0,"text":"처방한 곳에 문의하세요."}]},{"start":73,"end":81,"text":"‘약 끊으니 가려워요’ 뒤에 한 줄 더요. 예전 증상이 돌아왔나요, 새로운 느낌인가요?","cues":[{"start":73.0,"end":76.5,"text":"‘약 끊으니 가려워요’ 뒤에 한 줄 더요."},{"start":76.5,"end":78.8,"text":"예전 증상이 돌아왔나요,"},{"start":78.8,"end":81.0,"text":"새로운 느낌인가요?"}]}],"sources":[{"title":"Antihistamines","url":"https://www.nhs.uk/medicines/antihistamines/"},{"title":"FDA requires warning about rare but severe itching after stopping long-term use of oral allergy medicines cetirizine or levocetirizine","url":"https://www.fda.gov/drugs/drug-safety-communications/fda-requires-warning-about-rare-severe-itching-after-stopping-long-term-use-oral-allergy-medicines"},{"title":"The International Guideline for the Definition, Classification, Diagnosis and Management of Urticaria","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/all.70210"},{"title":"Pruritus (itching)","url":"https://www.skinhealthinfo.org.uk/condition/pruritus/"}]},{"id":86,"title":"어릴 때 들은 페니실린 알레르기, 지금도 해당될까?","category":"알레르기","original":"어릴 때 들은 페니실린 알레르기, 지금도 해당하는지 다시 확인할 수 있습니다","length":80,"parts":[{"start":0,"end":2,"text":"페니실린, 아직 못 먹나요?","cues":[{"start":0.0,"end":2.0,"text":"페니실린, 아직 못 먹나요?"}]},{"start":2,"end":8,"text":"기록에 붙은 알레르기 한 줄에 당시 상황을 다시 채워 넣어 보세요.","cues":[{"start":2.0,"end":4.6,"text":"기록에 붙은 알레르기 한 줄에"},{"start":4.6,"end":8.0,"text":"당시 상황을 다시 채워 넣어 보세요."}]},{"start":8,"end":32,"text":"어떤 사람은 페니실린을 먹고 메스꺼워서 알레르기라고 기억합니다. 어떤 사람은 복용 직후 두드러기나 숨참이 있었고요. 며칠 뒤 발진이 생긴 경우와 입안에 상처나 물집이 생긴 경우도 평가가 다릅니다. 기억이 흐릿해도 그 약을 먹은 뒤 언제 무엇이 생겼는지부터 정리할 수 있어요.","cues":[{"start":8.0,"end":11.0,"text":"어떤 사람은 페니실린을 먹고 메스꺼워서"},{"start":11.0,"end":13.6,"text":"알레르기라고 기억합니다."},{"start":13.6,"end":15.5,"text":"어떤 사람은 복용 직후"},{"start":15.5,"end":18.3,"text":"두드러기나 숨참이 있었고요."},{"start":18.3,"end":20.7,"text":"며칠 뒤 발진이 생긴 경우와"},{"start":20.7,"end":23.6,"text":"입안에 상처나 물집이 생긴 경우도"},{"start":23.6,"end":26.6,"text":"평가가 다릅니다. 기억이 흐릿해도"},{"start":26.6,"end":28.9,"text":"그 약을 먹은 뒤 언제 무엇이"},{"start":28.9,"end":32.0,"text":"생겼는지부터 정리할 수 있어요."}]},{"start":32,"end":36,"text":"재평가는 집에서 한 알 먹어 보는 일이 아닙니다.","cues":[{"start":32.0,"end":33.8,"text":"재평가는 집에서 한 알"},{"start":33.8,"end":36.0,"text":"먹어 보는 일이 아닙니다."}]},{"start":36,"end":73,"text":"예를 들면 가족 수첩에 ‘항생제 먹고 설사’라고만 써 있을 수 있어요. 다른 사람은 약을 먹은 뒤 바로 숨이 차 병원에 갔다고 하죠. 같은 항생제 알레르기 칸에 들어 있어도 다시 검토하는 법은 달라집니다. 의료진이 당시 위험을 나눈 뒤 필요하면 피부검사나 의료진이 지켜보는 앞에서 약을 먹는 검사를 고려합니다. 심각한 지연 반응 이력은 별도로 다뤄요. 기억나는 제품, 증상이나 치료, 그 뒤 다른 항생제를 먹었는지도 진료에서 알려 주세요.","cues":[{"start":36.0,"end":39.0,"text":"예를 들면 가족 수첩에 ‘항생제 먹고"},{"start":39.0,"end":41.8,"text":"설사’라고만 써 있을 수 있어요."},{"start":41.8,"end":44.4,"text":"다른 사람은 약을 먹은 뒤 바로"},{"start":44.4,"end":47.1,"text":"숨이 차 병원에 갔다고 하죠."},{"start":47.1,"end":49.8,"text":"같은 항생제 알레르기 칸에 들어"},{"start":49.8,"end":53.5,"text":"있어도 다시 검토하는 법은 달라집니다."},{"start":53.5,"end":56.1,"text":"의료진이 당시 위험을 나눈 뒤"},{"start":56.1,"end":58.9,"text":"필요하면 피부검사나 의료진이"},{"start":58.9,"end":61.7,"text":"지켜보는 앞에서 약을 먹는 검사를 고려합니다."},{"start":61.7,"end":65.4,"text":"심각한 지연 반응 이력은 별도로 다뤄요."},{"start":65.4,"end":68.0,"text":"기억나는 제품, 증상이나 치료,"},{"start":68.0,"end":70.8,"text":"그 뒤 다른 항생제를 먹었는지도"},{"start":70.8,"end":73.0,"text":"진료에서 알려 주세요."}]},{"start":73,"end":80,"text":"오래된 기록을 지우는 건 기억이 아니라, 당시 반응을 바탕으로 한 평가입니다.","cues":[{"start":73.0,"end":76.5,"text":"오래된 기록을 지우는 건 기억이 아니라,"},{"start":76.5,"end":80.0,"text":"당시 반응을 바탕으로 한 평가입니다."}]}],"sources":[{"title":"Clinical Features of Penicillin Allergy","url":"https://www.cdc.gov/antibiotic-use/hcp/clinical-signs/"},{"title":"Efficacy of a Clinical Decision Rule to Enable Direct Oral Challenge in Patients With Low-Risk Penicillin Allergy: The PALACE Randomized Clinical Trial","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10352926/"},{"title":"Penicillin Allergy - STI Treatment Guidelines","url":"https://www.cdc.gov/std/treatment-guidelines/penicillin-allergy.htm"},{"title":"Penicillin Allergy Delabeling Can and Should Be Performed in Pregnant Patients: A Work Group Report of the AAAAI","url":"https://www.aaaai.org/Aaaai/media/Media-Library-PDFs/Allergist%20Resources/Statements%20and%20Practice%20Parameters/Penicillin-allergy-delabeling-in-pregnant-patients-in-press-2026.pdf"}]},{"id":87,"title":"코막힘이 나아졌는데 낮에 더 졸릴 때","category":"알레르기","original":"코막힘을 참다 잠과 집중까지 나빠지는 이유","length":80,"parts":[{"start":0,"end":2,"text":"코는 뚫렸는데, 더 졸려요.","cues":[{"start":0.0,"end":2.0,"text":"코는 뚫렸는데, 더 졸려요."}]},{"start":2,"end":8,"text":"코가 덜 막히는지와 낮에 더 깨어 있는지를 따로 확인해 보세요.","cues":[{"start":2.0,"end":5.0,"text":"코가 덜 막히는지와 낮에 더 깨어"},{"start":5.0,"end":8.0,"text":"있는지를 따로 확인해 보세요."}]},{"start":8,"end":29,"text":"비염으로 코 안이 붓고 막히면 밤에 편히 자기가 어려울 수 있어요. 약을 쓰고 콧물이 줄어 코는 편해졌죠. 그런데 일부 항히스타민제는 사람을 졸리게 할 수 있습니다. 복용 뒤 일정한 때에 눈이 감긴다면 밤잠 외에 약의 영향도 살펴볼 단서예요.","cues":[{"start":8.0,"end":10.5,"text":"비염으로 코 안이 붓고 막히면"},{"start":10.5,"end":13.7,"text":"밤에 편히 자기가 어려울 수 있어요."},{"start":13.7,"end":17.1,"text":"약을 쓰고 콧물이 줄어 코는 편해졌죠."},{"start":17.1,"end":19.6,"text":"그런데 일부 항히스타민제는"},{"start":19.6,"end":22.4,"text":"사람을 졸리게 할 수 있습니다."},{"start":22.4,"end":25.4,"text":"복용 뒤 일정한 때에 눈이 감긴다면"},{"start":25.4,"end":29.0,"text":"밤잠 외에 약의 영향도 살펴볼 단서예요."}]},{"start":29,"end":36,"text":"반대로 큰 코골이와 숨 멎음이 있으면 코약의 문제로만 넘길 일이 아닙니다.","cues":[{"start":29.0,"end":32.3,"text":"반대로 큰 코골이와 숨 멎음이 있으면"},{"start":32.3,"end":36.0,"text":"코약의 문제로만 넘길 일이 아닙니다."}]},{"start":36,"end":72,"text":"가령 밤에는 코가 좀 편해졌는데 약을 먹은 다음 날 오전마다 집중이 끊겼다고 해볼게요. 다른 날엔 약을 안 바꿨는데도 큰 코골이 뒤에 지쳤고요. 졸린 시각과 밤에 벌어진 일을 맞춰 보면 질문을 좁힐 수 있어요. 밤에 숨이 끊기는 모습을 본 사람이 있는지, 낮에 일이나 운전이 어려울 정도로 조는지도 중요해요. 진료에는 약 이름과 먹은 시각, 졸린 시각, 밤에 관찰된 일을 가져가세요. 졸릴 땐 운전은 피해야 합니다.","cues":[{"start":36.0,"end":38.8,"text":"가령 밤에는 코가 좀 편해졌는데"},{"start":38.8,"end":41.1,"text":"약을 먹은 다음 날 오전마다"},{"start":41.1,"end":43.7,"text":"집중이 끊겼다고 해볼게요."},{"start":43.7,"end":46.3,"text":"다른 날엔 약을 안 바꿨는데도"},{"start":46.3,"end":48.7,"text":"큰 코골이 뒤에 지쳤고요."},{"start":48.7,"end":51.3,"text":"졸린 시각과 밤에 벌어진 일을"},{"start":51.3,"end":54.3,"text":"맞춰 보면 질문을 좁힐 수 있어요."},{"start":54.3,"end":56.7,"text":"밤에 숨이 끊기는 모습을 본"},{"start":56.7,"end":59.6,"text":"사람이 있는지, 낮에 일이나 운전이"},{"start":59.6,"end":62.9,"text":"어려울 정도로 조는지도 중요해요."},{"start":62.9,"end":65.5,"text":"진료에는 약 이름과 먹은 시각,"},{"start":65.5,"end":69.2,"text":"졸린 시각, 밤에 관찰된 일을 가져가세요."},{"start":69.2,"end":72.0,"text":"졸릴 땐 운전은 피해야 합니다."}]},{"start":72,"end":80,"text":"약 효과를 한 줄로 채점하지 마세요. 코는 편했나, 밤은 어땠나, 낮엔 깨어 있었나.","cues":[{"start":72.0,"end":74.7,"text":"약 효과를 한 줄로 채점하지"},{"start":74.7,"end":76.7,"text":"마세요. 코는 편했나,"},{"start":76.7,"end":80.0,"text":"밤은 어땠나, 낮엔 깨어 있었나."}]}],"sources":[{"title":"Allergic Rhinitis – Patient information leaflet","url":"https://www.bsaci.org/wp-content/uploads/2024/03/Allergic-Rhinitis-PIL.pdf"},{"title":"Allergic rhinitis","url":"https://www.nhs.uk/conditions/allergic-rhinitis/"},{"title":"Sleep apnoea","url":"https://www.nhs.uk/conditions/sleep-apnoea/"},{"title":"Antihistamines","url":"https://www.nhs.uk/medicines/antihistamines/"},{"title":"Allergic Rhinitis and Its Impact on Asthma (ARIA)-EAACI Guidelines—2024–2025 Revision: Part I—Guidelines on Intranasal Treatments","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC13040648/"}]},{"id":88,"title":"운동할 때 가렵고 숨까지 찬다면","category":"알레르기","original":"운동할 때 온몸이 가렵다면 어떤 증상까지 확인해야 할까요?","length":84,"parts":[{"start":0,"end":2,"text":"운동 중 가렵고, 숨도 찼나요?","cues":[{"start":0.0,"end":2.0,"text":"운동 중 가렵고, 숨도 찼나요?"}]},{"start":2,"end":14,"text":"운동을 멈추세요. 목이 조이거나 숨쉬기 어려워 아나필락시스가 의심되면, 처방된 에피네프린을 쓰고 즉시 일일구에 연락하세요.","cues":[{"start":2.0,"end":5.6,"text":"운동을 멈추세요. 목이 조이거나 숨쉬기"},{"start":5.6,"end":8.7,"text":"어려워 아나필락시스가 의심되면,"},{"start":8.7,"end":11.2,"text":"처방된 에피네프린을 쓰고"},{"start":11.2,"end":14.0,"text":"즉시 일일구에 연락하세요."}]},{"start":14,"end":57,"text":"몸이 더워질 때 작은 두드러기가 올라오는 사람이 있습니다. 운동이나 뜨거운 샤워에서 비슷할 수 있죠. 그런데 가려움과 함께 목이 조이거나 숨쉬기 어렵고 쓰러질 것 같다면 심한 전신 알레르기 반응일 수 있어요. 평소 운동에서 느끼던 숨참과 다르다면 특히 눈여겨봐야 합니다. 운동 뒤 팔에 작은 두드러기만 있었다면 얼마나 퍼졌고, 식거나 쉬면서 어떻게 달라졌는지 알려 주세요. 같은 가려움이라도 목소리, 호흡, 어지럼이 함께 변했는지를 따로 적으면 진료에서 위험을 판단하기 쉬워요.","cues":[{"start":14.0,"end":16.8,"text":"몸이 더워질 때 작은 두드러기가"},{"start":16.8,"end":19.4,"text":"올라오는 사람이 있습니다."},{"start":19.4,"end":21.8,"text":"운동이나 뜨거운 샤워에서"},{"start":21.8,"end":24.6,"text":"비슷할 수 있죠. 그런데 가려움과"},{"start":24.6,"end":27.6,"text":"함께 목이 조이거나 숨쉬기 어렵고"},{"start":27.6,"end":29.9,"text":"쓰러질 것 같다면 심한 전신"},{"start":29.9,"end":32.6,"text":"알레르기 반응일 수 있어요."},{"start":32.6,"end":35.1,"text":"평소 운동에서 느끼던 숨참과"},{"start":35.1,"end":38.4,"text":"다르다면 특히 눈여겨봐야 합니다."},{"start":38.4,"end":41.9,"text":"운동 뒤 팔에 작은 두드러기만 있었다면"},{"start":41.9,"end":44.4,"text":"얼마나 퍼졌고, 식거나 쉬면서"},{"start":44.4,"end":47.5,"text":"어떻게 달라졌는지 알려 주세요."},{"start":47.5,"end":50.3,"text":"같은 가려움이라도 목소리, 호흡,"},{"start":50.3,"end":53.7,"text":"어지럼이 함께 변했는지를 따로 적으면"},{"start":53.7,"end":57.0,"text":"진료에서 위험을 판단하기 쉬워요."}]},{"start":57,"end":63,"text":"피부에 두드러기가 없어도 심한 알레르기 반응이 생길 수 있어요.","cues":[{"start":57.0,"end":59.8,"text":"피부에 두드러기가 없어도 심한"},{"start":59.8,"end":63.0,"text":"알레르기 반응이 생길 수 있어요."}]},{"start":63,"end":76,"text":"상황이 가라앉은 뒤 진료에서는 운동 전 음식, 약, 증상이 시작된 때를 알려 주세요. 원인을 확인한다고 자기 몸으로 같은 조건을 반복하지 마세요.","cues":[{"start":63.0,"end":64.7,"text":"상황이 가라앉은 뒤"},{"start":64.7,"end":67.1,"text":"진료에서는 운동 전 음식, 약,"},{"start":67.1,"end":70.3,"text":"증상이 시작된 때를 알려 주세요."},{"start":70.3,"end":73.1,"text":"원인을 확인한다고 자기 몸으로"},{"start":73.1,"end":76.0,"text":"같은 조건을 반복하지 마세요."}]},{"start":76,"end":84,"text":"운동 중 가려웠다면 물어볼 순서가 있어요. 피부에만 있었나, 목과 호흡까지 달라졌나.","cues":[{"start":76.0,"end":78.5,"text":"운동 중 가려웠다면 물어볼"},{"start":78.5,"end":81.4,"text":"순서가 있어요. 피부에만 있었나,"},{"start":81.4,"end":84.0,"text":"목과 호흡까지 달라졌나."}]}],"sources":[{"title":"Diagnosis and management of allergy and respiratory disorders in sport: An EAACI task force position paper","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/all.15431"},{"title":"Acute Anaphylaxis Clinical Care Standard","url":"https://www.safetyandquality.gov.au/clinical-care-standards/acute-anaphylaxis"},{"title":"The International Guideline for the Definition, Classification, Diagnosis and Management of Urticaria","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/all.70210"},{"title":"아나필락시스 응급처치 · 질병관리청","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6684"}]},{"id":89,"title":"새우 알레르기와 조영제 검사에서 더 중요한 이력","category":"알레르기","original":"새우 알레르기와 조영제 반응, 왜 따로 확인할까요?","length":80,"parts":[{"start":0,"end":2,"text":"새우 알레르기면 조영제 금지?","cues":[{"start":0.0,"end":2.0,"text":"새우 알레르기면 조영제 금지?"}]},{"start":2,"end":7,"text":"검사실에서 특별히 확인해야 할 질문은 따로 있습니다.","cues":[{"start":2.0,"end":4.6,"text":"검사실에서 특별히 확인해야"},{"start":4.6,"end":7.0,"text":"할 질문은 따로 있습니다."}]},{"start":7,"end":28,"text":"새우 알레르기에서 몸이 반응하는 건 해산물에 든 단백질입니다. 요오드가 든 조영제라고 해서 그 둘이 같은 알레르기라고 말할 수는 없어요. 조영제 검사를 앞뒀다면 이전에 조영제를 쓴 뒤 어떤 반응이 있었는지가 더 직접적인 단서가 됩니다.","cues":[{"start":7.0,"end":10.0,"text":"새우 알레르기에서 몸이 반응하는"},{"start":10.0,"end":12.8,"text":"건 해산물에 든 단백질입니다."},{"start":12.8,"end":15.4,"text":"요오드가 든 조영제라고 해서"},{"start":15.4,"end":17.7,"text":"그 둘이 같은 알레르기라고"},{"start":17.7,"end":20.5,"text":"말할 수는 없어요. 조영제 검사를"},{"start":20.5,"end":22.8,"text":"앞뒀다면 이전에 조영제를"},{"start":22.8,"end":25.4,"text":"쓴 뒤 어떤 반응이 있었는지가"},{"start":25.4,"end":28.0,"text":"더 직접적인 단서가 됩니다."}]},{"start":28,"end":32,"text":"여기서 ‘이상했어요’라는 말은 조금 풀어야 해요.","cues":[{"start":28.0,"end":30.0,"text":"여기서 ‘이상했어요’라는"},{"start":30.0,"end":32.0,"text":"말은 조금 풀어야 해요."}]},{"start":32,"end":73,"text":"조영제를 쓰는 검사도 종류가 여럿이죠. 예를 들어 컴퓨터 단층촬영에서 주사를 맞았는지, 자기공명영상 검사였는지 알면 어떤 반응이 있었는지 확인하는 데 도움이 됩니다. 몸이 순간 따뜻했던 것과 두드러기, 숨참이 있었던 일은 검사 계획에 다른 영향을 줄 수 있어요. 검사 이름이나 조영제 이름, 반응이 시작된 때와 어떤 치료를 받았는지 알려 주세요. 이름은 몰라도 당시 검사를 받은 병원과 날짜는 단서가 됩니다. 기존 새우 알레르기 역시 병력으로 말하면 됩니다.","cues":[{"start":32.0,"end":34.6,"text":"조영제를 쓰는 검사도 종류가"},{"start":34.6,"end":36.9,"text":"여럿이죠. 예를 들어 컴퓨터"},{"start":36.9,"end":39.7,"text":"단층촬영에서 주사를 맞았는지,"},{"start":39.7,"end":42.1,"text":"자기공명영상 검사였는지"},{"start":42.1,"end":44.5,"text":"알면 어떤 반응이 있었는지"},{"start":44.5,"end":47.1,"text":"확인하는 데 도움이 됩니다."},{"start":47.1,"end":50.1,"text":"몸이 순간 따뜻했던 것과 두드러기,"},{"start":50.1,"end":52.3,"text":"숨참이 있었던 일은 검사"},{"start":52.3,"end":55.4,"text":"계획에 다른 영향을 줄 수 있어요."},{"start":55.4,"end":57.7,"text":"검사 이름이나 조영제 이름,"},{"start":57.7,"end":60.5,"text":"반응이 시작된 때와 어떤 치료를"},{"start":60.5,"end":62.7,"text":"받았는지 알려 주세요."},{"start":62.7,"end":65.5,"text":"이름은 몰라도 당시 검사를 받은"},{"start":65.5,"end":68.4,"text":"병원과 날짜는 단서가 됩니다."},{"start":68.4,"end":70.6,"text":"기존 새우 알레르기 역시"},{"start":70.6,"end":73.0,"text":"병력으로 말하면 됩니다."}]},{"start":73,"end":80,"text":"검사 전에 꼭 전할 한 줄. ‘예전에 조영제를 맞고, 언제 어떤 반응이 있었어요.’","cues":[{"start":73.0,"end":75.3,"text":"검사 전에 꼭 전할 한 줄."},{"start":75.3,"end":77.3,"text":"‘예전에 조영제를 맞고,"},{"start":77.3,"end":80.0,"text":"언제 어떤 반응이 있었어요.’"}]}],"sources":[{"title":"Management and Prevention of Hypersensitivity Reactions to Radiocontrast Media: A Consensus Statement from the ACR and AAAAI","url":"https://pubs.rsna.org/doi/10.1148/radiol.240100"},{"title":"Radiocontrast Media Hypersensitivity","url":"https://www.allergy.org.au/hp/drug-allergy/radiocontrast-media"},{"title":"Radiocontrast Material and Seafood Allergy","url":"https://education.aaaai.org/sites/default/files/scorm_engine/Applying%20Choosing%20Wisely%20Recommendations%20Seafood%20Allergy%20and%20Radiocontrast_1-1550244683/story_content/external_files/Choosing%20Wisely%20Patient%20Handout_Radiocontrast%20Material%20and%20Seafood%20Allergy.pdf"},{"title":"조영제 매뉴얼 · 미국영상의학회","url":"https://www.acr.org/Clinical-Resources/Clinical-Tools-and-Reference/Contrast-Manual"}]},{"id":90,"title":"고양이 알레르기 검사에서 양성인데 왜 봄에만 힘들까?","category":"알레르기","original":"고양이 알레르기 검사에서 양성인데 왜 봄에만 힘들까요?","leng  놓으세요. 운동에서만 떨어졌는지, 물건을 들거나 계단을 오르는 일상에서도 힘이 빠지는지는 서로 다른 단서입니다. 일상 동작에서 새로 근력이 떨어지면 진료에서 확인하세요.","cues":[{"start":38.0,"end":41.0,"text":"예를 들어 전에 주 세 번 했던 운동을"},{"start":41.0,"end":44.3,"text":"이번엔 쉬지 않고 며칠 연속 했어요."},{"start":44.3,"end":46.4,"text":"무게를 낮춰도 평소보다"},{"start":46.4,"end":49.0,"text":"힘들게 느껴졌죠. 그러면 더 센"},{"start":49.0,"end":51.8,"text":"자극이 필요한지 판단하기 전에,"},{"start":51.8,"end":54.8,"text":"회차 사이에 얼마나 회복했는지 볼"},{"start":54.8,"end":57.8,"text":"필요가 있습니다. 최근 바뀐 훈련량,"},{"start":57.8,"end":61.1,"text":"쉰 날, 먹고 잔 흐름을 함께 놓으세요."},{"start":61.1,"end":63.2,"text":"운동에서만 떨어졌는지,"},{"start":63.2,"end":65.8,"text":"물건을 들거나 계단을 오르는"},{"start":65.8,"end":68.3,"text":"일상에서도 힘이 빠지는지는"},{"start":68.3,"end":70.6,"text":"서로 다른 단서입니다."},{"start":70.6,"end":72.9,"text":"일상 동작에서 새로 근력이"},{"start":72.9,"end":76.0,"text":"떨어지면 진료에서 확인하세요."}]},{"start":76,"end":84,"text":"더 할지 쉬어갈지는 기록이 떨어졌다는 사실보다 이번 주 몸에 쌓인 부담을 보고 정하세요.","cues":[{"start":76.0,"end":78.4,"text":"더 할지 쉬어갈지는 기록이"},{"start":78.4,"end":80.9,"text":"떨어졌다는 사실보다 이번 주"},{"start":80.9,"end":84.0,"text":"몸에 쌓인 부담을 보고 정하세요."}]}],"sources":[{"title":"Prevention, diagnosis, and treatment of the overtraining syndrome: joint consensus statement of the ECSS and ACSM","url":"https://pubmed.ncbi.nlm.nih.gov/23247672/"},{"title":"2023 International Olympic Committee’s consensus statement on Relative Energy Deficiency in Sport (REDs)","url":"https://bjsm.bmj.com/content/57/17/1073"},{"title":"Position of the Academy of Nutrition and Dietetics, Dietitians of Canada, and ACSM: Nutrition and Athletic Performance","url":"https://www.andeal.org/files/files/Collaborations/Position_Athletic-Performance_2016March.pdf"},{"title":"Weakness — MedlinePlus Medical Encyclopedia","url":"https://medlineplus.gov/ency/article/003174.htm"},{"title":"Signs and Symptoms of Rhabdomyolysis","url":"https://www.cdc.gov/niosh/rhabdo/signs-symptoms/index.html"}]},{"id":92,"title":"인바디 근육량이 갑자기 줄었을 때 첫 비교","category":"운동","original":"인바디에서 근육량이 줄었다면 실제로 근육이 빠진 걸까요?","length":80,"parts":[{"start":0,"end":2,"text":"인바디 근육, 뚝 떨어졌나요?","cues":[{"start":0.0,"end":2.0,"text":"인바디 근육, 뚝 떨어졌나요?"}]},{"start":2,"end":8,"text":"두 장의 결과지에서 근육 칸을 읽기 전에 측정 조건부터 맞춰 보세요.","cues":[{"start":2.0,"end":5.0,"text":"두 장의 결과지에서 근육 칸을 읽기"},{"start":5.0,"end":8.0,"text":"전에 측정 조건부터 맞춰 보세요."}]},{"start":8,"end":30,"text":"인바디 같은 기계는 몸에 약한 전류를 흘려 전기 신호의 특성을 봅니다. 그 수치를 바탕으로 몸 안의 물과 여러 성분을 추정해 근육량을 계산하죠. 첫 검사는 아침에, 두 번째는 운동해 땀을 뺀 뒤에 했다면 몸속 수분 상태가 달라져 숫자에도 영향을 줄 수 있어요.","cues":[{"start":8.0,"end":11.2,"text":"인바디 같은 기계는 몸에 약한 전류를"},{"start":11.2,"end":14.2,"text":"흘려 전기 신호의 특성을 봅니다."},{"start":14.2,"end":17.0,"text":"그 수치를 바탕으로 몸 안의 물과"},{"start":17.0,"end":19.5,"text":"여러 성분을 추정해 근육량을"},{"start":19.5,"end":21.9,"text":"계산하죠. 첫 검사는 아침에,"},{"start":21.9,"end":24.4,"text":"두 번째는 운동해 땀을 뺀 뒤에"},{"start":24.4,"end":27.2,"text":"했다면 몸속 수분 상태가 달라져"},{"start":27.2,"end":30.0,"text":"숫자에도 영향을 줄 수 있어요."}]},{"start":30,"end":36,"text":"기계가 같은 값을 잘 낸다는 것과 내 근육을 직접 쟀다는 건 다른 얘기예요.","cues":[{"start":30.0,"end":32.8,"text":"기계가 같은 값을 잘 낸다는 것과 내"},{"start":32.8,"end":36.0,"text":"근육을 직접 쟀다는 건 다른 얘기예요."}]},{"start":36,"end":74,"text":"가령 지난번과 숫자는 크게 달라졌지만, 평소처럼 계단을 오르고 장바구니도 똑같이 들었다고 해볼게요. 반대로 결과지 수치는 비슷한데 의자에서 일어나는 힘이 떨어질 수 있죠. 둘은 비교할 자료가 다른 경우입니다. 비슷한 시간과 조건에서 잰 값의 추세를 보세요. 계단을 오르거나 물건을 들 때 실제 힘이 달라졌는지도 따로 확인합니다. 숫자 변화가 반복되고 생활에서 힘도 떨어진다면 그때는 두 정보를 다 들고 평가받으세요.","cues":[{"start":36.0,"end":39.5,"text":"가령 지난번과 숫자는 크게 달라졌지만,"},{"start":39.5,"end":41.6,"text":"평소처럼 계단을 오르고"},{"start":41.6,"end":44.2,"text":"장바구니도 똑같이 들었다고"},{"start":44.2,"end":46.4,"text":"해볼게요. 반대로 결과지"},{"start":46.4,"end":48.8,"text":"수치는 비슷한데 의자에서"},{"start":48.8,"end":51.7,"text":"일어나는 힘이 떨어질 수 있죠."},{"start":51.7,"end":55.2,"text":"둘은 비교할 자료가 다른 경우입니다."},{"start":55.2,"end":57.4,"text":"비슷한 시간과 조건에서"},{"start":57.4,"end":60.0,"text":"잰 값의 추세를 보세요. 계단을"},{"start":60.0,"end":62.8,"text":"오르거나 물건을 들 때 실제 힘이"},{"start":62.8,"end":65.9,"text":"달라졌는지도 따로 확인합니다."},{"start":65.9,"end":68.7,"text":"숫자 변화가 는 조건이 달라졌죠. 화면의 색이 달랐다는 말보다 어떻게 쟀고 몸이 지금 어떤지까지 봐야, 오늘 운동 계획에 그 숫자를 얼마나 반영할지 판단할 수 있어요. 평소 비슷한 때의 흐름과 어젯밤 잠, 최근 운동 부담, 몸의 실제 느낌을 같이 보세요. 반대로 점수가 좋더라도 열이 나거나 새로운 불편이 있으면 현재 상태를 먼저 확인해야 합니다.","cues":[{"start":39.0,"end":41.4,"text":"가령 평소 아침마다 앉아서"},{"start":41.4,"end":44.6,"text":"재다가 오늘은 운동 직후 잰 값이라면,"},{"start":44.6,"end":47.2,"text":"재는 조건이 달라졌죠. 화면의"},{"start":47.2,"end":50.2,"text":"색이 달랐다는 말보다 어떻게 쟀고"},{"start":50.2,"end":52.6,"text":"몸이 지금 어떤지까지 봐야,"},{"start":52.6,"end":55.0,"text":"오늘 운동 계획에 그 숫자를"},{"start":55.0,"end":58.3,"text":"얼마나 반영할지 판단할 수 있어요."},{"start":58.3,"end":60.4,"text":"평소 비슷한 때의 흐름과"},{"start":60.4,"end":62.6,"text":"어젯밤 잠, 최근 운동 부담,"},{"start":62.6,"end":65.5,"text":"몸의 실제 느낌을 같이 보세요."},{"start":65.5,"end":68.1,"text":"반대로 점수가 좋더라도 열이"},{"start":68.1,"end":70.7,"text":"나거나 새로운 불편이 있으면"},{"start":70.7,"end":74.0,"text":"현재 상태를 먼저 확인해야 합니다."}]},{"start":74,"end":80,"text":"오늘 운동을 정할 땐 화면 한 칸과 몸이 보내는 신호를 같이 보세요.","cues":[{"start":74.0,"end":76.8,"text":"오늘 운동을 정할 땐 화면 한 칸과"},{"start":76.8,"end":80.0,"text":"몸이 보내는 신호를 같이 보세요."}]}],"sources":[{"title":"Guidelines for Rigor and Reproducibility of Heart Rate Variability within Human Cardiovascular Research","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC13477148/"},{"title":"Validation of nocturnal resting heart rate and heart rate variability in consumer wearables","url":"https://physoc.onlinelibrary.wiley.com/doi/10.14814/phy2.70527"},{"title":"Heart Rate Monitoring in Team Sports—A Conceptual Framework for Contextualizing Heart Rate Measures for Training and Recovery Prescription","url":"https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2018.00639/full"},{"title":"Top Things to Know: 2021 Guideline for the Evaluation and Diagnosis of Chest Pain","url":"https://professional.heart.org/en/science-news/2021-guideline-for-the-evaluation-and-diagnosis-of-chest-pain/top-things-to-know"}]},{"id":95,"title":"같은 산책길인데 심박수가 높은 날","category":"운동","original":"천천히 걷는데도 심박수가 높게 나오는 날, 몸 상태와 워치에서 뭘 볼까요?","length":84,"parts":[{"start":0,"end":2,"text":"산책인데, 맥박이 치솟나요?","cues":[{"start":0.0,"end":2.0,"text":"산책인데, 맥박이 치솟나요?"}]},{"start":2,"end":7,"text":"어제도 걸었던 길이라면 속도 외에 바뀐 걸 찾아보세요.","cues":[{"start":2.0,"end":4.1,"text":"어제도 걸었던 길이라면"},{"start":4.1,"end":7.0,"text":"속도 외에 바뀐 걸 찾아보세요."}]},{"start":7,"end":49,"text":"더운 날엔 열을 내보내려고 피부 쪽 혈류를 늘립니다. 땀으로 수분도 빠질 수 있어요. 같은 속도로 걸어도 이런 조건에선 심장이 더 자주 뛸 수 있습니다. 손목 워치가 흔들리거나 잘 닿지 않을 때는 측정에 오차가 나기도 하죠. 숫자만 보고 갑자기 체력이 나빠졌다고 정하긴 어려워요. 예를 들어 한 번만 워치 숫자가 높았고 시계를 고쳐 찼더니 값이 돌아온 날이 있을 수 있죠. 반대로 쉬어도 심장이 불규칙하게 뛰는 느낌이 반복된다면, 기기 화면뿐 아니라 몸에서 느낀 변화가 중요합니다.","cues":[{"start":7.0,"end":9.3,"text":"더운 날엔 열을 내보내려고"},{"start":9.3,"end":11.7,"text":"피부 쪽 혈류를 늘립니다."},{"start":11.7,"end":14.5,"text":"땀으로 수분도 빠질 수 있어요."},{"start":14.5,"end":17.5,"text":"같은 속도로 걸어도 이런 조건에선"},{"start":17.5,"end":20.3,"text":"심장이 더 자주 뛸 수 있습니다."},{"start":20.3,"end":23.0,"text":"손목 워치가 흔들리거나 잘 닿지"},{"start":23.0,"end":26.5,"text":"않을 때는 측정에 오차가 나기도 하죠."},{"start":26.5,"end":28.8,"text":"숫자만 보고 갑자기 체력이"},{"start":28.8,"end":31.6,"text":"나빠졌다고 정하긴 어려워요."},{"start":31.6,"end":34.1,"text":"예를 들어 한 번만 워치 숫자가"},{"start":34.1,"end":36.4,"text":"높았고 시계를 고쳐 찼더니"},{"start":36.4,"end":39.2,"text":"값이 돌아온 날이 있을 수 있죠."},{"start":39.2,"end":42.2,"text":"반대로 쉬어도 심장이 불규칙하게"},{"start":42.2,"end":44.3,"text":"뛰는 느낌이 반복된다면,"},{"start":44.3,"end":46.6,"text":"기기 화면뿐 아니라 몸에서"},{"start":46.6,"end":49.0,"text":"느낀 변화가 중요합니다."}]},{"start":49,"end":54,"text":"이때 빠른 것과 박자가 불규칙한 건 다른 정보입니다.","cues":[{"start":49.0,"end":51.0,"text":"이때 빠른 것과 박자가"},{"start":51.0,"end":54.0,"text":"불규칙한 건 다른 정보입니다."}]},{"start":54,"end":76,"text":"걸음을 멈춘 뒤에도 심장이 빨리 뛰는지, 박자가 불규칙한지, 다른 증상이 있는지 살펴보세요. 가슴통증, 심한 숨참, 실신이 따라오면 바로 평가가 필요합니다. 반복되는 변화라면 같은 속도였는지, 얼마나 더웠는지, 어떤 증상이 있었는지 알려 주세요.","cues":[{"start":54.0,"end":56.4,"text":"걸음을 멈춘 뒤에도 심장이"},{"start":56.4,"end":59.2,"text":"빨리 뛰는지, 박자가 불규칙한지,"},{"start":59.2,"end":62.3,"text":"다른 증상이 있는지 살펴보세요."},{"start":62.3,"end":64.6,"text":"가슴통증, 심한 숨참, 실신이"},{"start":64.6,"end":67.9,"text":"따라오면 바로 평가가 필요합니다."},{"start":67.9,"end":71.2,"text":"반복되는 변화라면 같은 속도였는지,"},{"start":71.2,"end":73.8,"text":"얼마나 더웠는지, 어떤 증상이"},{"start":73.8,"end":76.0,"text":"있었는지 알려 주세요."}]},{"start":76,"end":84,"text":"산책 속도가 같았다면 워치 숫자 옆에 다른 변수를 적으세요. 날씨와 증상, 맥박의 리듬까지.","cues":[{"start":76.0,"end":78.3,"text":"산책 속도가 같았다면 워치"},{"start":78.3,"end":81.2,"text":"숫자 옆에 다른 변수를 적으세요."},{"start":81.2,"end":84.0,"text":"날씨와 증상, 맥박의 리듬까지."}]}],"sources":[{"title":"Tachycardia: Fast Heart Rate","url":"https://www.heart.org/en/health-topics/arrhythmia/about-arrhythmia/tachycardia--fast-heart-rate"},{"title":"Heart palpitations","url":"https://www.nhs.uk/symptoms/heart-palpitations/"},{"title":"Accuracy of Wrist-Worn Heart Rate Monitors","url":"https://jamanetwork.com/journals/jamacardiology/fullarticle/2566167"},{"title":"Dehydration reduces stroke volume and cardiac output during exercise because of impaired cardiac filling and venous return, not left ventricular function","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7294577/"},{"title":"Target Heart Rates Chart","url":"https://www.heart.org/en/healthy-living/exercise-and-physical-activity/fitness-basics/target-heart-rates"}]},{"id":96,"title":"뛰면 덜 아픈 뒤꿈치, 다음 날 첫걸음을 보는 이유","category":"운동","original":"뛰다 보면 뒤꿈치 통증이 사라진다. 힘줄도 회복된 걸까요?","length":79,"parts":[{"start":0,"end":2,"text":"뛰니까, 뒤꿈치가 덜 아파요.","cues":[{"start":0.0,"end":2.0,"text":"뛰니까, 뒤꿈치가 덜 아파요."}]},{"start":2,"end":8,"text":"달리는 중에 편해졌다면, 다음 날 아침 첫걸음까지 봐야 합니다.","cues":[{"start":2.0,"end":4.3,"text":"달리는 중에 편해졌다면,"},{"start":4.3,"end":8.0,"text":"다음 날 아침 첫걸음까지 봐야 합니다."}]},{"start":8,"end":47,"text":"뒤꿈치 뒤의 아킬레스건은 종아리 힘을 발로 전합니다. 걸을 때 딛고 몸을 밀어주는 일에 관여하죠. 처음 걸을 때 아프다가 몸이 풀리면서 덜 아프게 느낄 수 있어요. 하지만 통증이 잠깐 줄었다는 것만으로 힘줄이 그날 받은 부담을 다 견뎠다고 볼 수는 없습니다. 가령 달릴 때 통증이 풀려 평소보다 길게 뛰었어요. 저녁까진 괜찮다가 다음 날 신발을 신고 처음 딛는 순간에 더 뻣뻣할 수 있죠. 운동 중 편안함만 적으면 뒤늦게 온 부담이 기록에서 빠집니다.","cues":[{"start":8.0,"end":11.0,"text":"뒤꿈치 뒤의 아킬레스건은 종아리"},{"start":11.0,"end":13.7,"text":"힘을 발로 전합니다. 걸을 때 딛고"},{"start":13.7,"end":16.6,"text":"몸을 밀어주는 일에 관여하죠."},{"start":16.6,"end":18.9,"text":"처음 걸을 때 아프다가 몸이"},{"start":18.9,"end":22.2,"text":"풀리면서 덜 아프게 느낄 수 있어요."},{"start":22.2,"end":24.7,"text":"하지만 통증이 잠깐 줄었다는"},{"start":24.7,"end":27.9,"text":"것만으로 힘줄이 그날 받은 부담을 다"},{"start":27.9,"end":30.5,"text":"견뎠다고 볼 수는 없습니다."},{"start":30.5,"end":33.5,"text":"가령 달릴 때 통증이 풀려 평소보다"},{"start":33.5,"end":35.6,"text":"길게 뛰었어요. 저녁까진"},{"start":35.6,"end":38.1,"text":"괜찮다가 다음 날 신발을 신고"},{"start":38.1,"end":41.4,"text":"처음 딛는 순간에 더 뻣뻣할 수 있죠."},{"start":41.4,"end":44.2,"text":"운동 중 편안함만 적으면 뒤늦게"},{"start":44.2,"end":47.0,"text":"온 부담이 기록에서 빠집니다."}]},{"start":47,"end":51,"text":"부담은 달리기 기록에만 있지 않아요.","cues":[{"start":47.0,"end":51.0,"text":"부담은 달리기 기록에만 있지 않아요."}]},{"start":51,"end":72,"text":"계단을 많이 오르거나 오래 서 있었던 일도 같이 봅니다. 달린 뒤 그날 저녁과 다음 아침의 뻣뻣함이 어떻게 바뀌었는지 확인하세요. 갑자기 뒤에서 맞은 듯하거나 끊어지는 느낌 뒤 발을 딛거나 밀기 어렵다면 운동을 멈추고 신속히 평가받으세요.","cues":[{"start":51.0,"end":53.5,"text":"계단을 많이 오르거나 오래 서"},{"start":53.5,"end":55.9,"text":"있었던 일도 같이 봅니다."},{"start":55.9,"end":58.7,"text":"달린 뒤 그날 저녁과 다음 아침의"},{"start":58.7,"end":61.2,"text":"뻣뻣함이 어떻게 바뀌었는지"},{"start":61.2,"end":63.5,"text":"확인하세요. 갑자기 뒤에서"},{"start":63.5,"end":66.2,"text":"맞은 듯하거나 끊어지는 느낌 뒤"},{"start":66.2,"end":68.5,"text":"발을 딛거나 밀기 어렵다면"},{"start":68.5,"end":72.0,"text":"운동을 멈추고 신속히 평가받으세요."}]},{"start":72,"end":79,"text":"운동량이 맞았는지 궁금하다면 가장 편했던 순간 말고, 다음 날 첫걸음을 보세요.","cues":[{"start":72.0,"end":74.7,"text":"운동량이 맞았는지 궁금하다면"},{"start":74.7,"end":76.6,"text":"가장 편했던 순간 말고,"},{"start":76.6,"end":79.0,"text":"다음 날 첫걸음을 보세요."}]}],"sources":[{"title":"Achilles Pain, Stiffness, and Muscle Power Deficits: Midportion Achilles Tendinopathy Revision – 2024","url":"https://orthopt.org/uploads/content_files/files/chimenti_et_al_2024_achilles_pain_stiffness_and_muscle_power_deficits_midportion_achilles_tendinopathy_revision_2024.pdf"},{"title":"Achilles tendinopathy management advice","url":"https://www.cuh.nhs.uk/patient-information/achilles-tendinopathy-management-advice/"},{"title":"Achilles Tendinitis","url":"https://www.orthoinfo.org/bodypart/foot-ankle/achilles-tendinitis/"}]},{"id":97,"title":"밤 운동 후 피곤한데 잠은 안 오는 이유","category":"운동","original":"밤 운동 뒤 몸은 지쳤는데 잠은 안 오는 이유","length":80,"parts":[{"start":0,"end":2,"text":"운동 뒤, 몸만 피곤한가요?","cues":[{"start":0.0,"end":2.0,"text":"운동 뒤, 몸만 피곤한가요?"}]},{"start":2,"end":7,"text":"운동 종료 시각과 잠들 준비가 된 시각은 다를 수 있어요.","cues":[{"start":2.0,"end":4.6,"text":"운동 종료 시각과 잠들 준비가"},{"start":4.6,"end":7.0,"text":"된 시각은 다를 수 있어요."}]},{"start":7,"end":33,"text":"밤에 강하게 운동하고 집에 옵니다. 다리는 무거운데 심장은 아직 빨리 뛰고 열이 남아 있는 것 같아요. 운동은 끝났지만 몸이 회복하는 과정은 계속되죠. 피곤하다는 느낌만으로 곧 잠들 수 있다고 판단하기는 어려워요. 반대로 저녁에 가볍게 운동해도 잠에 별 영향이 없는 사람도 있습니다.","cues":[{"start":7.0,"end":10.3,"text":"밤에 강하게 운동하고 집에 옵니다."},{"start":10.3,"end":12.9,"text":"다리는 무거운데 심장은 아직"},{"start":12.9,"end":16.2,"text":"빨리 뛰고 열이 남아 있는 것 같아요."},{"start":16.2,"end":18.1,"text":"운동은 끝났지만 몸이"},{"start":18.1,"end":20.8,"text":"회복하는 과정은 계속되죠."},{"start":20.8,"end":23.8,"text":"피곤하다는 느낌만으로 곧 잠들 수"},{"start":23.8,"end":26.7,"text":"있다고 판단하기는 어려워요."},{"start":26.7,"end":29.5,"text":"반대로 저녁에 가볍게 운동해도"},{"start":29.5,"end":33.0,"text":"잠에 별 영향이 없는 사람도 있습니다."}]},{"start":33,"end":39,"text":"핵심은 ‘밤 운동은 나쁘다’로 묶기 전에 내 시간차를 보는 겁니다.","cues":[{"start":33.0,"end":36.0,"text":"핵심은 ‘밤 운동은 나쁘다’로 묶기"},{"start":36.0,"end":39.0,"text":"전에 내 시간차를 보는 겁니다."}]},{"start":39,"end":75,"text":"가령 같은 저녁 운동이라도 여덟 시에 산책을 끝낸 날과, 자정 직전에 힘든 운동을 마친 날은 몸이 밤을 준비할 시간이 달라요. 시간표를 늘어놓으면 운동 자체와 잘 시간이 줄어든 문제를 구분할 수 있습니다. 끝낸 시각과 강도를 적고, 씻고 누운 시각과 실제로 잠든 때를 비교해 보세요. 운동을 무조건 빼기보다 가능한 날 강도나 시간을 하나만 바꿔보면 알기 쉬워요. 일정이 밀려 잠잘 시간 자체가 줄었는지도 함께 보고요.","cues":[{"start":39.0,"end":41.3,"text":"가령 같은 저녁 운동이라도"},{"start":41.3,"end":43.6,"text":"여덟 시에 산책을 끝낸 날과,"},{"start":43.6,"end":46.5,"text":"자정 직전에 힘든 운동을 마친 날은"},{"start":46.5,"end":49.5,"text":"몸이 밤을 준비할 시간이 달라요."},{"start":49.5,"end":51.4,"text":"시간표를 늘어놓으면"},{"start":51.4,"end":53.9,"text":"운동 자체와 잘 시간이 줄어든"},{"start":53.9,"end":56.5,"text":"문제를 구분할 수 있습니다."},{"start":56.5,"end":58.6,"text":"끝낸 시각과 강도를 적고,"},{"start":58.6,"end":60.7,"text":"씻고 누운 시각과 실제로"},{"start":60.7,"end":63.1,"text":"잠든 때를 비교해 보세요."},{"start":63.1,"end":65.2,"text":"운동을 무조건 빼기보다"},{"start":65.2,"end":67.3,"text":"가능한 날 강도나 시간을"},{"start":67.3,"end":70.1,"text":"하나만 바꿔보면 알기 쉬워요."},{"start":70.1,"end":72.6,"text":"일정이 밀려 잠잘 시간 자체가"},{"start":72.6,"end":75.0,"text":"줄었는지도 함께 보고요."}]},{"start":75,"end":80,"text":"운동이 끝난 시계와 잠이 시작된 시계 사이를 재보세요.","cues":[{"start":75.0,"end":77.1,"text":"운동이 끝난 시계와 잠이"},{"start":77.1,"end":80.0,"text":"시작된 시계 사이를 재보세요."}]}],"sources":[{"title":"How Sleep Works — Your Sleep/Wake Cycle","url":"https://www.nhlbi.nih.gov/health/sleep/sleep-wake-cycle"},{"title":"Dose-response relationship between evening exercise and sleep","url":"https://www.nature.com/articles/s41467-025-58271-x"},{"title":"Effects of Evening Exercise on Sleep in Healthy Participants: A Systematic Review and Meta-Analysis","url":"https://pubmed.ncbi.nlm.nih.gov/30374942/"},{"title":"Effects of morning versus evening exercise on sleep: a systematic review of comparative studies with a meta-analysis of randomized controlled trials","url":"https://pubmed.ncbi.nlm.nih.gov/42632303/"},{"title":"How Sleep Works — Why Is Sleep Important?","url":"https://www.nhlbi.nih.gov/health/sleep/why-sleep-important"}]},{"id":98,"title":"강하게 운동한 직후 혈당이 오르는 이유","category":"운동","original":"운동했는데 왜 혈당이 오를까? 운동할 때 간이 하는 일","length":84,"parts":[{"start":0,"end":2,"text":"운동 직후, 혈당이 올랐어요.","cues":[{"start":0.0,"end":2.0,"text":"운동 직후, 혈당이 올랐어요."}]},{"start":2,"end":8,"text":"근육이 포도당을 쓰는 동안 간에서도 동시에 일이 벌어집니다.","cues":[{"start":2.0,"end":4.5,"text":"근육이 포도당을 쓰는 동안"},{"start":4.5,"end":8.0,"text":"간에서도 동시에 일이 벌어집니다."}]},{"start":8,"end":47,"text":"운동하는 근육은 포도당을 더 가져다 쓸 수 있어요. 동시에 몸이 강하게 힘쓸 때는 간이 저장한 연료를 혈액으로 더 보낼 수 있습니다. 간이 공급하는 쪽이 더 앞서면 강한 운동 직후엔 수치가 잠깐 올라갈 수 있죠. 센서로 봤다면 혈액과의 시간차도 생각해야 합니다. 예를 들어 같은 날 산책을 했을 때와 전력으로 힘을 썼을 때 센서가 다르게 찍힐 수 있어요. 가장 높았던 점 하나만 보지 말고 운동 전 값과, 운동이 끝난 뒤 어떻게 움직였는지를 함께 살펴보세요.","cues":[{"start":8.0,"end":11.2,"text":"운동하는 근육은 포도당을 더 가져다"},{"start":11.2,"end":13.9,"text":"쓸 수 있어요. 동시에 몸이 강하게"},{"start":13.9,"end":16.5,"text":"힘쓸 때는 간이 저장한 연료를"},{"start":16.5,"end":19.3,"text":"혈액으로 더 보낼 수 있습니다."},{"start":19.3,"end":21.9,"text":"간이 공급하는 쪽이 더 앞서면"},{"start":21.9,"end":24.4,"text":"강한 운동 직후엔 수치가 잠깐"},{"start":24.4,"end":27.0,"text":"올라갈 수 있죠. 센서로 봤다면"},{"start":27.0,"end":30.5,"text":"혈액과의 시간차도 생각해야 합니다."},{"start":30.5,"end":33.0,"text":"예를 들어 같은 날 산책을 했을"},{"start":33.0,"end":35.4,"text":"때와 전력으로 힘을 썼을 때"},{"start":35.4,"end":38.2,"text":"센서가 다르게 찍힐 수 있어요."},{"start":38.2,"end":41.0,"text":"가장 높았던 점 하나만 보지 말고"},{"start":41.0,"end":43.9,"text":"운동 전 값과, 운동이 끝난 뒤 어떻게"},{"start":43.9,"end":47.0,"text":"움직였는지를 함께 살펴보세요."}]},{"start":47,"end":52,"text":"그런데 직후에 올랐다고 나중에 내려가지 않는 건 아니에요.","cues":[{"start":47.0,"end":49.0,"text":"그런데 직후에 올랐다고"},{"start":49.0,"end":52.0,"text":"나중에 내려가지 않는 건 아니에요."}]},{"start":52,"end":75,"text":"인슐린을 쓰는 사람은 운동 뒤 저혈당 위험까지 자기 치료 계획을 따라야 합니다. 제 일형 당뇨가 있는 분은 혈당이 높고 케톤도 확인되면 운동으로 낮추려 하지 말고 의료진과 정한 대응을 따르세요. 운동의 전후 몇 시간, 약과 식사 시각도 같이 보면 판단에 도움이 됩니다.","cues":[{"start":52.0,"end":53.9,"text":"인슐린을 쓰는 사람은"},{"start":53.9,"end":56.4,"text":"운동 뒤 저혈당 위험까지 자기"},{"start":56.4,"end":59.0,"text":"치료 계획을 따라야 합니다."},{"start":59.0,"end":61.1,"text":"제 일형 당뇨가 있는 분은"},{"start":61.1,"end":63.6,"text":"혈당이 높고 케톤도 확인되면"},{"start":63.6,"end":65.9,"text":"운동으로 낮추려 하지 말고"},{"start":65.9,"end":68.9,"text":"의료진과 정한 대응을 따르세요."},{"start":68.9,"end":72.0,"text":"운동의 전후 몇 시간, 약과 식사 시각도"},{"start":72.0,"end":75.0,"text":"같이 보면 판단에 도움이 됩니다."}]},{"start":75,"end":84,"text":"그래프의 한 점으로 운동을 채점하지 마세요. 간의 공급과 근육의 사용은 동시에 움직입니다.","cues":[{"start":75.0,"end":77.6,"text":"그래프의 한 점으로 운동을"},{"start":77.6,"end":80.4,"text":"채점하지 마세요. 간의 공급과"},{"start":80.4,"end":84.0,"text":"근육의 사용은 동시에 움직입니다."}]}],"sources":[{"title":"Exercise and Blood Glucose Levels in Diabetes","url":"https://diabetes.org/health-wellness/fitne end":30.0,"text":"일어나는 일이 더 힘들어질 수 있어요."}]},{"start":30,"end":36,"text":"그렇다고 아픈 걸 참으며 예전 운동으로 바로 돌아갈 필요는 없습니다.","cues":[{"start":30.0,"end":32.4,"text":"그렇다고 아픈 걸 참으며 예전"},{"start":32.4,"end":36.0,"text":"운동으로 바로 돌아갈 필요는 없습니다."}]},{"start":36,"end":75,"text":"가령 쉬고 나서 평지에선 덜 불편한데 낮은 의자에 앉으면 두 손을 짚어야 비로소 일어날 수 있어요. 그럼 어떤 동작을 되찾아야 하는지가 보이죠. 아픈 날을 줄이는 것과 그 동작이 편해지는 걸 함께 볼 수 있어요. 어떤 동작을 되찾고 싶은지 정하고, 몸 상태에 맞는 부담을 조절하는 게 중요해요. 새로 무릎이 뜨겁게 붓거나 심한 통증이 생기면 운동 계획보다 원인 확인이 먼저입니다. 사진 결과뿐 아니라 팔을 짚어야 일어나는지 같은 변화도 알려 주세요.","cues":[{"start":36.0,"end":38.3,"text":"가령 쉬고 나서 평지에선 덜"},{"start":38.3,"end":40.9,"text":"불편한데 낮은 의자에 앉으면"},{"start":40.9,"end":43.7,"text":"두 손을 짚어야 비로소 일어날 수"},{"start":43.7,"end":45.8,"text":"있어요. 그럼 어떤 동작을"},{"start":45.8,"end":48.5,"text":"되찾아야 하는지가 보이죠."},{"start":48.5,"end":51.2,"text":"아픈 날을 줄이는 것과 그 동작이"},{"start":51.2,"end":54.1,"text":"편해지는 걸 함께 볼 수 있어요."},{"start":54.1,"end":57.1,"text":"어떤 동작을 되찾고 싶은지 정하고,"},{"start":57.1,"end":60.1,"text":"몸 상태에 맞는 부담을 조절하는 게"},{"start":60.1,"end":62.7,"text":"중요해요. 새로 무릎이 뜨겁게"},{"start":62.7,"end":65.4,"text":"붓거나 심한 통증이 생기면 운동"},{"start":65.4,"end":68.7,"text":"계획보다 원인 확인이 먼저입니다."},{"start":68.7,"end":71.5,"text":"사진 결과뿐 아니라 팔을 짚어야"},{"start":71.5,"end":75.0,"text":"일어나는지 같은 변화도 알려 주세요."}]},{"start":75,"end":82,"text":"무릎을 얼마나 쉬었는지와 함께, 다시 편하게 하고 싶은 동작 하나를 정해 보세요.","cues":[{"start":75.0,"end":77.7,"text":"무릎을 얼마나 쉬었는지와 함께,"},{"start":77.7,"end":79.6,"text":"다시 편하게 하고 싶은"},{"start":79.6,"end":82.0,"text":"동작 하나를 정해 보세요."}]}],"sources":[{"title":"Osteoarthritis in over 16s: diagnosis and management (NG226)","url":"https://www.nice.org.uk/guidance/ng226/chapter/Recommendations"},{"title":"Osteoarthritis","url":"https://www.niams.nih.gov/health-topics/osteoarthritis"},{"title":"Osteoarthritis: Diagnosis, Treatment, and Steps to Take","url":"https://www.niams.nih.gov/health-topics/osteoarthritis/diagnosis-treatment-and-steps-to-take"},{"title":"Knee pain","url":"https://www.nhs.uk/symptoms/knee-pain/"}]},{"id":100," <script>
"use strict";
const episodes = JSON.parse(document.getElementById("episodes").textContent);
const episodeById = new Map(episodes.map(episode => [episode.id, episode]));
const $ = selector => document.querySelector(selector);
const number = id => String(id).padStart(3, "0");
const time = sec => String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
const subTime = sec => time(Math.floor(sec)) + "." + Math.round((sec - Math.floor(sec)) * 10);
const range = (start, end) => time(start) + "–" + time(end);
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
}[char]));
const statuses = {todo:"미검토", revise:"수정 필요", done:"검토 완료"};
const storageKey = "onbom-shorts-review-2026-11-20";
const isNarrow = matchMedia("(max-width:760px)");
const originalBase = "https://gusrtavedarw.github.io/onbom-youtube-review/";
let reviews = {};
let storageAvailable = true;

try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
  if (saved && typeof saved === "object" && !Array.isArray(saved)) reviews = saved;
  localStorage.setItem(storageKey, JSON.stringify(reviews));
} catch {
  storageAvailable = false;
}
const marks = id => ({
  status: Object.hasOwn(statuses, reviews[id]?.status) ? reviews[id].status : "todo",
  memo: typeof reviews[id]?.memo === "string" ? reviews[id].memo : ""
});
const initialId = Number(location.hash.match(/^#short-(\d{1,3})$/)?.[1]);
let currentId = episodeById.has(initialId) ? initialId : episodes[0].id;
let matching = episodes;
let cutMode = false;
let toastTimer;

$("#library").open = !isNarrow.matches;
for (const category of new Set(episodes.map(episode => episode.category))) {
  $("#category").add(new Option(category, category));
}
function announce(message) {
  const element = $("#notice");
  clearTimeout(toastTimer);
  element.textContent = message;
  element.hidden = false;
  toastTimer = setTimeout(() => { element.hidden = true; }, 2300);
}
function save(id, update) {
  const next = {...marks(id), ...update};
  if (next.status === "todo" && !next.memo) delete reviews[id];
  else reviews[id] = next;
  try {
    localStorage.setItem(storageKey, JSON.stringify(reviews));
  } catch {
    storageAvailable = false;
    $("#save-hint").textContent = "현재 브라우저에서 저장이 제한되어 이 탭을 닫으면 메모가 사라집니다.";
  }
}
function updateProgress() {
  const count = episodes.filter(episode => marks(episode.id).status === "done").length;
  $("#done").textContent = count;
  $("#progress").value = count;
}
function renderList() {
  const query = $("#search").value.trim().normalize("NFC").toLowerCase();
  const category = $("#category").value;
  const status = $("#status-filter").value;
  matching = episodes.filter(episode => {
    if (category && episode.category !== category) return false;
    if (status && marks(episode.id).status !== status) return false;
    if (!query) return true;
    if (/^#?\d{1,3}$/.test(query)) return episode.id === Number(query.replace("#",""));
    return [episode.title, episode.original, episode.category, ...episode.parts.map(part => part.text)]
      .join(" ").toLowerCase().includes(query);
  });
  $("#count").textContent = matching.length + "편";
  const list = $("#list");
  if (!matching.length) {
    list.innerHTML = '<p class="empty">검색 조건에 맞는 대본이 없습니다.</p>';
    return;
  }
  list.innerHTML = matching.map(episode => {
    const status = marks(episode.id).status;
    return `<button type="button" class="entry" data-episode="${episode.id}" aria-current="${episode.id === currentId}">
      <span class="entry-num">${number(episode.id)}</span>
      <span><span class="entry-title">${escapeHtml(episode.title)}</span>
      <span class="entry-hook">${escapeHtml(episode.parts[0].text)}</span>
      ${status === "todo" ? "" : `<span class="entry-state">${statuses[status]}</span>`}</span>
    </button>`;
  }).join("");
}
function neighbors() {
  const position = matching.findIndex(episode => episode.id === currentId);
  if (position < 0) return [null, matching[0]?.id];
  return [matching[position - 1]?.id, matching[position + 1]?.id];
}
function updateNavigation() {
  const [before, after] = neighbors();
  $("#previous").disabled = !before;
  $("#next").disabled = !after;
}
function syncSelection() {
  for (const button of document.querySelectorAll(".entry")) {
    button.setAttribute("aria-current", String(Number(button.dataset.episode) === currentId));
  }
}
const sectionLabels = ["첫 훅", "시청 이유", "본문", "중간 훅", "본문", "결말"];
const sectionClasses = ["hook", "beat", "beat", "beat pivot", "beat", "beat ending"];
function episodeNarration(episode) {
  return episode.parts.map((part, index) =>
    `<section class="${sectionClasses[index]}">
      <h3>${sectionLabels[index]} <span class="track">${range(part.start, part.end)}</span></h3>
      <p>${escapeHtml(part.text)}</p>
    </section>`
  ).join("");
}
function episodeCues(episode) {
  return episode.parts.flatMap((part, index) => part.cues.map(cue =>
    `<div class="cue"><time>${subTime(cue.start)}–${subTime(cue.end)} · ${sectionLabels[index]}</time><p>${escapeHtml(cue.text)}</p></div>`
  )).join("");
}
function episodeSourceLinks(episode) {
  return episode.sources.map(source =>
    `<li><a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.title)}</a></li>`
  ).join("");
}
function renderReader() {
  const episode = episodeById.get(currentId);
  const selected = marks(currentId);
  const narration = episodeNarration(episode);
  const cues = episodeCues(episode);
  const links = episodeSourceLinks(episode);
  const id = number(currentId);
  $("#reader").innerHTML = `
    <div class="reader-header">
      <div class="episode-meta"><span class="num">${id}</span><span>${escapeHtml(episode.category)}</span><time title="녹음 전 예상 길이" datetime="PT${episode.length}S">약 ${time(episode.length)}</time></div>
      <h2 tabindex="-1" id="script-title">${escapeHtml(episode.title)}</h2>
      <div class="actions">
        <button type="button" class="primary" id="copy">이 편 대본 전체 복사</button>
        <button type="button" id="download-html">이 편 HTML 다운로드</button>
        <button type="button" id="toggle-cuts" aria-pressed="${cutMode}">컷 타임라인</button>
        <label>검토 상태 <select id="episode-status">${Object.entries(statuses).map(([key, value]) =>
          `<option value="${key}" ${selected.status === key ? "selected" : ""}>${value}</option>`
        ).join("")}</select></label>
      </div>
    </div>
    <div class="content">
      <div id="reading" ${cutMode ? "hidden" : ""}>${narration}</div>
      <div id="cut-view" class="switch-panel" ${cutMode ? "" : "hidden"}><p class="cuts-head">문장 흐름에 맞춘 자막·화면 전환 지점입니다. 실제 녹음에 맞춰 시간을 조정하세요.</p><div class="cuts">${cues}</div></div>
      <div class="review">
        <div><label for="memo">검토 메모</label><textarea id="memo" placeholder="훅, 표현, 길이 등 수정할 점" aria-describedby="save-hint"></textarea>
        <p class="hint" id="save-hint">${storageAvailable ? "메모와 상태는 이 브라우저에 자동 저장됩니다." : "현재 브라우저에서 저장이 제한되어 이 탭을 닫으면 메모가 사라집니다."}</p></div>
        <details class="sources"><summary>원본 대본과 근거</summary><div class="source-body">
          <p><a href="${originalBase}#topic-${id}/script" target="_blank" rel="noopener noreferrer">원본 ${id}편 · ${escapeHtml(episode.original)}</a></p>
          <ul>${links}</ul>
        </div></details>
        <nav class="move" aria-label="검색 결과 안에서 이동"><button id="previous" type="button">← 이전 편</button><button id="next" type="button">다음 편 →</button></nav>
      </div>
    </div>`;
  $("#memo").value = selected.memo;
  updateNavigation();
}
function openEpisode(id, {user = false, updateHash = true} = {}) {
  if (!episodeById.has(id)) return;
  currentId = id;
  if (updateHash) history.replaceState(null, "", "#short-" + number(id));
  syncSelection();
  renderReader();
  if (user && isNarrow.matches) $("#library").open = false;
  if (user) {
    $("#script-title").focus({preventScroll:true});
    $("#reader").scrollIntoView({block:"start"});
  }
}
async function copyNarration() {
  const text = episodeById.get(currentId).parts.map(part => part.text).join("\n\n");
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const field = document.createElement("textarea");
    field.value = text;
    field.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.append(field);
    field.select();
    let copied = false;
    try { copied = document.execCommand("copy"); } catch {}
    field.remove();
    $("#copy")?.focus({preventScroll:true});
    if (!copied) {
      const dialog = $("#copy-fallback");
      const fullScript = $("#copy-text");
      fullScript.value = text;
      if (!dialog.open) dialog.showModal();
      fullScript.focus();
      fullScript.select();
      fullScript.setSelectionRange(0, text.length);
      return;
    }
  }
  announce("이 편의 낭독문 전체를 복사했습니다.");
}
function episodeHtml(episode) {
  const id = number(episode.id);
  const title = escapeHtml(episode.title);
  return `<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온봄 쇼츠 ${id}편 · ${title}</title>
<style>
  :root {font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#182c27;background:#eef3f0}
  body {max-width:840px;margin:auto;padding:24px;line-height:1.65;box-sizing:border-box}
  main {background:#fff;padding:clamp(16px,4vw,40px);border:1px solid #dce6df;border-radius:14px;overflow-wrap:anywhere}
  header {border-bottom:1px solid #dce6df;padding-bottom:18px}
  h1 {line-height:1.25;font-size:clamp(1.4rem,5vw,2.1rem);margin:8px 0}
  h2 {font-size:1.25rem;margin-top:28px}
  h3 {font-size:.95rem;margin:.65em 0 .2em}
  p {margin:.3em 0 .8em}
  .meta,.track,.cue time {color:#4c635b;font-size:.85rem;font-variant-numeric:tabular-nums}
  .hook {background:#e2f0e8;border-radius:8px;padding:8px 14px}
  .cue {border-top:1px solid #dce6df;padding-block:6px}
  .cue p {margin:.15em 0}
  a {color:#1c5242;text-underline-offset:3px}
  @media print {body,main {background:white;padding:0;border:0} .cue,section {break-inside:avoid}}
</style>
</head>
<body>
<main>
  <header>
    <p class="meta">온봄의원 쇼츠 ${id}편 · ${escapeHtml(episode.category)} · 약 ${time(episode.length)}</p>
    <h1>${title}</h1>
  </header>
  <section aria-labelledby="narration-title">
    <h2 id="narration-title">낭독 대본</h2>
    ${episodeNarration(episode)}
  </section>
  <section aria-labelledby="captions-title">
    <h2 id="captions-title">자막 타임코드</h2>
    <p class="meta">타임코드는 녹음 전 가안입니다.</p>
    ${episodeCues(episode)}
  </section>
  <section aria-labelledby="sources-title">
    <h2 id="sources-title">원본 대본과 근거</h2>
    <p><a href="${originalBase}#topic-${id}/script">${escapeHtml(episode.original)}</a></p>
    <ul>${episodeSourceLinks(episode)}</ul>
  </section>
</main>
</body>
</html>`;
}
function downloadEpisode() {
  const episode = episodeById.get(currentId);
  const file = new Blob([episodeHtml(episode)], {type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(file);
  const link = document.createElement("a");
  link.href = url;
  link.download = "onbom-short-" + number(episode.id) + ".html";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  announce(number(episode.id) + "편 HTML 다운로드를 시작했습니다.");
}
function applyFilters() {
  renderList();
  if (matching.length && !matching.some(episode => episode.id === currentId)) openEpisode(matching[0].id);
  else updateNavigation();
}
$("#search").addEventListener("input", applyFilters);
$("#category").addEventListener("change", applyFilters);
$("#status-filter").addEventListener("change", applyFilters);
$("#reset").addEventListener("click", () => {
  for (const selector of ["#search", "#category", "#status-filter"]) $(selector).value = "";
  applyFilters();
  $("#search").focus();
});
$("#list").addEventListener("click", event => {
  const button = event.target.closest("[data-episode]");
  if (button) openEpisode(Number(button.dataset.episode), {user:true});
});
$("#reader").addEventListener("click", event => {
  const id = event.target.closest("button")?.id;
  switch (id) {
    case "copy": copyNarration(); break;
    case "download-html": downloadEpisode(); break;
    case "toggle-cuts":
      cutMode = !cutMode;
      $("#toggle-cuts").setAttribute("aria-pressed", String(cutMode));
      $("#reading").hidden = cutMode;
      $("#cut-view").hidden = !cutMode;
      break;
    case "previous": openEpisode(neighbors()[0], {user:true}); break;
    case "next": openEpisode(neighbors()[1], {user:true}); break;
  }
});
$("#reader").addEventListener("input", event => {
  if (event.target.id === "memo") save(currentId, {memo:event.target.value});
});
$("#reader").addEventListener("change", event => {
  if (event.target.id !== "episode-status") return;
  save(currentId, {status:event.target.value});
  updateProgress();
  renderList();
  updateNavigation();
  announce(storageAvailable ? "검토 상태를 저장했습니다." : "이 탭에 검토 상태를 반영했습니다.");
});
window.addEventListener("hashchange", () => {
  const match = location.hash.match(/^#short-(\d{1,3})$/);
  if (match) openEpisode(Number(match[1]), {updateHash:false});
});
renderList();
renderReader();
updateProgress();
</script>
</body>
</html>
