prescribing information","url":"https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/215256s024lbl.pdf"},{"title":"Weight regain and cardiometabolic effects after withdrawal of semaglutide: The STEP 1 trial extension","url":"https://pubmed.ncbi.nlm.nih.gov/35441470/"},{"title":"Nutritional priorities to support GLP-1 therapy for obesity: a joint Advisory","url":"https://doi.org/10.1016/j.ajcnut.2025.04.023"}]},{"id":35,"title":"몸무게는 정상인데 혈압이나 혈당이 왜 높을까?","category":"체중·대사","original":"몸무게는 정상인데 혈압이나 혈당은 왜 높을 수 있을까?","length":84,"parts":[{"start":0,"end":2,"text":"체중은 정상, 혈당은 높대요?","cues":[{"start":0.0,"end":2.0,"text":"체중은 정상, 혈당은 높대요?"}]},{"start":2,"end":8,"text":"키와 몸무게로 계산한 숫자가 검진표 전체를 설명하진 못합니다.","cues":[{"start":2.0,"end":4.6,"text":"키와 몸무게로 계산한 숫자가"},{"start":4.6,"end":8.0,"text":"검진표 전체를 설명하진 못합니다."}]},{"start":8,"end":32,"text":"체질량지수는 체중을 키와 견주는 값이에요. 몸속 지방이 어디에 얼마나 모였는지, 근육이 어느 정도인지는 직접 보여주지 않죠. 비슷한 키에 같은 체중인 두 사람도 허리둘레, 가족력, 활동량이 다를 수 있어요. 혈당을 처리하는 방식이나 혈중 지방의 상태도 달라질 수 있고요.","cues":[{"start":8.0,"end":10.4,"text":"체질량지수는 체중을 키와"},{"start":10.4,"end":13.0,"text":"견주는 값이에요. 몸속 지방이"},{"start":13.0,"end":15.1,"text":"어디에 얼마나 모였는지,"},{"start":15.1,"end":17.7,"text":"근육이 어느 정도인지는 직접"},{"start":17.7,"end":20.1,"text":"보여주지 않죠. 비슷한 키에"},{"start":20.1,"end":22.9,"text":"같은 체중인 두 사람도 허리둘레,"},{"start":22.9,"end":26.1,"text":"가족력, 활동량이 다를 수 있어요."},{"start":26.1,"end":28.9,"text":"혈당을 처리하는 방식이나 혈중"},{"start":28.9,"end":32.0,"text":"지방의 상태도 달라질 수 있고요."}]},{"start":32,"end":38,"text":"그래서 체중이 정상이라고 검진표를 덮으면 중요한 정보가 빠져요.","cues":[{"start":32.0,"end":35.2,"text":"그래서 체중이 정상이라고 검진표를"},{"start":35.2,"end":38.0,"text":"덮으면 중요한 정보가 빠져요."}]},{"start":38,"end":76,"text":"예를 들어 체중은 그대로인데 두 번 연속 혈압이 이전보다 높게 나왔어요. 그런 사람에게 체중만 줄이라고 말하면 숫자가 변한 이유와 실제로 필요한 평가를 놓칠 수 있죠. 검사표를 줄마다 읽는 이유입니다. 혈당과 혈압, 지질이 각각 어떤 범위인지 보고 이전 결과와 이어 보세요. 어느 숫자가 변했는지에 따라 추가로 확인할 일과 우선순위가 달라집니다. 이미 먹는 양이 적거나 근력이 줄었다면 더 빼는 게 첫 질문이 아닐 수도 있어요.","cues":[{"start":38.0,"end":41.0,"text":"예를 들어 체중은 그대로인데 두 번"},{"start":41.0,"end":44.5,"text":"연속 혈압이 이전보다 높게 나왔어요."},{"start":44.5,"end":47.3,"text":"그런 사람에게 체중만 줄이라고"},{"start":47.3,"end":49.7,"text":"말하면 숫자가 변한 이유와"},{"start":49.7,"end":53.0,"text":"실제로 필요한 평가를 놓칠 수 있죠."},{"start":53.0,"end":56.3,"text":"검사표를 줄마다 읽는 이유입니다."},{"start":56.3,"end":59.7,"text":"혈당과 혈압, 지질이 각각 어떤 범위인지"},{"start":59.7,"end":62.6,"text":"보고 이전 결과와 이어 보세요."},{"start":62.6,"end":65.2,"text":"어느 숫자가 변했는지에 따라"},{"start":65.2,"end":68.0,"text":"추가로 확인할 일과 우선순위가"},{"start":68.0,"end":70.3,"text":"달라집니다. 이미 먹는 양이"},{"start":70.3,"end":72.7,"text":"적거나 근력이 줄었다면 더"},{"start":72.7,"end":76.0,"text":"빼는 게 첫 질문이 아닐 수도 있어요."}]},{"start":76,"end":84,"text":"체중계가 안 바뀌어도 검사표의 다른 줄은 움직입니다. 달라진 그 줄부터 보세요.","cues":[{"start":76.0,"end":78.1,"text":"체중계가 안 바뀌어도"},{"start":78.1,"end":81.4,"text":"검사표의 다른 줄은 움직입니다."},{"start":81.4,"end":84.0,"text":"달라진 그 줄부터 보세요."}]}],"sources":[{"title":"Metabolic Syndrome — Diagnosis","url":"https://www.nhlbi.nih.gov/health/metabolic-syndrome/diagnosis"},{"title":"About Insulin Resistance and Type 2 Diabetes","url":"https://www.cdc.gov/diabetes/about/insulin-resistance-type-2-diabetes.html"},{"title":"Am I at a Healthy Weight?","url":"https://www.niddk.nih.gov/health-information/weight-management/adult-overweight-obesity/am-i-healthy-weight"}]},{"id":36,"title":"폐경 전후 같은 체중에서 달라지는 허리와 힘","category":"체중·대사","original":"폐경 전후 몸무게는 그대로인데 왜 허리둘레가 늘고 힘이 줄까?","length":81,"parts":[{"start":0,"end":2,"text":"체중은 그대로, 허리만 꽉 껴요.","cues":[{"start":0.0,"end":2.0,"text":"체중은 그대로, 허리만 꽉 껴요."}]},{"start":2,"end":7,"text":"체중계에 찍힌 합계 안에서 무엇이 달라졌는지 볼게요.","cues":[{"start":2.0,"end":4.4,"text":"체중계에 찍힌 합계 안에서"},{"start":4.4,"end":7.0,"text":"무엇이 달라졌는지 볼게요."}]},{"start":7,"end":30,"text":"옷의 허리는 조이는데 체중은 작년과 비슷합니다. 장을 보고 오는 길엔 장바구니가 더 무겁게 느껴져요. 폐경 전후에는 나이가 드는 과정과 함께 지방의 분포나 근육 상태가 달라질 수 있습니다. 몸무게가 같아도 허리의 변화와 몸에서 실제로 내는 힘은 다를 수 있는 거죠.","cues":[{"start":7.0,"end":9.5,"text":"옷의 허리는 조이는데 체중은"},{"start":9.5,"end":12.1,"text":"작년과 비슷합니다. 장을 보고"},{"start":12.1,"end":14.8,"text":"오는 길엔 장바구니가 더 무겁게"},{"start":14.8,"end":17.6,"text":"느껴져요. 폐경 전후에는 나이가"},{"start":17.6,"end":20.3,"text":"드는 과정과 함께 지방의 분포나"},{"start":20.3,"end":23.4,"text":"근육 상태가 달라질 수 있습니다."},{"start":23.4,"end":26.7,"text":"몸무게가 같아도 허리의 변화와 몸에서"},{"start":26.7,"end":30.0,"text":"실제로 내는 힘은 다를 수 있는 거죠."}]},{"start":30,"end":34,"text":"그럼 체성분표의 근육 숫자만 보면 될까요?","cues":[{"start":30.0,"end":32.0,"text":"그럼 체성분표의 근육"},{"start":32.0,"end":34.0,"text":"숫자만 보면 될까요?"}]},{"start":34,"end":73,"text":"가령 바지 치수는 달라졌는데 계단을 오르는 힘은 그대로일 수 있어요. 반대로 옷은 비슷하게 맞아도 장을 본 뒤 가방을 들기 힘든 사람이 있죠. 같은 몸무게라 해도 지켜야 할 생활 능력은 다릅니다. 근육이 얼마나 있는지와 지금 얼마나 힘을 낼 수 있는지도 다른 질문입니다. 의자에서 일어나기, 계단 오르기, 가방 들기가 어떻게 바뀌었는지 보면 생활 목표를 잡는 데 도움이 돼요. 체중 변화에만 맞춰 식사를 계속 줄이면 지켜야 할 기능을 놓칠 수 있죠.","cues":[{"start":34.0,"end":37.2,"text":"가령 바지 치수는 달라졌는데 계단을"},{"start":37.2,"end":40.3,"text":"오르는 힘은 그대로일 수 있어요."},{"start":40.3,"end":43.2,"text":"반대로 옷은 비슷하게 맞아도 장을"},{"start":43.2,"end":46.5,"text":"본 뒤 가방을 들기 힘든 사람이 있죠."},{"start":46.5,"end":49.1,"text":"같은 몸무게라 해도 지켜야 할"},{"start":49.1,"end":51.6,"text":"생활 능력은 다릅니다. 근육이"},{"start":51.6,"end":54.6,"text":"얼마나 있는지와 지금 얼마나 힘을"},{"start":54.6,"end":57.7,"text":"낼 수 있는지도 다른 질문입니다."},{"start":57.7,"end":60.5,"text":"의자에서 일어나기, 계단 오르기,"},{"start":60.5,"end":63.7,"text":"가방 들기가 어떻게 바뀌었는지 보면"},{"start":63.7,"end":66.7,"text":"생활 목표를 잡는 데 도움이 돼요."},{"start":66.7,"end":70.1,"text":"체중 변화에만 맞춰 식사를 계속 줄이면"},{"start":70.1,"end":73.0,"text":"지켜야 할 기능을 놓칠 수 있죠."}]},{"start":73,"end":81,"text":"체중계는 제자리여도 바지 허리와 장바구니는 달라졌죠. 그 둘도 몸의 변화입니다.","cues":[{"start":73.0,"end":75.5,"text":"체중계는 제자리여도 바지"},{"start":75.5,"end":78.5,"text":"허리와 장바구니는 달라졌죠."},{"start":78.5,"end":81.0,"text":"그 둘도 몸의 변화입니다."}]}],"sources":[{"title":"Changes in body composition and weight during the menopause transition","url":"https://insight.jci.org/articles/view/124865"},{"title":"Menopause Topics: Hormone Therapy","url":"https://menopause.org/patient-education/menopause-topics/hormone-therapy"},{"title":"Can hormone therapy during menopause help me lose weight?","url":"https://www.acog.org/womens-health/experts-and-stories/ask-acog/can-hormone-therapy-help-me-lose-weight"},{"title":"Older Adult Activity: An Overview","url":"https://www.cdc.gov/physical-activity-basics/guidelines/older-adults.html"}]},{"id":37,"title":"지난번처럼 먹었는데 이번엔 왜 살이 잘 안 빠질까?","category":"체중·대사","original":"지난번과 똑같이 먹었는데 이번엔 왜 살이 잘 안 빠질까?","length":82,"parts":[{"start":0,"end":2,"text":"같은 식단, 왜 이번엔 안 빠져요?","cues":[{"start":0.0,"end":2.0,"text":"같은 식단, 왜 이번엔 안 빠져요?"}]},{"start":2,"end":8,"text":"지난번 첫 주 몸무게와 지금을 비교할 때 빠진 전제가 있습니다.","cues":[{"start":2.0,"end":4.7,"text":"지난번 첫 주 몸무게와 지금을"},{"start":4.7,"end":8.0,"text":"비교할 때 빠진 전제가 있습니다."}]},{"start":8,"end":32,"text":"처음 식단을 바꿨을 땐 첫 주에 숫자가 훅 내려갔을 수 있어요. 그중엔 몸에 저장된 탄수화물과 함께 움직인 수분도 들어갑니다. 시작한 몸무게가 다르면 같은 양을 먹어도 몸이 쓰는 에너지 조건도 달라지죠. 게다가 이번엔 야근이 많거나, 저녁마다 허기가 더 셀 수도 있습니다.","cues":[{"start":8.0,"end":10.5,"text":"처음 식단을 바꿨을 땐 첫 주에"},{"start":10.5,"end":13.4,"text":"숫자가 훅 내려갔을 수 있어요."},{"start":13.4,"end":16.1,"text":"그중엔 몸에 저장된 탄수화물과"},{"start":16.1,"end":19.2,"text":"함께 움직인 수분도 들어갑니다."},{"start":19.2,"end":21.3,"text":"시작한 몸무게가 다르면"},{"start":21.3,"end":23.6,"text":"같은 양을 먹어도 몸이 쓰는"},{"start":23.6,"end":26.0,"text":"에너지 조건도 달라지죠."},{"start":26.0,"end":28.5,"text":"게다가 이번엔 야근이 많거나,"},{"start":28.5,"end":32.0,"text":"저녁마다 허기가 더 셀 수도 있습니다."}]},{"start":32,"end":38,"text":"엑셀에 적힌 메뉴는 같아도 실제로 지키는 난이도는 달라진 겁니다.","cues":[{"start":32.0,"end":35.0,"text":"엑셀에 적힌 메뉴는 같아도 실제로"},{"start":35.0,"end":38.0,"text":"지키는 난이도는 달라진 겁니다."}]},{"start":38,"end":76,"text":"예전엔 퇴근하고 바로 밥을 먹었지만 지금은 일곱 시까지 회의가 계속된다고 해볼게요. 식단표에 저녁 메뉴는 같아도 그 전에 참은 시간은 다릅니다. 실천하기 어렵다면 바꿀 자리가 메뉴 밖에도 있을 수 있어요. 지난번의 가장 낮은 숫자와 오늘을 바로 견주기보다 같은 조건에서 잰 여러 날 흐름을 보세요. 이번에 잠이 줄었는지, 식사 사이가 길어졌는지 확인하면 손볼 자리가 보입니다. 무조건 양을 더 줄이면 하루의 부담까지 커질 수 있죠.","cues":[{"start":38.0,"end":40.3,"text":"예전엔 퇴근하고 바로 밥을"},{"start":40.3,"end":42.8,"text":"먹었지만 지금은 일곱 시까지"},{"start":42.8,"end":45.6,"text":"회의가 계속된다고 해볼게요."},{"start":45.6,"end":48.1,"text":"식단표에 저녁 메뉴는 같아도"},{"start":48.1,"end":50.9,"text":"그 전에 참은 시간은 다릅니다."},{"start":50.9,"end":53.7,"text":"실천하기 어렵다면 바꿀 자리가"},{"start":53.7,"end":56.3,"text":"메뉴 밖에도 있을 수 있어요."},{"start":56.3,"end":59.2,"text":"지난번의 가장 낮은 숫자와 오늘을"},{"start":59.2,"end":61.9,"text":"바로 견주기보다 같은 조건에서"},{"start":61.9,"end":64.3,"text":"잰 여러 날 흐름을 보세요."},{"start":64.3,"end":66.2,"text":"이번에 잠이 줄었는지,"},{"start":66.2,"end":68.3,"text":"식사 사이가 길어졌는지"},{"start":68.3,"end":71.3,"text":"확인하면 손볼 자리가 보입니다."},{"start":71.3,"end":73.2,"text":"무조건 양을 더 줄이면"},{"start":73.2,"end":76.0,"text":"하루의 부담까지 커질 수 있죠."}]},{"start":76,"end":82,"text":"예전 식단표를 다시 쓰기 전에, 오늘의 출발점부터 다시 써 보세요.","cues":[{"start":76.0,"end":78.6,"text":"예전 식단표를 다시 쓰기 전에,"},{"start":78.6,"end":82.0,"text":"오늘의 출발점부터 다시 써 보세요."}]}],"sources":[{"title":"Eating & Physical Activity to Lose or Maintain Weight","url":"https://www.niddk.nih.gov/health-information/weight-management/adult-overweight-obesity/eating-physical-activity"},{"title":"Long-term persistence of hormonal adaptations to weight loss","url":"https://pubmed.ncbi.nlm.nih.gov/22029981/"},{"title":"Relationship between muscle water and glycogen recovery after prolonged exercise in the heat in humans","url":"https://pubmed.ncbi.nlm.nih.gov/25911631/"},{"title":"Prescription Medications to Treat Overweight & Obesity","url":"https://www.niddk.nih.gov/health-information/weight-management/prescription-medications-treat-overweight-obesity"}]},{"id":38,"title":"체중 유지 중 외식 한 끼로 판단하면 안 되는 것","category":"체중·대사","original":"살을 뺀 뒤 평소처럼 지내면서 몸무게도 지킬 수 있을까?","length":80,"parts":[{"start":0,"end":2,"text":"외식 한 끼로 감량은 안 끝나요.","cues":[{"start":0.0,"end":2.0,"text":"외식 한 끼로 감량은 안 끝나요."}]},{"start":2,"end":8,"text":"다음 날 체중이 뛰었을 때, 며칠 뒤까지 봐야 알 수 있는 게 있어요.","cues":[{"start":2.0,"end":4.3,"text":"다음 날 체중이 뛰었을 때,"},{"start":4.3,"end":8.0,"text":"며칠 뒤까지 봐야 알 수 있는 게 있어요."}]},{"start":8,"end":31,"text":"몸무게가 줄면 움직이고 살아가는 데 드는 에너지가 달라질 수 있어요. 식욕이나 포만감 신호도 감량 전과 같지 않을 수 있고요. 그 상태에서 외식한 다음 날 몸무게가 올라가면 되돌아간 것 같죠. 그런데 음식 무게나 수분 때문에 하루 숫자는 움직일 수 있습니다.","cues":[{"start":8.0,"end":11.0,"text":"몸무게가 줄면 움직이고 살아가는"},{"start":11.0,"end":14.3,"text":"데 드는 에너지가 달라질 수 있어요."},{"start":14.3,"end":16.8,"text":"식욕이나 포만감 신호도 감량"},{"start":16.8,"end":19.3,"text":"전과 같지 않을 수 있고요."},{"start":19.3,"end":21.6,"text":"그 상태에서 외식한 다음 날"},{"start":21.6,"end":25.1,"text":"몸무게가 올라가면 되돌아간 것 같죠."},{"start":25.1,"end":27.9,"text":"그런데 음식 무게나 수분 때문에"},{"start":27.9,"end":31.0,"text":"하루 숫자는 움직일 수 있습니다."}]},{"start":31,"end":37,"text":"그날 바로 끼니를 빼면 다음 식사 때 허기까지 읽기 어려워져요.","cues":[{"start":31.0,"end":33.5,"text":"그날 바로 끼니를 빼면 다음"},{"start":33.5,"end":37.0,"text":"식사 때 허기까지 읽기 어려워져요."}]},{"start":37,"end":73,"text":"예를 들어 짠 음식을 먹고 오른 수치가 며칠 사이 익숙한 범위로 내려오는 일과, 몇 주에 걸쳐 조금씩 올라가는 일은 다르게 읽습니다. 하루에 밥을 굶어 보상하면 그 둘을 가를 흐름을 놓치기 쉬워요. 유지할 때는 여러 날이나 몇 주의 흐름과, 평소 계획으로 다시 돌아오기가 얼마나 쉬운지를 함께 보세요. 계속 배고파 일에 집중하기 어렵거나 가족과 외식을 피하게 된다면, 체중이 같아도 계획을 다시 볼 이유가 있습니다.","cues":[{"start":37.0,"end":39.5,"text":"예를 들어 짠 음식을 먹고 오른"},{"start":39.5,"end":42.3,"text":"수치가 며칠 사이 익숙한 범위로"},{"start":42.3,"end":45.3,"text":"내려오는 일과, 몇 주에 걸쳐 조금씩"},{"start":45.3,"end":48.3,"text":"올라가는 일은 다르게 읽습니다."},{"start":48.3,"end":50.7,"text":"하루에 밥을 굶어 보상하면"},{"start":50.7,"end":53.9,"text":"그 둘을 가를 흐름을 놓치기 쉬워요."},{"start":53.9,"end":57.3,"text":"유지할 때는 여러 날이나 몇 주의 흐름과,"},{"start":57.3,"end":60.1,"text":"평소 계획으로 다시 돌아오기가"},{"start":60.1,"end":62.9,"text":"얼마나 쉬운지를 함께 보세요."},{"start":62.9,"end":65.3,"text":"계속 배고파 일에 집중하기"},{"start":65.3,"end":67.4,"text":"어렵거나 가족과 외식을"},{"start":67.4,"end":69.9,"text":"피하게 된다면, 체중이 같아도"},{"start":69.9,"end":73.0,"text":"계획을 다시 볼 이유가 있습니다."}]},{"start":73,"end":80,"text":"유지의 질문은 이겁니다. ‘한 번도 안 흔들렸나’보다 ‘흔들려도 돌아올 수 있나.’","cues":[{"start":73.0,"end":75.4,"text":"유지의 질문은 이겁니다."},{"start":75.4,"end":77.6,"text":"‘한 번도 안 흔들렸나’보다"},{"start":77.6,"end":80.0,"text":"‘흔들려도 돌아올 수 있나.’"}]}],"sources":[{"title":"Eating & Physical Activity to Lose or Maintain Weight","url":"https://www.niddk.nih.gov/health-information/weight-management/adult-overweight-obesity/eating-physical-activity"},{"title":"Long-term persistence of hormonal adaptations to weight loss","url":"https://pubmed.ncbi.nlm.nih.gov/22029981/"},{"title":"Tips for Keeping Weight Off","url":"https://www.cdc.gov/healthy-weight-growth/losing-weight/keeping-it-off.html"},{"title":"Relationship between muscle water and glycogen recovery after prolonged exercise in the heat in humans","url":"https://pubmed.ncbi.nlm.nih.gov/25911631/"},{"title":"Prescription Medications to Treat Overweight & Obesity","url":"https://www.niddk.nih.gov/health-information/weight-management/prescription-medications-treat-overweight-obesity"},{"title":"Nutritional priorities to support GLP-1 therapy for obesity: a joint Advisory","url":"https://doi.org/10.1016/j.ajcnut.2025.04.023"}]},{"id":39,"title":"며칠 만에 오른 체중과 신발이 끼는 변화","category":"체중·대사","original":"며칠 새 늘어난 체중, 지방·수분·부종을 어떻게 구별할까?","length":81,"parts":[{"start":0,"end":2,"text":"며칠 새, 신발까지 꽉 끼나요?","cues":[{"start":0.0,"end":2.0,"text":"며칠 새, 신발까지 꽉 끼나요?"}]},{"start":2,"end":8,"text":"체중계와 신발에서 동시에 온 변화는 한 끼 탓으로 넘기지 마세요.","cues":[{"start":2.0,"end":4.6,"text":"체중계와 신발에서 동시에 온"},{"start":4.6,"end":8.0,"text":"변화는 한 끼 탓으로 넘기지 마세요."}]},{"start":8,"end":46,"text":"체중계는 지방, 수분, 먹은 음식의 무게를 합해서 보여줍니다. 탄수화물을 저장할 때 물도 함께 움직이고, 짠 음식 뒤에는 일시적으로 수분 변화가 생길 수 있어요. 그래서 하루 이틀 숫자가 올라왔다고 전부 지방으로 해석할 수는 없죠. 아침에는 괜찮고 저녁마다 양쪽 신발이 꽉 끼는지, 오늘 처음 한쪽만 껴서 벗기 어려웠는지도 다르게 봐요. 어제 먹은 음식 이야기도 도움이 되지만, 평소와 얼마나 달라졌는지가 진료에서는 중요할 수 있습니다.","cues":[{"start":8.0,"end":10.7,"text":"체중계는 지방, 수분, 먹은 음식의"},{"start":10.7,"end":13.3,"text":"무게를 합해서 보여줍니다."},{"start":13.3,"end":16.1,"text":"탄수화물을 저장할 때 물도 함께"},{"start":16.1,"end":19.2,"text":"움직이고, 짠 음식 뒤에는 일시적으로"},{"start":19.2,"end":21.8,"text":"수분 변화가 생길 수 있어요."},{"start":21.8,"end":25.0,"text":"그래서 하루 이틀 숫자가 올라왔다고"},{"start":25.0,"end":28.0,"text":"전부 지방으로 해석할 수는 없죠."},{"start":28.0,"end":30.3,"text":"아침에는 괜찮고 저녁마다"},{"start":30.3,"end":32.2,"text":"양쪽 신발이 꽉 끼는지,"},{"start":32.2,"end":34.5,"text":"오늘 처음 한쪽만 껴서 벗기"},{"start":34.5,"end":37.1,"text":"어려웠는지도 다르게 봐요."},{"start":37.1,"end":40.5,"text":"어제 먹은 음식 이야기도 도움이 되지만,"},{"start":40.5,"end":43.0,"text":"평소와 얼마나 달라졌는지가"},{"start":43.0,"end":46.0,"text":"진료에서는 중요할 수 있습니다."}]},{"start":46,"end":52,"text":"여기서 발목이나 종아리가 갑자기 붓는다면 질문이 달라집니다.","cues":[{"start":46.0,"end":49.1,"text":"여기서 발목이나 종아리가 갑자기"},{"start":49.1,"end":52.0,"text":"붓는다면 질문이 달라집니다."}]},{"start":52,"end":75,"text":"양말 자국이 평소보다 깊어졌는지, 한쪽만 붓는지, 숨도 차는지 봐야 해요. 새로 생긴 한쪽 다리 붓기와 통증, 또는 갑작스러운 호흡곤란이 있으면 신속한 의료 평가가 필요합니다. 평소 흐름을 볼 때는 비슷한 조건에서 잰 몸무게와 붓기 시점을 같이 기록하세요.","cues":[{"start":52.0,"end":55.0,"text":"양말 자국이 평소보다 깊어졌는지,"},{"start":55.0,"end":58.6,"text":"한쪽만 붓는지, 숨도 차는지 봐야 해요."},{"start":58.6,"end":61.4,"text":"새로 생긴 한쪽 다리 붓기와 통증,"},{"start":61.4,"end":64.6,"text":"또는 갑작스러운 호흡곤란이 있으면"},{"start":64.6,"end":67.8,"text":"신속한 의료 평가가 필요합니다."},{"start":67.8,"end":70.1,"text":"평소 흐름을 볼 때는 비슷한"},{"start":70.1,"end":72.5,"text":"조건에서 잰 몸무게와 붓기"},{"start":72.5,"end":75.0,"text":"시점을 같이 기록하세요."}]},{"start":75,"end":81,"text":"체중이 올랐다는 줄 옆에, 어디가 언제 부었는지도 적어 두세요.","cues":[{"start":75.0,"end":77.3,"text":"체중이 올랐다는 줄 옆에,"},{"start":77.3,"end":81.0,"text":"어디가 언제 부었는지도 적어 두세요."}]}],"sources":[{"title":"Weight gain — unintentional","url":"https://medlineplus.gov/ency/article/003084.htm"},{"title":"Swelling","url":"https://medlineplus.gov/ency/article/003103.htm"},{"title":"Relationship between muscle water and glycogen recovery after prolonged exercise in the heat in humans","url":"https://pubmed.ncbi.nlm.nih.gov/25911631/"},{"title":"한쪽 팔다리의 붓기와 폐색전증의 신호 · CDC","url":"https://www.cdc.gov/blood-clots/about/"}]},{"id":40,"title":"술을 안 마셔도 간에 흉터가 있는지 보는 이유","category":"체중·대사","original":"술을 안 마시는데 간 수치가 높다. 지방간이 있다면 왜 간 흉터까지 봐야 할까?","length":86,"parts":[{"start":0,"end":2,"text":"술 안 마셔도 간 수치는 올라요.","cues":[{"start":0.0,"end":2.0,"text":"술 안 마셔도 간 수치는 올라요."}]},{"start":2,"end":8,"text":"간 수치가 올라간 이유와 간에 흉터가 쌓였는지는 다른 질문이에요.","cues":[{"start":2.0,"end":4.5,"text":"간 수치가 올라간 이유와 간에"},{"start":4.5,"end":8.0,"text":"흉터가 쌓였는지는 다른 질문이에요."}]},{"start":8,"end":33,"text":"간효소 수치가 높으면 간세포가 자극을 받았는지 살피게 됩니다. 약이나 다른 질환도 원인 후보죠. 술을 안 마셔도 혈당이나 지질 문제와 함께 간에 지방이 쌓일 수 있습니다. 어떤 사람은 염증이 이어지며 흉터 조직이 생기기도 해요. 지방이 있다는 사실만으로 그 정도를 알 순 없습니다.","cues":[{"start":8.0,"end":10.7,"text":"간효소 수치가 높으면 간세포가"},{"start":10.7,"end":13.8,"text":"자극을 받았는지 살피게 됩니다."},{"start":13.8,"end":16.8,"text":"약이나 다른 질환도 원인 후보죠."},{"start":16.8,"end":19.9,"text":"술을 안 마셔도 혈당이나 지질 문제와"},{"start":19.9,"end":23.2,"text":"함께 간에 지방이 쌓일 수 있습니다."},{"start":23.2,"end":25.7,"text":"어떤 사람은 염증이 이어지며"},{"start":25.7,"end":28.3,"text":"흉터 조직이 생기기도 해요."},{"start":28.3,"end":30.6,"text":"지방이 있다는 사실만으로"},{"start":30.6,"end":33.0,"text":"그 정도를 알 순 없습니다."}]},{"start":33,"end":39,"text":"여기서 한 번 정상으로 돌아온 간 수치가 흉터까지 지워주진 않습니다.","cues":[{"start":33.0,"end":35.7,"text":"여기서 한 번 정상으로 돌아온 간"},{"start":35.7,"end":39.0,"text":"수치가 흉터까지 지워주진 않습니다."}]},{"start":39,"end":79,"text":"예를 들어 두 사람의 간효소가 비슷하더라도 그중 한 사람은 당뇨가 오래됐고, 다른 사람은 최근에 약을 바꿨어요. 그 두 검사표에서 확인할 순서가 같을 수는 없죠. 이전 결과가 있으면 같이 보여 주세요. 필요할 때는 나이와 혈액검사를 조합한 점수나 간의 단단함을 보는 검사로 위험을 좁혀요. 누구에게 어떤 검사가 필요한지는 이전 수치와 대사 상태를 함께 보고 판단합니다. 관리 목표에도 수치 변화와 함께 혈당이나 혈압 등 몸 전체의 위험이 들어갑니다.","cues":[{"start":39.0,"end":41.6,"text":"예를 들어 두 사람의 간효소가"},{"start":41.6,"end":44.2,"text":"비슷하더라도 그중 한 사람은"},{"start":44.2,"end":47.4,"text":"당뇨가 오래됐고, 다른 사람은 최근에"},{"start":47.4,"end":50.2,"text":"약을 바꿨어요. 그 두 검사표에서"},{"start":50.2,"end":53.1,"text":"확인할 순서가 같을 수는 없죠."},{"start":53.1,"end":56.6,"text":"이전 결과가 있으면 같이 보여 주세요."},{"start":56.6,"end":59.4,"text":"필요할 때는 나이와 혈액검사를"},{"start":59.4,"end":62.0,"text":"조합한 점수나 간의 단단함을"},{"start":62.0,"end":64.7,"text":"보는 검사로 위험을 좁혀요."},{"start":64.7,"end":67.7,"text":"누구에게 어떤 검사가 필요한지는"},{"start":67.7,"end":70.7,"text":"이전 수치와 대사 상태를 함께 보고"},{"start":70.7,"end":73.5,"text":"판단합니다. 관리 목표에도 수치"},{"start":73.5,"end":76.1,"text":"변화와 함께 혈당이나 혈압 등"},{"start":76.1,"end":79.0,"text":"몸 전체의 위험이 들어갑니다."}]},{"start":79,"end":86,"text":"검사표를 볼 때 두 질문을 챙기세요. ‘왜 올랐지?’ 그리고 ‘흉터 위험은 어떤가?’","cues":[{"start":79.0,"end":82.4,"text":"검사표를 볼 때 두 질문을 챙기세요."},{"start":82.4,"end":86.0,"text":"‘왜 올랐지?’ 그리고 ‘흉터 위험은 어떤가?’"}]}],"sources":[{"title":"Diagnosis of NAFLD & NASH","url":"https://www.niddk.nih.gov/health-information/liver-disease/nafld-nash/diagnosis"},{"title":"EASL–EASD–EASO Clinical Practice Guidelines on the management of metabolic dysfunction-associated steatotic liver disease (MASLD)","url":"https://easlcampus.eu/sites/default/files/2024-08/EASL_CPGs_management_of_MASLD.pdf"},{"title":"Screening and Diagnosing MASLD","url":"https://professional.diabetes.org/sites/dpro/files/2026-03/031926-hcp-screening-and-diagnosing-masld-final-3-23-26.pdf"}]},{"id":41,"title":"점심 허기가 사라졌을 때 확인할 오후의 신호","category":"식사·영양","original":"점심시간인데 배가 안 고프다. 배고파질 때까지 기다려도 될까?","length":84,"parts":[{"start":0,"end":2,"text":"점심인데, 배가 안 고프세요?","cues":[{"start":0.0,"end":2.0,"text":"점심인데, 배가 안 고프세요?"}]},{"start":2,"end":7,"text":"한 끼를 넘길지 고민이라면, 어제 오후까지 이어서 보세요.","cues":[{"start":2.0,"end":4.3,"text":"한 끼를 넘길지 고민이라면,"},{"start":4.3,"end":7.0,"text":"어제 오후까지 이어서 보세요."}]},{"start":7,"end":33,"text":"허기는 위 하나가 보내는 신호가 아니에요. 식사 습관, 약, 긴장, 몸 상태에 따라 달라질 수 있습니다. 예를 들어 일이 몰려 점심 생각이 안 나서 넘겼죠. 그런데 오후에 기운이 빠지고 집에 가는 길에 몸이 몹시 허기질 수도 있어요. 식사를 안 하는 동안에도 간은 혈당을 유지하도록 포도당을 내보냅니다.","cues":[{"start":7.0,"end":9.8,"text":"허기는 위 하나가 보내는 신호가"},{"start":9.8,"end":12.2,"text":"아니에요. 식사 습관, 약, 긴장,"},{"start":12.2,"end":15.5,"text":"몸 상태에 따라 달라질 수 있습니다."},{"start":15.5,"end":18.3,"text":"예를 들어 일이 몰려 점심 생각이"},{"start":18.3,"end":20.9,"text":"안 나서 넘겼죠. 그런데 오후에"},{"start":20.9,"end":23.5,"text":"기운이 빠지고 집에 가는 길에"},{"start":23.5,"end":26.4,"text":"몸이 몹시 허기질 수도 있어요."},{"start":26.4,"end":29.7,"text":"식사를 안 하는 동안에도 간은 혈당을"},{"start":29.7,"end":33.0,"text":"유지하도록 포도당을 내보냅니다."}]},{"start":33,"end":39,"text":"그래서 한낮의 조용한 배만으로 하루를 판단하기는 어려워요.","cues":[{"start":33.0,"end":36.0,"text":"그래서 한낮의 조용한 배만으로"},{"start":36.0,"end":39.0,"text":"하루를 판단하기는 어려워요."}]},{"start":39,"end":78,"text":"예를 들면 어제는 점심 생각이 안 나 그냥 일했고, 오늘은 작은 샌드위치를 먹었다고 해볼게요. 두 날 다 점심엔 배가 고프지 않았는데 오후에 집중이 달라질 수 있죠. 작은 비교가 다음 끼니를 정할 때 도움이 됩니다. 비슷한 날, 먹을 수 있는 작은 식사를 한 뒤 오후의 기운과 저녁 허기가 어떤지 비교해 보세요. 식욕이 계속 떨어지거나 체중이 의도치 않게 줄면, 습관으로만 보지 말고 원인을 확인해야 해요. 복용 중인 약이 있다면 시작 시점도 단서입니다.","cues":[{"start":39.0,"end":41.6,"text":"예를 들면 어제는 점심 생각이"},{"start":41.6,"end":44.1,"text":"안 나 그냥 일했고, 오늘은 작은"},{"start":44.1,"end":47.2,"text":"샌드위치를 먹었다고 해볼게요."},{"start":47.2,"end":50.4,"text":"두 날 다 점심엔 배가 고프지 않았는데"},{"start":50.4,"end":53.2,"text":"오후에 집중이 달라질 수 있죠."},{"start":53.2,"end":55.4,"text":"작은 비교가 다음 끼니를"},{"start":55.4,"end":58.1,"text":"정할 때 도움이 됩니다. 비슷한 날,"},{"start":58.1,"end":60.3,"text":"먹을 수 있는 작은 식사를"},{"start":60.3,"end":62.4,"text":"한 뒤 오후의 기운과 저녁"},{"start":62.4,"end":65.3,"text":"허기가 어떤지 비교해 보세요."},{"start":65.3,"end":68.0,"text":"식욕이 계속 떨어지거나 체중이"},{"start":68.0,"end":70.6,"text":"의도치 않게 줄면, 습관으로만"},{"start":70.6,"end":73.7,"text":"보지 말고 원인을 확인해야 해요."},{"start":73.7,"end":75.6,"text":"복용 중인 약이 있다면"},{"start":75.6,"end":78.0,"text":"시작 시점도 단서입니다."}]},{"start":78,"end":84,"text":"점심에 배가 고팠는지와 오후에 어떤 일이 있었는지를 이어 적어 보세요.","cues":[{"start":78.0,"end":80.6,"text":"점심에 배가 고팠는지와 오후에"},{"start":80.6,"end":84.0,"text":"어떤 일이 있었는지를 이어 적어 보세요."}]}],"sources":[{"title":"Your Digestive System & How it Works","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/digestive-system-how-it-works"},{"title":"Low Blood Glucose (Hypoglycemia)","url":"https://www.niddk.nih.gov/health-information/diabetes/overview/preventing-problems/low-blood-glucose-hypoglycemia"},{"title":"Food first advice for adults with a small appetite","url":"https://cios.icb.nhs.uk/health/nutrition/small-appetite/"},{"title":"About Insulin Resistance and Type 2 Diabetes","url":"https://www.cdc.gov/diabetes/about/insulin-resistance-type-2-diabetes.html"}]},{"id":42,"title":"연속혈당측정기 그래프는 꼭 평평해야 할까?","category":"식사·영양","original":"혈당 그래프를 평평하게 만들면 더 건강해질까?","length":81,"parts":[{"start":0,"end":2,"text":"혈당 곡선, 평평해야 좋을까요?","cues":[{"start":0.0,"end":2.0,"text":"혈당 곡선, 평평해야 좋을까요?"}]},{"start":2,"end":7,"text":"혈당 곡선이 같은 두 끼도, 식판을 보면 전혀 다를 수 있어요.","cues":[{"start":2.0,"end":4.0,"text":"혈당 곡선이 같은 두 끼도,"},{"start":4.0,"end":7.0,"text":"식판을 보면 전혀 다를 수 있어요."}]},{"start":7,"end":28,"text":"먹고 난 뒤 포도당이 들어오고 몸은 그걸 사용하거나 저장합니다. 두 일이 동시에 움직여 식후 수치는 오르내릴 수 있어요. 연속혈당측정기는 피부 아래 조직액의 포도당을 읽어서 혈당이 빠르게 바뀌는 때에는 혈액 검사와 시간차도 생길 수 있죠.","cues":[{"start":7.0,"end":9.5,"text":"먹고 난 뒤 포도당이 들어오고"},{"start":9.5,"end":12.7,"text":"몸은 그걸 사용하거나 저장합니다."},{"start":12.7,"end":15.0,"text":"두 일이 동시에 움직여 식후"},{"start":15.0,"end":17.6,"text":"수치는 오르내릴 수 있어요."},{"start":17.6,"end":20.0,"text":"연속혈당측정기는 피부 아래"},{"start":20.0,"end":22.3,"text":"조직액의 포도당을 읽어서"},{"start":22.3,"end":24.8,"text":"혈당이 빠르게 바뀌는 때에는"},{"start":24.8,"end":28.0,"text":"혈액 검사와 시간차도 생길 수 있죠."}]},{"start":28,"end":32,"text":"이제 같은 봉우리 옆에 실제 식판을 놓아 보세요.","cues":[{"start":28.0,"end":29.8,"text":"이제 같은 봉우리 옆에"},{"start":29.8,"end":32.0,"text":"실제 식판을 놓아 보세요."}]},{"start":32,"end":75,"text":"예를 들어 장을 본 뒤 걷고 나서 잰 점과, 같은 메뉴를 먹고 앉아 일하던 날의 점은 다를 수 있어요. 그 차이로 음식 하나가 늘 나쁘다고 결론 내리기 전에, 식사와 몸이 움직인 조건을 같이 보세요. 섬유질이나 단백질을 얼마나 먹었는지, 배가 충분히 찼는지, 이 식사를 계속 할 수 있는지는 곡선에 바로 찍히지 않습니다. 당뇨를 진단할 때는 정해진 검사를 쓰고, 이미 치료 중이라면 센서 해석과 목표도 개인마다 달라져요. 건강한 사람 모두에게 평평한 곡선이 건강 개선으로 이어진다는 근거도 제한적입니다.","cues":[{"start":32.0,"end":34.5,"text":"예를 들어 장을 본 뒤 걷고 나서"},{"start":34.5,"end":37.1,"text":"잰 점과, 같은 메뉴를 먹고 앉아"},{"start":37.1,"end":40.2,"text":"일하던 날의 점은 다를 수 있어요."},{"start":40.2,"end":43.1,"text":"그 차이로 음식 하나가 늘 나쁘다고"},{"start":43.1,"end":45.7,"text":"결론 내리기 전에, 식사와 몸이"},{"start":45.7,"end":48.3,"text":"움직인 조건을 같이 보세요."},{"start":48.3,"end":50.8,"text":"섬유질이나 단백질을 얼마나"},{"start":50.8,"end":53.4,"text":"먹었는지, 배가 충분히 찼는지,"},{"start":53.4,"end":55.9,"text":"이 식사를 계속 할 수 있는지는"},{"start":55.9,"end":58.8,"text":"곡선에 바로 찍히지 않습니다."},{"start":58.8,"end":61.1,"text":"당뇨를 진단할 때는 정해진"},{"start":61.1,"end":63.9,"text":"검사를 쓰고, 이미 치료 중이라면"},{"start":63.9,"end":66.4,"text":"센서 해석과 목표도 개인마다"},{"start":66.4,"end":69.2,"text":"달라져요. 건강한 사람 모두에게"},{"start":69.2,"end":71.7,"text":"평평한 곡선이 건강 개선으로"},{"start":71.7,"end":75.0,"text":"이어진다는 근거도 제한적입니다."}]},{"start":75,"end":81,"text":"그래프에서 점 하나를 봤다면, 식판에서는 하루 전체를 보세요.","cues":[{"start":75.0,"end":77.7,"text":"그래프에서 점 하나를 봤다면,"},{"start":77.7,"end":81.0,"text":"식판에서는 하루 전체를 보세요."}]}],"sources":[{"title":"FDA Clears First Over-the-Counter Continuous Glucose Monitor","url":"https://www.fda.gov/news-events/press-announcements/fda-clears-first-over-counter-continuous-glucose-monitor"},{"title":"Continuous Glucose Monitoring Profiles in Healthy Nondiabetic Participants: A Multicenter Prospective Study","url":"https://pubmed.ncbi.nlm.nih.gov/31127824/"},{"title":"How Do Glucose Monitors Measure Sugar Levels in the Blood?","url":"https://www.nist.gov/how-do-you-measure-it/how-do-glucose-monitors-measure-sugar-levels-blood"},{"title":"Diabetes & Prediabetes Tests","url":"https://www.niddk.nih.gov/health-information/professionals/clinical-tools-patient-management/diabetes/diabetes-prediabetes"},{"title":"About Insulin Resistance and Type 2 Diabetes","url":"https://www.cdc.gov/diabetes/about/insulin-resistance-type-2-diabetes.html"}]},{"id":43,"title":"밥 먹고 손이 떨리면 정말 저혈당일까?","category":"식사·영양","original":"식후 손떨림, 먹고 좋아지면 저혈당일까?","length":80,"parts":[{"start":0,"end":2,"text":"손 떨려서 먹었더니 나았나요?","cues":[{"start":0.0,"end":2.0,"text":"손 떨려서 먹었더니 나았나요?"}]},{"start":2,"end":8,"text":"그 한 장면에서 저혈당을 판단하려면 정보가 하나 더 필요합니다.","cues":[{"start":2.0,"end":5.3,"text":"그 한 장면에서 저혈당을 판단하려면"},{"start":5.3,"end":8.0,"text":"정보가 하나 더 필요합니다."}]},{"start":8,"end":47,"text":"식사 뒤 손이 떨리고 식은땀이 납니다. 달달한 걸 먹고 나니 잦아들었죠. 이런 변화는 저혈당에서 올 수 있지만, 떨림과 좋아졌다는 느낌만으론 그때 수치를 알지 못해요. 평가에서는 증상이 있는 순간 낮은 혈당이 확인됐는지, 혈당이 회복되며 증상도 풀렸는지를 연결합니다. 가령 증상이 올 때의 측정값은 없고 먹고 난 뒤 정상값만 남았어요. 그 값은 먹기 전 수치를 보여주지 못하죠. 시간을 같이 적으면 어느 순간의 자료인지 구분할 수 있어요.","cues":[{"start":8.0,"end":11.5,"text":"식사 뒤 손이 떨리고 식은땀이 납니다."},{"start":11.5,"end":14.5,"text":"달달한 걸 먹고 나니 잦아들었죠."},{"start":14.5,"end":17.7,"text":"이런 변화는 저혈당에서 올 수 있지만,"},{"start":17.7,"end":20.5,"text":"떨림과 좋아졌다는 느낌만으론"},{"start":20.5,"end":22.9,"text":"그때 수치를 알지 못해요."},{"start":22.9,"end":25.0,"text":"평가에서는 증상이 있는"},{"start":25.0,"end":27.6,"text":"순간 낮은 혈당이 확인됐는지,"},{"start":27.6,"end":29.7,"text":"혈당이 회복되며 증상도"},{"start":29.7,"end":32.1,"text":"풀렸는지를 연결합니다."},{"start":32.1,"end":35.1,"text":"가령 증상이 올 때의 측정값은 없고"},{"start":35.1,"end":37.9,"text":"먹고 난 뒤 정상값만 남았어요."},{"start":37.9,"end":41.6,"text":"그 값은 먹기 전 수치를 보여주지 못하죠."},{"start":41.6,"end":44.4,"text":"시간을 같이 적으면 어느 순간의"},{"start":44.4,"end":47.0,"text":"자료인지 구분할 수 있어요."}]},{"start":47,"end":54,"text":"그런데 인슐린처럼 저혈당을 일으킬 수 있는 약을 쓰고 있다면 순서가 달라요.","cues":[{"start":47.0,"end":49.6,"text":"그런데 인슐린처럼 저혈당을"},{"start":49.6,"end":51.8,"text":"일으킬 수 있는 약을 쓰고"},{"start":51.8,"end":54.0,"text":"있다면 순서가 달라요."}]},{"start":54,"end":74,"text":"약을 쓰는 사람은 증상이 올 때 의료진과 정한 대응을 우선하세요. 매우 혼란스럽거나 의식을 잃는 상황은 응급입니다. 반복되는 식후 증상을 상담할 때는 식사 시점, 떨림이 시작된 때, 확보한 혈당 값과 약 이름을 같이 알려 주세요.","cues":[{"start":54.0,"end":56.6,"text":"약을 쓰는 사람은 증상이 올 때"},{"start":56.6,"end":59.9,"text":"의료진과 정한 대응을 우선하세요."},{"start":59.9,"end":62.7,"text":"매우 혼란스럽거나 의식을 잃는"},{"start":62.7,"end":65.3,"text":"상황은 응급입니다. 반복되는"},{"start":65.3,"end":68.3,"text":"식후 증상을 상담할 때는 식사 시점,"},{"start":68.3,"end":70.9,"text":"떨림이 시작된 때, 확보한 혈당"},{"start":70.9,"end":74.0,"text":"값과 약 이름을 같이 알려 주세요."}]},{"start":74,"end":80,"text":"기록은 세 장면입니다. 떨린 순간, 그때의 혈당, 가라앉은 때.","cues":[{"start":74.0,"end":77.2,"text":"기록은 세 장면입니다. 떨린 순간,"},{"start":77.2,"end":80.0,"text":"그때의 혈당, 가라앉은 때."}]}],"sources":[{"title":"Hypoglycemia","url":"https://www.endocrine.org/patient-engagement/endocrine-library/hypoglycemia"},{"title":"Low Blood Glucose (Hypoglycemia)","url":"https://www.niddk.nih.gov/health-information/diabetes/overview/preventing-problems/low-blood-glucose-hypoglycemia"},{"title":"Evaluation and Management of Adult Hypoglycemic Disorders: An Endocrine Society Clinical Practice Guideline","url":"https://academic.oup.com/jcem/article/94/3/709/2596247"},{"title":"Low blood sugar (hypoglycaemia)","url":"https://www.nhs.uk/conditions/low-blood-sugar-hypoglycaemia/"}]},{"id":44,"title":"단백질을 채웠는데 근육이 그대로인 이유","category":"식사·영양","original":"단백질을 챙겨 먹는데 근육이 안 늘면 운동에서 뭘 봐야 할까?","length":82,"parts":[{"start":0,"end":2,"text":"단백질은 늘고, 근육은 그대로?","cues":[{"start":0.0,"end":2.0,"text":"단백질은 늘고, 근육은 그대로?"}]},{"start":2,"end":7,"text":"셰이크 옆에 이번 주 운동 기록도 같이 놓아 보세요.","cues":[{"start":2.0,"end":4.3,"text":"셰이크 옆에 이번 주 운동"},{"start":4.3,"end":7.0,"text":"기록도 같이 놓아 보세요."}]},{"start":7,"end":30,"text":"근육은 몸 안에서 계속 분해되고 다시 만들어집니다. 단백질은 만드는 데 쓰는 재료예요. 몸이 그 구조를 더 필요로 한다는 신호는 저항운동처럼 실제로 힘을 쓰는 과정에서 들어옵니다. 재료를 충분히 먹어도 어떤 동작을 어느 정도 해 왔는지에 따라 변화는 달라져요.","cues":[{"start":7.0,"end":8.9,"text":"근육은 몸 안에서 계속"},{"start":8.9,"end":11.7,"text":"분해되고 다시 만들어집니다."},{"start":11.7,"end":14.9,"text":"단백질은 만드는 데 쓰는 재료예요."},{"start":14.9,"end":17.6,"text":"몸이 그 구조를 더 필요로 한다는"},{"start":17.6,"end":20.1,"text":"신호는 저항운동처럼 실제로"},{"start":20.1,"end":23.1,"text":"힘을 쓰는 과정에서 들어옵니다."},{"start":23.1,"end":24.9,"text":"재료를 충분히 먹어도"},{"start":24.9,"end":27.0,"text":"어떤 동작을 어느 정도 해"},{"start":27.0,"end":30.0,"text":"왔는지에 따라 변화는 달라져요."}]},{"start":30,"end":35,"text":"운동하고 힘이 늘었다고 전부 근육이 커진 건 아니에요.","cues":[{"start":30.0,"end":32.1,"text":"운동하고 힘이 늘었다고"},{"start":32.1,"end":35.0,"text":"전부 근육이 커진 건 아니에요."}]},{"start":35,"end":74,"text":"가령 지난달과 무게가 같아도 더 안정적으로 움직였다면 기록할 변화가 있어요. 반대로 운동을 계속 빠뜨렸다면, 단백질을 추가한 것만으론 훈련 내용이 달라지지 않았죠. 어떤 자극을 실제로 받았나부터 보세요. 처음에는 동작이 익숙해지면서 힘을 더 잘 쓸 수도 있습니다. 체성분 숫자만 보지 말고 같은 동작이 얼마나 수월해졌는지 꾸준히 비교해 보세요. 운동 부담에 비해 먹는 양이 너무 적거나 회복이 부족하면 그것도 판단에 들어갑니다.","cues":[{"start":35.0,"end":37.6,"text":"가령 지난달과 무게가 같아도"},{"start":37.6,"end":39.9,"text":"더 안정적으로 움직였다면"},{"start":39.9,"end":42.1,"text":"기록할 변화가 있어요."},{"start":42.1,"end":44.9,"text":"반대로 운동을 계속 빠뜨렸다면,"},{"start":44.9,"end":47.2,"text":"단백질을 추가한 것만으론"},{"start":47.2,"end":50.1,"text":"훈련 내용이 달라지지 않았죠."},{"start":50.1,"end":53.8,"text":"어떤 자극을 실제로 받았나부터 보세요."},{"start":53.8,"end":56.5,"text":"처음에는 동작이 익숙해지면서"},{"start":56.5,"end":59.2,"text":"힘을 더 잘 쓸 수도 있습니다."},{"start":59.2,"end":61.3,"text":"체성분 숫자만 보지 말고"},{"start":61.3,"end":64.3,"text":"같은 동작이 얼마나 수월해졌는지"},{"start":64.3,"end":66.5,"text":"꾸준히 비교해 보세요."},{"start":66.5,"end":68.8,"text":"운동 부담에 비해 먹는 양이"},{"start":68.8,"end":71.4,"text":"너무 적거나 회복이 부족하면"},{"start":71.4,"end":74.0,"text":"그것도 판단에 들어갑니다."}]},{"start":74,"end":82,"text":"단백질을 이미 충분히 먹고 있다면, 다음으로 확인할 건 셰이크 한 잔이 아니라 운동 자극이에요.","cues":[{"start":74.0,"end":76.8,"text":"단백질을 이미 충분히 먹고 있다면,"},{"start":76.8,"end":79.3,"text":"다음으로 확인할 건 셰이크 한"},{"start":79.3,"end":82.0,"text":"잔이 아니라 운동 자극이에요."}]}],"sources":[{"title":"Dietary Supplements for Exercise and Athletic Performance: Health Professional Fact Sheet","url":"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"},{"title":"Resistance Training Prescription for Muscle Function, Hypertrophy, and Physical Performance in Healthy Adults","url":"https://doi.org/10.1249/MSS.0000000000003897"},{"title":"Protein supplementation during resistance-type exercise training in the elderly","url":"https://pubmed.ncbi.nlm.nih.gov/22968306/"}]},{"id":45,"title":"채식 뒤 피로, 뺀 음식보다 그 자리에 들어온 것","category":"식사·영양","original":"채식한 뒤 피곤할 때 철분과 비타민 B12는 어떻게 확인할까?","length":84,"parts":[{"start":0,"end":2,"text":"채식 뒤 피곤해졌나요?","cues":[{"start":0.0,"end":2.0,"text":"채식 뒤 피곤해졌나요?"}]},{"start":2,"end":8,"text":"고기를 뺐다는 말 다음에, 그 자리를 뭘로 채웠는지가 중요해요.","cues":[{"start":2.0,"end":4.3,"text":"고기를 뺐다는 말 다음에,"},{"start":4.3,"end":8.0,"text":"그 자리를 뭘로 채웠는지가 중요해요."}]},{"start":8,"end":33,"text":"이전보다 음식 종류와 양이 함께 줄었다면 원인은 하나로 정하기 어렵습니다. 철은 몸이 산소를 운반하는 데 쓰이고, 비타민 비십이는 피를 만드는 일과 신경 기능을 돕죠. 비십이는 동물성 식품을 완전히 빼는 경우 강화 식품이나 보충제를 통해 충분히 들어오는지 확인할 필요가 있어요.","cues":[{"start":8.0,"end":10.4,"text":"이전보다 음식 종류와 양이"},{"start":10.4,"end":13.0,"text":"함께 줄었다면 원인은 하나로"},{"start":13.0,"end":15.6,"text":"정하기 어렵습니다. 철은 몸이"},{"start":15.6,"end":18.1,"text":"산소를 운반하는 데 쓰이고,"},{"start":18.1,"end":21.1,"text":"비타민 비십이는 피를 만드는 일과"},{"start":21.1,"end":24.2,"text":"신경 기능을 돕죠. 비십이는 동물성"},{"start":24.2,"end":26.8,"text":"식품을 완전히 빼는 경우 강화"},{"start":26.8,"end":29.6,"text":"식품이나 보충제를 통해 충분히"},{"start":29.6,"end":33.0,"text":"들어오는지 확인할 필요가 있어요."}]},{"start":33,"end":38,"text":"그리고 먹었다는 양과 실제로 흡수된 양은 다를 수 있습니다.","cues":[{"start":33.0,"end":35.4,"text":"그리고 먹었다는 양과 실제로"},{"start":35.4,"end":38.0,"text":"흡수된 양은 다를 수 있습니다."}]},{"start":38,"end":79,"text":"예를 들어 단백질 식품이나 강화 식품도 찾지 않은 채 샐러드만 남은 식단과, 여러 식품을 챙기는 채식은 같은 조건이 아니에요. 장보기 목록과 실제로 먹은 끼니를 함께 보면 어떤 질문을 해야 할지 좁힐 수 있습니다. 철이 부족하다면 월경이나 다른 혈액 손실도 함께 살펴요. 피로에 손발 저림이나 감각 변화가 더해지면 진료에서 그 증상도 알려 주세요. 영양소 하나를 추측해 계속 보충하기보다 무엇을 먹는지, 언제부터 달라졌는지, 필요한 검사가 있는지를 같이 확인하면 됩니다.","cues":[{"start":38.0,"end":40.7,"text":"예를 들어 단백질 식품이나 강화"},{"start":40.7,"end":43.2,"text":"식품도 찾지 않은 채 샐러드만"},{"start":43.2,"end":45.9,"text":"남은 식단과, 여러 식품을 챙기는"},{"start":45.9,"end":48.8,"text":"채식은 같은 조건이 아니에요."},{"start":48.8,"end":51.1,"text":"장보기 목록과 실제로 먹은"},{"start":51.1,"end":53.6,"text":"끼니를 함께 보면 어떤 질문을"},{"start":53.6,"end":56.2,"text":"해야 할지 좁힐 수 있습니다."},{"start":56.2,"end":58.5,"text":"철이 부족하다면 월경이나"},{"start":58.5,"end":61.3,"text":"다른 혈액 손실도 함께 살펴요."},{"start":61.3,"end":63.6,"text":"피로에 손발 저림이나 감각"},{"start":63.6,"end":65.9,"text":"변화가 더해지면 진료에서"},{"start":65.9,"end":68.0,"text":"그 증상도 알려 주세요."},{"start":68.0,"end":70.3,"text":"영양소 하나를 추측해 계속"},{"start":70.3,"end":72.9,"text":"보충하기보다 무엇을 먹는지,"},{"start":72.9,"end":76.0,"text":"언제부터 달라졌는지, 필요한 검사가"},{"start":76.0,"end":79.0,"text":"있는지를 같이 확인하면 됩니다."}]},{"start":79,"end":84,"text":"식사 기록엔 뺀 음식과 들어온 음식, 두 칸이 필요합니다.","cues":[{"start":79.0,"end":81.6,"text":"식사 기록엔 뺀 음식과 들어온"},{"start":81.6,"end":84.0,"text":"음식, 두 칸이 필요합니다."}]}],"sources":[{"title":"Vitamin B12: Health Professional Fact Sheet","url":"https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/"},{"title":"Iron: Health Professional Fact Sheet","url":"https://ods.od.nih.gov/factsheets/Iron-HealthProfessional/"},{"title":"The vegan diet","url":"https://www.nhs.uk/live-well/eat-well/how-to-eat-a-balanced-diet/the-vegan-diet/"}]},{"id":46,"title":"건강식인데 외식이 무서워졌다면","category":"식사·영양","original":"건강하게 먹으려다 외식이 무서워졌다면, 어떤 점이 걱정되는 걸까?","length":83,"parts":[{"start":0,"end":2,"text":"건강식 하는데 외식은 겁나요?","cues":[{"start":0.0,"end":2.0,"text":"건강식 하는데 외식은 겁나요?"}]},{"start":2,"end":8,"text":"식단을 지켰는지뿐 아니라 그 규칙 때문에 포기한 식사도 보세요.","cues":[{"start":2.0,"end":4.6,"text":"식단을 지켰는지뿐 아니라 그"},{"start":4.6,"end":8.0,"text":"규칙 때문에 포기한 식사도 보세요."}]},{"start":8,"end":31,"text":"확인된 음식 알레르기 때문에 특정 재료를 피하는 경우엔 위험을 줄이는 목적이 있습니다. 그런데 ‘몸에 안 좋을 것 같다’는 걱정으로 음식이 하나씩 빠지다, 외식 메뉴에 안전하다고 느끼는 것이 거의 남지 않을 수 있어요. 약속을 취소하면 지금 마음은 편해집니다.","cues":[{"start":8.0,"end":10.6,"text":"확인된 음식 알레르기 때문에"},{"start":10.6,"end":13.0,"text":"특정 재료를 피하는 경우엔"},{"start":13.0,"end":16.1,"text":"위험을 줄이는 목적이 있습니다."},{"start":16.1,"end":18.7,"text":"그런데 ‘몸에 안 좋을 것 같다’는"},{"start":18.7,"end":21.6,"text":"걱정으로 음식이 하나씩 빠지다,"},{"start":21.6,"end":23.7,"text":"외식 메뉴에 안전하다고"},{"start":23.7,"end":26.3,"text":"느끼는 것이 거의 남지 않을 수"},{"start":26.3,"end":28.5,"text":"있어요. 약속을 취소하면"},{"start":28.5,"end":31.0,"text":"지금 마음은 편해집니다."}]},{"start":31,"end":36,"text":"그 안도감 때문에 다음 약속도 피하고 싶어질 수 있죠.","cues":[{"start":31.0,"end":33.0,"text":"그 안도감 때문에 다음"},{"start":33.0,"end":36.0,"text":"약속도 피하고 싶어질 수 있죠."}]},{"start":36,"end":76,"text":"가령 약속을 잡고 나서 각각의 재료를 몇 시간씩 검색하다 결국 취소했다고 해볼게요. 이때 매번 검사 결과나 몸무게만 확인하면, 그 규칙을 지키느라 얼마만큼의 일상을 내줬는지 빠지게 됩니다. 몸무게가 일반적인 범위여도 음식 종류가 크게 줄고, 식사 계획에 하루가 묶이면 도움이 필요할 수 있어요. 실제로 피해야 할 재료가 있는지 의료적으로 살피면서, 불안과 영양, 가족이나 친구와 먹는 일도 함께 봅니다. 먹을 수 있는 상황을 되찾는 게 목표에 들어갈 수 있어요.","cues":[{"start":36.0,"end":38.5,"text":"가령 약속을 잡고 나서 각각의"},{"start":38.5,"end":41.3,"text":"재료를 몇 시간씩 검색하다 결국"},{"start":41.3,"end":44.0,"text":"취소했다고 해볼게요. 이때 매번"},{"start":44.0,"end":46.8,"text":"검사 결과나 몸무게만 확인하면,"},{"start":46.8,"end":49.5,"text":"그 규칙을 지키느라 얼마만큼의"},{"start":49.5,"end":52.5,"text":"일상을 내줬는지 빠지게 됩니다."}, s/overview/preventing-problems/low-blood-glucose-hypoglycemia"},{"title":"Reminder: risk factors for ketoacidosis with SGLT-2 inhibitors","url":"https://www.medsafe.govt.nz/profs/PUArticles/December2024/Reminder-risk-factors-for-ketoacidosis-with-SGLT-2-inhibitors.html"}]},{"id":48,"title":"탄수화물을 줄인 뒤 변비가 생긴 이유","category":"식사·영양","original":"탄수화물을 줄인 뒤 피곤하고 변비가 생겼다면 식단에서 뭘 살펴볼까?","length":80,"parts":[{"start":0,"end":2,"text":"탄수화물 줄이고 변비가 왔나요?","cues":[{"start":0.0,"end":2.0,"text":"탄수화물 줄이고 변비가 왔나요?"}]},{"start":2,"end":8,"text":"탄수화물을 줄였다는 말 말고, 그날부터 사라진 음식을 찾아보세요.","cues":[{"start":2.0,"end":4.5,"text":"탄수화물을 줄였다는 말 말고,"},{"start":4.5,"end":8.0,"text":"그날부터 사라진 음식을 찾아보세요."}]},{"start":8,"end":30,"text":"예전엔 아침에 귀리를 먹고, 점심엔 콩과 채소를 먹었습니다. 식단을 바꾸며 이걸 다 빼고 고기와 치즈가 주로 남았다고 해볼게요. 그러면 탄수화물과 함께 대변의 상태에 영향을 주는 섬유 섭취도 줄 수 있죠. 먹는 양과 물의 양도 달라졌을 수 있습니다.","cues":[{"start":8.0,"end":10.4,"text":"예전엔 아침에 귀리를 먹고,"},{"start":10.4,"end":13.5,"text":"점심엔 콩과 채소를 먹었습니다."},{"start":13.5,"end":15.9,"text":"식단을 바꾸며 이걸 다 빼고"},{"start":15.9,"end":18.6,"text":"고기와 치즈가 주로 남았다고"},{"start":18.6,"end":21.2,"text":"해볼게요. 그러면 탄수화물과"},{"start":21.2,"end":24.0,"text":"함께 대변의 상태에 영향을 주는"},{"start":24.0,"end":26.9,"text":"섬유 섭취도 줄 수 있죠. 먹는 양과"},{"start":26.9,"end":30.0,"text":"물의 양도 달라졌을 수 있습니다."}]},{"start":30,"end":35,"text":"그런데 ‘적응 중’이라고 부르면 이 변화들이 다 묻힐 수 있어요.","cues":[{"start":30.0,"end":32.4,"text":"그런데 ‘적응 중’이라고 부르면"},{"start":32.4,"end":35.0,"text":"이 변화들이 다 묻힐 수 있어요."}]},{"start":35,"end":74,"text":"가령 접시에서 밥만 덜어낸 경우와, 콩이나 채소까지 같이 사라진 경우 모두 탄수화물을 줄인 거죠. 장이 받는 음식의 양과 종류는 전혀 다를 수 있습니다. 내 식단에서 생긴 변화를 바로 그 차이로 보세요. 먼저 바꾸기 전후 식사에서 식이섬유가 든 음식, 마시는 물, 전체 양을 비교해 보세요. 감량 초기에 수분도 움직일 수 있어서 체중 변화만 보고 잘 맞는 식단이라 판단하기 어렵습니다. 약을 쓰거나 불편이 계속된다면 식사 내용과 증상을 함께 확인하세요.","cues":[{"start":35.0,"end":38.0,"text":"가령 접시에서 밥만 덜어낸 경우와,"},{"start":38.0,"end":40.5,"text":"콩이나 채소까지 같이 사라진"},{"start":40.5,"end":43.6,"text":"경우 모두 탄수화물을 줄인 거죠."},{"start":43.6,"end":46.1,"text":"장이 받는 음식의 양과 종류는"},{"start":46.1,"end":49.1,"text":"전혀 다를 수 있습니다. 내 식단에서"},{"start":49.1,"end":52.3,"text":"생긴 변화를 바로 그 차이로 보세요."},{"start":52.3,"end":54.7,"text":"먼저 바꾸기 전후 식사에서"},{"start":54.7,"end":57.0,"text":"식이섬유가 든 음식, 마시는 물,"},{"start":57.0,"end":59.4,"text":"전체 양을 비교해 보세요."},{"start":59.4,"end":62.0,"text":"감량 초기에 수분도 움직일 수"},{"start":62.0,"end":64.7,"text":"있어서 체중 변화만 보고 잘 맞는"},{"start":64.7,"end":67.8,"text":"식단이라 판단하기 어렵습니다."},{"start":67.8,"end":70.5,"text":"약을 쓰거나 불편이 계속된다면"},{"start":70.5,"end":74.0,"text":"식사 내용과 증상을 함께 확인하세요."}]},{"start":74,"end":80,"text":"탄수화물 숫자를 세기 전에, 장이 받던 재료 중 뭐가 빠졌는지 보세요.","cues":[{"start":74.0,"end":76.3,"text":"탄수화물 숫자를 세기 전에,"},{"start":76.3,"end":80.0,"text":"장이 받던 재료 중 뭐가 빠졌는지 보세요."}]}],"sources":[{"title":"Effect of carbohydrate-restricted diets and intermittent fasting on obesity, type 2 diabetes mellitus, and hypertension management: consensus statement","url":"https://link.springer.com/article/10.1186/s40885-022-00207-4"},{"title":"Symptoms & Causes of Constipation","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/symptoms-causes"},{"title":"Reminder: risk factors for ketoacidosis with SGLT-2 inhibitors","url":"https://www.medsafe.govt.nz/profs/PUArticles/December2024/Reminder-risk-factors-for-ketoacidosis-with-SGLT-2-inhibitors.html"},{"title":"Relationship between muscle water and glycogen recovery after prolonged exercise in the heat in humans","url":"https://pubmed.ncbi.nlm.nih.gov/25911631/"}]},{"id":49,"title":"일어설 때 어지럽다고 소금부터 늘리기 어려운 이유","category":"식사·영양","original":"어지러울 때 소금을 늘리라는데 혈압이 높으면 어떡할까?","length":83,"parts":[{"start":0,"end":2,"text":"일어서면 어질, 소금 먹을까요?","cues":[{"start":0.0,"end":2.0,"text":"일어서면 어질, 소금 먹을까요?"}]},{"start":2,"end":8,"text":"소금 이야기를 하기 전에 혈압을 잰 자세와 복용약부터 보세요.","cues":[{"start":2.0,"end":5.0,"text":"소금 이야기를 하기 전에 혈압을"},{"start":5.0,"end":8.0,"text":"잰 자세와 복용약부터 보세요."}]},{"start":8,"end":31,"text":"일어서면 몸 아래쪽으로 혈액이 더 모일 수 있어요. 몸은 맥박과 혈관을 조절해 대응합니다. 그런데 앉아서 잰 혈압만으로 일어난 뒤의 변화를 알기 어렵죠. 어떤 경우엔 },{"start":38.6,"end":40.9,"text":"하나는 한 번에 한 알을 먹고,"},{"start":40.9,"end":43.2,"text":"다른 건 하루 두 번 먹는다면"},{"start":43.2,"end":45.6,"text":"알 수부터 맞춰야 합니다."},{"start":45.6,"end":48.1,"text":"포장 색이 달라도 같은 줄에서"},{"start":48.1,"end":50.6,"text":"합쳐서 읽으세요. 상한은 많이"},{"start":50.6,"end":53.3,"text":"먹어도 좋다는 목표치가 아니고,"},{"start":53.3,"end":55.8,"text":"일부 성분은 특정 약의 흡수나"},{"start":55.8,"end":58.6,"text":"작용에 영향을 줄 수도 있어요."},{"start":58.6,"end":61.6,"text":"상담할 때는 제품 이름만 적기보다"},{"start":61.6,"end":63.9,"text":"성분표 사진과 실제 하루에"},{"start":63.9,"end":66.7,"text":"먹는 알 수를 같이 보여 주세요."},{"start":66.7,"end":69.4,"text":"음식과 다른 제품에서 들어오는"},{"start":69.4,"end":72.0,"text":"양까지 살펴야 할 때도 있죠."}]},{"start":72,"end":78,"text":"세 통을 펴 놓고 같은 성분에 같은 색을 긋는 것부터 시작하세요.","cues":[{"start":72.0,"end":74.5,"text":"세 통을 펴 놓고 같은 성분에"},{"start":74.5,"end":78.0,"text":"같은 색을 긋는 것부터 시작하세요."}]}],"sources":[{"title":"Multivitamin/mineral Supplements: Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/MVMS-Consumer/"},{"title":"FDA 101: Dietary Supplements","url":"https://www.fda.gov/consumers/consumer-updates/fda-101-dietary-supplements"},{"title":"Vitamin B6: Health Professional Fact Sheet","url":"https://ods.od.nih.gov/factsheets/VitaminB6-HealthProfessional/"},{"title":"Biotin Interference with Troponin Lab Tests — Assays Subject to Biotin Interference","url":"https://www.fda.gov/medical-devices/in-vitro-diagnostics/biotin-interference-troponin-lab-tests-assays-subject-biotin-interference"}]},{"id":51,"title":"소장 세균 과증식(SIBO) 치료 뒤 먹을 음식이 더 줄었다면","category":"소화·장","original":"소장 세균 과증식(SIBO) 치료가 끝났는데 먹을 음식이 더 줄었다면","length":90,"parts":[{"start":0,"end":2,"text":"장 치료 뒤, 메뉴가 더 줄었어요?","cues":[{"start":0.0,"end":2.0,"text":"장 치료 뒤, 메뉴가 더 줄었어요?"}]},{"start":2,"end":7,"text":"치료 결과를 보려면 불편과 식탁의 크기를 함께 봐야 해요.","cues":[{"start":2.0,"end":4.3,"text":"치료 결과를 보려면 불편과"},{"start":4.3,"end":7.0,"text":"식탁의 크기를 함께 봐야 해요."}]},{"start":7,"end":33,"text":"소장에 미생물이 지나치게 늘었는지를 살필 때, 흔히 숨으로 나오는 가스를 봅니다. 세균을 직접 세는 검사는 아니죠. 치료 뒤에도 더부룩함이 남으면 검사를 언제 했는지, 증상이 어떤 상황에 생기는지 다시 볼 수 있어요. 그사이 먹는 메뉴를 계속 줄였다면, 어디까지 제한했는지도 중요합니다.","cues":[{"start":7.0,"end":9.4,"text":"소장에 미생물이 지나치게"},{"start":9.4,"end":11.5,"text":"늘었는지를 살필 때, 흔히"},{"start":11.5,"end":14.4,"text":"숨으로 나오는 가스를 봅니다."},{"start":14.4,"end":17.5,"text":"세균을 직접 세는 검사는 아니죠."},{"start":17.5,"end":20.3,"text":"치료 뒤에도 더부룩함이 남으면"},{"start":20.3,"end":22.7,"text":"검사를 언제 했는지, 증상이"},{"start":22.7,"end":26.4,"text":"어떤 상황에 생기는지 다시 볼 수 있어요."},{"start":26.4,"end":29.5,"text":"그사이 먹는 메뉴를 계속 줄였다면,"},{"start":29.5,"end":33.0,"text":"어디까지 제한했는지도 중요합니다."}]},{"start":33,"end":39,"text":"저포드맵 식단을 한다고 소장에서 세균을 없앴다고 볼 수는 없어요.","cues":[{"start":33.0,"end":36.0,"text":"저포드맵 식단을 한다고 소장에서"},{"start":36.0,"end":39.0,"text":"세균을 없앴다고 볼 수는 없어요."}]},{"start":39,"end":82,"text":"가령 처음엔 양파를 먹으면 불편한 것 같았는데, 시간이 지나 과일과 콩, 여러 채소도 같이 뺐다고 해볼게요. 지금 식사만 보면 어느 제한이 실제로 도움이 됐는지 알기 어려워요. 뺀 순서까지 살펴보는 이유입니다. 이 식단은 일부 탄수화물을 잠시 줄여 증상 변화를 살피는 데 쓰입니다. 필요하면 영양 전문가와 조건을 정해 식품을 다시 넣어 보면서, 양과 종류에 따라 견딜 범위를 찾을 수 있어요. 증상이 남는다는 이유로 같은 치료를 반복하거나 계속 빼기 전, 어떤 불편이 남았는지 진료에서 확인하세요.","cues":[{"start":39.0,"end":42.2,"text":"가령 처음엔 양파를 먹으면 불편한 것"},{"start":42.2,"end":44.9,"text":"같았는데, 시간이 지나 과일과 콩,"},{"start":44.9,"end":48.1,"text":"여러 채소도 같이 뺐다고 해볼게요."},{"start":48.1,"end":50.7,"text":"지금 식사만 보면 어느 제한이"},{"start":50.7,"end":54.1,"text":"실제로 도움이 됐는지 알기 어려워요."},{"start":54.1,"end":57.4,"text":"뺀 순서까지 살펴보는 이유입니다."},{"start":57.4,"end":60.1,"text":"이 식단은 일부 탄수화물을 잠시"},{"start":60.1,"end":63.6,"text":"줄여 증상 변화를 살피는 데 쓰입니다."},{"start":63.6,"end":66.3,"text":"필요하면 영양 전문가와 조건을"},{"start":66.3,"end":68.8,"text":"정해 식품을 다시 넣어 보면서,"},{"start":68.8,"end":71.4,"text":"양과 종류에 따라 견딜 범위를"},{"start":71.4,"end":74.1,"text":"찾을 수 있어요. 증상이 남는다는"},{"start":74.1,"end":76.9,"text":"이유로 같은 치료를 반복하거나"},{"start":76.9,"end":79.0,"text":"계속 빼기 전, 어떤 불편이"},{"start":79.0,"end":82.0,"text":"남았는지 진료에서 확인하세요."}]},{"start":82,"end":90,"text":"치료가 끝났다면 두 가지를 물어보세요. 배는 얼마나 나아졌고, 식탁엔 무엇이 남았나.","cues":[{"start":82.0,"end":84.5,"text":"치료가 끝났다면 두 가지를"},{"start":84.5,"end":87.6,"text":"물어보세요. 배는 얼마나 나아졌고,"},{"start":87.6,"end":90.0,"text":"식탁엔 무엇이 남았나."}]}],"sources":[{"title":"ACG Clinical Guideline: Small Intestinal Bacterial Overgrowth","url":"https://doi.org/10.14309/AJG.0000000000000501"},{"title":"AGA Clinical Practice Update on Small Intestinal Bacterial Overgrowth: Expert Review","url":"https://doi.org/10.1053/j.gastro.2020.06.090"},{"title":"Critical appraisal of the SIBO hypothesis and breath testing: A clinical practice update endorsed by the European society of neurogastroenterology and motility (ESNM) and the American neurogastroenterology and motility society (ANMS)","url":"https://onlinelibrary.wiley.com/doi/10.1111/nmo.14817"},{"title":"AGA Clinical Practice Update on the Role of Diet in Irritable Bowel Syndrome: Expert Review","url":"https://pubmed.ncbi.nlm.nih.gov/35337654/"},{"title":"Efficacy and Findings of a Blinded Randomized Reintroduction Phase for the Low FODMAP Diet in Irritable Bowel Syndrome","url":"https://pubmed.ncbi.nlm.nih.gov/38401741/"},{"title":"Small Intestinal Bacterial Overgrowth (SIBO)","url":"https://gi.org/topics/small-intestinal-bacterial-overgrowth-sibo/"}]},{"id":52,"title":"내시경은 정상인데 과민성대장증후군일 수 있을까?","category":"소화·장","original":"내시경은 정상인데 과민성대장증후군? 의사는 뭘 보고 진단할까?","length":83,"parts":[{"start":0,"end":2,"text":"내시경은 정상, 배는 아파요.","cues":[{"start":0.0,"end":2.0,"text":"내시경은 정상, 배는 아파요."}]},{"start":2,"end":8,"text":"내시경이 보는 장과 생활 속에서 일하는 장은 관찰하는 방식이 달라요.","cues":[{"start":2.0,"end":4.7,"text":"내시경이 보는 장과 생활 속에서"},{"start":4.7,"end":8.0,"text":"일하는 장은 관찰하는 방식이 달라요."}]},{"start":8,"end":32,"text":"카메라는 장 벽을 비춥니다. 염증이나 구조 변화처럼 그 화면으로 찾는 문제들이 있죠. 그런데 식사한 뒤 장이 얼마나 빨리 움직였는지, 평범한 팽창을 얼마나 아프게 느끼는지는 사진 한 장에 그대로 나오지 않습니다. 과민성대장증후군을 볼 때는 그래서 실제 증상 패턴을 묻습니다.","cues":[{"start":8.0,"end":10.6,"text":"카메라는 장 벽을 비춥니다."},{"start":10.6,"end":12.9,"text":"염증이나 구조 변화처럼 그"},{"start":12.9,"end":15.6,"text":"화면으로 찾는 문제들이 있죠."},{"start":15.6,"end":18.1,"text":"그런데 식사한 뒤 장이 얼마나"},{"start":18.1,"end":20.8,"text":"빨리 움직였는지, 평범한 팽창을"},{"start":20.8,"end":23.5,"text":"얼마나 아프게 느끼는지는 사진"},{"start":23.5,"end":26.5,"text":"한 장에 그대로 나오지 않습니다."},{"start":26.5,"end":28.8,"text":"과민성대장증후군을 볼 때는"},{"start":28.8,"end":32.0,"text":"그래서 실제 증상 패턴을 묻습니다."}]},{"start":32,"end":37,"text":"‘정상이라서 과민성’으로 끝나는 과정은 아니에요.","cues":[{"start":32.0,"end":34.3,"text":"‘정상이라서 과민성’으로"},{"start":34.3,"end":37.0,"text":"끝나는 과정은 아니에요."}]},{"start":37,"end":75,"text":"가령 어떤 날은 점심 뒤 통증이 생기고 화장실에 다녀오면 좀 풀립니다. 다른 날은 화장실과 상관없이 밤에 아파서 깼어요. 둘 다 ‘배가 아프다’지만 검사 결과에 붙여 읽을 생활 속 단서가 다르죠. 통증이 배변 전후에 달라지는지, 변을 보는 횟수나 모양이 같이 변했는지 살펴요. 피가 보이거나 의도치 않게 체중이 줄면 다른 원인을 별도로 평가해야 하고요. 검사 결과와 증상을 함께 놓으면 무엇을 먼저 치료할지 구체적으로 정할 수 있습니다.","cues":[{"start":37.0,"end":39.6,"text":"가령 어떤 날은 점심 뒤 통증이"},{"start":39.6,"end":41.9,"text":"생기고 화장실에 다녀오면"},{"start":41.9,"end":44.7,"text":"좀 풀립니다. 다른 날은 화장실과"},{"start":44.7,"end":47.6,"text":"상관없이 밤에 아파서 깼어요."},{"start":47.6,"end":50.6,"text":"둘 다 ‘배가 아프다’지만 검사 결과에"},{"start":50.6,"end":53.6,"text":"붙여 읽을 생활 속 단서가 다르죠."},{"start":53.6,"end":56.4,"text":"통증이 배변 전후에 달라지는지,"},{"start":56.4,"end":59.0,"text":"변을 보는 횟수나 모양이 같이"},{"start":59.0,"end":61.8,"text":"변했는지 살펴요. 피가 보이거나"},{"start":61.8,"end":63.9,"text":"의도치 않게 체중이 줄면"},{"start":63.9,"end":67.4,"text":"다른 원인을 별도로 평가해야 하고요."},{"start":67.4,"end":70.2,"text":"검사 결과와 증상을 함께 놓으면"},{"start":70.2,"end":72.1,"text":"무엇을 먼저 치료할지"},{"start":72.1,"end":75.0,"text":"구체적으로 정할 수 있습니다."}]},{"start":75,"end":83,"text":"진료에 가져갈 건 사진 한 장과 함께, ‘배가 언제 아프고 변을 보면 어떻게 달라지는지’입니다.","cues":[{"start":75.0,"end":78.0,"text":"진료에 가져갈 건 사진 한 장과 함께,"},{"start":78.0,"end":80.3,"text":"‘배가 언제 아프고 변을 보면"},{"start":80.3,"end":83.0,"text":"어떻게 달라지는지’입니다."}]}],"sources":[{"title":"Diagnosis of Irritable Bowel Syndrome","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/irritable-bowel-syndrome/diagnosis"},{"title":"Symptoms & Causes of Irritable Bowel Syndrome","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/irritable-bowel-syndrome/symptoms-causes"},{"title":"ACG Clinical Guideline: Management of Irritable Bowel Syndrome","url":"https://doi.org/10.14309/AJG.0000000000001036"}]},{"id":53,"title":"속쓰림은 줄었는데 트림은 왜 남을까","category":"소화·장","original":"위산을 줄이는 약을 먹어도 트림이 계속 나는 이유","length":83,"parts":[{"start":0,"end":2,"text":"위산약 먹어도, 트림하나요?","cues":[{"start":0.0,"end":2.0,"text":"위산약 먹어도, 트림하나요?"}]},{"start":2,"end":8,"text":"같은 식사 뒤에 나온 증상이라도 약이 닿는 지점은 다를 수 있어요.","cues":[{"start":2.0,"end":4.8,"text":"같은 식사 뒤에 나온 증상이라도"},{"start":4.8,"end":8.0,"text":"약이 닿는 지점은 다를 수 있어요."}]},{"start":8,"end":31,"text":"위산을 줄이는 약은 산에 노출되는 정도를 낮춥니다. 타는 느낌이 줄어들 수 있죠. 트림에는 공기의 이동이 관여합니다. 위에 들어간 공기가 올라오는 경우도 있고, 공기가 식도까지만 들어갔다가 바로 나오는 경우도 있어요. 겉으로는 모두 같은 트림처럼 들려요.","cues":[{"start":8.0,"end":10.1,"text":"위산을 줄이는 약은 산에"},{"start":10.1,"end":12.7,"text":"노출되는 정도를 낮춥니다."},{"start":12.7,"end":15.4,"text":"타는 느낌이 줄어들 수 있죠."},{"start":15.4,"end":17.5,"text":"트림에는 공기의 이동이"},{"start":17.5,"end":19.6,"text":"관여합니다. 위에 들어간"},{"start":19.6,"end":22.1,"text":"공기가 올라오는 경우도 있고,"},{"start":22.1,"end":24.9,"text":"공기가 식도까지만 들어갔다가"},{"start":24.9,"end":27.5,"text":"바로 나오는 경우도 있어요."},{"start":27.5,"end":31.0,"text":"겉으로는 모두 같은 트림처럼 들려요."}]},{"start":31,"end":37,"text":"그래서 트림이 남았다는 사실만으로 산이 더 많다고 하긴 어렵습니다.","cues":[{"start":31.0,"end":34.1,"text":"그래서 트림이 남았다는 사실만으로"},{"start":34.1,"end":37.0,"text":"산이 더 많다고 하긴 어렵습니다."}]},{"start":37,"end":75,"text":"탄산을 마시고 한참 뒤 트림이 나는 날과, 이야기하는 중에 트림이 연달아 나오는 날을 떠올려 보세요. 언제 어떤 식으로 반복되는지 적으면, 산이 남았는지 공기의 움직임을 더 봐야 하는지 판단할 단서가 돼요. 속쓰림과 트림이 같은 때 생기는지, 어느 쪽이 약을 먹고 바뀌었는지 보세요. 필요한 경우에는 산도와 내용물 움직임을 구분해 기록하는 검사로 단서를 얻기도 합니다. 남은 증상을 어떻게 다룰지는 그 결과에 따라 달라질 수 있어요.","cues":[{"start":37.0,"end":40.4,"text":"탄산을 마시고 한참 뒤 트림이 나는 날과,"},{"start":40.4,"end":43.1,"text":"이야기하는 중에 트림이 연달아"},{"start":43.1,"end":45.7,"text":"나오는 날을 떠올려 보세요."},{"start":45.7,"end":48.9,"text":"언제 어떤 식으로 반복되는지 적으면,"},{"start":48.9,"end":51.7,"text":"산이 남았는지 공기의 움직임을"},{"start":51.7,"end":54.9,"text":"더 봐야 하는지 판단할 단서가 돼요."},{"start":54.9,"end":57.9,"text":"속쓰림과 트림이 같은 때 생기는지,"},{"start":57.9,"end":61.5,"text":"어느 쪽이 약을 먹고 바뀌었는지 보세요."},{"start":61.5,"end":64.3,"text":"필요한 경우에는 산도와 내용물"},{"start":64.3,"end":66.6,"text":"움직임을 구분해 기록하는"},{"start":66.6,"end":69.4,"text":"검사로 단서를 얻기도 합니다."},{"start":69.4,"end":72.0,"text":"남은 증상을 어떻게 다룰지는"},{"start":72.0,"end":75.0,"text":"그 결과에 따라 달라질 수 있어요."}]},{"start":75,"end":83,"text":"‘위산약이 안 들어요’ 대신 이렇게 말해 주세요. ‘타는 건 줄었는데, 트림은 그대로예요.’","cues":[{"start":75.0,"end":77.3,"text":"‘위산약이 안 들어요’ 대신"},{"start":77.3,"end":79.9,"text":"이렇게 말해 주세요. ‘타는 건"},{"start":79.9,"end":83.0,"text":"줄었는데, 트림은 그대로예요.’"}]}],"sources":[{"title":"Treatment for GER & GERD","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/acid-reflux-ger-gerd-adults/treatment"},{"title":"Diagnosis of GER & GERD","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/acid-reflux-ger-gerd-adults/diagnosis"},{"title":"AGA Clinical Practice Update on Evaluation and Management of Belching, Abdominal Bloating, and Distention: Expert Review","url":"https://gastro.org/clinical-guidance/evaluation-and-management-of-belching-abdominal-bloating-and-distention/"},{"title":"ACG Clinical Guideline: Guidelines for the Diagnosis and Management of Gastroesophageal Reflux Disease","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8754510/"},{"title":"Chest pain","url":"https://www.nhs.uk/symptoms/chest-pain/"}]},{"id":54,"title":"입 냄새가 걱정될 때 먼저 볼 곳","category":"소화·장","original":"입 냄새가 나는데 왜 입안부터 살펴봐야 할까?","length":82,"parts":[{"start":0,"end":2,"text":"입 냄새, 위부터 의심하나요?","cues":[{"start":0.0,"end":2.0,"text":"입 냄새, 위부터 의심하나요?"}]},{"start":2,"end":8,"text":"검사받을 곳을 고르기 전에 냄새가 만들어질 수 있는 가까운 곳부터 봐요.","cues":[{"start":2.0,"end":4.8,"text":"검사받을 곳을 고르기 전에 냄새가"},{"start":4.8,"end":8.0,"text":"만들어질 수 있는 가까운 곳부터 봐요."}]},{"start":8,"end":28,"text":"혀 표면의 설태, 잇몸 염증, 음식물이 남기 쉬운 곳을 떠올려 보세요. 입안의 세균이 남은 물질을 분해할 때 냄새가 날 수 있습니다. 침은 입안을 씻어주는 역할도 하죠. 입이 마르면 같은 날에도 냄새가 더 두드러질 수 있어요.","cues":[{"start":8.0,"end":11.1,"text":"혀 표면의 설태, 잇몸 염증, 음식물이"},{"start":11.1,"end":14.0,"text":"남기 쉬운 곳을 떠올려 보세요."},{"start":14.0,"end":16.4,"text":"입안의 세균이 남은 물질을"},{"start":16.4,"end":19.5,"text":"분해할 때 냄새가 날 수 있습니다."},{"start":19.5,"end":22.9,"text":"침은 입안을 씻어주는 역할도 하죠."},{"start":22.9,"end":25.1,"text":"입이 마르면 같은 날에도"},{"start":25.1,"end":28.0,"text":"냄새가 더 두드러질 수 있어요."}]},{"start":28,"end":34,"text":"이럴 때 장 해독부터 시작하면, 정작 입안에서 손볼 곳을 놓칩니다.","cues":[{"start":28.0,"end":30.6,"text":"이럴 때 장 해독부터 시작하면,"},{"start":30.6,"end":34.0,"text":"정작 입안에서 손볼 곳을 놓칩니다."}]},{"start":34,"end":76,"text":"예를 들어 아침에 입이 바싹 마른 날 특히 심했고, 잇몸에서 피도 났다고 해볼게요. 그 정보는 위보다 입안부터 살펴볼 이유가 됩니다. 약을 새로 먹고 입이 마르기 시작했는지도 같이 말할 수 있어요. 입이 언제 마르는지, 잇몸에서 피가 나는지, 양치해도 냄새가 지속되는지부터 확인해 보세요. 치과에서 입안을 살핀 뒤에도 불편이 남거나, 함께 있는 다른 증상이 있다면 그에 맞춰 다음 원인을 평가할 수 있어요. 실제 냄새와 냄새 때문에 일상이 위축된 정도도 함께 이야기할 수 있습니다.","cues":[{"start":34.0,"end":37.0,"text":"예를 들어 아침에 입이 바싹 마른 날"},{"start":37.0,"end":40.0,"text":"특히 심했고, 잇몸에서 피도 났다고"},{"start":40.0,"end":42.3,"text":"해볼게요. 그 정보는 위보다"},{"start":42.3,"end":45.4,"text":"입안부터 살펴볼 이유가 됩니다."},{"start":45.4,"end":47.7,"text":"약을 새로 먹고 입이 마르기"},{"start":47.7,"end":51.0,"text":"시작했는지도 같이 말할 수 있어요."},{"start":51.0,"end":53.6,"text":"입이 언제 마르는지, 잇몸에서"},{"start":53.6,"end":56.1,"text":"피가 나는지, 양치해도 냄새가"},{"start":56.1,"end":59.2,"text":"지속되는지부터 확인해 보세요."},{"start":59.2,"end":61.8,"text":"치과에서 입안을 살핀 뒤에도"},{"start":61.8,"end":63.9,"text":"불편이 남거나, 함께 있는"},{"start":63.9,"end":66.4,"text":"다른 증상이 있다면 그에 맞춰"},{"start":66.4,"end":69.3,"text":"다음 원인을 평가할 수 있어요."},{"start":69.3,"end":72.7,"text":"실제 냄새와 냄새 때문에 일상이 위축된"},{"start":72.7,"end":76.0,"text":"정도도 함께 이야기할 수 있습니다."}]},{"start":76,"end":82,"text":"입 냄새가 난다면 첫 지도는 입안입니다. 혀, 잇몸, 침부터.","cues":[{"start":76.0,"end":78.8,"text":"입 냄새가 난다면 첫 지도는"},{"start":78.8,"end":82.0,"text":"입안입니다. 혀, 잇몸, 침부터."}]}],"sources":[{"title":"Bad Breath","url":"https://www.mouthhealthy.org/all-topics-a-z/bad-breath/"},{"title":"Bad breath","url":"https://www.nhs.uk/symptoms/bad-breath/"},{"title":"Dry mouth","url":"https://www.nhs.uk/symptoms/dry-mouth/"},{"title":"Detoxes and Cleanses: What You Need To Know","url":"https://www.nccih.nih.gov/health/detoxes-and-cleanses-what-you-need-to-know"}]},{"id":55,"title":"몇 입만 먹어도 배가 꽉 차는 이유","category":"소화·장","original":"몇 숟갈만 먹어도 배가 꽉 찬다. 위에서 음식이 늦게 내려가는 걸까?","length":78,"parts":[{"start":0,"end":2,"text":"세 입 먹고, 위가 꽉 차나요?","cues":[{"start":0.0,"end":2.0,"text":"세 입 먹고, 위가 꽉 차나요?"}]},{"start":2,"end":8,"text":"그 느낌만으로 위가 음식을 늦게 내보낸다고 정하기는 어려워요.","cues":[{"start":2.0,"end":4.8,"text":"그 느낌만으로 위가 음식을 늦게"},{"start":4.8,"end":8.0,"text":"내보낸다고 정하기는 어려워요."}]},{"start":8,"end":29,"text":"위는 음식을 받으면서 여유 공간을 만들고, 나중엔 소장 쪽으로 조금씩 보냅니다. 받는 과정이 불편한 경우와 내보내는 속도가 느린 경우에, 모두 몇 입 먹기 힘들다는 말이 나올 수 있어요. 당뇨나 수술 이력, 새로 시작한 약도 확인할 단서가 됩니다.","cues":[{"start":8.0,"end":9.9,"text":"위는 음식을 받으면서"},{"start":9.9,"end":12.3,"text":"여유 공간을 만들고, 나중엔"},{"start":12.3,"end":15.1,"text":"소장 쪽으로 조금씩 보냅니다."},{"start":15.1,"end":17.4,"text":"받는 과정이 불편한 경우와"},{"start":17.4,"end":20.0,"text":"내보내는 속도가 느린 경우에,"},{"start":20.0,"end":22.5,"text":"모두 몇 입 먹기 힘들다는 말이"},{"start":22.5,"end":25.3,"text":"나올 수 있어요. 당뇨나 수술 이력,"},{"start":25.3,"end":29.0,"text":"새로 시작한 약도 확인할 단서가 됩니다."}]},{"start":29,"end":34,"text":"그래서 위 배출은 느낌과 따로 관찰해야 할 때가 있어요.","cues":[{"start":29.0,"end":31.1,"text":"그래서 위 배출은 느낌과"},{"start":31.1,"end":34.0,"text":"따로 관찰해야 할 때가 있어요."}]},{"start":34,"end":72,"text":"예를 들어 조금만 먹어도 꽉 차서 중간에 숟가락을 놓는데, 한참 지나선 다시 가벼워지는 날이 있어요. 다른 날엔 식후 오래 불편하고 토하기도 합니다. 먹은 양만 같아도 진료에서 물을 순서가 달라지죠. 필요한 경우 일정한 식사를 먹은 뒤 위에서 얼마나 빠져나가는지를 검사로 봅니다. 진료에는 먹고 몇 입 만에 찼는지, 얼마나 오래 불렀는지, 구토나 체중 감소가 있는지를 가져가세요. 먹거나 마시기 어려울 정도라면 평가를 미루지 마세요.","cues":[{"start":34.0,"end":36.8,"text":"예를 들어 조금만 먹어도 꽉 차서"},{"start":36.8,"end":38.9,"text":"중간에 숟가락을 놓는데,"},{"start":38.9,"end":41.4,"text":"한참 지나선 다시 가벼워지는"},{"start":41.4,"end":43.8,"text":"날이 있어요. 다른 날엔 식후"},{"start":43.8,"end":46.9,"text":"오래 불편하고 토하기도 합니다."},{"start":46.9,"end":49.2,"t :8,"end":28,"text":"장에 물이 더 남도록 돕는 약이 있습니다. 변이 부드러워지면 배출이 수월해질 수 있죠. 어떤 약은 장의 움직임이나 분비에 작용합니다. 약을 쉬면서 받던 도움이 줄면, 원래의 딱딱한 변이나 배출 어려움이 다시 느껴질 수 있어요.","cues":[{"start":8.0,"end":11.7,"text":"장에 물이 더 남도록 돕는 약이 있습니다."},{"start":11.7,"end":14.1,"text":"변이 부드러워지면 배출이"},{"start":14.1,"end":16.9,"text":"수월해질 수 있죠. 어떤 약은 장의"},{"start":16.9,"end":20.0,"text":"움직임이나 분비에 작용합니다."},{"start":20.0,"end":22.5,"text":"약을 쉬면서 받던 도움이 줄면,"},{"start":22.5,"end":24.9,"text":"원래의 딱딱한 변이나 배출"},{"start":24.9,"end":28.0,"text":"어려움이 다시 느껴질 수 있어요."}]},{"start":28,"end":33,"text":"그 변화 하나가 장이 손상됐다는 증거가 되진 않습니다.","cues":[{"start":28.0,"end":30.8,"text":"그 변화 하나가 장이 손상됐다는"},{"start":30.8,"end":33.0,"text":"증거가 되진 않습니다."}]},{"start":33,"end":70,"text":"같은 변비약이라고 써 있어도 어떤 사람이 먹은 건 물이 남게 돕는 약, 다른 사람이 먹은 건 움직임에 작용하는 약일 수 있어요. 쉬었을 때 다시 힘들었다는 경험이 같아도 확인할 부작용과 치료 계획은 다르죠. 오래 쓸 때의 주의점이나 부작용은 약 종류에 따라 달라요. 이름을 확인하고, 약을 먹을 때 무엇이 나아졌는지와 무엇이 남았는지 말해 보세요. 변은 무른데도 계속 힘을 줘야 한다면 배출 자체를 살피는 쪽으로 질문이 달라집니다.","cues":[{"start":33.0,"end":35.5,"text":"같은 변비약이라고 써 있어도"},{"start":35.5,"end":38.7,"text":"어떤 사람이 먹은 건 물이 남게 돕는 약,"},{"start":38.7,"end":41.2,"text":"다른 사람이 먹은 건 움직임에"},{"start":41.2,"end":43.6,"text":"작용하는 약일 수 있어요."},{"start":43.6,"end":46.0,"text":"쉬었을 때 다시 힘들었다는"},{"start":46.0,"end":48.7,"text":"경험이 같아도 확인할 부작용과"},{"start":48.7,"end":51.5,"text":"치료 계획은 다르죠. 오래 쓸 때의"},{"start":51.5,"end":54.2,"text":"주의점이나 부작용은 약 종류에"},{"start":54.2,"end":56.7,"text":"따라 달라요. 이름을 확인하고,"},{"start":56.7,"end":59.7,"text":"약을 먹을 때 무엇이 나아졌는지와"},{"start":59.7,"end":62.5,"text":"무엇이 남았는지 말해 보세요."},{"start":62.5,"end":65.1,"text":"변은 무른데도 계속 힘을 줘야"},{"start":65.1,"end":67.4,"text":"한다면 배출 자체를 살피는"},{"start":67.4,"end":70.0,"text":"쪽으로 질문이 달라집니다."}]},{"start":70,"end":77,"text":"상담에 들고 갈 건 약 상자와 기록 두 줄. 먹을 때 바뀐 것, 쉬었을 때 돌아온 것.","cues":[{"start":70.0,"end":73.6,"text":"상담에 들고 갈 건 약 상자와 기록 두 줄."},{"start":73.6,"end":77.0,"text":"먹을 때 바뀐 것, 쉬었을 때 돌아온 것."}]}],"sources":[{"title":"American Gastroenterological Association-American Colle 7.3,"text":"하지만 막힌 변이 남았다면 지사제를"},{"start":47.3,"end":51.0,"text":"먹기 전에 쌓인 변부터 확인해야 해요."}]},{"start":51,"end":70,"text":"이전 며칠 동안 변을 얼마나 봤는지, 배가 불러오거나 토하는지 함께 알려 주세요. 진찰로 쌓인 변이 있는지 확인해야 할 수 있습니다. 배가 심하게 아프거나 붓고, 토하거나 가스도 못 내보내면 신속하게 평가받으세요.","cues":[{"start":51.0,"end":54.0,"text":"이전 며칠 동안 변을 얼마나 봤는지,"},{"start":54.0,"end":56.8,"text":"배가 불러오거나 토하는지 함께"},{"start":56.8,"end":59.4,"text":"알려 주세요. 진찰로 쌓인 변이"},{"start":59.4,"end":62.6,"text":"있는지 확인해야 할 수 있습니다."},{"start":62.6,"end":64.9,"text":"배가 심하게 아프거나 붓고,"},{"start":64.9,"end":67.5,"text":"토하거나 가스도 못 내보내면"},{"start":67.5,"end":70.0,"text":"신속하게 평가받으세요."}]},{"start":70,"end":78,"text":"설사라고 말하기 전에 순서를 말해 주세요. ‘며칠 막혔고, 그다음 묽은 것이 샜어요.’","cues":[{"start":70.0,"end":72.9,"text":"설사라고 말하기 전에 순서를"},{"start":72.9,"end":75.3,"text":"말해 주세요. ‘며칠 막혔고,"},{"start":75.3,"end":78.0,"text":"그다음 묽은 것이 샜어요.’"}]}],"sources":[{"title":"Fecal impaction","url":"https://medlineplus.gov/ency/article/000230.htm"},{"title":"Constipation","url":"https://www.nhs.uk/conditions/constipation/"},{"title":"Symptoms & Causes of Constipation","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/symptoms-causes"}]},{"id":65,"title":"철분을 먹고 검은 변, 색보다 먼저 볼 신호","category":"배변","original":"철분제를 먹고 변이 검어졌다. 약 때문인지 출혈인지 어떻게 살필까요?","length":82,"parts":[{"start":0,"end":2,"text":"철분 먹고, 검은 변이 나와요?","cues":[{"start":0.0,"end":2.0,"text":"철분 먹고, 검은 변이 나와요?"}]},{"start":2,"end":9,"text":"약 때문에 색이 바뀔 수 있지만, 같이 생긴 신호가 있으면 판단이 달라져요.","cues":[{"start":2.0,"end":5.2,"text":"약 때문에 색이 바뀔 수 있지만, 같이"},{"start":5.2,"end":9.0,"text":"생긴 신호가 있으면 판단이 달라져요."}]},{"start":9,"end":50,"text":"먹은 철분 중 다 흡수되지 않은 부분은 변 색을 어둡게 만들 수 있습니다. 한편 위나 장에서 피가 나 소화되면서 검고 끈적한 변이 나올 수도 있어요. 새까맣다는 말만으로 둘을 확실히 가르기는 어렵습니다. 시작한 철분이 있어도 출혈 가능성이 사라지지는 않아요. 예를 들어 철분 복용과 동시에 색은 어두워졌지만 몸 상태는 그대로일 수 있어요. 어떤 날은 검고 끈적한 변과 함께 일어설 때 어지러움이 새로 생기죠. 약을 먹는다는 공통점으로 두 상황을 같게 보면 안 됩니다.","cues":[{"start":9.0,"end":12.2,"text":"먹은 철분 중 다 흡수되지 않은 부분은"},{"start":12.2,"end":15.2,"text": art":0.0,"end":2.0,"text":"소변도, 대변도 불편하세요?"}]},{"start":2,"end":8,"text":"같은 골반에서 벌어지는 두 일을 한 장에 시간별로 적어 보세요.","cues":[{"start":2.0,"end":5.0,"text":"같은 골반에서 벌어지는 두 일을"},{"start":5.0,"end":8.0,"text":"한 장에 시간별로 적어 보세요."}]},{"start":8,"end":32,"text":"소변이 자주 마렵다고 해도 갈 때마다 조금 나오는지, 매번 많이 나오는지 질문이 달라요. 변도 딱딱해서 힘든 것과 부드러운데 출구에서 안 나오는 것이 다르죠. 골반 아래 근육은 닫을 때 닫히고, 내보낼 때 풀려야 합니다. 그래서 힘을 더 주는 연습이 언제나 답은 아니에요.","cues":[{"start":8.0,"end":9.9,"text":"소변이 자주 마렵다고"},{"start":9.9,"end":12.5,"text":"해도 갈 때마다 조금 나오는지,"},{"start":12.5,"end":15.8,"text":"매번 많이 나오는지 질문이 달라요."},{"start":15.8,"end":19.1,"text":"변도 딱딱해서 힘든 것과 부드러운데"},{"start":19.1,"end":22.2,"text":"출구에서 안 나오는 것이 다르죠."},{"start":22.2,"end":24.9,"text":"골반 아래 근육은 닫을 때 닫히고,"},{"start":24.9,"end":27.4,"text":"내보낼 때 풀려야 합니다."},{"start":27.4,"end":29.8,"text":"그래서 힘을 더 주는 연습이"},{"start":29.8,"end":32.0,"text":"언제나 답은 아니에요."}]},{"start":32,"end":38,"text":"증상 둘이 같이 왔다고 한 원인으로 넣어 버리면 중요한 단서가 빠집니다.","cues":[{"start":32.0,"end":34.8,"text":"증상 둘이 같이 왔다고 한 원인으로"},{"start":34.8,"end":38.0,"text":"넣어 버리면 중요한 단서가 빠집니다."}]},{"start":38,"end":75,"text":"외출하면 화장실을 여러 번 들른다고 해볼게요. 갈 때마다 몇 방울씩 나오는 것과 물을 많이 마신 뒤 매번 충분히 나오는 건 사정이 다르죠. 대변도 아예 안 나오는 날과 마지막에 덜 나온 느낌이 남는 날을 나눠 보세요. 소변 횟수와 대략적인 양, 변을 볼 때 힘든 순간, 바뀐 약을 함께 보여 주세요. 한 문제로 받은 약이 다른 쪽 증상에 영향을 주는 경우도 있거든요. 소변을 전혀 못 보면서 아랫배가 아프면 급히 평가받아야 합니다.","cues":[{"start":38.0,"end":41.3,"text":"외출하면 화장실을 여러 번 들른다고"},{"start":41.3,"end":43.9,"text":"해볼게요. 갈 때마다 몇 방울씩"},{"start":43.9,"end":46.9,"text":"나오는 것과 물을 많이 마신 뒤 매번"},{"start":46.9,"end":50.0,"text":"충분히 나오는 건 사정이 다르죠."},{"start":50.0,"end":52.4,"text":"대변도 아예 안 나오는 날과"},{"start":52.4,"end":55.0,"text":"마지막에 덜 나온 느낌이 남는"},{"start":55.0,"end":57.6,"text":"날을 나눠 보세요. 소변 횟수와"},{"start":57.6,"end":60.4,"text":"대략적인 양, 변을 볼 때 힘든 순간,"},{"start":60.4,"end":63.1,"text":"바뀐 약을 함께 보여 주세요."},{"start":63.1,"end":66.2,"text":"한 문제로 받은 약이 다른 쪽 증상에"},{"start":66.2,"end":69.1,"text":"영향을 주는 경우도 있거든요."},{"start":69.1,"end":71.9,"text":"소변을 전혀 못 보면서 아랫배가"},{"st "end":68.0,"text":"그 증상도 진료에서 알려 주세요."},{"start":68.0,"end":70.7,"text":"보습을 바꾼 뒤의 반응은 다음에"},{"start":70.7,"end":74.0,"text":"무엇을 볼지 정하는 자료가 됩니다."}]},{"start":74,"end":81,"text":"진료에서 이렇게 말해 보세요. ‘당김은 줄었는데, 이 상황에서 붉고 뜨거워요.’","cues":[{"start":74.0,"end":76.0,"text":"진료에서 이렇게 말해"},{"start":76.0,"end":78.2,"text":"보세요. ‘당김은 줄었는데,"},{"start":78.2,"end":81.0,"text":"이 상황에서 붉고 뜨거워요.’"}]}],"sources":[{"title":"Rosacea","url":"https://www.skinhealthinfo.org.uk/condition/rosacea/"},{"title":"Rosacea: Diagnosis and treatment","url":"https://www.aad.org/public/diseases/rosacea/treatment/diagnosis-treat"},{"title":"Rosacea","url":"https://www.nhs.uk/conditions/rosacea/"}]},{"id":73,"title":"턱 여드름에서 위치보다 먼저 볼 변화","category":"피부","original":"턱 여드름이 반복되면 호르몬 검사부터 해야 할까요?","length":81,"parts":[{"start":0,"end":2,"text":"턱 여드름, 호르몬 탓일까요?","cues":[{"start":0.0,"end":2.0,"text":"턱 여드름, 호르몬 탓일까요?"}]},{"start":2,"end":8,"text":"거울에서 턱을 찾았으면, 다음은 생활과 몸의 변화를 보세요.","cues":[{"start":2.0,"end":4.4,"text":"거울에서 턱을 찾았으면,"},{"start":4.4,"end":8.0,"text":"다음은 생활과 몸의 변화를 보세요."}]},{"start":8,"end":30,"text":"여드름은 털이 자라는 모낭이 막히고 염증이 생기면서 나타납니다. 피지와 호르몬의 영향이 관여할 수 있어요. 그런 영향이 있다는 말과 혈액검사에서 호르몬 수치 이상이 나온다는 말은 다릅니다. 턱에 반복된다는 위치만으로 검사를 정하기도 어렵죠.","cues":[{"start":8.0,"end":11.2,"text":"여드름은 털이 자라는 모낭이 막히고"},{"start":11.2,"end":14.0,"text":"염증이 생기면서 나타납니다."},{"start":14.0,"end":17.0,"text":"피지와 호르몬의 영향이 관여할 수"},{"start":17.0,"end":19.3,"text":"있어요. 그런 영향이 있다는"},{"start":19.3,"end":22.0,"text":"말과 혈액검사에서 호르몬 수치"},{"start":22.0,"end":25.1,"text":"이상이 나온다는 말은 다릅니다."},{"start":25.1,"end":27.6,"text":"턱에 반복된다는 위치만으로"},{"start":27.6,"end":30.0,"text":"검사를 정하기도 어렵죠."}]},{"start":30,"end":35,"text":"여드름과 함께 새로 생긴 변화가 있다면 질문이 달라져요.","cues":[{"start":30.0,"end":32.0,"text":"여드름과 함께 새로 생긴"},{"start":32.0,"end":35.0,"text":"변화가 있다면 질문이 달라져요."}]},{"start":35,"end":74,"text":"턱에 생긴 위치는 계속 같아도, 원래 몇 개씩 나던 것이 최근 한꺼번에 늘었을 수 있어요. 혹은 피부 변화는 비슷한데 월경 간격이 달라졌을 수 있죠. 위치에 표시하고, 변화가 시작된 달도 알려 주세요. 생리 간격이 크게 달라졌거나, 얼굴이나 몸의 굵은 털이 늘었는지, 갑자기 심해졌는지를 알려 주세요. 여드름이 얼마나 오래됐고 어떤 치료를 써 왔는지도 봅니다. 피부에서 염증을 다루는 치료와 몸의 다른 신호를 평가하는 일은 함께 할 수 있어요.","cues":[{"start":35.0,"end":37.6,"text":"턱에 생긴 위치는 계속 같아도,"},{"start":37.6,"end":40.0,"text":"원래 몇 개씩 나던 것이 최근"},{"start":40.0,"end":42.6,"text":"한꺼번에 늘었을 수 있어요."},{"start":42.6,"end":46.1,"text":"혹은 피부 변화는 비슷한데 월경 간격이"},{"start":46.1,"end":49.1,"text":"달라졌을 수 있죠. 위치에 표시하고,"},{"start":49.1,"end":52.2,"text":"변화가 시작된 달도 알려 주세요."},{"start":52.2,"end":54.8,"text":"생리 간격이 크게 달라졌거나,"},{"start":54.8,"end":57.8,"text":"얼굴이나 몸의 굵은 털이 늘었는지,"},{"start":57.8,"end":61.1,"text":"갑자기 심해졌는지를 알려 주세요."},{"start":61.1,"end":63.5,"text":"여드름이 얼마나 오래됐고"},{"start":63.5,"end":66.6,"text":"어떤 치료를 써 왔는지도 봅니다."},{"start":66.6,"end":68.7,"text":"피부에서 염증을 다루는"},{"start":68.7,"end":70.9,"text":"치료와 몸의 다른 신호를"},{"start":70.9,"end":74.0,"text":"평가하는 일은 함께 할 수 있어요."}]},{"start":74,"end":81,"text":"진료에 사진을 가져가세요. 거기에 ‘같은 시기에 달라진 일’ 한 줄을 더하고요.","cues":[{"start":74.0,"end":77.6,"text":"진료에 사진을 가져가세요. 거기에 ‘같은"},{"start":77.6,"end":81.0,"text":"시기에 달라진 일’ 한 줄을 더하고요."}]}],"sources":[{"title":"Adult acne","url":"https://www.aad.org/public/diseases/acne/really-acne/adult-acne"},{"title":"Acne clinical guideline","url":"https://www.aad.org/member/clinical-quality/guidelines/acne"},{"title":"Recommendations from the 2023 International Evidence-based Guideline for the Assessment and Management of Polycystic Ovary Syndrome","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10477934/"}]},{"id":74,"title":"두드러기가 자꾸 날 때, 무엇을 먹었는지 말고 확인할 시간","category":"피부","original":"두드러기가 자꾸 나는데 원인 음식을 못 찾는 이유","length":86,"parts":[{"start":0,"end":2,"text":"두드러기엔 시계가 필요해요.","cues":[{"start":0.0,"end":2.0,"text":"두드러기엔 시계가 필요해요."}]},{"start":2,"end":7,"text":"반복 두드러기에는 식단표만큼 시계와 달력이 중요합니다.","cues":[{"start":2.0,"end":4.6,"text":"반복 두드러기에는 식단표만큼"},{"start":4.6,"end":7.0,"text":"시계와 달력이 중요합니다."}]},{"start":7,"end":48,"text":"피부의 비만세포가 히스타민 같은 물질을 내보내면, 피부가 부풀고 가려울 수 있어요. 이런 반응이 반복돼도 특정 음식이 원인으로 정해지지 않는 경우가 있습니다. 어떤 날은 압박이나 열처럼 다른 조건에 반응하기도 해요. 아무 메뉴나 하나씩 지우면 식탁만 좁아질 수 있죠. 아침에 팔 한 곳이 부풀었다가 저녁에 사라졌는데, 다음 날 등에서도 새로 올라오는 식일 수 있어요. 팔과 등의 병변은 각자 머문 시간이 다르죠. 어제부터 계속됐다고만 말하면 이 차이가 묻힙니다.","cues":[{"start":7.0,"end":9.6,"text":"피부의 비만세포가 히스타민"},{"start":9.6,"end":11.5,"text":"같은 물질을 내보내면,"},{"start":11.5,"end":14.6,"text":"피부가 부풀고 가려울 수 있어요."},{"start":14.6,"end":16.9,"text":"이런 반응이 반복돼도 특정"},{"start":16.9,"end":19.3,"text":"음식이 원인으로 정해지지"},{"start":19.3,"end":21.5,"text":"않는 경우가 있습니다."},{"start":21.5,"end":23.8,"text":"어떤 날은 압박이나 열처럼"},{"start":23.8,"end":26.7,"text":"다른 조건에 반응하기도 해요."},{"start":26.7,"end":29.0,"text":"아무 메뉴나 하나씩 지우면"},{"start":29.0,"end":31.6,"text":"식탁만 좁아질 수 있죠. 아침에"},{"start":31.6,"end":34.2,"text":"팔 한 곳이 부풀었다가 저녁에"},{"start":34.2,"end":36.7,"text":"사라졌는데, 다음 날 등에서도"},{"start":36.7,"end":39.6,"text":"새로 올라오는 식일 수 있어요."},{"start":39.6,"end":42.6,"text":"팔과 등의 병변은 각자 머문 시간이"},{"start":42.6,"end":45.4,"text":"다르죠. 어제부터 계속됐다고만"},{"start":45.4,"end":48.0,"text":"말하면 이 차이가 묻힙니다."}]},{"start":48,"end":55,"text":"두드러기가 얼마나 오래 반복됐는지와, 한 자리가 얼마나 갔는지를 나눠 보세요.","cues":[{"start":48.0,"end":51.4,"text":"두드러기가 얼마나 오래 반복됐는지와,"},{"start":51.4,"end":55.0,"text":"한 자리가 얼마나 갔는지를 나눠 보세요."}]},{"start":55,"end":79,"text":"달력에는 처음 시작한 날과 자주 올라온 날을 적어요. 같은 자리에 머문 시간은 시계로 보고 사진을 남깁니다. 음식 직후 같은 반응이 반복됐다면 그 시간도 단서죠. 숨쉬기 어렵거나 목이 조이는 등 아나필락시스가 의심되면, 처방된 에피네프린을 쓰고 즉시 일일구에 연락하세요.","cues":[{"start":55.0,"end":57.3,"text":"달력에는 처음 시작한 날과"},{"start":57.3,"end":59.7,"text":"자주 올라온 날을 적어요."},{"start":59.7,"end":61.7,"text":"같은 자리에 머문 시간은"},{"start":61.7,"end":64.5,"text":"시계로 보고 사진을 남깁니다."},{"start":64.5,"end":66.4,"text":"음식 직후 같은 반응이"},{"start":66.4,"end":69.2,"text":"반복됐다면 그 시간도 단서죠."},{"start":69.2,"end":71.9,"text":"숨쉬기 어렵거나 목이 조이는 등"},{"start":71.9,"end":74.1,"text":"아나필락시스가 의심되면,"},{"start":74.1,"end":76.4,"text":"처방된 에피네프린을 쓰고"},{"start":76.4,"end":79.0,"text":"즉시 일일구에 연락하세요."}]},{"start":79,"end":86,"text":"메뉴 옆에 먼저 두 칸을 채우세요. 몇 주째인지, 한 자리가 몇 시간 갔는지.","cues":[{"start":79.0,"end":82.3,"text":"메뉴 옆에 먼저 5,"text":"가령 머리 감을 때 빠진 양이 갑자기 늘었지만 두피의 어느 한 곳만 비어 보이진 않았어요. 빠진 날의 사진 한 장만으로는 앞선 변화가 보이지 않죠. 그 전에 식사나 몸 상태가 달라진 때까지 같이 봐야 합니다. 머리 전체에서 고루 빠지는지, 가르마만 넓어지거나 한 부분이 비는지 살펴보세요. 빠지기 시작한 날과 몇 달 전 있었던 감량, 질환, 약 변화도 단서가 됩니다. 보충제부터 고르기보다 분포와 경과를 보고 필요한 검사를 정하세요.","cues":[{"start":37.0,"end":39.4,"text":"가령 머리 감을 때 빠진 양이"},{"start":39.4,"end":42.0,"text":"갑자기 늘었지만 두피의 어느"},{"start":42.0,"end":44.9,"text":"한 곳만 비어 보이진 않았어요."},{"start":44.9,"end":47.5,"text":"빠진 날의 사진 한 장만으로는"},{"start":47.5,"end":49.9,"text":"앞선 변화가 보이지 않죠."},{"start":49.9,"end":52.1,"text":"그 전에 식사나 몸 상태가"},{"start":52.1,"end":55.2,"text":"달라진 때까지 같이 봐야 합니다."},{"start":55.2,"end":57.8,"text":"머리 전체에서 고루 빠지는지,"},{"start":57.8,"end":60.6,"text":"가르마만 넓어지거나 한 부분이"},{"start":60.6,"end":63.0,"text":"비는지 살펴보세요. 빠지기"},{"start":63.0,"end":65.8,"text":"시작한 날과 몇 달 전 있었던 감량,"},{"start":65.8,"end":68.7,"text":"질환, 약 변화도 단서가 됩니다."},{"start":68.7,"end":71.5,"text":"보충제부터 고르기보다 분포와"},{"start":71.5,"end":75.0,"text":"경과를 보고 필요한 검사를 정하세요."}]},{"start":75,"end":84,"text":"빠진 날만 동그라미 치지 마세요. 달력을 몇 달 전으로 돌려, 그때의 식사와 몸 상태를 찾아보세요.","cues":[{"start":75.0,"end":78.2,"text":"빠진 날만 동그라미 치지 마세요."},{"start":78.2,"end":80.4,"text":"달력을 몇 달 전으로 돌려,"},{"start":80.4,"end":84.0,"text":"그때의 식사와 몸 상태를 찾아보세요."}]}],"sources":[{"title":"Telogen effluvium","url":"https://www.skinhealthinfo.org.uk/condition/telogen-effluvium/"},{"title":"Do you have hair loss or hair shedding?","url":"https://www.aad.org/public/diseases/hair-loss/insider/shedding"},{"title":"Hair loss: Diagnosis and treatment","url":"https://www.aad.org/public/diseases/hair-loss/treatment/diagnosis-treat"},{"title":"Telogen Effluvium Associated With Weight Loss: A Single Center Retrospective Study","url":"https://anndermatol.org/DOIx.php?id=10.5021/ad.24.043"},{"title":"Use of 5% Topical Minoxidil Application for Telogen Effluvium: An Open-Label Single-Arm Clinical Trial","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/1346-8138.17844"}]},{"id":76,"title":"긁기 전엔 발진이 없었던 가려움","category":"피부","original":"발진은 없는데 계속 가렵다면, 피부 말고도 살펴볼 게 있을까요?","length":83,"parts":[{"start":0,"end":2,"text":"발진 없이, 온몸이 가렵나요?","cues":[{"start":0.0,"end":2.0,"text":"발진 없이, 온몸이 가렵나요?"}]},{"start":2,"end":7,"text":"긁고 난 피부를 보기 전에 처음 가렵던 순간을 떠올려 보세요.","cues":[{"start":2.0,"end":4.4,"text":"긁고 난 피부를 보기 전에 처음"},{"start":4.4,"end":7.0,"text":"가렵던 순간을 떠올려 보세요."}]},{"start":7,"end":34,"text":"피부가 가렵다고 해서 처음부터 붉은 점이 보이는 건 아닙니다. 피부가 건조할 때도 겉에서 변화가 뚜렷하지 않을 수 있어요. 그 뒤 손톱으로 긁으면 줄이나 딱지가 남죠. 진료에서 자국만 보면 맨 처음에 피부가 어땠는지는 알기 어렵습니다. 가렵기 전에 있던 변화와 긁어서 생긴 자국은 살펴볼 순서가 다르거든요.","cues":[{"start":7.0,"end":9.7,"text":"피부가 가렵다고 해서 처음부터"},{"start":9.7,"end":12.5,"text":"붉은 점이 보이는 건 아닙니다."},{"start":12.5,"end":14.9,"text":"피부가 건조할 때도 겉에서"},{"start":14.9,"end":17.9,"text":"변화가 뚜렷하지 않을 수 있어요."},{"start":17.9,"end":19.8,"text":"그 뒤 손톱으로 긁으면"},{"start":19.8,"end":22.3,"text":"줄이나 딱지가 남죠. 진료에서"},{"start":22.3,"end":24.8,"text":"자국만 보면 맨 처음에 피부가"},{"start":24.8,"end":27.6,"text":"어땠는지는 알기 어렵습니다."},{"start":27.6,"end":30.3,"text":"가렵기 전에 있던 변화와 긁어서"},{"start":30.3,"end":34.0,"text":"생긴 자국은 살펴볼 순서가 다르거든요."}]},{"start":34,"end":39,"text":"가려운 범위가 한 곳인지 온몸인지에 따라 질문이 달라져요.","cues":[{"start":34.0,"end":36.0,"text":"가려운 범위가 한 곳인지"},{"start":36.0,"end":39.0,"text":"온몸인지에 따라 질문이 달라져요."}]},{"start":39,"end":76,"text":"가령 처음 가려웠을 때 다리 한 곳이었는지, 그날 밤엔 팔과 몸통까지 옮겨 갔는지를 떠올려 보세요. 처음부터 눈에 띄는 발진이 있었는지 알려주면, 피부에서 볼 문제와 더 살펴볼 조건을 가르는 데 도움이 됩니다. 한 곳만 반복되면 그 부위가 무엇과 닿는지 보게 됩니다. 온몸에서 오래 가고 처음에 발진이 없었다면 약이나 몸 상태까지 살피고 필요한 검사를 고를 수 있어요. 갑자기 바뀐 약과 가려움으로 깬 밤이 있었는지도 알려 주세요.","cues":[{"start":39.0,"end":41.3,"text":"가령 처음 가려웠을 때 다리"},{"start":41.3,"end":43.9,"text":"한 곳이었는지, 그날 밤엔 팔과"},{"start":43.9,"end":46.6,"text":"몸통까지 옮겨 갔는지를 떠올려"},{"start":46.6,"end":48.9,"text":"보세요. 처음부터 눈에 띄는"},{"start":48.9,"end":51.2,"text":"발진이 있었는지 알려주면,"},{"start":51.2,"end":53.8,"text":"피부에서 볼 문제와 더 살펴볼"},{"start":53.8,"end":56.8,"text":"조건을 가르는 데 도움이 됩니다."},{"start":56.8,"end":59.8,"text":"한 곳만 반복되면 그 부위가 무엇과"},{"start":59.8,"end":62.3,"text":"닿는지 보게 됩니다. 온몸에서"},{"start":62.3,"end":65.3,"text":"오래 가고 처음에 발진이 없었다면"},{"start":65.3,"end":67.6,"text":"약이나 몸 상태까지 살피고"},{"start":67.6,"end":70.4,"text":"필요한 검사를 고를 수 있어요."},{"start":70.4,"end":73.0,"text":"갑자기 바뀐 약과 가려움으로"},{"start":73.0,"end":76.0,"text":"깬 밤이 있었는지도 알려 주세요."}]},{"start":76,"end":83,"text":"사진을 남길 수 있다면 순서가 중요해요. 긁은 직후보다 손이 가기 전의 피부.","cues":[{"start":76.0,"end":79.7,"text":"사진을 남길 수 있다면 순서가 중요해요."},{"start":79.7,"end":83.0,"text":"긁은 직후보다 손이 가기 전의 피부."}]}],"sources":[{"title":"Pruritus (itching)","url":"https://www.skinhealthinfo.org.uk/condition/pruritus/"},{"title":"Pruritus","url":"https://www.pcds.org.uk/clinical-guidance/pruritus-without-a-rash"},{"title":"European Guideline on Chronic Pruritus: In cooperation with the European Dermatology Forum (EDF)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12529596/"}]},{"id":77,"title":"새 약을 시작한 뒤 햇빛 반응이 달라졌다면","category":"피부","original":"같은 햇빛인데 새 약을 먹은 뒤 피부 반응이 달라진 이유","length":82,"parts":[{"start":0,"end":2,"text":"새 약 뒤, 햇빛에 타나요?","cues":[{"start":0.0,"end":2.0,"text":"새 약 뒤, 햇빛에 타나요?"}]},{"start":2,"end":8,"text":"같은 햇빛인데 이번에 유독 피부가 아팠다면 약을 시작한 날짜를 보세요.","cues":[{"start":2.0,"end":4.8,"text":"같은 햇빛인데 이번에 유독 피부가"},{"start":4.8,"end":8.0,"text":"아팠다면 약을 시작한 날짜를 보세요."}]},{"start":8,"end":32,"text":"일부 약 성분은 피부에서 빛과 만나 반응을 일으킬 수 있어요. 그중에는 햇빛이 닿은 자리가 유난히 심하게 탄 것처럼 화끈거리는 반응이 있습니다. 어떤 경우엔 면역 반응이 관여해서 시간이 지난 뒤 가려운 발진이 보이기도 하죠. 모양만 보고 집에서 구분하긴 어렵습니다.","cues":[{"start":8.0,"end":10.6,"text":"일부 약 성분은 피부에서 빛과"},{"start":10.6,"end":13.5,"text":"만나 반응을 일으킬 수 있어요."},{"start":13.5,"end":16.1,"text":"그중에는 햇빛이 닿은 자리가"},{"start":16.1,"end":18.2,"text":"유난히 심하게 탄 것처럼"},{"start":18.2,"end":21.1,"text":"화끈거리는 반응이 있습니다."},{"start":21.1,"end":24.1,"text":"어떤 경우엔 면역 반응이 관여해서"},{"start":24.1,"end":26.7,"text":"시간이 지난 뒤 가려운 발진이"},{"start":26.7,"end":29.1,"text":"보이기도 하죠. 모양만 보고"},{"start":29.1,"end":32.0,"text":"집에서 구분하긴 어렵습니다."}]},{"start":32,"end":36,"text":"그리고 약은 삼킨 알약만 뜻하지 않아요.","cues":[{"start":32.0,"end":36.0,"text":"그리고 약은 삼킨 알약만 뜻하지 않아요."}]},{"start":36,"end":75,"text":"가령 팔의 소매 아래는 그대로인데 밖으로 드러난 손등만 유난히 아팠다고 해볼게요. 그런 경계는 햇빛과의 관계를 볼 단서예요. 약을 바꾼 시점과 피부가 처음 변한 날이 가까웠는지도 같이 알려 주세요. 최근 바른 제품이나 보충제도 목록에 넣으세요. 옷 밖으로 나온 곳만 달라졌는지, 햇빛을 보고 얼마나 지나 생겼는지도 단서입니다. 처방약을 혼자 빼기 전에 확인하고, 넓게 물집이 생기거나 입안과 눈 등 점막까지 아프면 신속히 평가받으세요.","cues":[{"start":36.0,"end":39.0,"text":"가령 팔의 소매 아래는 그대로인데"},{"start":39.0,"end":41.6,"text":"밖으로 드러난 손등만 유난히"},{"start":41.6,"end":44.4,"text":"아팠다고 해볼게요. 그런 경계는"},{"start":44.4,"end":47.3,"text":"햇빛과의 관계를 볼 단서예요."},{"start":47.3,"end":49.8,"text":"약을 바꾼 시점과 피부가 처음"},{"start":49.8,"end":52.4,"text":"변한 날이 가까웠는지도 같이"},{"start":52.4,"end":55.2,"text":"알려 주세요. 최근 바른 제품이나"},{"start":55.2,"end":57.9,"text":"보충제도 목록에 넣으세요."},{"start":57.9,"end":60.7,"text":"옷 밖으로 나온 곳만 달라졌는지,"},{"start":60.7,"end":62.8,"text":"햇빛을 보고 얼마나 지나"},{"start":62.8,"end":65.2,"text":"생겼는지도 단서입니다."},{"start":65.2,"end":68.3,"text":"처방약을 혼자 빼기 전에 확인하고,"},{"start":68.3,"end":71.3,"text":"넓게 물집이 생기거나 입안과 눈 등"},{"start":71.3,"end":75.0,"text":"점막까지 아프면 신속히 평가받으세요."}]},{"start":75,"end":82,"text":"사진 옆에 두 날짜를 적으세요. 새로 쓴 약의 첫날, 햇빛 뒤 피부가 달라진 날.","cues":[{"start":75.0,"end":78.2,"text":"사진 옆에 두 날짜를 적으세요. 새로"},{"start":78.2,"end":82.0,"text":"쓴 약의 첫날, 햇빛 뒤 피부가 달라진 날."}]}],"sources":[{"title":"The Sun and Your Medicine","url":"https://www.fda.gov/drugs/understanding-over-counter-medicines/sun-and-your-medicine"},{"title":"Photodermatoses: drug-induced","url":"https://www.pcds.org.uk/clinical-guidance/drug-induced-photodermatoses"},{"title":"Stevens-Johnson syndrome","url":"https://www.nhs.uk/conditions/stevens-johnson-syndrome/"}]},{"id":78,"title":"크림을 발라도 손이 갈라지면 뭘 먼저 볼까?","category":"피부","original":"순한 크림을 발라도 손이 갈라진다면, 손에 닿는 것부터 살펴볼까요?","length":80,"parts":[{"start":0,"end":2,"text":"크림 발라도, 손이 갈라져요?","cues":[{"start":0.0,"end":2.0,"text":"크림 발라도, 손이 갈라져요?"}]},{"start":2,"end":8,"text":"아침부터 저녁까지 손에 닿는 것을 시간순으로 떠올려 보세요.","cues":[{"start":2.0,"end":4.7,"text":"아침부터 저녁까지 손에 닿는"},{"start":4.7,"end":8.0,"text":"것을 시간순으로 떠올려 보세요."}]},{"start":8,"end":29,"text":"아침엔 손을 씻고, 일하면서 세정제를 쓰고, 저녁엔 설거지를 하죠. 한 번은 괜찮아도 물과 세정제가 반복되면 피부 장벽이 자극을 받을 수 있습니다. 또 어떤 사람은 장갑 성분이나 제품 속 특정 물질에 알레르기가 생겨 손에 염증이 나타날 수 있어요.","cues":[{"start":8.0,"end":10.3,"text":"아침엔 손을 씻고, 일하면서"},{"start":10.3,"end":13.1,"text":"세정제를 쓰고, 저녁엔 설거지를"},{"start":13.1,"end":15.4,"text":"하죠. 한 번은 괜찮아도 물과"},{"start":15.4,"end":18.1,"text":"세정제가 반복되면 피부 장벽이"},{"start":18.1,"end":20.5,"text":"자극을 받을 수 있습니다."},{"start":20.5,"end":23.0,"text":"또 어떤 사람은 장갑 성분이나"},{"start":23.0,"end":25.8,"text":"제품 속 특정 물질에 알레르기가"},{"start":25.8,"end":29.0,"text":"생겨 손에 염증이 나타날 수 있어요."}]},{"start":29,"end":34,"text":"장갑을 썼다는 사실만으로 접촉이 사라진 건 아닙니다.","cues":[{"start":29.0,"end":31.4,"text":"장갑을 썼다는 사실만으로"},{"start":31.4,"end":34.0,"text":"접촉이 사라진 건 아닙니다."}]},{"start":34,"end":73,"text":"아침엔 괜찮다가 설거지와 손 씻기를 여러 번 한 뒤 손이 쓰라린 날이 있을 수 있어요. 반대로 새 장갑을 바꾼 뒤부터 손등이 가려웠을 수도 있고요. 둘 다 갈라져 보이지만 손이 만난 조건과 시간은 다릅니다. 안이 젖었는지, 어떤 재질인지, 벗었을 때 어느 부위가 더 가려운지 살펴보세요. 쉬는 날 피부가 나아진다면 평일 접촉을 찾는 데 도움이 되지만, 그 정보만으로 원인이 확정되진 않아요. 염증을 다루면서 반복되는 접촉도 점검할 수 있습니다.","cues":[{"start":34.0,"end":36.4,"text":"아침엔 괜찮다가 설거지와"},{"start":36.4,"end":38.7,"text":"손 씻기를 여러 번 한 뒤 손이"},{"start":38.7,"end":41.4,"text":"쓰라린 날이 있을 수 있어요."},{"start":41.4,"end":43.9,"text":"반대로 새 장갑을 바꾼 뒤부터"},{"start":43.9,"end":46.8,"text":"손등이 가려웠을 수도 있고요."},{"start":46.8,"end":49.1,"text":"둘 다 갈라져 보이지만 손이"},{"start":49.1,"end":52.0,"text":"만난 조건과 시간은 다릅니다."},{"start":52.0,"end":54.6,"text":"안이 젖었는지, 어떤 재질인지,"},{"start":54.6,"end":56.7,"text":"벗었을 때 어느 부위가 더"},{"start":56.7,"end":58.9,"text":"가려운지 살펴보세요."},{"start":58.9,"end":61.3,"text":"쉬는 날 피부가 나아진다면"},{"start":61.3,"end":64.3,"text":"평일 접촉을 찾는 데 도움이 되지만,"},{"start":64.3,"end":68.0,"text":"그 정보만으로 원인이 확정되진 않아요."},{"start":68.0,"end":70.3,"text":"염증을 다루면서 반복되는"},{"start":70.3,"end":73.0,"text":"접촉도 점검할 수 있습니다."}]},{"start":73,"end":80,"text":"크림통 옆에 오늘 손에 닿은 세 가지를 써 보세요. 가장 자주 닿은 것부터요.","cues":[{"start":73.0,"end":76.5,"text":"크림통 옆에 오늘 손에 닿은 세 가지를"
