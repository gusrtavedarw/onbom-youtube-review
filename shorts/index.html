:root {
  color-scheme: light;
  --bg:#eef3f0; --surface:#fff; --ink:#182c27; --muted:#4c635b;
  --line:#dce6df; --green:#1c5242; --deep:#122e26; --mint:#e2f0e8;
  --amber:#844819; --pale:#fff3e4; --round:18px;
  font-family:Pretendard, "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
* {box-sizing:border-box}
body {margin:0;background:var(--bg);color:var(--ink);line-height:1.5}
button,select,input,textarea {font:inherit;color:inherit}
button,select,summary {cursor:pointer}
button,select,input,textarea {border:1px solid var(--line);border-radius:9px;background:var(--surface)}
button,select {min-height:42px}
button {padding:8px 12px}
a {color:var(--green);text-underline-offset:3px}
:focus-visible {outline:3px solid #a06926;outline-offset:2px}
[hidden] {display:none!important}
.wrap {width:min(1352px,calc(100% - 64px));margin-inline:auto}
.hero {background:var(--deep);color:#f5fbf7;border-bottom:4px solid #80ad98}
.hero-inner {padding:30px 0 32px;display:flex;gap:24px;align-items:end;justify-content:space-between}
.brand {margin:0 0 4px;color:#a8cdbb;font-weight:700;font-size:.86rem;letter-spacing:.03em}
h1,h2,h3,p {margin:0}
h1 {font-size:clamp(2rem,4vw,3.15rem);line-height:1.12;letter-spacing:-.052em}
.hero p:last-child {margin-top:12px;color:#d5e7de;font-size:.96rem}
.progress {min-width:176px;display:grid;gap:8px;font-size:.9rem;color:#dcece3}
.progress strong {color:white;font-size:1.15rem}
progress {width:100%;height:7px;accent-color:#92c3aa}
.workspace {display:grid;grid-template-columns:minmax(268px,315px) minmax(0,1fr);align-items:start;gap:22px;padding-block:25px 40px}
.library,.reader {background:var(--surface);border:1px solid var(--line);border-radius:var(--round);min-width:0}
.library {position:sticky;top:16px}
.library > summary {list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 17px;font-weight:700;min-height:49px}
.library > summary::-webkit-details-marker {display:none}
.library > summary::after {content:"＋";color:var(--green)}
.library[open] > summary::after {content:"−"}
.library-controls {padding:0 14px 13px;border-bottom:1px solid var(--line)}
.filters {display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters label {min-width:0;display:grid;gap:5px;font-size:.79rem;color:var(--muted);font-weight:700}
.filters label:first-child {grid-column:1 / -1}
.filters input,.filters select {width:100%;min-width:0;min-height:42px;padding:7px 9px;font-size:.91rem;font-weight:400;color:var(--ink)}
.filter-foot {display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:.8rem}
.text-button {min-height:36px;border-color:transparent;background:transparent;color:var(--green);font-weight:700}
#list {max-height:clamp(240px,calc(100dvh - 260px),760px);overflow:auto;padding:6px;scrollbar-color:#b4c8bb transparent}
.entry {width:100%;text-align:left;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start;padding:10px 8px;border:1px solid transparent;background:white}
.entry:hover {background:#f3f8f5}
.entry[aria-current=true] {background:var(--mint);border-color:#b5d4c4}
.entry-num {font-variant-numeric:tabular-nums;color:var(--green);font-weight:700;font-size:.8rem;padding-top:2px}
.entry-title {display:block;font-size:.92rem;font-weight:700;word-break:keep-all;overflow-wrap:anywhere;line-height:1.36}
.entry-hook {display:block;margin-top:5px;color:var(--muted);font-size:.8rem;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.entry-state {display:inline-block;margin-top:4px;font-size:.72rem;color:var(--green);font-weight:700}
.reader {overflow:hidden}
.reader-header {padding:25px clamp(19px,3.5vw,40px) 20px;border-bottom:1px solid var(--line)}
.episode-meta {display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem;font-weight:700}
.episode-meta .num {border-radius:7px;background:var(--mint);color:var(--green);padding:3px 7px;font-variant-numeric:tabular-nums}
.episode-meta time {margin-inline-start:auto;color:var(--green);font-variant-numeric:tabular-nums}
h2 {font-size:clamp(1.55rem,2.8vw,2.45rem);line-height:1.2;letter-spacing:-.043em;margin-block:12px 17px;word-break:keep-all;overflow-wrap:anywhere}
.actions {display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions button,.actions select {font-size:.9rem;padding-inline:11px;font-weight:700}
.actions .primary,.primary:hover {background:var(--green);border-color:var(--green);color:white}
.actions button:hover,.move button:hover {border-color:var(--green)}
.actions button[aria-pressed=true] {background:var(--mint);border-color:#a3c8b5;color:var(--green)}
.actions label {margin-inline-start:auto;font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:7px}
.move {display:flex;justify-content:space-between;gap:8px}
.move button:disabled {opacity:.45;cursor:default}
.content {padding:0 clamp(19px,3.5vw,40px) 24px}
.hook {margin-top:19px;border:1px solid #b5d4c4;background:var(--mint);border-radius:14px;padding:17px 19px}
.hook p {font-size:clamp(1.33rem,3vw,1.75rem);letter-spacing:-.025em;font-weight:700;line-height:1.4}
.track {color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.beat {padding:15px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:110px minmax(0,1fr);gap:13px}
.beat h3,.hook h3 {font-size:.85rem;line-height:1.36;margin-bottom:4px}
.beat h3 .track,.hook h3 .track {display:block;font-size:.77rem;margin-top:5px;color:var(--muted);font-weight:400}
.beat p {font-size:1.04rem;line-height:1.67;word-break:keep-all;overflow-wrap:anywhere}
.pivot {background:var(--pale);border:0;border-radius:10px;padding:11px 13px;margin-block:7px 0}
.pivot h3,.pivot .track {color:var(--amber)!important}
.pivot p,.ending p {font-weight:700}
.ending {border-bottom:0}
.switch-panel {margin-top:15px}
.cuts-head {color:var(--muted);font-size:.84rem;margin-bottom:10px}
.cuts {display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.cue {border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
.cue time {font-size:.76rem;color:var(--green);font-variant-numeric:tabular-nums}
.cue p {font-size:.96rem;word-break:keep-all;overflow-wrap:anywhere}
.review {border-top:1px solid var(--line);padding-top:15px;margin-top:10px;display:grid;gap:13px}
.review label {font-size:.91rem;font-weight:700}
.review textarea {width:100%;min-height:83px;resize:vertical;padding:10px;display:block;margin-top:5px;font-size:.95rem}
.hint {margin-top:5px;color:var(--muted);font-size:.8rem}
.sources {border:1px solid var(--line);border-radius:10px}
.sources summary {font-weight:700;padding:11px 13px;font-size:.91rem}
.source-body {padding:0 13px 13px;font-size:.88rem;overflow-wrap:anywhere}
.source-body ul {padding-inline-start:19px;margin-block:8px 0}
.source-body li+li {margin-top:5px}
.empty {padding:30px 20px;color:var(--muted);text-align:center}
.footnote {padding:0 0 26px;color:var(--muted);font-size:.82rem}
#notice {position:fixed;z-index:2;bottom:16px;left:50%;transform:translateX(-50%);background:var(--deep);color:white;padding:10px 16px;border-radius:9px;max-width:calc(100% - 32px);font-size:.9rem}
#copy-fallback {width:min(520px,calc(100% - 32px));padding:20px;border:1px solid var(--line);border-radius:14px;color:var(--ink);background:var(--surface)}
#copy-fallback::backdrop {background:#122e2680}
#copy-fallback textarea {width:100%;padding:10px;margin-block:12px;resize:vertical}
#copy-fallback h2 {font-size:1.2rem}
#copy-fallback form {display:flex;justify-content:end}
noscript {display:block;padding:20px}
@media(max-width:760px) {
  .wrap {width:calc(100% - 28px)}
  .hero-inner {display:block;padding-block:20px}
  .hero p:last-child {margin-top:8px}
  .progress {margin-top:12px;width:145px;gap:2px;font-size:.8rem}
  .progress strong {font-size:1rem}
  .workspace {grid-template-columns:minmax(0,1fr);gap:12px;padding-block:13px 24px}
  .library {position:static}
  #list {max-height:310px}
  .reader-header {padding-block:18px 14px}
  .actions label {margin-inline-start:0}
  .beat {grid-template-columns:1fr;gap:3px;padding-block:11px}
  .beat h3,.hook h3 {display:flex;align-items:center;gap:8px}
  .beat h3 .track,.hook h3 .track {margin-top:0}
  .hook {margin-top:14px;padding:13px}
  .pivot {padding-inline:10px}
}
@media print {
  .hero-inner {padding:0;color:#000}
  .hero {background:white;border:0}
  .brand,.hero p:last-child {color:#333}
  .progress,.library,.actions,.review,.footnote,.move,#notice {display:none!important}
  .workspace {display:block;padding-top:12px;width:100%}
  .reader {border:0}
  .beat,.hook {break-inside:avoid}
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap hero-inner">
    <div>
      <p class="brand">온봄의원 유튜브</p>
      <h1>쇼츠 대본 검토</h1>
      <p>기존 대본 100편에서 뽑은 주제 100개 · 편당 60~90초</p>
    </div>
    <div class="progress">
      <span id="progress-label">검토 완료 <strong id="done">0</strong> / 100</span>

    </div>
  </div>
</header>
<main class="wrap workspace">
  <details id="library" class="library" open>
    <summary><span>주제 목록</span></summary>

      <div class="filters">
        <label>검색 <input id="search" type="search" placeholder="주제 번호, 제목, 대본 문장" autocomplete="off"></label>
        <label>분야 <select id="category"><option value="">모든 분야</option></select></label>
        <label>상태 <select id="status-filter"><option value="">모든 상태</option><option value="todo">미검토</option><option value="revise">수정 필요</option><option value="done">검토 완료</option></select></label>

</main>
<footer class="wrap footnote">2026.11.20 · 온봄 의료 설명 통합본의 주제 번호를 사용했습니다. 타임코드는 녹음 전 가안입니다.</footer>
<div id="notice" role="status" hidden></div>
<dialog id="copy-fallback" aria-labelledby="copy-fallback-title">
  <h2 id="copy-fallback-title">대본 전체 복사</h2>

  <textarea id="copy-text" rows="9" readonly aria-label="이 편의 낭독문 전체" aria-describedby="copy-fallback-hint"></textarea>
  <form method="dialog"><button type="submit">닫기</button></form>
</dialog>

<script type="application/json" id="episodes">[{"id":1,"title":"운동 다음 날, 계단보다 책 읽기가 힘들다면","category":"피로","original":"운동 다음 날, 일상이 무너질 만큼 피곤하다면","length":85,"parts":[{"start":0,"end":2,"text":"운동 다음 날, 머리가 멍해요?","cues":[{"start":0.0,"end":2.0,"text":"운동 다음 날, 머리가 멍해요?"}]},{"start":2,"end":8,"text":"허벅지만 뻐근한 날인지, 평소 하던 일까지 버거운 날인지 살펴보세요.","cues":[{"start":2.0,"end":4.9,"text":"허벅지만 뻐근한 날인지, 평소 하던"},{"start":4.9,"end":8.0,"text":"일까지 버거운 날인지 살펴보세요."}]},{"start":8,"end":49,"text":"오랜만에 산을 내려오면 다음 날 허벅지가 아플 수 있어요. 많이 쓴 부위에 시간이 지나 통증이 오는 거죠. 책을 읽거나 식사를 차리는 일은 대체로 해낼 수 있습니다. 그런데 짧은 외출 뒤엔 전혀 다른 일이 생길 수 있어요. 아픈 부위 하나를 짚기가 어렵고 머리까지 멍해집니다. 가령 두 사람 다 계단에서 힘들었다고 해볼게요. 한 사람은 허벅지만 당겼어요. 다른 사람은 통화하다 말을 잇기 어려워 그날 약속까지 미뤘죠. 진료에서도 다음 날 어떤 일을 못 했는지 물어봐요.","cues":[{"start":8.0,"end":10.1,"text":"오랜만에 산을 내려오면"},{"start":10.1,"end":13.2,"text":"다음 날 허벅지가 아플 수 있어요."},{"start":13.2,"end":16.2,"text":"많이 쓴 부위에 시간이 지나 통증이"},{"start":16.2,"end":18.8,"text":"오는 거죠. 책을 읽거나 식사를"},{"start":18.8,"end":22.3,"text":"차리는 일은 대체로 해낼 수 있습니다."},{"start":22.3,"end":24.7,"text":"그런데 짧은 외출 뒤엔 전혀"},{"start":24.7,"end":27.1,"text":"다른 일이 생길 수 있어요."},{"start":27.1,"end":29.9,"text":"아픈 부위 하나를 짚기가 어렵고"},{"start":29.9,"end":33.1,"text":"머리까지 멍해집니다. 가령 두 사람 다"},{"start":33.1,"end":36.2,"text":"계단에서 힘들었다고 해볼게요."},{"start":36.2,"end":39.1,"text":"한 사람은 허벅지만 당겼어요."},{"start":39.1,"end":41.4,"text":"다른 사람은 통화하다 말을"},{"start":41.4,"end":43.8,"text":"잇기 어려워 그날 약속까지"},{"start":43.8,"end":46.1,"text":"미뤘죠. 진료에서도 다음 날"},{"start":46.1,"end":49.0,"text":"어떤 일을 못 했는지 물어봐요."}]},{"start":49,"end":53,"text":"차이는 ‘다음 날’이라는 날짜에만 있지 않아요.","cues":[{"start":49.0,"end":50.9,"text":"차이는 ‘다음 날’이라는"},{"start":50.9,"end":53.0,"text":"날짜에만 있지 않아요."}]},{"start":53,"end":78,"text":"어떤 일을 한 뒤 평소 하던 것 중 뭐가 어려워졌는지 보세요. 외출할 때는 버틸 만했어도 뒤늦게 잠이나 집중력이 흔들릴 수 있어요. 원래대로 돌아오는 데 며칠 걸렸는지도 중요해요. 같은 일이 반복되면 운동량을 늘리기 전에 진료에서 무슨 활동을 했고 증상이 어떻게 달라졌는지 말해 주세요.","cues":[{"start":53.0,"end":55.5,"text":"어떤 일을 한 뒤 평소 하던 것 중"},{"start":55.5,"end":58.1,"text":"뭐가 어려 rt":0.0,"end":2.0,"text":"커피가 잠을 대신하진 못해요."}]},{"start":2,"end":6,"text":"커피 한 잔에 일이 손에 잡히면 몸도 쉰 걸까요?","cues":[{"start":2.0,"end":3.9,"text":"커피 한 잔에 일이 손에"},{"start":3.9,"end":6.0,"text":"잡히면 몸도 쉰 걸까요?"}]},{"start":6,"end":32,"text":"깨어 있는 시간이 길어지면 뇌에 잠을 재촉하는 신호가 쌓입니다. 그중 하나가 아데노신이에요. 카페인은 이 신호를 받는 자리에 끼어들어 졸음이 덜 느껴지게 할 수 있습니다. 그래서 오전에 커피를 한 잔 마시고 메일을 읽으니 좀 더 정신이 들 수 있어요. 그사이 밀린 잠을 실제로 잔 건 아니죠.","cues":[{"start":6.0,"end":8.8,"text":"깨어 있는 시간이 길어지면 뇌에"},{"start":8.8,"end":12.0,"text":"잠을 재촉하는 신호가 쌓입니다."},{"start":12.0,"end":14.9,"text":"그중 하나가 아데노신이에요."},{"start":14.9,"end":17.7,"text":"카페인은 이 신호를 받는 자리에"},{"start":17.7,"end":20.3,"text":"끼어들어 졸음이 덜 느껴지게"},{"start":20.3,"end":22.9,"text":"할 수 있습니다. 그래서 오전에"},{"start":22.9,"end":25.3,"text":"커피를 한 잔 마시고 메일을"},{"start":25.3,"end":28.4,"text":"읽으니 좀 더 정신이 들 수 있어요."},{"start":28.4,"end":32.0,"text":"그사이 밀린 잠을 실제로 잔 건 아니죠."}]},{"start":32,"end":37,"text":"오후에 마신 커피는 밤잠에도 영향을 줄 수 있어요.","cues":[{"start":32.0,"end":33.9,"text":"오후에 마신 커피는"},{"start":33.9,"end":37.0,"text":"밤잠에도 영향을 줄 수 있어요."}]},{"start":37,"end":77,"text":"마지막 잔을 매일 같은 시간에 마셨다면 내 몸이 어떻게 반응하는지 비교할 날이 없을 수 있어요. 커피를 마시고 얼마나 잠이 깼는지, 밤에 누웠을 때 잠은 잘 왔는지, 다음 아침엔 어땠는지 보세요. 밤에 잘 잠든 것 같아도 사람에 따라 자는 시간이나 잠의 질이 달라질 수 있어요. 다음 날 또 졸리면 커피부터 찾게 되죠. 패턴이 궁금하다면 마지막 잔 시각과 그날 밤에 잔 시간, 다음 날 오전 컨디션을 함께 보세요. 여러 날 놓고 보면 한 잔 전후보다 흐름이 잘 보입니다.","cues":[{"start":37.0,"end":39.6,"text":"마지막 잔을 매일 같은 시간에"},{"start":39.6,"end":42.8,"text":"마셨다면 내 몸이 어떻게 반응하는지"},{"start":42.8,"end":45.5,"text":"비교할 날이 없을 수 있어요."},{"start":45.5,"end":48.5,"text":"커피를 마시고 얼마나 잠이 깼는지,"},{"start":48.5,"end":51.1,"text":"밤에 누웠을 때 잠은 잘 왔는지,"},{"start":51.1,"end":53.9,"text":"다음 아침엔 어땠는지 보세요."},{"start":53.9,"end":56.5,"text":"밤에 잘 잠든 것 같아도 사람에"},{"start":56.5,"end":59.1,"text":"따라 자는 시간이나 잠의 질이"},{"start":59.1,"end":61.5,"text":"달라질 수 있어요. 다음 날 또"},{"start":61.5,"end":64.1,"text":"졸리면 커피부터 찾게 되죠."},{"start":64.1,"end":66.5,"text":"패턴이 궁금하다면 마지막"},{"start":66.5,"end":68.9,"text":"잔 시각과 그날 밤에 잔 시간,"},{"start":68.9,"end":72.2,"text":"다음 날 오전 컨디션을 함께 보세요."},{"start":72.2,"end":74.1,"text":"여러 날 놓고 보면 한 잔"},{"start":74.1,"end":77.0,"text":"전후보다 흐름이 잘 보입니다."}]},{"start":77,"end":83,"text":"커피를 마신 뒤 잠이 깬 것 같았다면 그날 밤에 푹 잤는지도 보세요.","cues":[{"start":77.0,"end":80.1,"text":"커피를 마신 뒤 잠이 깬 것 같았다면"},{"start":80.1,"end":83.0,"text":"그날 밤에 푹 잤는지도 보세요."}]}],"sources":[{"title":"Spilling the Beans: How Much Caffeine is Too Much?","url":"https://www.fda.gov/consumers/consumer-updates/spilling-beans-how-much-caffeine-too-much"},{"title":"Caffeine effects on sleep taken 0, 3, or 6 hours before going to bed","url":"https://pubmed.ncbi.nlm.nih.gov/24235903/"},{"title":"Low, but not high, dose caffeine is a readily available probe for adenosine actions","url":"https://pubmed.ncbi.nlm.nih.gov/27915051/"},{"title":"Sleep Deprivation and Deficiency – What Makes You Sleep?","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/body-clock"}]},{"id":9,"title":"피로가 시작된 날과 새 약을 시작한 날을 맞춰보기","category":"피로","original":"약을 바꾼 뒤 피곤하다면? 졸림, 혈압, 함께 먹는 약을 살펴봅니다","length":83,"parts":[{"start":0,"end":2,"text":"새 약 먹고 자꾸 졸리나요?","cues":[{"start":0.0,"end":2.0,"text":"새 약 먹고 자꾸 졸리나요?"}]},{"start":2,"end":9,"text":"영양제부터 살피기 전에 새 약을 먹은 날과 피곤해지기 시작한 날을 맞춰 보세요.","cues":[{"start":2.0,"end":4.3,"text":"영양제부터 살피기 전에 새"},{"start":4.3,"end":6.6,"text":"약을 먹은 날과 피곤해지기"},{"start":6.6,"end":9.0,"text":"시작한 날을 맞춰 보세요."}]},{"start":9,"end":31,"text":"새 약을 먹기 시작했거나 용량을 바꾼 날이 있죠. 그다음부턴 오후에 눈을 뜨기 힘들 수도 있어요. 일부 약은 깨어 있게 하는 신호에 영향을 줍니다. 맥박이나 혈압에 영향을 주는 약도 있어요. 그러면 일어설 때 어지럽거나 움직일 때 힘들 수 있어요.","cues":[{"start":9.0,"end":11.9,"text":"새 약을 먹기 시작했거나 용량을"},{"start":11.9,"end":14.3,"text":"바꾼 날이 있죠. 그다음부턴"},{"start":14.3,"end":17.7,"text":"오후에 눈을 뜨기 힘들 수도 있어요."},{"start":17.7,"end":19.8,"text":"일부 약은 깨어 있게 하는"},{"start":19.8,"end":22.7,"text":"신호에 영향을 줍니다. 맥박이나"},{"start":22.7,"end":25.9,"text":"혈압에 영향을 주는 약도 있어요."},{"start":25.9,"end":28.5,"text":"그러면 일어설 때 어지럽거나"},{"start":28.5,"end":31.0,"text":"움직일 때 힘들 수 있어요."}]},{"start":31,"end":35,"text":"처방약 말고 먹기 시작한 약이 있는지도 보세요.","cues":[{"start":31.0,"end":33.0,"text":"처방약 말고 먹기 시작한"},{"start":33.0,"end":35.0,"text":"약이 있는지도 보세요."}]},{"start":35,"end":77,"text":"회의 전에만 졸리기 시작했는지, 아침 약을 먹고 비슷한 시간이 지나면 늘 눈이 감겼는지 떠올려 보세요. 토요일에도 그 시간에 졸았는지까지 알면 생활 일정과 약의 시간표를 비교할 수 있어요. 새로 챙겨 먹는 감기약이나 알레르기약도 보세요. 술이나 다른 약이 겹치면 졸림이 더해질 수 있거든요. 날짜가 비슷하면 약과 관련 있는지 살펴볼 만해요. 약을 먹게 된 이유와 다른 몸 상태도 봐야 알 수 있고요. 처방약을 혼자 빼기보다 처방한 곳이나 약사에게 복용 목록을 보여 주세요.","cues":[{"start":35.0,"end":37.8,"text":"회의 전에만 졸리기 시작했는지,"},{"start":37.8,"end":41.0,"text":"아침 약을 먹고 비슷한 시간이 지나면"},{"start":41.0,"end":44.1,"text":"늘 눈이 감겼는지 떠올려 보세요."},{"start":44.1,"end":47.4,"text":"토요일에도 그 시간에 졸았는지까지"},{"start":47.4,"end":50.2,"text":"알면 생활 일정과 약의 시간표를"},{"start":50.2,"end":53.0,"text":"비교할 수 있어요. 새로 챙겨 먹는"},{"start":53.0,"end":56.3,"text":"감기약이나 알레르기약도 보세요."},{"start":56.3,"end":58.4,"text":"술이나 다른 약이 겹치면"},{"start":58.4,"end":61.1,"text":"졸림이 더해질 수 있거든요."},{"start":61.1,"end":64.1,"text":"날짜가 비슷하면 약과 관련 있는지"},{"start":64.1,"end":67.1,"text":"살펴볼 만해요. 약을 먹게 된 이유와"},{"start":67.1,"end":70.2,"text":"다른 몸 상태도 봐야 알 수 있고요."},{"start":70.2,"end":72.4,"text":"처방약을 혼자 빼기보다"},{"start":72.4,"end":74.5,"text":"처방한 곳이나 약사에게"},{"start":74.5,"end":77.0,"text":"복용 목록을 보여 주세요."}]},{"start":77,"end":83,"text":"약을 언제 바꿨는지, 하루 중 몇 시쯤 힘들어지는지 메모해 두세요.","cues":[{"start":77.0,"end":79.6,"text":"약을 언제 바꿨는지, 하루 중 몇"},{"start":79.6,"end":83.0,"text":"시쯤 힘들어지는지 메모해 두세요."}]}],"sources":[{"title":"Some Medicines and Driving Don’t Mix","url":"https://www.fda.gov/consumers/consumer-updates/some-medicines-and-driving-dont-mix"},{"title":"Beta blockers","url":"https://www.nhs.uk/medicines/beta-blockers/"},{"title":"Drug Interactions: What You Should Know","url":"https://www.fda.gov/drugs/resources-drugs/drug-interactions-what-you-should-know"}]},{"id":10,"title":"검사 결과는 정상인데도 계속 피곤하다면","category":"피로","original":"피로 검사 결과가 정상이라는데 왜 계속 힘들까? 검사에서 알 수 있는 것","length":84,"parts":[{"start":0,"end":2,"text":"검사 정상인데 피곤해요?","cues":[{"start":0.0,"end":2.0,"text":"검사 정상인데 피곤해요?"}]},{"start":2,"end":9,"text":"다른 검사를 알아보기 전에 예전엔 하던 일 중 요즘 못 하게 된 걸 떠올려 보세요.","cues":[{"start":2.0,"end":4.4,"text":"다른 검사를 알아보기 전에"},{"start":4.4,"end":6.5,"text":"예전엔 하던 일 중 요즘 못"},{"start":6.5,"end":9.0,"text":"하게 된 걸 떠올려 보세요."}]},{"start":9,"end":32,"text":"혈액검사에서 빈혈이나 갑상선 이상을 살피는 건 도움이 됩니다. 결과가 정상이면 그 검사에서 찾으려던 문제가 있을 가능성은 낮아지죠. 그런데 밤중에 몇 번을 깨는지, 감기약을 먹고 얼마나 졸린지, 출근길을 얼마나 버티는지는 검사지에 그대로 찍히지 않아요.","cues":[{"start":9.0,"end":11.8,"text":"혈액검사에서 빈혈이나 갑상선"},{"start":11.8,"end":14.8,"text":"이상을 살피는 건 도움이 됩니다."},{"start":14.8,"end":18.2,"text":"결과가 정상이면 그 검사에서 찾으려던"},{"start":18.2,"end":21.3,"text":"문제가 있을 가능성은 낮아지죠."},{"start":21.3,"end":23.8,"text":"그런데 밤중에 몇 번을 깨는지,"},{"start":23.8,"end":26.4,"text":"감기약을 먹고 얼마나 졸린지,"},{"start":26.4,"end":28.9,"text":"출근길을 얼마나 버티는지는"},{"start":28.9,"end":32.0,"text":"검사지에 그대로 찍히지 않아요."}]},{"start":32,"end":36,"text":"여기서 검사를 잔뜩 하면 단서가 더 많아질까요?","cues":[{"start":32.0,"end":34.0,"text":"여기서 검사를 잔뜩 하면"},{"start":34.0,"end":36.0,"text":"단서가 더 많아질까요?"}]},{"start":36,"end":77,"text":"예를 들면 ‘퇴근하면 눕는다’보다 ‘퇴근하고 아이와 걷던 십 분을 이제 못 걷는다’가 구체적이죠. 같은 피로라도 전에는 괜찮던 일이 어느 정도 어려워졌는지 알면, 진료에서 출발점이 생깁니다. 찾을 이유가 적은 항목을 많이 확인하면, 우연히 정상 범위를 벗어난 수치까지 따져 볼 일이 늘 수 있습니다. 어떤 일이 언제부터 어려워졌는지 알면 다음 질문을 더 정확히 좁힐 수 있어요. 평소 하던 일이 계속 힘들거나 새 증상이 생겼다면 정상으로 나온 결과지도 가지고 다시 진료받으세요.","cues":[{"start":36.0,"end":38.7,"text":"예를 들면 ‘퇴근하면 눕는다’보다"},{"start":38.7,"end":41.2,"text":"‘퇴근하고 아이와 걷던 십 분을"},{"start":41.2,"end":44.0,"text":"이제 못 걷는다’가 구체적이죠."},{"start":44.0,"end":46.5,"text":"같은 피로라도 전에는 괜찮던"},{"start":46.5,"end":49.5,"text":"일이 어느 정도 어려워졌는지 알면,"},{"start":49.5,"end":52.3,"text":"진료에서 출발점이 생깁니다."},{"start":52.3,"end":55.6,"text":"찾을 이유가 적은 항목을 많이 확인하면,"},{"start":55.6,"end":58.8,"text":"우연히 정상 범위를 벗어난 수치까지"},{"start":58.8,"end":61.4,"text":"따져 볼 일이 늘 수 있습니다."},{"start":61.4,"end":64.7,"text":"어떤 일이 언제부터 어려워졌는지 알면"},{"start":64.7,"end":68.1,"text":"다음 질문을 더 정확히 좁힐 수 있어요."},{"start":68.1,"end":70.9,"text":"평소 하던 일이 계속 힘들거나 새"},{"start":70.9,"end":73.6,"text":"증상이 생겼다면 정상으로 나온"},{"start":73.6,"end":77.0,"text":"결과지도 가지고 다시 진료받으세요."}]},{"start":77,"end":84,"text":"‘피곤합니다’ 뒤에 붙일 문장이에요. ‘지난달엔 하던 이 일을 지금은 못합니다.’","cues":[{"start":77.0,"end":80.3,"text":"‘피곤합니다’ 뒤에 붙일 문장이에요."},{"start":80.3,"end":84.0,"text":"‘지난달엔 하던 이 일을 지금은 못합니다.’"}]}],"sources":[{"title":"Tiredness and fatigue","url":"https://www.nhs.uk/symptoms/tiredness-and-fatigue/"},{"title":"Ordering blood tests for patients with unexplained fatigue in general practice: what does it yield? Results of the VAMPIRE trial","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2662125/"},{"title":"How to Understand Your Lab Results","url":"https://medlineplus.gov/lab-tests/how-to-understand-your-lab-results/"},{"title":"Fatigue in Adults: Evaluation and Management","url":"https://www.aafp.org/afp/2023/0700/fatigue-adults"}]},{"id":11,"title":"스마트워치에 ‘깊은 잠 20분’이라고 떴다면","category":"수면","original":"스마트워치는 내가 잠든 걸 어떻게 알까? 수면 점수가 놓치는 것","length":80,"parts":[{"start":0,"end":2,"text":"워치는 깊은 잠을 어떻게 알죠?","cues":[{"start":0.0,"end":2.0,"text":"워치는 깊은 잠을 어떻게 알죠?"}]},{"start":2,"end":7,"text":"손목에서 직접 잰 것과 앱이 계산한 것을 구분해 볼게요.","cues":[{"start":2.0,"end":4.4,"text":"손목에서 직접 잰 것과 앱이"},{"start":4.4,"end":7.0,"text":"계산한 것을 구분해 볼게요."}]},{"start":7,"end":44,"text":"스마트워치는 움직임이나 맥박을 재요. 그런 신호의 조합을 보고 잠든 때나 수면 단계를 추정해요. 침대에서 눈만 뜬 채 가만히 누워 있으면 자는 걸로 잡히기도 하죠. 수면검사에서는 뇌파를 보고 잠의 단계를 구분해요. 일반 스마트워치는 손목에서 뇌파를 직접 읽지 못해요. 앱이 한밤중에 깼다고 찍어도 실제로 뒤척인 것인지 알기 어렵습니다. 앱에 잘 잤다고 나와도 오전에 회의마다 졸면 그건 직접 겪은 증상이에요.","cues":[{"start":7.0,"end":10.0,"text":"스마트워치는 움직임이나 맥박을"},{"start":10.0,"end":12.6,"text":"재요. 그런 신호의 조합을 보고"},{"start":12.6,"end":15.7,"text":"잠든 때나 수면 단계를 추정해요."},{"start":15.7,"end":18.5,"text":"침대에서 눈만 뜬 채 가만히 누워"},{"start":18.5,"end":21.6,"text":"있으면 자는 걸로 잡히기도 하죠."},{"start":21.6,"end":24.2,"text":"수면검사에서는 뇌파를 보고"},{"start":24.2,"end":26.4,"text":"잠의 단계를 구분해요."},{"start":26.4,"end":29.0,"text":"일반 스마트워치는 손목에서"},{"start":29.0,"end":31.4,"text":"뇌파를 직접 읽지 못해요."},{"start":31.4,"end": alth/sleep/stages-of-sleep"}]},{"id":12,"title":"새벽에 깬 이유와 다시 못 잔 이유는 따로 있다","category":"수면","original":"새벽 세 시에 깨는 이유와 다시 잠들기 힘든 이유는 같을까?","length":80,"parts":[{"start":0,"end":2,"text":"새벽 세 시, 또 깼나요?","cues":[{"start":0.0,"end":2.0,"text":"새벽 세 시, 또 깼나요?"}]},{"start":2,"end":8,"text":"같은 시각에 깨도 다시 잠드는 걸 막는 건 다른 데 있을 수 있어요.","cues":[{"start":2.0,"end":4.7,"text":"같은 시각에 깨도 다시 잠드는"},{"start":4.7,"end":8.0,"text":"걸 막는 건 다른 데 있을 수 있어요."}]},{"start":8,"end":35,"text":"밤이 깊어지면 잠의 구성이 달라집니다. 화장실이 급하거나 통증, 코골이와 함께 잠이 끊기는 사람도 있어요. 어떤 밤에는 특별한 이유를 기억하지 못한 채 잠깐 눈이 떠지죠. 그런데 그 순간 시계를 봅니다. 세 시간 남았네, 내일 발표 망치겠네. 그때부터 몇 시간이나 더 잘 수 있을지 자꾸 계산하게 돼요.","cues":[{"start":8.0,"end":11.7,"text":"밤이 깊어지면 잠의 구성이 달라집니다."},{"start":11.7,"end":14.8,"text":"화장실이 급하거나 통증, 코골이와"},{"start":14.8,"end":17.9,"text":"함께 잠이 끊기는 사람도 있어요."},{"start":17.9,"end":20.2,"text":"어떤 밤에는 특별한 이유를"},{"start":20.2,"end":23.5,"text":"기억하지 못한 채 잠깐 눈이 떠지죠."},{"start":23.5,"end":26.4,"text":"그런데 그 순간 시계를 봅니다."},{"start":26.4,"end":29.7,"text":"세 시간 남았네, 내일 발표 망치겠네."},{"start":29.7,"end":32.3,"text":"그때부터 몇 시간이나 더 잘 수"},{"start":32.3,"end":35.0,"text":"있을지 자꾸 계산하게 돼요."}]},{"start":35,"end":40,"text":"처음 잠을 깨운 일과 그 뒤 잠이 안 온 이유가 다를 수 있어요.","cues":[{"start":35.0,"end":37.5,"text":"처음 잠을 깨운 일과 그 뒤 잠이"},{"start":37.5,"end":40.0,"text":"안 온 이유가 다를 수 있어요."}]},{"start":40,"end":73,"text":"가령 첫 번째 밤엔 화장실에서 돌아와 바로 잤고 다음 날엔 눈을 뜨자마자 시간을 계산하다 한참 깨어 있었어요. 두 날 다 세 시에 깼지만 다시 잠드는 데 걸린 시간은 달랐죠. 진료에서 ‘세 시에 깨요’라고 말할 때 두 장면을 나눠 보세요. 눈을 뜰 때 몸이 어땠는지, 그 뒤 침대에서 무슨 생각을 했고 뭘 했는지요. 반복되는 불면을 다루는 인지행동치료는 이렇게 잠을 밀어내는 반응도 살핍니다.","cues":[{"start":40.0,"end":42.5,"text":"가령 첫 번째 밤엔 화장실에서"},{"start":42.5,"end":44.8,"text":"돌아와 바로 잤고 다음 날엔"},{"start":44.8,"end":46.7,"text":"눈을 뜨자마자 시간을"},{"start":46.7,"end":49.6,"text":"계산하다 한참 깨어 있었어요."},{"start":49.6,"end":51.9,"text":"두 날 다 세 시에 깼지만 다시"},{"start":51.9,"end":54.7,"text":"잠드는 데 걸린 시간은 달랐죠."},{"start":54.7,"end":57.0,"text":"진료에서 ‘세 시에 깨요’라고"},{"start":57.0,"end":59.9,"text":"말할 때 두 장면을 나눠 보세요."},{"start":59.9,"end":62.0,"text":"눈을 뜰 때 몸이 어땠는지,"},{"start":62.0,"end":64.7,"text":"그 뒤 침대에서 무슨 생각을 했고"},{"start":64.7,"end":67.2,"text":"뭘 했는지요. 반복되는 불면을"},{"start":67.2,"end":70.0,"text":"다루는 인지행동치료는 이렇게"},{"start":70.0,"end":73.0,"text":"잠을 밀어내는 반응도 살핍니다."}]},{"start":73,"end":80,"text":"새벽 세 시에 깼다면 뭘 느껴 눈을 떴는지, 그 뒤 왜 다시 못 잤는지 따로 떠올려 보세요.","cues":[{"start":73.0,"end":75.2,"text":"새벽 세 시에 깼다면 뭘 느껴"},{"start":75.2,"end":77.5,"text":"눈을 떴는지, 그 뒤 왜 다시 못"},{"start":77.5,"end":80.0,"text":"잤는지 따로 떠올려 보세요."}]}],"sources":[{"title":"Insomnia – Symptoms","url":"https://www.nhlbi.nih.gov/health/insomnia/symptoms"},{"title":"Sleep Problems and Menopause: What Can I Do?","url":"https://www.nia.nih.gov/health/menopause/sleep-problems-and-menopause-what-can-i-do"},{"title":"Insomnia – Diagnosis","url":"https://www.nhlbi.nih.gov/health/insomnia/diagnosis"},{"title":"How Sleep Works – Sleep Phases and Stages","url":"https://www.nhlbi.nih.gov/health/sleep/stages-of-sleep"},{"title":"Behavioral and psychological treatments for chronic insomnia disorder in adults: an AASM clinical practice guideline","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7853203/"}]},{"id":13,"title":"일요일에 늦잠 자면 왜 밤에 잠이 안 올까?","category":"수면","original":"주말에 늦잠을 잤더니 일요일 밤에 잠이 안 오는 이유","length":87,"parts":[{"start":0,"end":2,"text":"일요일 밤만 잠이 안 와요?","cues":[{"start":0.0,"end":2.0,"text":"일요일 밤만 잠이 안 와요?"}]},{"start":2,"end":7,"text":"밤 열한 시보다 점심때 일어난 아침을 먼저 떠올려 보세요.","cues":[{"start":2.0,"end":4.5,"text":"밤 열한 시보다 점심때 일어난"},{"start":4.5,"end":7.0,"text":"아침을 먼저 떠올려 보세요."}]},{"start":7,"end":38,"text":"잠은 두 가지에 영향을 받아요. 하나는 오래 깨어 있을수록 잠이 쏟기는 정도예요. 잠의 압력이라고 해요. 낮까지 자고 일어나면 같은 밤 열한 시에도 깨어 있던 시간이 짧죠. 또 하나는 몸의 시계, 생체시계예요. 빛을 보는 시간이 달라지면 이 시계가 받는 신호도 바뀔 수 있어요. 주말에 늦게 자고 늦게 일어나면 두 힘이 평일 밤과 다르게 움직입니다.","cues":[{"start":7.0,"end":9.9,"text":"잠은 두 가지에 영향을 받아요."},{"start":9.9,"end":12.2,"text":"하나는 오래 깨어 있을수록"},{"start":12.2,"end":14.5,"text":"잠이 쏟기는 정도예요."},{"start":14.5,"end":16.7,"text":"잠의 압력이라고 해요."},{"start":16.7,"end":19.2,"text":"낮까지 자고 일어나면 같은 밤"},{"start":19.2,"end":22.5,"text":"열한 시에도 깨어 있던 시간이 짧죠."},{"start":22.5,"end":25.8,"text":"또 하나는 몸의 시계, 생체시계예요."},{"start":25.8,"end":28.2,"text":"빛을 보는 시간이 달라지면"},{"start":28.2,"end":31.7,"text":"이 시계가 받는 신호도 바뀔 수 있어요."},{"start":31.7,"end":34.5,"text":"주말에 늦게 자고 늦게 일어나면"},{"start":34.5,"end":38.0,"text":"두 힘이 평일 밤과 다르게 움직입니다."}]},{"start":38,"end":43,"text":"그래서 피곤하다고 무조건 일찍 잠이 드는 건 아니죠.","cues":[{"start":38.0,"end":40.5,"text":"그래서 피곤하다고 무조건"},{"start":40.5,"end":43.0,"text":"일찍 잠이 드는 건 아니죠."}]},{"start":43,"end":82,"text":"예를 들어 토요일엔 두 시까지 깨어 있었고 일요일에는 점심에 처음으로 밖에 나갔어요. 그러고는 일요일 밤에만 평소보다 일찍 누워요. 일찍 누웠어도 몸은 아직 잠들 시간으로 받아들이지 않을 수 있어요. 평일에 못 잔 잠을 보충하는 건 의미가 있어요. 일요일마다 밤잠이 밀린다면 평일에 잠을 얼마나 자는지 보고 주말에는 평소보다 얼마나 늦게 일어났는지 살펴보세요. 일요일 밤에 눕는 시각만 앞당기면 몸은 아직 잠들 준비가 안 됐을 수 있거든요.","cues":[{"start":43.0,"end":45.5,"text":"예를 들어 토요일엔 두 시까지"},{"start":45.5,"end":48.3,"text":"깨어 있었고 일요일에는 점심에"},{"start":48.3,"end":50.7,"text":"처음으로 밖에 나갔어요."},{"start":50.7,"end":53.7,"text":"그러고는 일요일 밤에만 평소보다"},{"start":53.7,"end":56.5,"text":"일찍 누워요. 일찍 누웠어도 몸은"},{"start":56.5,"end":59.2,"text":"아직 잠들 시간으로 받아들이지"},{"start":59.2,"end":62.0,"text":"않을 수 있어요. 평일에 못 잔 잠을"},{"start":62.0,"end":64.6,"text":"보충하는 건 의미가 있어요."},{"start":64.6,"end":67.2,"text":"일요일마다 밤잠이 밀린다면"},{"start":67.2,"end":69.9,"text":"평일에 잠을 얼마나 자는지 보고"},{"start":69.9,"end":72.3,"text":"주말에는 평소보다 얼마나"},{"start":72.3,"end":75.1,"text":"늦게 일어났는지 살펴보세요."},{"start":75.1,"end":77.2,"text":"일요일 밤에 눕는 시각만"},{"start":77.2,"end":79.4,"text":"앞당기면 몸은 아직 잠들"},{"start":79.4,"end":82.0,"text":"준비가 안 됐을 수 있거든요."}]},{"start":82,"end":87,"text":"일요일 밤잠을 보고 싶으면, 일요일 아침 알람부터 보세요.","cues":[{"start":82.0,"end":84.3,"text":"일요일 밤잠을 보고 싶으면,"},{"start":84.3,"end":87.0,"text":"일요일 아침 알람부터 보세요."}]}],"sources":[{"title":"Circadian Rhythm Disorders – What Are Circadian Rhythm Disorders?","url":"https://www.nhlbi.nih.gov/health/circadian-rhythm-disorders"},{"title":"Sleep Deprivation and Deficiency – Healthy Sleep Habits","url  날엔 늦게 누워서"},{"start":38.7,"end":40.8,"text":"한 번도 안 깨고 잘 잔다면,"},{"start":40.8,"end":44.0,"text":"잠을 앞당기는 게 질문일 수 있어요."},{"start":44.0,"end":47.4,"text":"자정 전에 잠들지만 밤새 여러 번 깬다면"},{"start":47.4,"end":50.4,"text":"잠의 시간표부터 살펴야 합니다."},{"start":50.4,"end":53.8,"text":"둘 다 그냥 잠이 안 온다고 부르기 쉽죠."},{"start":53.8,"end":56.3,"text":"빨리 방출되는 제형과 천천히"},{"start":56.3,"end":58.8,"text":"방출되는 제형은 몸에 성분이"},{"start":58.8,"end":61.2,"text":"들어오는 속도가 달라요."},{"start":61.2,"end":63.9,"text":"제품이나 먹는 시간을 바꿨다면"},{"start":63.9,"end":67.0,"text":"잠이 더 늦게 들었는지, 밤중에 깼는지,"},{"start":67.0,"end":69.4,"text":"다음 날 졸렸는지 보세요."},{"start":69.4,"end":71.9,"text":"다른 약과 함께 쓰거나 불면이"},{"start":71.9,"end":74.0,"text":"이어진다면 복용 계획을"},{"start":74.0,"end":77.0,"text":"의료진과 확인하는 게 좋습니다."}]},{"start":77,"end":85,"text":"복용을 상담할 땐 잠드는 시각이 문제인지, 밤중에 자꾸 깨는 게 문제인지 먼저 말해 주세요.","cues":[{"start":77.0,"end":79.8,"text":"복용을 상담할 땐 잠드는 시각이"},{"start":79.8,"end":82.3,"text":"문제인지, 밤중에 자꾸 깨는 게"},{"start":82.3,"end":85.0,"text":"문제인지 먼저 말해 주세요."}]}],"sources":[{"title":"Melatonin: What You Need To Know","url":"https://www.nccih.nih.gov/health/melatonin-what-you-need-to-know"},{"title":"The European Insomnia Guideline: An update on the diagnosis and treatment of insomnia 2023","url":"https://pubmed.ncbi.nlm.nih.gov/38016484/"},{"title":"Jet Lag Disorder","url":"https://www.cdc.gov/yellow-book/hcp/travel-air-sea/jet-lag-disorder.html"}]},{"id":17,"title":"늦게 자도 푹 자는 사람에게 필요한 질문","category":"수면","original":"밤에 또렷하고 아침에 일어나기 힘들다면, 밤형 성향과 수면장애는 어떻게 구분할까?","length":84,"parts":[{"start":0,"end":2,"text":"밤형인가요, 불면인가요?","cues":[{"start":0.0,"end":2.0,"text":"밤형인가요, 불면인가요?"}]},{"start":2,"end":7,"text":"알람 없이 잔 날에는 잠이 잘 들고 푹 잤는지 보세요.","cues":[{"start":2.0,"end":4.3,"text":"알람 없이 잔 날에는 잠이"},{"start":4.3,"end":7.0,"text":"잘 들고 푹 잤는지 보세요."}]},{"start":7,"end":30,"text":"밤 열한 시에 누우면 한참 깨어 있습니다. 그런데 쉬는 날 새벽 두 시에 눕자 바로 잠들어요. 일어나는 시간도 늦출 수 있으면 충분히 자고 하루를 보내죠. 이럴 땐 잠 자체의 어려움뿐 아니라 몸이 잠들 준비를 하는 시각이 학교나 직장 일정과 어긋났는지 함께 봐요.","cues":[{"start":7. dian-rhythm-disorders/types"},{"title":"Circadian Rhythm Disorders – Treatment","url":"https://www.nhlbi.nih.gov/health/circadian-rhythm-disorders/treatment"},{"title":"Clinical Practice Guideline for the Treatment of Intrinsic Circadian Rhythm Sleep-Wake Disorders: An Update for 2015","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4582061/"}]},{"id":18,"title":"낮잠 뒤엔 왜 멍하고 밤엔 잠이 늦게 올까?","category":"수면","original":"낮잠 뒤엔 멍하고 밤엔 잠이 늦어진다. 두 가지는 왜 생길까?","length":83,"parts":[{"start":0,"end":2,"text":"낮잠 자고 나면 한동안 멍해요?","cues":[{"start":0.0,"end":2.0,"text":"낮잠 자고 나면 한동안 멍해요?"}]},{"start":2,"end":8,"text":"낮잠에서 깬 직후와 그날 밤에 각각 어떤 변화가 있는지 볼게요.","cues":[{"start":2.0,"end":4.7,"text":"낮잠에서 깬 직후와 그날 밤에"},{"start":4.7,"end":8.0,"text":"각각 어떤 변화가 있는지 볼게요."}]},{"start":8,"end":32,"text":"낮잠에서 깬 직후엔 눈을 떴어도 정신이 천천히 돌아올 수 있어요. 수면 관성이라고 합니다. 잠이 깊었던 순간에 깨면 더 멍하다고 느낄 수 있죠. 그런데 같은 날 밤엔 침대에 누워도 잠이 늦게 올 수 있습니다. 깨어 있을 때 쌓인 잠의 압력이 낮잠을 자면서 조금 줄었기 때문이에요.","cues":[{"start":8.0,"end":10.7,"text":"낮잠에서 깬 직후엔 눈을 떴어도"},{"start":10.7,"end":13.7,"text":"정신이 천천히 돌아올 수 있어요."},{"start":13.7,"end":16.1,"text":"수면 관성이라고 합니다."},{"start":16.1,"end":18.2,"text":"잠이 깊었던 순간에 깨면"},{"start":18.2,"end":20.6,"text":"더 멍하다고 느낄 수 있죠."},{"start":20.6,"end":22.9,"text":"그런데 같은 날 밤엔 침대에"},{"start":22.9,"end":25.9,"text":"누워도 잠이 늦게 올 수 있습니다."},{"start":25.9,"end":29.0,"text":"깨어 있을 때 쌓인 잠의 압력이 낮잠을"},{"start":29.0,"end":32.0,"text":"자면서 조금 줄었기 때문이에요."}]},{"start":32,"end":39,"text":"눈 뜨고 한동안 멍한 건지, 그날 밤 잠드는 시간이 밀리는 건지 구분해 보세요.","cues":[{"start":32.0,"end":34.2,"text":"눈 뜨고 한동안 멍한 건지,"},{"start":34.2,"end":36.2,"text":"그날 밤 잠드는 시간이"},{"start":36.2,"end":39.0,"text":"밀리는 건지 구분해 보세요."}]},{"start":39,"end":77,"text":"가령 점심을 먹고 잠깐 눕는 날과, 저녁에 소파에서 길게 잠드는 날을 비교해 보세요. 두 번 다 눈 뜬 직후엔 비슷하게 멍했어도 밤잠까지 남은 시간이 달라 그날 밤 잠드는 시각은 다를 수 있습니다. 잠깐 멍했다가 오후가 편했다면, 밤까지 잠이 밀린 날과 같은 결과가 아니에요. 낮잠을 의도한 건지, 회의나 운전 중 나도 모르게 졸았는지도 중요합니다. 원치 않는 졸림이 반복되면 밤 수면과 다른 원인을 확인하고 운전 중 졸리면 안전하게 멈추세요.","cues":[{"start":39.0,"end":41.8,"text":"가령 점심을 먹고 잠깐 눕는 날과,"},{"start":41.8,"end":44.3,"text":"저녁에 소파에서 길게 잠드는"},{"start":44.3,"end":46.7,"text":"날을 비교해 보세요. 두 번 다"},{"start":46.7,"end":49.4,"text":"눈 뜬 직후엔 비슷하게 멍했어도"},{"start":49.4,"end":52.2,"text":"밤잠까지 남은 시간이 달라 그날"},{"start":52.2,"end":55.5,"text":"밤 잠드는 시각은 다를 수 있습니다."},{"start":55.5,"end":58.3,"text":"잠깐 멍했다가 오후가 편했다면,"},{"start":58.3,"end":61.3,"text":"밤까지 잠이 밀린 날과 같은 결과가"},{"start":61.3,"end":63.8,"text":"아니에요. 낮잠을 의도한 건지,"},{"start":63.8,"end":66.2,"text":"회의나 운전 중 나도 모르게"},{"start":66.2,"end":68.6,"text":"졸았는지도 중요합니다."},{"start":68.6,"end":70.9,"text":"원치 않는 졸림이 반복되면"},{"start":70.9,"end":73.7,"text":"밤 수면과 다른 원인을 확인하고"},{"start":73.7,"end":77.0,"text":"운전 중 졸리면 안전하게 멈추세요."}]},{"start":77,"end":83,"text":"낮잠 뒤 멍한 게 언제 풀렸는지, 그날 밤 몇 시에 잠들었는지 적어 보세요.","cues":[{"start":77.0,"end":79.4,"text":"낮잠 뒤 멍한 게 언제 풀렸는지,"},{"start":79.4,"end":83.0,"text":"그날 밤 몇 시에 잠들었는지 적어 보세요."}]}],"sources":[{"title":"NIOSH Training for Nurses on Shift Work and Long Work Hours – Sleep Inertia","url":"https://www.cdc.gov/niosh/work-hour-training-for-nurses/longhours/mod7/03.html"},{"title":"Sleep Deprivation and Deficiency – Healthy Sleep Habits","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits"},{"title":"Excessive daytime sleepiness (hypersomnia)","url":"https://www.nhs.uk/conditions/excessive-daytime-sleepiness-hypersomnia/"},{"title":"Sleep Deprivation and Deficiency – What Makes You Sleep?","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/body-clock"}]},{"id":19,"title":"수면제를 건너뛴 밤, 왜 더 못 잤을까?","category":"수면","original":"수면제를 건너뛴 밤에 왜 더 못 잘까? 원래 불면인지 약을 거른 영향인지","length":88,"parts":[{"start":0,"end":2,"text":"수면제 안 먹으니 더 못 잤나요?","cues":[{"start":0.0,"end":2.0,"text":"수면제 안 먹으니 더 못 잤나요?"}]},{"start":2,"end":7,"text":"그 밤만 보고 약이 평생 필요한지 판단하기는 어려워요.","cues":[{"start":2.0,"end":3.9,"text":"그 밤만 보고 약이 평생"},{"start":3.9,"end":7.0,"text":"필요한지 판단하기는 어려워요."}]},{"start":7,"end":50,"text":"원래 있던 불면이 다시 드러날 수 있습니다. 약을 줄인 뒤 잠깐, 복용하기 전보다 잠이 더 나빠지는 반동 불면일 수도 있죠. 어떤 약은 오래 쓰다 급히 줄일 때 떨림이나 불안처럼 잠이 안 오는 것 말고 다른 증상도 같이 생길 수 있습니다. 한밤중에는 이 세 가지가 비슷하게 느껴지거나 겹치기도 해요. 예를 들어 원래도 잠들기 어려웠는지, 약을 줄이고 전에 없던 몸 떨림까지 생겼는지는 다른 이야기입니다. 증상들이 겹칠 수 있으니 그 자리에서 이름을 붙이기보다 변화가 시작된 때부터 정리하세요.","cues":[{"start":7.0,"end":9.8,"text":"원래 있던 불면이 다시 드러날 수"},{"start":9.8,"end":12.2,"text":"있습니다. 약을 줄인 뒤 잠깐,"},{"start":12.2,"end":15.2,"text":"복용하기 전보다 잠이 더 나빠지는"},{"start":15.2,"end":18.0,"text":"반동 불면일 수도 있죠. 어떤 약은"},{"start":18.0,"end":20.8,"text":"오래 쓰다 급히 줄일 때 떨림이나"},{"start":20.8,"end":23.4,"text":"불안처럼 잠이 안 오는 것 말고"},{"start":23.4,"end":26.7,"text":"다른 증상도 같이 생길 수 있습니다."},{"start":26.7,"end":29.7,"text":"한밤중에는 이 세 가지가 비슷하게"},{"start":29.7,"end":32.4,"text":"느껴지거나 겹치기도 해요."},{"start":32.4,"end":35.6,"text":"예를 들어 원래도 잠들기 어려웠는지,"},{"start":35.6,"end":38.6,"text":"약을 줄이고 전에 없던 몸 떨림까지"},{"start":38.6,"end":41.7,"text":"생겼는지는 다른 이야기입니다."},{"start":41.7,"end":44.1,"text":"증상들이 겹칠 수 있으니 그"},{"start":44.1,"end":46.7,"text":"자리에서 이름을 붙이기보다"},{"start":46.7,"end":50.0,"text":"변화가 시작된 때부터 정리하세요."}]},{"start":50,"end":57,"text":"‘어제 안 먹었더니 못 잤어요’라고 할 때는 어떤 수면제였는지 아는 게 꼭 필요합니다.","cues":[{"start":50.0,"end":52.6,"text":"‘어제 안 먹었더니 못 잤어요’라고"},{"start":52.6,"end":54.9,"text":"할 때는 어떤 수면제였는지"},{"start":54.9,"end":57.0,"text":"아는 게 꼭 필요합니다."}]},{"start":57,"end":82,"text":"벤조디아제핀 계열을 꾸준히 쓰다가 갑자기 끊거나 급히 줄이면 심한 금단이 생길 수 있어요. 감량 방법은 약과 복용 기간, 건강 상태에 따라 의료진과 정하세요. 갑자기 경련이 생기면 응급 상황입니다. 상담에는 평소 먹던 양, 달라진 날, 잠이 안 온 것 외에 새로 생긴 증상도 알려 주세요.","cues":[{"start":57.0,"end":59.6,"text":"벤조디아제핀 계열을 꾸준히"},{"start":59.6,"end":62.6,"text":"쓰다가 갑자기 끊거나 급히 줄이면"},{"start":62.6,"end":65.3,"text":"심한 금단이 생길 수 있어요."},{"start":65.3,"end":67.7,"text":"감량 방법은 약과 복용 기간,"},{"start":67.7,"end":71.3,"text":"건강 상태에 따라 의료진과 정하세요."},{"start":71.3,"end":73.7,"text":"갑자기 경련이 생기면 응급"},{"start":73.7,"end":76.7,"text":"상황입니다. 상담에는 평소 먹던 양,"},{"start":76.7,"end":79.1,"text":"달라진 날, 잠이 안 온 것 외에"},{"start":79.1,"end":82.0,"text":"새로 생긴 증상도 알려 주세요."}]},{"start":82,"end":88,"text":"약 이름과 언제 줄였는지, 그 뒤 전에 없던 증상이 생겼  보세요."}]},{"start":39,"end":82,"text":"오늘 쉬는 방법이 도리어 부담이 됐다면 이렇게 생각해 보세요. 앱이 없으면 몸을 돌볼 수 없는 건지, 아니면 앱을 켤 필요 없는 날이 있는지요. 십 분쯤 여유를 낼 수 있다면 그 시간을 그냥 비워 둬도 돼요. 몸이 긴장했을 때 잠깐 풀 시간이 필요한지, 하루에 너무 많은 요구가 들어오는지를 보세요. 예를 들어 저녁에 머리가 복잡하다면 명상 앱을 하나 더 받기 전에, 그 시간에 답할 필요 없는 연락이 있는지 살피는 거예요. 가능하다면 일을 언제 어떻게 하는지 바꿔 보는 것도 스트레스를 줄이는 방법이에요.","cues":[{"start":39.0,"end":41.7,"text":"오늘 쉬는 방법이 도리어 부담이"},{"start":41.7,"end":44.6,"text":"됐다면 이렇게 생각해 보세요."},{"start":44.6,"end":47.5,"text":"앱이 없으면 몸을 돌볼 수 없는 건지,"},{"start":47.5,"end":51.2,"text":"아니면 앱을 켤 필요 없는 날이 있는지요."},{"start":51.2,"end":53.5,"text":"십 분쯤 여유를 낼 수 있다면"},{"start":53.5,"end":56.3,"text":"그 시간을 그냥 비워 둬도 돼요."},{"start":56.3,"end":59.0,"text":"몸이 긴장했을 때 잠깐 풀 시간이"},{"start":59.0,"end":61.3,"text":"필요한지, 하루에 너무 많은"},{"start":61.3,"end":64.2,"text":"요구가 들어오는지를 보세요."},{"start":64.2,"end":67.3,"text":"예를 들어 저녁에 머리가 복잡하다면"},{"start":67.3,"end":69.6,"text":"명상 앱을 하나 더 받기 전에,"},{"start":69.6,"end":71.7,"text":"그 시간에 답할 필요 없는"},{"start":71.7,"end":74.6,"text":"연락이 있는지 살피는 거예요."},{"start":74.6,"end":76.4,"text":"가능하다면 일을 언제"},{"start":76.4,"end":79.0,"text":"어떻게 하는지 바꿔 보는 것도"},{"start":79.0,"end":82.0,"text":"스트레스를 줄이는 방법이에요."}]},{"start":82,"end":88,"text":"오늘 할 일 중 하나쯤 빼도 된다면 그 항목에 먼저 줄을 그어 보세요.","cues":[{"start":82.0,"end":84.8,"text":"오늘 할 일 중 하나쯤 빼도 된다면"},{"start":84.8,"end":88.0,"text":"그 항목에 먼저 줄을 그어 보세요."}]}],"sources":[{"title":"Doing What Matters in Times of Stress: An Illustrated Guide","url":"https://www.who.int/publications/i/item/9789240003927"},{"title":"Guidelines on mental health at work","url":"https://www.who.int/publications/i/item/9789240053052"},{"title":"Depression","url":"https://www.nimh.nih.gov/health/publications/depression"},{"title":"I’m So Stressed Out! Fact Sheet","url":"https://www.nimh.nih.gov/health/publications/so-stressed-out-fact-sheet"},{"title":"Relaxation Techniques: What You Need To Know","url":"https://www.nccih.nih.gov/health/relaxation-techniques-what-you-need-to-know"}]},{"id":22,"title":"긁을 땐 시원한데 왜 나중에 더 가려울까?","category":"스트레스·마음","original":"긴장하면 가렵고 긁으면 더 가렵다. 피부와 신경에 무슨 일이 생길까?","length":86,"parts":[{"start":0,"end":2,"text":"긁을수록 왜 더 가렵죠?","cues":[{"start":0.0,"end":2.0,"text":"긁을수록 왜 더 가렵죠?"}]},{"start":2,"end":7,"text":"긁을 땐 시원한데 나중에 따갑고 또 가려워지는 건 왜일까요?","cues":[{"start":2.0,"end":4.6,"text":"긁을 땐 시원한데 나중에 따갑고"},{"start":4.6,"end":7.0,"text":"또 가려워지는 건 왜일까요?"}]},{"start":7,"end":31,"text":"가려움은 피부에서 감각신경을 타고 뇌로 전해집니다. 손톱으로 긁을 때 들어오는 다른 감각이 잠깐 그 신호를 덮을 수 있어요. 그래서 그 순간엔 정말로 편해지죠. 그런데 같은 자리를 계속 긁으면 피부 겉이 상하고 염증이 더해질 수 있습니다. 다시 가려워져서 또 손이 가죠.","cues":[{"start":7.0,"end":9.8,"text":"가려움은 피부에서 감각신경을"},{"start":9.8,"end":12.5,"text":"타고 뇌로 전해집니다. 손톱으로"},{"start":12.5,"end":15.1,"text":"긁을 때 들어오는 다른 감각이"},{"start":15.1,"end":18.0,"text":"잠깐 그 신호를 덮을 수 있어요."},{"start":18.0,"end":21.2,"text":"그래서 그 순간엔 정말로 편해지죠."},{"start":21.2,"end":23.4,"text":"그런데 같은 자리를 계속"},{"start":23.4,"end":25.5,"text":"긁으면 피부 겉이 상하고"},{"start":25.5,"end":28.1,"text":"염증이 더해질 수 있습니다."},{"start":28.1,"end":31.0,"text":"다시 가려워져서 또 손이 가죠."}]},{"start":31,"end":37,"text":"스트레스를 받거나 지친 날엔 가려움에 더 신경이 쏠릴 수 있어요.","cues":[{"start":31.0,"end":33.6,"text":"스트레스를 받거나 지친 날엔"},{"start":33.6,"end":37.0,"text":"가려움에 더 신경이 쏠릴 수 있어요."}]},{"start":37,"end":80,"text":"예를 들어 같은 손등이 퇴근하고 유독 가려울 때, 그날 손을 많이 씻었는지와 집에 와서 얼마나 오래 긁었는지를 떠올려 보세요. 처음 자극과 그 뒤 상처가 겹치면 어느 순간을 보느냐에 따라 설명이 달라져요. 손등이 똑같이 가려워도 긴장한 저녁엔 유난히 신경 쓰일 수 있죠. 그렇다고 피부에 생긴 자극이나 염증이 사라지는 건 아닙니다. 가려움이 계속되면 처음에 발진이 있었는지, 긁고 나서 자국이 생겼는지 구분해 보세요. 피부를 치료하는 일과 긁는 고리를 끊는 방법을 함께 살필 수 있습니다.","cues":[{"start":37.0,"end":39.7,"text":"예를 들어 같은 손등이 퇴근하고"},{"start":39.7,"end":42.3,"text":"유독 가려울 때, 그날 손을 많이"},{"start":42.3,"end":44.8,"text":"씻었는지와 집에 와서 얼마나"},{"start":44.8,"end":47.9,"text":"오래 긁었는지를 떠올려 보세요."},{"start":47.9,"end":50.6,"text":"처음 자극과 그 뒤 상처가 겹치면"},{"start":50.6,"end":52.5,"text":"어느 순간을 보느냐에"},{"start":52.5,"end":54.7,"text":"따라 설명이 달라져요."},{"start":54.7,"end":57.5,"text":"손등이 똑같이 가려워도 긴장한"},{"start":57.5,"end":60.5,"text":"저녁엔 유난히 신경 쓰일 수 있죠."},{"start":60.5,"end":63.3,"text":"그렇다고 피부에 생긴 자극이나"},{"start":63.3,"end":66.1,"text":"염증이 사라지는 건 아닙니다."},{"start":66.1,"end":68.4,"text":"가려움이 계속되면 처음에"},{"start":68.4,"end":70.7,"text":"발진이 있었는지, 긁고 나서"},{"start":70.7,"end":73.8,"text":"자국이 생겼는지 구분해 보세요."},{"start":73.8,"end":76.7,"text":"피부를 치료하는 일과 긁는 고리를"},{"start":76.7,"end":80.0,"text":"끊는 방법을 함께 살필 수 있습니다."}]},{"start":80,"end":86,"text":"처음엔 가렵기만 했나요? 긁기 전부터 피부가 변해 있었나요?","cues":[{"start":80.0,"end":82.6,"text":"처음엔 가렵기만 했나요?"},{"start":82.6,"end":86.0,"text":"긁기 전부터 피부가 변해 있었나요?"}]}],"sources":[{"title":"6 skin and hair conditions linked to stress","url":"https://www.aad.org/public/diseases/a-z/stress-skin-conditions"},{"title":"European Guideline on Chronic Pruritus: In cooperation with the European Dermatology Forum","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12529596/"},{"title":"Eczema types: Neurodermatitis diagnosis and treatment","url":"https://www.aad.org/public/diseases/eczema/types/neurodermatitis/treatment"}]},{"id":23,"title":"두근거림이 지나간 뒤 찍은 심전도는 무엇을 말할까","category":"스트레스·마음","original":"두근거림이 불안 때문인지 부정맥 때문인지, 심전도로 뭘 알 수 있을까?","length":81,"parts":[{"start":0,"end":2,"text":"두근거림, 검사 땐 없었나요?","cues":[{"start":0.0,"end":2.0,"text":"두근거림, 검사 땐 없었나요?"}]},{"start":2,"end":8,"text":"심전도가 정상으로 나왔어도 두근거릴 때 찍었는지 봐야 해요.","cues":[{"start":2.0,"end":4.7,"text":"심전도가 정상으로 나왔어도"},{"start":4.7,"end":8.0,"text":"두근거릴 때 찍었는지 봐야 해요."}]},{"start":8,"end":33,"text":"심전도는 그 순간 심장의 전기 신호를 기록합니다. 낮 두 시에 누워서 찍으면 그때 심장의 박동이 어땠는지 나와요. 그런데 두근거림이 퇴근길에 몇 분씩만 왔다면 낮 검사에 그 순간이 들어가진 않습니다. 두근거릴 때 심전도가 찍히면 그때 느낌과 실제 심장 박동을 비교해 볼 수 있어요.","cues":[{"start":8.0,"end":10.1,"text":"심전도는 그 순간 심장의"},{"start":10.1,"end":12.5,"text":"전기 신호를 기록합니다."},{"start":12.5,"end":15.1,"text":"낮 두 시에 누워서 찍으면 그때"},{"start":15.1,"end":18.2,"text":"심장의 박동이 어땠는지 나와요."},{"start":18.2,"end":20.7,"text":"그런데 두근거림이 퇴근길에"},{"start":20.7,"end":23.1,"text":"몇 분씩만 왔다면 낮 검사에"},{"start":23.1,"end":25.9,"text":"그 순간이 들어가진 않습니다."},{"start":25.9,"end":28.5,"text":"두근거릴 때 심전도가 찍히면"},{"start":28.5,"end":30.4,"text":"그때 느낌과 실제 심장"},{"start":30.4,"end":33.0,"text":"박동을 비교해 볼 수 있어요."}]},{"start":33,"end":38,"text":"검사할 때 두근거림이 생기는 시간을 담는 게 중요해요.","cues":[{"start":33.0,"end":35.6,"text":"검사할 때 두근거림이 생기는"},{"start":35.6,"end":38.0,"text":"시간을 담는 게 중요해요."}]},{"start":38,"end":75,"text":"낮에 심전도를 찍을 땐 한 번도 두근대지 않았다면 밤에 갑자기 뛰던 순간은 기록에 없을 수 있어요. 증상이 있을 때 찍었다면 그 순간 심장이 어떻게 뛰었는지 비교할 수 있고요. 매일 생기는지, 며칠에 한 번인지, 갑자기 시작해 갑자기 멈추는지를 적어 보세요. 증상 빈도에 따라 기록하는 기간을 다르게 고를 수 있습니다. 긴장도 심장이 뛰는 느낌을 키울 수 있지만 흉통이나 심한 숨참, 실신이 동반되면 즉시 평가가 필요합니다.","cues":[{"start":38.0,"end":40.6,"text":"낮에 심전도를 찍을 땐 한 번도"},{"start":40.6,"end":43.4,"text":"두근대지 않았다면 밤에 갑자기"},{"start":43.4,"end":46.7,"text":"뛰던 순간은 기록에 없을 수 있어요."},{"start":46.7,"end":48.8,"text":"증상이 있을 때 찍었다면"},{"start":48.8,"end":51.6,"text":"그 순간 심장이 어떻게 뛰었는지"},{"start":51.6,"end":54.4,"text":"비교할 수 있고요. 매일 생기는지,"},{"start":54.4,"end":57.2,"text":"며칠에 한 번인지, 갑자기 시작해"},{"start":57.2,"end":60.3,"text":"갑자기 멈추는지를 적어 보세요."},{"start":60.3,"end":62.6,"text":"증상 빈도에 따라 기록하는"},{"start":62.6,"end":65.7,"text":"기간을 다르게 고를 수 있습니다."},{"start":65.7,"end":68.7,"text":"긴장도 심장이 뛰는 느낌을 키울 수"},{"start":68.7,"end":71.7,"text":"있지만 흉통이나 심한 숨참, 실신이"},{"start":71.7,"end":75.0,"text":"동반되면 즉시 평가가 필요합니다."}]},{"start":75,"end":81,"text":"두근거림은 몇 시쯤 시작했는지, 얼마나 오래 갔는지 적어 두세요.","cues":[{"start":75.0,"end":77.8,"text":"두근거림은 몇 시쯤 시작했는지,"},{"start":77.8,"end":81.0,"text":"얼마나 오래 갔는지 적어 두세요."}]}],"sources":[{"title":"Heart palpitations","url":"https://www.nhs.uk/symptoms/heart-palpitations/"},{"title":"2017 ISHNE-HRS expert consensus statement on ambulatory ECG and external cardiac monitoring/telemetry","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6931745/"},{"title":"Arrhythmias – Diagnosis","url":"https://www.nhlbi.nih.gov/health/arrhythmias/diagnosis"},{"title":"Palpitations: Evaluation, Management, and Wearable Smart Devices","url":"https://www.aafp.org/afp/2024/0900/palpitations"}]},{"id":24,"title":"명상 중 심장이 더 크게 느껴지는 까닭","category":"스트레스·마음","original":"명상할 때 왜 심장 뛰는 느낌이 더 또렷해질까?","length":83,"parts":[{"start":0,"end":2,"text":"명상 중 심장이 더 크게 뛰어요?","cues":[{"start":0.0,"end":2.0,"text":"명상 중 심장이 더 크게 뛰어요?"}]},{"start":2,"end":9,"text":"심장이 실제로 다르게 뛰는 걸까요? 평소 박동을 더 크게 느끼는 걸까요?","cues":[{"start":2.0,"end":5.5,"text":"심장이 실제로 다르게 뛰는 걸까요?"},{"start":5.5,"end":9.0,"text":"평소 박동을 더 크게 느끼는 걸까요?"}]},{"start":9,"end":33,"text":"밤에 주변이 조용해지면 냉장고 돌아가는 소리가 갑자기 들릴 때가 있죠. 기계가 더 세게 돈 것처럼 느껴집니다. 몸도 비슷해요. 눈을 감고 숨이나 가슴에 집중하면 원래 지나가던 감각이 또렷해질 수 있어요. 그때 ‘뭔가 이상하다’고 받아들이면 그 신호를 더 열심히 찾게 되고요.","cues":[{"start":9.0,"end":11.7,"text":"밤에 주변이 조용해지면 냉장고"},{"start":11.7,"end":15.4,"text":"돌아가는 소리가 갑자기 들릴 때가 있죠."},{"start":15.4,"end":18.9,"text":"기계가 더 세게 돈 것처럼 느껴집니다."},{"start":18.9,"end":21.6,"text":"몸도 비슷해요. 눈을 감고 숨이나"},{"start":21.6,"end":24.4,"text":"가슴에 집중하면 원래 지나가던"},{"start":24.4,"end":27.0,"text":"감각이 또렷해질 수 있어요."},{"start":27.0,"end":30.0,"text":"그때 ‘뭔가 이상하다’고 받아들이면"},{"start":30.0,"end":33.0,"text":"그 신호를 더 열심히 찾게 되고요."}]},{"start":33,"end":37,"text":"그렇다면 더 오래 버티면서 집중해야 할까요?","cues":[{"start":33.0,"end":35.3,"text":"그렇다면 더 오래 버티면서"},{"start":35.3,"end":37.0,"text":"집중해야 할까요?"}]},{"start":37,"end":77,"text":"같은 자리에서 잠깐 눈을 뜨고 방 안의 소리를 들어보세요. 그러면 가슴 뛰는 느낌이 덜 신경 쓰이는 사람도 있어요. 그래도 박자가 실제로 규칙적인지, 얼마나 빠른지는 감각을 옮겨 보는 것만으로 알 수 없습니다. 가슴에 집중하기 힘들다면 눈을 뜨고 발바닥이나 주변 소리로 집중 대상을 옮겨볼 수 있습니다. 쉬었다 다시 해도 되고요. 명상 밖에서도 새 두근거림이 반복되거나 흉통, 실신이 동반된다면 명상 때문으로 넘기지 말고 증상에 맞게 평가받으세요.","cues":[{"start":37.0,"end":39.5,"text":"같은 자리에서 잠깐 눈을 뜨고"},{"start":39.5,"end":42.2,"text":"방 안의 소리를 들어보세요."},{"start":42.2,"end":44.5,"text":"그러면 가슴 뛰는 느낌이 덜"},{"start":44.5,"end":47.1,"text":"신경 쓰이는 사람도 있어요."},{"start":47.1,"end":50.1,"text":"그래도 박자가 실제로 규칙적인지,"},{"start":50.1,"end":52.7,"text":"얼마나 빠른지는 감각을 옮겨"},{"start":52.7,"end":55.5,"text":"보는 것만으로 알 수 없습니다."},{"start":55.5,"end":57.8,"text":"가슴에 집중하기 힘들다면"},{"start":57.8,"end":60.8,"text":"눈을 뜨고 발바닥이나 주변 소리로"},{"start":60.8,"end":63.9,"text":"집중 대상을 옮겨볼 수 있습니다."},{"start":63.9,"end":66.3,"text":"쉬었다 다시 해도 되고요."},{"start":66.3,"end":68.8,"text":"명상 밖에서도 새 두근거림이"},{"start":68.8,"end":72.0,"text":"반복되거나 흉통, 실신이 동반된다면"},{"start":72.0,"end":74.4,"text":"명상 때문으로 넘기지 말고"},{"start":74.4,"end":77.0,"text":"증상에 맞게 평가받으세요."}]},{"start":77,"end":83,"text":"명상하는 동안에만 박동을 더 크게 느끼는지 먼저 살펴보세요.","cues":[{"start":77.0,"end":79.7,"text":"명상하는 동안에만 박동을 더"},{"start":79.7,"end":83.0,"text":"크게 느끼는지 먼저 살펴보세요."}]}],"sources":[{"title":"Meditation and Mindfulness: Effectiveness and Safety","url":"https://www.nccih.nih.gov/health/meditation-and-mindfulness-effectiveness-and-safety"},{"title":"Adverse events in meditation practices and meditation-based therapies: a systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/32820538/"},{"title":"Chest pain","url":"https://www.nhs.uk/symptoms/chest-pain/"},{"title":"Shortness of breath","url":"https://www.nhs.uk/symptoms/shortness-of-breath/"},{"title":"Adverse Experiences in Brief Meditation Practices: Randomized Controlled Trial","url":"https://pubmed.ncbi.nlm.nih.gov/42735902/"},{"title":"Breathing exercises in the treatment of hyperventilation","url":"https://www.cuh.nhs.uk/patient-information/breathing-exercises-in-the-treatment-of-hyperventilation/"}]},{"id":25,"title":"점심을 거르면 저녁에 왜 더 많이 먹게 될까?","category":"스트레스·마음","original":"낮에 먹는 걸 참다 보면 왜 밤에는 멈추기 어려울까?","length":88,"parts":[{"start":0,"end":2,"text":"밤에 몰아 먹나요?","cues":[{"start":0.0,"end":2.0,"text":"밤에 몰아 먹나요?"}]},{"start":2,"end":7,"text":"저녁에 몰아 먹던 날 점심은 어땠는지 떠올려 보세요.","cues":[{"start":2.0,"end":4.5,"text":"저녁에 몰아 먹던 날 점심은"},{"start":4.5,"end":7.0,"text":"어땠는지 떠올려 보세요."}]},{"start":7,"end":33,"text":"바빠서 점심을 넘깁니다. 오후엔 아메리카노로 버텨요. 집에 오자마자 빵부터 집는데 생각했던 것보다 빠르게 많이 먹게 돼요. 밤에 먹었다는 데만 신경 쓰면 아침부터 얼마나 배고팠고 음식 생각이 났는지 놓치기 쉽죠. 저녁에 무엇을 먹었는지와 함께 하루 동안 먹을 기회가 있었는지 확인해야 해요.","cues":[{"start":7.0,"end":9.4,"text":"바빠서 점심을 넘깁니다."},{"start":9.4,"end":12.2,"text":"오후엔 아메리카노로 버텨요."},{"start":12.2,"end":14.7,"text":"집에 오자마자 빵부터 집는데"},{"start":14.7,"end":18.3,"text":"생각했던 것보다 빠르게 많이 먹게 돼요."},{"start":18.3,"end":20.8,"text":"밤에 먹었다는 데만 신경 쓰면"},{"start":20.8,"end":23.1,"text":"아침부터 얼마나 배고팠고"},{"start":23.1,"end":26.1,"text":"음식 생각이 났는지 놓치기 쉽죠."},{"start":26.1,"end":28.3,"text":"저녁에 무엇을 먹었는지와"},{"start":28.3,"end":30.6,"text":"함께 하루 동안 먹을 기회가"},{"start":30.6,"end":33.0,"text":"있었는지 확인해야 해요."}]},{"start":33,"end":39,"text":"얼마나 먹었는지 말고 먹던 중에 멈출 수 있었는지도 봐야 해요.","cues":[{"start":33.0,"end":36.0,"text":"얼마나 먹었는지 말고 먹던 중에"},{"start":36.0,"end":39.0,"text":"멈출 수 있었는지도 봐야 해요."}]},{"start":39,"end":80,"text":"오후 네 시에 간식을 조금 챙긴 날과, 아무것도 먹지 않고 퇴근한 날을 떠올려 보세요. 저녁이 같은 메뉴여도 먹기 시작하는 속도나 멈추는 느낌이 다를 수 있어요. 그날 저녁 전에 얼마나 배고팠는지, 막상 먹기 시작하면 멈추기 어렵다는 느낌이 자꾸 드는지도 보세요. 스트레스나 감정이 섞일 수도 있고 그다음 날 덜 먹으려다 같은 고리가 이어지기도 합니다. 규칙적으로 먹을 기회를 만드는 게 관리의 한 부분이고 먹다가 멈추기 힘들어서 자주 괴롭다면 도움을 받아볼 수 있습니다.","cues":[{"start":39.0,"end":41.9,"text":"오후 네 시에 간식을 조금 챙긴 날과,"},{"start":41.9,"end":44.3,"text":"아무것도 먹지 않고 퇴근한"},{"start":44.3,"end":46.6,"text":"날을 떠올려 보세요. 저녁이"},{"start":46.6,"end":49.1,"text":"같은 메뉴여도 먹기 시작하는"},{"start":49.1,"end":52.6,"text":"속도나 멈추는 느낌이 다를 수 있어요."},{"start":52.6,"end":55.5,"text":"그날 저녁 전에 얼마나 배고팠는지,"},{"start":55.5,"end":58.7,"text":"막상 먹기 시작하면 멈추기 어렵다는"},{"start":58.7,"end":61.5,"text":"느낌이 자꾸 드는지도 보세요."},{"start":61.5,"end":64.0,"text":"스트레스나 감정이 섞일 수도"},{"start":64.0,"end":66.3,"text":"있고 그다음 날 덜 먹으려다"},{"start":66.3,"end":69.4,"text":"같은 고리가 이어지기도 합니다."},{"start":69.4,"end":72.3,"text":"규칙적으로 먹을 기회를 만드는 게"},{"start":72.3,"end":74.6,"text":"관리의 한 부분이고 먹다가"},{"start":74.6,"end":77.4,"text":"멈추기 힘들어서 자주 괴롭다면"},{"start":77.4,"end":80.0,"text":"도움을 받아볼 수 있습니다."}]},{"start":80,"end":88,"text":"밤에 몰아 먹었던 날, 저녁 전 마지막 끼니는 몇 시였고 얼마나 오래 버텼는지 떠올려 보세요.","cues":[{"start":80.0,"end":82.4,"text":"밤에 몰아 먹었던 날, 저녁 전"},{"start":82.4,"end":85.1,"text":"마지막 끼니는 몇 시였고 얼마나"},{"start":85.1,"end":88.0,"text":"오래 버텼는지 떠올려 보세요."}]}],"sources":[{"title":"Symptoms & Causes of Binge Eating Disorder","url":"https://www.niddk.nih.gov/health-information/weight-management/binge-eating-disorder/symptoms-causes"},{"title":"Eating disorders: recognition and treatment – Recommendations","url":"https://www.nice.org.uk/guidance/ng69/chapter/Recommendations"},{"title":"Treatment – Binge eating disorder","url":"https://www.nhs.uk/mental-health/conditions/binge-eating/treatment/"}]},{"id":26,"title":"쉬는 날에도 아무것도 즐겁지 않을 때","category":"스트레스·마음","original":"번아웃과 우울증은 어떻게 다를까? 쉬고 나서도 즐겁지 않다면","length":85,"parts":[{"start":0,"end":2,"text":"쉬는 날도 재미가 없나요?","cues":[{"start":0.0,"end":2.0,"text":"쉬는 날도 재미가 없나요?"}]},{"start":2,"end":7,"text":"일 때문에 힘들다면 쉬는 날엔 어떤지도 봐야 해요.","cues":[{"start":2.0,"end":4.3,"text":"일 때문에 힘들다면 쉬는"},{"start":4.3,"end":7.0,"text":"날엔 어떤지도 봐야 해요."}]},{"start":7,"end":31,"text":"업무 연락만 봐도 몸이 무겁죠. 일에 마음이 가지 않고 예전만큼 못 하겠다는 생각이 들 수 있어요. 번아웃을 살필 때는 이런 일이 일하는 동안 생기는지 봅니다. 그런데 쉬는 날에도 좋아하던 드라마가 재미없고 식사나 잠, 집중까지 달라져 있다면 회사 밖에서의 생활도 살펴야 해요.","cues":[{"start":7.0,"end":9.8,"text":"업무 연락만 봐도 몸이 무겁죠."},{"start":9.8,"end":12.5,"text":"일에 마음이 가지 않고 예전만큼"},{"start":12.5,"end":15.5,"text":"못 하겠다는 생각이 들 수 있어요."},{"start":15.5,"end":18.0,"text":"번아웃을 살필 때는 이런 일이"},{"start":18.0,"end":20.7,"text":"일하는 동안 생기는지 봅니다."},{"start":20.7,"end":23.2,"text":"그런데 쉬는 날에도 좋아하던"},{"start":23.2,"end":25.7,"text":"드라마가 재미없고 식사나 잠,"},{"start":25.7,"end":28.2,"text":"집중까지 달라져 있다면 회사"},{"start":28.2,"end":31.0,"text":"밖에서의 생활도 살펴야 해요."}]},{"start":31,"end":37,"text":"일 때문에 지친 사람에게 우울 증상이 함께 나타날 수 있습니다.","cues":[{"start":31.0,"end":33.7,"text":"일 때문에 지친 사람에게 우울"},{"start":33.7,"end":37.0,"text":"증상이 함께 나타날 수 있습니다."}]},{"start":37,"end":79,"text":"평소 좋아하던 사람을 만나는 일도 미루고 쉬어도 식사나 잠의 변화가 이어졌다면 회사 밖의 이야기까지 말해 주세요. 그걸 알아야 당장의 업무 조정 외에 따로 도움이 필요한 부분을 함께 볼 수 있어요. 휴가 때 느낌 하나로 구분하긴 어려워요. 이런 변화가 얼마나 이어졌는지, 사람을 만나고 일상을 챙기는 일이 얼마나 어려워졌는지 봐야 합니다. 몸 상태와 과거 기분의 큰 변화도 평가에 들어가죠. 좋아하던 일이 계속 재미없고 일상생활도 어려워졌다면 휴식에만 기대기보다 상담해 보세요.","cues":[{"start":37.0,"end":39.5,"text":"평소 좋아하던 사람을 만나는"},{"start":39.5,"end":41.8,"text":"일도 미루고 쉬어도 식사나"},{"start":41.8,"end":44.3,"text":"잠의 변화가 이어졌다면 회사"},{"start":44.3,"end":47.1,"text":"밖의 이야기까지 말해 주세요."},{"start":47.1,"end":49.6,"text":"그걸 알아야 당장의 업무 조정"},{"start":49.6,"end":52.3,"text":"외에 따로 도움이 필요한 부분을"},{"start":52.3,"end":54.8,"text":"함께 볼 수 있어요. 휴가 때 느낌"},{"start":54.8,"end":57.4,"text":"하나로 구분하긴 어려워요."},{"start":57.4,"end":60.2,"text":"이런 변화가 얼마나 이어졌는지,"},{"start":60.2,"end":63.1,"text":"사람을 만나고 일상을 챙기는 일이"},{"start":63.1,"end":66.3,"text":"얼마나 어려워졌는지 봐야 합니다."},{"start":66.3,"end":68.4,"text":"몸 상태와 과거 기분의 큰"},{"start":68.4,"end":70.8,"text":"변화도 평가에 들어가죠."},{"start":70.8,"end":73.3,"text":"좋아하던 일이 계속 재미없고"},{"start":73.3,"end":75.6,"text":"일상생활도 어려워졌다면"},{"start":75.6,"end":79.0,"text":"휴식에만 기대기보다 상담해 보세요."}]},{"start":79,"end":85,"text":"일이 없는 날에도 예전에 좋아하던 게 여전히 좋은지 스스로 물어보세요.","cues":[{"start":79.0,"end":82.0,"text":"일이 없는 날에도 예전에 좋아하던 게"},{"start":82.0,"end":85.0,"text":"여전히 좋은지 스스로 물어보세요."}]}],"sources":[{"title":"Burn-out an occupational phenomenon","url":"https://www.who.int/standards/classifications/frequently-asked-questions/burn-out-an-occupational-phenomenon"},{"title":"Depression","url":"https://www.nimh.nih.gov/health/publications/depression"},{"title":"Guidelines on mental health at work","url":"https://www.who.int/publications/i/item/9789240053052"}]},{"id":27,"title":"퇴근만 빨라진 단축근무가 버거운 이유","category":"스트레스·마음","original":"쉬고 나아졌는데 출근하자 다시 힘들다. 일하는 시간 외에 뭘 봐야 할까?","length":80,"parts":[{"start":0,"end":2,"text":"퇴근만 빨라지고 일은 그대로.","cues":[{"start":0.0,"end":2.0,"text":"퇴근만 빨라지고 일은 그대로."}]},{"start":2,"end":6,"text":"복귀 시간표 옆에 업무 목록도 펼쳐 보세요.","cues":[{"start":2.0,"end":4.0,"text":"복귀 시간표 옆에 업무"},{"start":4.0,"end":6.0,"text":"목록도 펼쳐 보세요."}]},{"start":6,"end":30,"text":"쉬는 동안엔 불편할 때 멈출 수 있었죠. 복귀하면 회의는 정시에 시작하고 요청은 예고 없이 들어옵니다. 퇴근을 두 시간 당겨도 같은 보고서를 같은 날까지 내야 하면, 일하는 동안 더 서두르게 돼요. 연락에도 바로바로 답해야 한다면 짧아진 시간에 오히려 일이 더 몰릴 수 있어요.","cues":[{"start":6.0,"end":9.4,"text":"쉬는 동안엔 불편할 때 멈출 수 있었죠."},{"start":9.4,"end":12.4,"text":"복귀하면 회의는 정시에 시작하고"},{"start":12.4,"end":15.2,"text":"요청은 예고 없이 들어옵니다."},{"start":15.2,"end":17.1,"text":"퇴근을 두 시간 당겨도"},{"start":17.1,"end":20.2,"text":"같은 보고서를 같은 날까지 내야 하면,"},{"start":20.2,"end":23.0,"text":"일하는 동안 더 서두르게 돼요."},{"start":23.0,"end":25.3,"text":"연락에도 바로바로 답해야"},{"start":25.3,"end":27.2,"text":"한다면 짧아진 시간에"},{"start":27.2,"end":30.0,"text":"오히려 일이 더 몰릴 수 있어요."}]},{"start":30,"end":35,"text":"몇 시간 일할지 정했다면 어떤 일을 줄일지도 정해 보세요.","cues":[{"start":30.0,"end":32.0,"text":"몇 시간 일할지 정했다면"},{"start":32.0,"end":35.0,"text":"어떤 일을 줄일지도 정해 보세요."}]},{"start":35,"end":75,"text":"예를 들어 오후 회의를 하나 뺀 시간에 새 요청이 몰리면 실제로 줄어든 일이 없을 수 있죠. 반대로 보고서 하나를 분담하고 당일 연락 대응을 다른 사람과 나누면 같은 퇴근 시각이어도 부담은 달라집니다. 어떤 업무를 맡을지, 급한 연락을 누가 받을지, 일이 몰리면 무엇을 미룰지 정해 보세요. 퇴근하고 밥 먹고 잠잘 힘이 남는지 보면 이렇게 계속 일할 수 있을지 판단하기 쉬워요. 몸을 어떻게 치료할지 살피면서 직장에선 어떤 일을 나눌 수 있을지도 의논할 수 있어요.","cues":[{"start":35.0,"end":37.4,"text":"예를 들어 오후 회의를 하나"},{"start":37.4,"end":39.7,"text":"뺀 시간에 새 요청이 몰리면"},{"start":39.7,"end":42.8,"text":"실제로 줄어든 일이 없을 수 있죠."},{"start":42.8,"end":45.6,"text":"반대로 보고서 하나를 분담하고"},{"start":45.6,"end":48.8,"text":"당일 연락 대응을 다른 사람과 나누면"},{"start":48.8,"end":51.3,"text":"같은 퇴근 시각이어도 부담은"},{"start":51.3,"end":54.1,"text":"달라집니다. 어떤 업무를 맡을지,"},{"start":54.1,"end":56.2,"text":"급한 연락을 누가 받을지,"},{"start":56.2,"end":58.6,"text":"일이 몰리면 무엇을 미룰지"},{"start":58.6,"end":61.2,"text":"정해 보세요. 퇴근하고 밥 먹고"},{"start":61.2,"end":64.1,"text":"잠잘 힘이 남는지 보면 이렇게 계속"},{"start":64.1,"end":67.2,"text":"일할 수 있을지 판단하기 쉬워요."},{"start":67.2,"end":70.0,"text":"몸을 어떻게 치료할지 살피면서"},{"start":70.0,"end":72.4,"text":"직장에선 어떤 일을 나눌 수"},{"start":72.4,"end":75.0,"text":"있을지도 의논할 수 있어요."}]},{"start":75,"end":80,"text":"복귀할 때 근무 시간 옆에 실제로 줄이는 일도 한 줄 적으세요.","cues":[{"start":75.0,"end":77.6,"text":"복귀할 때 근무 시간 옆에 실제로"},{"start":77.6,"end":80.0,"text":"줄이는 일도 한 줄 적으세요."}]}],"sources":[{"title":"Workplace health: long-term sickness absence and capability to work – Recommendations","url":"https://www.nice.org.uk/guidance/ng146/chapter/recommendations"},{"title":"Workplace health: long-term sickness absence and capability to work – Rationale and impact","url":"https://www.nice.org.uk/guidance/NG146/chapter/rationale-and-impact"},{"title":"Returning to work after mental health issues","url":"https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/return-to-work-after-mental-health-issues/"},{"title":"Guidelines on mental health at work","url":"https://www.who.int/publications/i/item/9789240053052"},{"title":"Strategies to Prevent Worsening of Symptoms","url":"https://www.cdc.gov/me-cfs/hcp/clinical-care/treating-the-most-disruptive-symptoms-first-and-preventing-worsening-of-symptoms.html"}]},{"id":28,"title":"휴가만 가면 왜 배가 편해질까?","category":"스트레스·마음","original":"휴가 때는 배가 편했는데, 평소와 뭐가 달랐을까요?","length":90,"parts":[{"start":0,"end":2,"text":"휴가만 가면 배가 편해요?","cues":[{"start":0.0,"end":2.0,"text":"휴가만 가면 배가 편해요?"}]},{"start":2,"end":7,"text":"배가 편했던 날엔 평소와 뭐가 달랐는지 떠올려 보세요.","cues":[{"start":2.0,"end":4.1,"text":"배가 편했던 날엔 평소와"},{"start":4.1,"end":7.0,"text":"뭐가 달랐는지 떠올려 보세요."}]},{"start":7,"end":31,"text":"출근하는 날엔 커피부터 마시고 회의 사이에 급히 먹고 화장실은 미룹니다. 휴가 날엔 늦게 일어나 천천히 먹고 불편하면 바로 갈 수 있죠. 장소를 옮겼을 때 식사, 잠, 긴장, 화장실 여건이 한 번에 바뀐 겁니다. 평소와 다른 게 많아서 뭐 하나가 원인이었다고 단정하기 어려워요.","cues":[{"start":7.0,"end":10.2,"text":"출근하는 날엔 커피부터 마시고 회의"},{"start":10.2,"end":13.7,"text":"사이에 급히 먹고 화장실은 미룹니다."},{"start":13.7,"end":16.3,"text":"휴가 날엔 늦게 일어나 천천히"},{"start":16.3,"end":19.1,"text":"먹고 불편하면 바로 갈 수 있죠."},{"start":19.1,"end":21.7,"text":"장소를 옮겼을 때 식사, 잠, 긴장,"},{"start":21.7,"end":24.9,"text":"화장실 여건이 한 번에 바뀐 겁니다."},{"start":24.9,"end":27.7,"text":"평소와 다른 게 많아서 뭐 하나가"},{"start":27.7,"end":31.0,"text":"원인이었다고 단정하기 어려워요."}]},{"start":31,"end":36,"text":"장이 똑같이 늘어나도 어떤 날엔 더 아프게 느낄 수 있습니다.","cues":[{"start":31.0,"end":33.6,"text":"장이 똑같이 늘어나도 어떤 날엔"},{"start":33.6,"end":36.0,"text":"더 아프게 느낄 수 있습니다."}]},{"start":36,"end":83,"text":"예를 들어 휴가 때 아침마다 화장실에 바로 갈 수 있었다면, 평일과 비교할 단서가 하나 생깁니다. 긴장 정도까지 함께 바뀌었으니 그 정보만으로 원인을 정하진 않아요. 한꺼번에 고치면 달라진 이유도 알기 어렵죠. 장은 내용물을 움직이고 그 감각은 뇌에 전달됩니다. 몸 상태와 여건에 따라 불편의 정도는 달라질 수 있어요. 평일과 휴가의 차이를 보고 싶다면 먼저 한 조건을 바꿔 보세요. 예를 들어 아침 식사 속도를 늦춘 날과 급히 먹은 날을 비교하는 거죠. 증상이 계속되면 검사 결과를 가져가고 배가 언제 더 불편했는지 진료에서 알려 주세요.","cues":[{"start":36.0,"end":38.3,"text":"예를 들어 휴가 때 아침마다"},{"start":38.3,"end":40.8,"text":"화장실에 바로 갈 수 있었다면,"},{"start":40.8,"end":44.3,"text":"평일과 비교할 단서가 하나 생깁니다."},{"start":44.3,"end":47.0,"text":"긴장 정도까지 함께 바뀌었으니"},{"start":47.0,"end":49.5,"text":"그 정보만으로 원인을 정하진"},{"start":49.5,"end":51.6,"text":"않아요. 한꺼번에 고치면"},{"start":51.6,"end":54.2,"text":"달라진 이유도 알기 어렵죠."},{"start":54.2,"end":56.3,"text":"장은 내용물을 움직이고"},{"start":56.3,"end":58.9,"text":"그 감각은 뇌에 전달됩니다."},{"start":58.9,"end":61.5,"text":"몸 상태와 여건에 따라 불편의"},{"start":61.5,"end":63.8,"text":"정도는 달라질 수 있어요."},{"start":63.8,"end":66.2,"text":"평일과 휴가의 차이를 보고"},{"start":66.2,"end":69.4,"text":"싶다면 먼저 한 조건을 바꿔 보세요."},{"start":69.4,"end":72.1,"text":"예를 들어 아침 식사 속도를 늦춘"},{"start":72.1,"end":75.4,"text":"날과 급히 먹은 날을 비교하는 거죠."},{"start":75.4,"end":77.9,"text":"증상이 계속되면 검사 결과를"},{"start":77.9,"end":79.8,"text":"가져가고 배가 언제 더"},{"start":79.8,"end":83.0,"text":"불편했는지 진료에서 알려 주세요."}]},{"start":83,"end":90,"text":"휴가 때 배가 편했다면 그때 하던 것 중 평일에도 해 볼 수 있는 걸 하나 골라 보세요.","cues":[{"start":83.0,"end":84.9,"text":"휴가 때 배가 편했다면"},{"start":84.9,"end":87.2,"text":"그때 하던 것 중 평일에도 해"},{"start":87.2,"end":90.0,"text":"볼 수 있는 걸 하나 골라 보세요."}]}],"sources":[{"title":"Symptoms & Causes of Irritable Bowel Syndrome","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/irritable-bowel-syndrome/symptoms-causes"},{"title":"British Society of Gastroenterology guidelines on the management of irritable bowel syndrome","url":"https://gut.bmj.com/content/early/2021/04/27/gutjnl-2021-324598"},{"title":"Effect of coffee on distal colon function","url":"https://pubmed.ncbi.nlm.nih.gov/2338272/"},{"title":"2025 Seoul Consensus on Clinical Practice Guidelines for Irritable Bowel Syndrome","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11986658/"}]},{"id":29,"title":"정상 검사 뒤에도 검색을 다시 켜게 되는 순간","category":"스트레스·마음","original":"검사 결과가 정상인데 왜 며칠 지나면 또 걱정될까?","length":83,"parts":[{"start":0,"end":2,"text":"정상인데 또 증상 검색해요?","cues":[{"start":0.0,"end":2.0,"text":"정상인데 또 증상 검색해요?"}]},{"start":2,"end":8,"text":"검색하고 나면 마음이 놓이죠. 그런데 그 안심은 얼마나 갈까요?","cues":[{"start":2.0,"end":4.9,"text":"검색하고 나면 마음이 놓이죠."},{"start":4.9,"end":8.0,"text":"그런데 그 안심은 얼마나 갈까요?"}]},{"start":8,"end":33,"text":"몸이 평소와 조금 다르게 느껴져요. 검색하면 걱정돼서 몸을 더 자세히 보죠. 검사에서 괜찮다는 말을 듣고 잠깐 숨이 놓입니다. 며칠 뒤 몸이 비슷하게 느껴지면 또 확인부터 하고 싶어져요. 그때마다 확인 직후 안심을 얻었다면, 뇌는 확인하는 일이 꼭 필요하다고 배울 수 있습니다.","cues":[{"start":8.0,"end":11.3,"text":"몸이 평소와 조금 다르게 느껴져요."},{"start":11.3,"end":13.7,"text":"검색하면 걱정돼서 몸을 더"},{"start":13.7,"end":16.5,"text":"자세히 보죠. 검사에서 괜찮다는"},{"start":16.5,"end":19.4,"text":"말을 듣고 잠깐 숨이 놓입니다."},{"start":19.4,"end":22.2,"text":"며칠 뒤 몸이 비슷하게 느껴지면"},{"start":22.2,"end":24.9,"text":"또 확인부터 하고 싶어져요."},{"start":24.9,"end":27.3,"text":"그때마다 확인 직후 안심을"},{"start":27.3,"end":29.9,"text":"얻었다면, 뇌는 확인하는 일이"},{"start":29.9,"end":33.0,"text":"꼭 필요하다고 배울 수 있습니다."}]},{"start":33,"end":39,"text":"잠깐 안심하고 나서 또 확인하기까지 시간이 점점 짧아질 수 있어요.","cues":[{"start":33.0,"end":36.2,"text":"잠깐 안심하고 나서 또 확인하기까지"},{"start":36.2,"end":39.0,"text":"시간이 점점 짧아질 수 있어요."}]},{"start":39,"end":76,"text":"어떤 날은 검색한 직후 마음이 놓였는데 십 분 뒤 다른 글을 또 열 수 있어요. 그게 반복되면 어느 정보가 맞는지 찾아다니느라 불안해지는 시간 자체가 길어집니다. 치료할 때는 몸의 증상을 진료하면서 언제, 얼마나 자주 확인하는지도 살펴볼 수 있어요. 새롭거나 지속되는 변화는 의료진과 정한 기준에 따라 확인하세요. 익숙한 걱정이 돌아올 땐 불안해진 시점과 검색하고 나서 편해진 시간이 얼마나 갔는지 적어볼 수 있습니다.","cues":[{"start":39.0,"end":41.5,"text":"어떤 날은 검색한 직후 마음이"},{"start":41.5,"end":43.9,"text":"놓였는데 십 분 뒤 다른 글을"},{"start":43.9,"end":46.4,"text":"또 열 수 있어요. 그게 반복되면"},{"start":46.4,"end":49.4,"text":"어느 정보가 맞는지 찾아다니느라"},{"start":49.4,"end":52.9,"text":"불안해지는 시간 자체가 길어집니다."},{"start":52.9,"end":55.0,"text":"치료할 때는 몸의 증상을"},{"start":55.0,"end":57.5,"text":"진료하면서 언제, 얼마나 자주"},{"start":57.5,"end":60.6,"text":"확인하는지도 살펴볼 수 있어요."},{"start":60.6,"end":63.8,"text":"새롭거나 지속되는 변화는 의료진과"},{"start":63.8,"end":66.6,"text":"정한 기준에 따라 확인하세요."},{"start":66.6,"end":68.7,"text":"익숙한 걱정이 돌아올 땐"},{"start":68.7,"end":71.0,"text":"불안해진 시점과 검색하고"},{"start":71.0,"end":73.4,"text":"나서 편해진 시간이 얼마나"},{"start":73.4,"end":76.0,"text":"갔는지 적어볼 수 있습니다."}]},{"start":76,"end":83,"text":"검색창을 다시 열었다면 지난번 검색 뒤 얼마나 마음이 편했는지 떠올려 보세요.","cues":[{"start":76.0,"end":78.1,"text":"검색창을 다시 열었다면"},{"start":78.1,"end":80.6,"text":"지난번 검색 뒤 얼마나 마음이"},{"start":80.6,"end":83.0,"text":"편했는지 떠올려 보세요."}]}],"sources":[{"title":"Health anxiety","url":"https://www.nhs.uk/mental-health/conditions/health-anxiety/"},{"title":"Cognitive-behaviour therapy for health anxiety in medical patients (CHAMP): a randomised controlled trial with outcomes to 5 years","url":"https://pubmed.ncbi.nlm.nih.gov/28877841/"},{"title":"I’m So Stressed Out! Fact Sheet","url":"https://www.nimh.nih.gov/health/publications/so-stressed-out-fact-sheet"}]},{"id":30,"title":"영상 검사에서는 정상인데 왜 계속 아플까?","category":"스트레스·마음","original":"검사는 정상인데 계속 아프다면, 스트레스는 통증에 어떤 영향을 줄까?","length":88,"parts":[{"start":0,"end":2,"text":"사진은 정상, 통증은 그대로.","cues":[{"start":0.0,"end":2.0,"text":"사진은 정상, 통증은 그대로."}]},{"start":2,"end":8,"text":"영상에 이상이 안 보여도 몸은 계속 아플 수 있어요. 왜 그런지 볼게요.","cues":[{"start":2.0,"end":5.0,"text":"영상에 이상이 안 보여도 몸은 계속"},{"start":5.0,"end":8.0,"text":"아플 수 있어요. 왜 그런지 볼게요."}]},{"start":8,"end":36,"text":"영상 검사는 몸의 구조에 어떤 변화가 생겼는지 보는 검사예요. 검사에서 찾던 이상이 보이지 않으면 그 원인일 가능성은 낮아질 수 있습니다. 통증은 몸의 조직에서 어떤 신호가 오는지, 신경계가 그 신호를 어떻게 받아들이는지에 따라 달라져요. 그래서 잠이 부족하거나 긴장한 날 같은 움직임이 더 아프게 느껴질 수 있죠.","cues":[{"start":8.0,"end":10.1,"text":"영상 검사는 몸의 구조에"},{"start":10.1,"end":13.6,"text":"어떤 변화가 생겼는지 보는 검사예요."},{"start":13.6,"end":16.2,"text":"검사에서 찾던 이상이 보이지"},{"start":16.2,"end":18.5,"text":"않으면 그 원인일 가능성은"},{"start":18.5,"end":21.3,"text":"낮아질 수 있습니다. 통증은 몸의"},{"start":21.3,"end":23.9,"text":"조직에서 어떤 신호가 오는지,"},{"start":23.9,"end":26.2,"text":"신경계가 그 신호를 어떻게"},{"start":26.2,"end":29.3,"text":"받아들이는지에 따라 달라져요."},{"start":29.3,"end":32.3,"text":"그래서 잠이 부족하거나 긴장한 날"},{"start":32.3,"end":36.0,"text":"같은 움직임이 더 아프게 느껴질 수 있죠."}]},{"start":36,"end":41,"text":"그렇다면 할 수 있는 일은 사진을 다시 찍는 것뿐일까요?","cues":[{"start":36.0,"end":38.1,"text":"그렇다면 할 수 있는 일은"},{"start":38.1,"end":41.0,"text":"사진을 다시 찍는 것뿐일까요?"}]},{"start":41,"end":81,"text":"같은 거리도 밤에 자주 깬 뒤엔 중간에 쉬어야 하고 다른 날엔 끝까지 걸을 수 있죠. 어느 날 덜 아팠어도 다른 날 느낀 통증은 실제예요. 언제 몸이 더 힘들고 다시 하고 싶은 일이 뭔지 이야기해 보면 도움이 돼요. 어떤 동작을 얼마나 할 수 있는지부터 보면 치료 목표가 생겨요. 예전엔 십 분 걷고 장을 봤는데 지금은 중간에 앉아야 한다는 식입니다. 새 증상이 생기거나 빠르게 심해지면 다시 진료받으세요. 통증을 줄이고 원래 하던 일을 다시 할 방법을 의논할 수 있어요.","cues":[{"start":41.0,"end":43.6,"text":"같은 거리도 밤에 자주 깬 뒤엔"},{"start":43.6,"end":46.8,"text":"중간에 쉬어야 하고 다른 날엔 끝까지"},{"start":46.8,"end":49.5,"text":"걸을 수 있죠. 어느 날 덜 아팠어도"},{"start":49.5,"end":52.4,"text":"다른 날 느낀 통증은 실제예요."},{"start":52.4,"end":54.9,"text":"언제 몸이 더 힘들고 다시 하고"},{"start":54.9,"end":57.5,"text":"싶은 일이 뭔지 이야기해 보면"},{"start":57.5,"end":59.6,"text":"도움이 돼요. 어떤 동작을"},{"start":59.6,"end":62.2,"text":"얼마나 할 수 있는지부터 보면"},{"start":62.2,"end":64.5,"text":"치료 목표가 생겨요. 예전엔"},{"start":64.5,"end":67.1,"text":"십 분 걷고 장을 봤는데 지금은"},{"start":67.1,"end":70.2,"text":"중간에 앉아야 한다는 식입니다."},{"start":70.2,"end":72.5,"text":"새 증상이 생기거나 빠르게"},{"start":72.5,"end":75.4,"text":"심해지면 다시 진료받으세요."},{"start":75.4,"end":77.9,"text":"통증을 줄이고 원래 하던 일을"},{"start":77.9,"end":81.0,"text":"다시 할 방법을 의논할 수 있어요."}]},{"start":81,"end":88,"text":"‘사진은 정상인데’ 뒤에 이어 주세요. ‘그래도 제가 다시 하고 싶은 일은 이겁니다.’","cues":[{"start":81.0,"end":83.4,"text":"‘사진은 정상인데’ 뒤에 이어"},{"start":83.4,"end":85.5,"text":"주세요. ‘그래도 제가 다시"},{"start":85.5,"end":88.0,"text":"하고 싶은 일은 이겁니다.’"}]}],"sources":[{"title":"Medically unexplained symptoms","url":"https://www.nhs.uk/conditions/medically-unexplained-symptoms/"},{"title":"Chronic pain (primary and secondary) in over 16s: assessment of all chronic pain and management of chronic primary pain","url":"https://www.nice.org.uk/guidance/ng193/chapter/recommendations"},{"title":"Pain","url":"https://www.ninds.nih.gov/health-information/disorders/pain"}]},{"id":31,"title":"혈당은 좋아졌는데 LDL 콜레스테롤이 오른 이유","category":"체중·대사","original":"살도 빠지고 혈당도 좋아졌는데 LDL 콜레스테롤은 왜 올랐을까?","length":83,"parts":[{"start":0,"end":2,"text":"살 빼고 엘디엘은 올랐어요?","cues":[{"start":0.0,"end":2.0,"text":"살 빼고 엘디엘은 올랐어요?"}]},{"start":2,"end":9,"text":"같은 검사표에서 혈당은 좋아졌는데 엘디엘 콜레스테롤은 오를 수 있어요.","cues":[{"start":2.0,"end":5.3,"text":"같은 검사표에서 혈당은 좋아졌는데"},{"start":5.3,"end":9.0,"text":"엘디엘 콜레스테롤은 오를 수 있어요."}]},{"start":9,"end":37,"text":"혈당은 혈액 속 포도당의 상태를 보여줍니다. 엘디엘 콜레스테롤은 엘디엘이라는 운반 입자에 실린 콜레스테롤 양을 뜻해요. 식사가 바뀌면 두 지표에 같은 변화가 생기는 건 아닙니다. 예를 들어 탄수화물은 줄였는데 버터나 지방이 많은 고기가 늘었다면, 일부 사람에선 혈당과 엘디엘이 서로 다르게 움직일 수 있어요.","cues":[{"start":9.0,"end":11.8,"text":"혈당은 혈액 속 포도당의 상태를"},{"start":11.8,"end":14.8,"text":"보여줍니다. 엘디엘 콜레스테롤은"},{"start":14.8,"end":17.2,"text":"엘디엘이라는 운반 입자에"},{"start":17.2,"end":20.1,"text":"실린 콜레스테롤 양을 뜻해요."},{"start":20.1,"end":22.2,"text":"식사가 바뀌면 두 지표에"},{"start":22.2,"end":25.3,"text":"같은 변화가 생기는 건 아닙니다."},{"start":25.3,"end":28.1,"text":"예를 들어 탄수화물은 줄였는데"},{"start":28.1,"end":31.3,"text":"버터나 지방이 많은 고기가 늘었다면,"},{"start":31.3,"end":34.1,"text":"일부 사람에선 혈당과 엘디엘이"},{"start":34.1,"end":37.0,"text":"서로 다르게 움직일 수 있어요."}]},{"start":37,"end":44,"text":"여기서 체중이 줄었다는 숫자가 올라간 수치를 대신 설명해 주진 않습니다.","cues":[{"start":37.0,"end":40.6,"text":"여기서 체중이 줄었다는 숫자가 올라간"},{"start":40.6,"end":44.0,"text":"수치를 대신 설명해 주진 않습니다."}]},{"start":44,"end":75,"text":"가령 같은 수치라도 이번에 처음 오른 경우와 몇 년째 높았던 경우가 있죠. 두 경우는 입자에 노출된 기간부터 다를 수 있어요. 이 입자가 동맥에 미치는 영향은 오래 노출될수록 쌓일 수 있어요. 식사에서 어떤 지방이 늘었는지, 식이섬유가 많은 음식이 줄었는지 보고 가족력과 예전 검사 수치도 함께 확인해요. 검사 한 번으로 음식 하나가 원인이라고 보긴 어렵죠.","cues":[{"start":44.0,"end":46.3,"text":"가령 같은 수치라도 이번에"},{"start":46.3,"end":49.0,"text":"처음 오른 경우와 몇 년째 높았던"},{"start":49.0,"end":51.6,"text":"경우가 있죠. 두 경우는 입자에"},{"start":51.6,"end":54.6,"text":"노출된 기간부터 다를 수 있어요."},{"start":54.6,"end":57.3,"text":"이 입자가 동맥에 미치는 영향은"},{"start":57.3,"end":60.3,"text":"오래 노출될수록 쌓일 수 있어요."},{"start":60.3,"end":63.1,"text":"식사에서 어떤 지방이 늘었는지,"},{"start":63.1,"end":65.2,"text":"식이섬유가 많은 음식이"},{"start":65.2,"end":67.7,"text":"줄었는지 보고 가족력과 예전"},{"start":67.7,"end":70.3,"text":"검사 수치도 함께 확인해요."},{"start":70.3,"end":72.6,"text":"검사 한 번으로 음식 하나가"},{"start":72.6,"end":75.0,"text":"원인이라고 보긴 어렵죠."}]},{"start":75,"end":83,"text":"혈당이 좋아진 건 반가운 일이죠. 엘디엘 콜레스테롤이 왜 올랐는지는 따로 살펴보세요.","cues":[{"start":75.0,"end":78.0,"text":"혈당이 좋아진 건 반가운 일이죠."},{"start":78.0,"end":80.2,"text":"엘디엘 콜레스테롤이 왜"},{"start":80.2,"end":83.0,"text":"올랐는지는 따로 살펴보세요."}]}],"sources":[{"title":"Introduction to Lipids and Lipoproteins — Endotext, Kenneth R. Feingold","url":"https://www.endotext.org/wp-content/uploads/pdfs/introduction-to-lipids-and-lipoproteins.pdf"},{"title":"Low-density lipoproteins cause atherosclerotic cardiovascular disease: pathophysiological, genetic, and therapeutic insights — EAS Consensus Panel","url":"https://doi.org/10.1093/eurheartj/ehz962"},{"title":"2024 KSoLA consensus on secondary dyslipidemia","url":"https://www.kjim.org/journal/view.php?doi=10.3904/kjim.2024.156"},{"title":"Effect of a ketogenic diet versus Mediterranean diet on glycated hemoglobin in individuals with prediabetes and type 2 diabetes mellitus: The interventional Keto-Med randomized crossover trial","url":"https://pubmed.ncbi.nlm.nih.gov/35641199/"},{"title":"한국지질·동맥경화학회 이상지질혈증 진료지침 2026","url":"https://www.lipid.or.kr/reference/guideline.php?boardid=guideline&category=&idx=1456&mode=view"}]},{"id":32,"title":"마운자로 맞고 배가 안 고플 때, 끼니는 어떻게 챙길까?","category":"체중·대사","original":"마운자로로 허기가 사라져도 몸은 왜 식사를 필요로 할까?","length":89,"parts":[{"start":0,"end":2,"text":"마운자로 맞고 덜 먹나요?","cues":[{"start":0.0,"end":2.0,"text":"마운자로 맞고 덜 먹나요?"}]},{"start":2,"end":8,"text":"예전보다 적게 먹는다면 어떤 음식부터 챙길지 생각해 보세요.","cues":[{"start":2.0,"end":4.3,"text":"예전보다 적게 먹는다면"},{"start":4.3,"end":8.0,"text":"어떤 음식부터 챙길지 생각해 보세요."}]},{"start":8,"end":52,"text":"마운자로를 맞고 나면 몇 입만 먹어도 배가 부를 수 있습니다. 오래 안 먹어도 음식 생각이 덜 날 수 있고요. 식욕 신호가 달라진 겁니다. 그 사이에도 몸은 움직이고 조직을 유지하는 데 에너지와 영양소를 씁니다. 한 끼에 과일 한 조각만 먹는 날이 이어지면 다른 음식을 먹을 기회도 줄어요. 가령 아침엔 차 한 잔, 점심엔 빵 한 조각, 저녁엔 국물만 먹은 날이 이어졌다고 해볼게요. 배가 덜 고프다고 해서 몸에 필요한 만큼 먹었다는 뜻은 아니죠. 먹고 싶지 않은 건지 음식이 잘 안 넘어가는 건지도 구분해야 해요.","cues":[{"start":8.0,"end":10.6,"text":"마운자로를 맞고 나면 몇 입만"},{"start":10.6,"end":13.4,"text":"먹어도 배가 부를 수 있습니다."},{"start":13.4,"end":16.4,"text":"오래 안 먹어도 음식 생각이 덜 날 수"},{"start":16.4,"end":19.7,"text":"있고요. 식욕 신호가 달라진 겁니다."},{"start":19.7,"end":22.1,"text":"그 사이에도 몸은 움직이고"},{"start":22.1,"end":24.7,"text":"조직을 유지하는 데 에너지와"},{"start":24.7,"end":27.2,"text":"영양소를 씁니다. 한 끼에 과일"},{"start":27.2,"end":29.8,"text":"한 조각만 먹는 날이 이어지면"},{"start":29.8,"end":32.9,"text":"다른 음식을 먹을 기회도 줄어요."},{"start":32.9,"end":35.2,"text":"가령 아침엔 차 한 잔, 점심엔"},{"start":35.2,"end":37.8,"text":"빵 한 조각, 저녁엔 국물만 먹은"},{"start":37.8,"end":40.5,"text":"날이 이어졌다고 해볼게요."},{"start":40.5,"end":42.8,"text":"배가 덜 고프다고 해서 몸에"},{"start":42.8,"end":46.1,"text":"필요한 만큼 먹었다는 뜻은 아니죠."},{"start":46.1,"end":48.9,"text":"먹고 싶지 않은 건지 음식이 잘 안"},{"start":48.9,"end":52.0,"text":"넘어가는 건지도 구분해야 해요."}]},{"start":52,"end":58,"text":"단백질 음료 한 잔으로 끼니에 빠진 영양을 다 채우긴 어려워요.","cues":[{"start":52.0,"end":54.7,"text":"단백질 음료 한 잔으로 끼니에"},{"start":54.7,"end":58.0,"text":"빠진 영양을 다 채우긴 어려워요."}]},{"start":58,"end":82,"text":"먹을 수 있는 양 안에서 단백질과 식이섬유가 든 음식을 챙기고 물과 에너지도 충분한지 봐야 해요. 실제 근육을 쓰는 활동과 회복도 중요하죠. 메스꺼움이나 구토 때문에 음식은 물론 물도 넘기기 어렵다면 마운자로를 맞고 있다는 것과 어떤 증상이 생겼는지 의료진에게 알리세요.","cues":[{"start":58.0,"end":60.7,"text":"먹을 수 있는 양 안에서 단백질과"},{"start":60.7,"end":63.3,"text":"식이섬유가 든 음식을 챙기고"},{"start":63.3,"end":66.5,"text":"물과 에너지도 충분한지 봐야 해요."},{"start":66.5,"end":69.3,"text":"실제 근육을 쓰는 활동과 회복도"},{"start":69.3,"end":71.8,"text":"중요하죠. 메스꺼움이나 구토"},{"start":71.8,"end":74.5,"text":"때문에 음식은 물론 물도 넘기기"},{"start":74.5,"end":76.9,"text":"어렵다면 마운자로를 맞고"},{"start":76.9,"end":79.0,"text":"있다는 것과 어떤 증상이"},{"start":79.0,"end":82.0,"text":"생겼는지 의료진에게 알리세요."}]},{"start":82,"end":89,"text":"오늘 얼마나 배가 고팠는지, 실제로 끼니마다 뭘 먹었는지 같이 떠올려 보세요.","cues":[{"start":82.0,"end":84.4,"text":"오늘 얼마나 배가 고팠는지,"},{"start":84.4,"end":86.1,"text":"실제로 끼니마다 뭘"},{"start":86.1,"end":89.0,"text":"먹었는지 같이 떠올려 보세요."}]}],"sources":[{"title":"Nutritional priorities to support GLP-1 therapy for obesity: a joint Advisory","url":"https://doi.org/10.1016/j.ajcnut.2025.04.023"},{"title":"MOUNJARO (tirzepatide) U.S. prescribing information","url":"https://pi.lilly.com/us/mounjaro-uspi.pdf"},{"title":"Multivitamin/mineral Supplements: Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/MVMS-Consumer/"}]},{"id":33,"title":"비만 치료 주사를 맞는데 살이 더 안 빠진다면","category":"체중·대사","original":"비만 치료 주사를 맞는데 살이 더 안 빠진다. 약효가 떨어진 걸까?","length":89,"parts":[{"start":0,"end":2,"text":"주사 맞아도 살이 안 빠져요?","cues":[{"start":0.0,"end":2.0,"text":"주사 맞아도 살이 안 빠져요?"}]},{"start":2,"end":7,"text":"체중이 제자리여도 약의 효과가 남아 있을 수 있어요.","cues":[{"start":2.0,"end":4.2,"text":"체중이 제자리여도 약의"},{"start":4.2,"end":7.0,"text":"효과가 남아 있을 수 있어요."}]},{"start":7,"end":29,"text":"처음엔 몇 주마다 숫자가 내려갔죠. 체중이 줄면 똑같은 하루를 보내도 몸이 쓰는 에너지가 달라질 수 있습니다. 예전과 비슷하게 먹고 움직여도 체중 변화는 둔해질 수 있어요. 배고픈 정도와 먹는 양은 예전과 같고 줄어든 체중도 유지되는 중일 수도 있죠.","cues":[{"start":7.0,"end":10.2,"text":"처음엔 몇 주마다 숫자가 내려갔죠."},{"start":10.2,"end":13.1,"text":"체중이 줄면 똑같은 하루를 보내도"},{"start":13.1,"end":16.8,"text":"몸이 쓰는 에너지가 달라질 수 있습니다."},{"start":16.8,"end":19.5,"text":"예전과 비슷하게 먹고 움직여도"},{"start":19.5,"end":22.2,"text":"체중 변화는 둔해질 수 있어요."},{"start":22.2,"end":25.4,"text":"배고픈 정도와 먹는 양은 예전과 같고"},{"start":25.4,"end":29.0,"text":"줄어든 체중도 유지되는 중일 수도 있죠."}]},{"start":29,"end":35,"text":"잘 빠지다가 멈춘 건지, 처음부터 거의 안 빠졌는지도 중요해요.","cues":[{"start":29.0,"end":32.0,"text":"잘 빠지다가 멈춘 건지, 처음부터"},{"start":32.0,"end":35.0,"text":"거의 안 빠졌는지도 중요해요."}]},{"start":35,"end":81,"text":"체중이 같아진 날만 보면 놓치기 쉽죠. 예전만큼 허기가 돌아왔는지, 아니면 작은 양으로도 여전히 식사가 끝나는지 확인해 보세요. 체중이 제자리에 머무는 동안 그런 느낌이 새로 생겼는지 살펴보세요. 처음 어떻게 반응했는지, 얼마나 오래 같은 범위인지, 목표로 삼은 혈당이나 생활 기능이 어떻게 바뀌었는지를 봐요. 부작용 때문에 끼니를 거르는지, 처방받은 일정대로 맞는지도 중요합니다. 이상을 느껴도 스스로 용량을 올리기보다 처방한 곳에 체중이 언제부터 그대로인지, 배고픔이나 먹는 양이 달라졌는지 알려 주세요.","cues":[{"start":35.0,"end":38.5,"text":"체중이 같아진 날만 보면 놓치기 쉽죠."},{"start":38.5,"end":41.0,"text":"예전만큼 허기가 돌아왔는지,"},{"start":41.0,"end":43.6,"text":"아니면 작은 양으로도 여전히"},{"start":43.6,"end":46.7,"text":"식사가 끝나는지 확인해 보세요."},{"start":46.7,"end":49.2,"text":"체중이 제자리에 머무는 동안"},{"start":49.2,"end":52.9,"text":"그런 느낌이 새로 생겼는지 살펴보세요."},{"start":52.9,"end":55.1,"text":"처음 어떻게 반응했는지,"},{"start":55.1,"end":57.4,"text":"얼마나 오래 같은 범위인지,"},{"start":57.4,"end":59.7,"text":"목표로 삼은 혈당이나 생활"},{"start":59.7,"end":63.0,"text":"기능이 어떻게 바뀌었는지를 봐요."},{"start":63.0,"end":65.8,"text":"부작용 때문에 끼니를 거르는지,"},{"start":65.8,"end":68.3,"text":"처방받은 일정대로 맞는지도"},{"start":68.3,"end":70.7,"text":"중요합니다. 이상을 느껴도"},{"start":70.7,"end":73.0,"text":"스스로 용량을 올리기보다"},{"start":73.0,"end":75.6,"text":"처방한 곳에 체중이 언제부터"},{"start":75.6,"end":78.1,"text":"그대로인지, 배고픔이나 먹는"},{"start":78.1,"end":81.0,"text":"양이 달라졌는지 알려 주세요."}]},{"start":81,"end":89,"text":"몇 킬로 더 빠졌는지 기록할 때 이미 빠진 체중을 얼마나 유지하고 있는지도 적어 보세요.","cues":[{"start":81.0,"end":83.6,"text":"몇 킬로 더 빠졌는지 기록할 때"},{"start":83.6,"end":85.8,"text":"이미 빠진 체중을 얼마나"},{"start":85.8,"end":89.0,"text":"유지하고 있는지도 적어 보세요."}]}],"sources":[{"title":"Prescription Medications to Treat Overweight & Obesity","url":"https://www.niddk.nih.gov/health-information/weight-management/prescription-medications-treat-overweight-obesity"},{"title":"Two-year effects of semaglutide in adults with overweight or obesity: the STEP 5 trial","url":"https://www.nature.com/articles/s41591-022-02026-4.pdf"},{"title":"Nutritional priorities to support GLP-1 therapy for obesity: a joint Advisory","url":"https://doi.org/10.1016/j.ajcnut.2025.04.023"}]},{"id":34,"title":"마운자로를 끊으면 왜 다시 배고플까?","category":"체중·대사","original":"비만 치료 주사를 끊으면 왜 다시 배고플까? 끊기 전에 세우는 계획","length":81,"parts":[{"start":0,"end":2,"text":"마운자로 끊자, 다시 배고파요?","cues":[{"start":0.0,"end":2.0,"text":"마운자로 끊자, 다시 배고파요?"}]},{"start":2,"end":7,"text":"체중계보다 식탁에서 먼저 느낄 수 있는 변화가 있어요.","cues":[{"start":2.0,"end":3.9,"text":"체중계보다 식탁에서"},{"start":3.9,"end":7.0,"text":"먼저 느낄 수 있는 변화가 있어요."}]},{"start":7,"end":29,"text":"마운자로를 맞을 땐 몇 숟갈만 먹어도 배가 차거나, 오후에 간식 생각이 덜 났을 수 있어요. 마운자로에 들어 있는 터제파타이드는 식욕과 먹는 양을 줄일 수 있습니다. 약을 끊고 효과가 줄면 배고픔이 더 빨리 오거나, 같은 양을 먹어도 덜 배부르게 느낄 수 있어요.","cues":[{"start":7.0,"end":9.5,"text":"마운자로를 맞을 땐 몇 숟갈만"},{"start":9.5,"end":11.8,"text":"먹어도 배가 차거나, 오후에"},{"start":11.8,"end":14.5,"text":"간식 생각이 덜 났을 수 있어요."},{"start":14.5,"end":17.9,"text":"마운자로에 들어 있는 터제파타이드는"},{"start":17.9,"end":21.0,"text":"식욕과 먹는 양을 줄일 수 있습니다."},{"start":21.0,"end":23.7,"text":"약을 끊고 효과가 줄면 배고픔이"},{"start":23.7,"end":26.4,"text":"더 빨리 오거나, 같은 양을 먹어도"},{"start":26.4,"end":29.0,"text":"덜 배부르게 느낄 수 있어요."}]},{"start":29,"end":35,"text":"그럼 배가 다시 고파지는 게 곧바로 체중이 늘어난다는 뜻일까요?","cues":[{"start":29.0,"end":32.1,"text":"그럼 배가 다시 고파지는 게 곧바로"},{"start":32.1,"end":35.0,"text":"체중이 늘어난다는 뜻일까요?"}]},{"start":35,"end":74,"text":"당뇨가 없는 성인을 대상으로 한 연구에서, 마운자로와 같은 성분을 중단한 사람들의 체중은 이후 일 년 동안 평균적으로 다시 늘었어요. 내 체중이 얼마나 달라질지는 허기만으로 알기 어렵습니다. 예전엔 저녁까지 괜찮았는데 요즘엔 오후 네 시부터 간식이 생각나는지 보세요. 하루만 유난히 배고팠는지, 비슷한 날에도 같은 변화가 이어지는지 살펴보고요. 약을 끊을 계획이라면 언제 다시 진료를 받고 어떤 변화를 확인할지 처방한 곳과 미리 정해 두세요.","cues":[{"start":35.0,"end":37.7,"text":"당뇨가 없는 성인을 대상으로 한"},{"start":37.7,"end":40.6,"text":"연구에서, 마운자로와 같은 성분을"},{"start":40.6,"end":43.3,"text":"중단한 사람들의 체중은 이후 일"},{"start":43.3,"end":46.5,"text":"년 동안 평균적으로 다시 늘었어요."},{"start":46.5,"end":49.0,"text":"내 체중이 얼마나 달라질지는"},{"start":49.0,"end":51.8,"text":"허기만으로 알기 어렵습니다."},{"start":51.8,"end":54.3,"text":"예전엔 저녁까지 괜찮았는데"},{"start":54.3,"end":56.1,"text":"요즘엔 오후 네 시부터"},{"start":56.1,"end":58.7,"text":"간식이 생각나는지 보세요."},{"start":58.7,"end":61.0,"text":"하루만 유난히 배고팠는지,"},{"start":61.0,"end":63.3,"text":"비슷한 날에도 같은 변화가"},{"start":63.3,"end":65.6,"text":"이어지는지 살펴보고요."},{"start":65.6,"end":68.3,"text":"약을 끊을 계획이라면 언제 다시"},{"start":68.3,"end":71.2,"text":"진료를 받고 어떤 변화를 확인할지"},{"start":71.2,"end":74.0,"text":"처방한 곳과 미리 정해 두세요."}]},{"start":74,"end":81,"text":"체중계 숫자를 기다리기 전에, 언제 배고프고 얼마나 먹어야 배가 차는지 보세요.","cues":[{"start":74.0,"end":76.5,"text":"체중계 숫자를 기다리기 전에,"},{"start":76.5,"end":78.4,"text":"언제 배고프고 얼마나"},{"start":78.4,"end":81.0,"text":"먹어야 배가 차는지 보세요."}]}],"sources":[{"title":"마운자로(터
