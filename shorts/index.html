rt":48.7,"end":52.0,"text":"실제로 필요한 평가를 놓칠 수 있죠."},{"start":52.0,"end":55.5,"text":"이전 검사 결과가 있으면 꺼내 보세요."},{"start":55.5,"end":58.3,"text":"혈당과 혈압, 지질이 어느 범위에"},{"start":58.3,"end":61.0,"text":"있는지 각각 확인해 보세요."},{"start":61.0,"end":63.5,"text":"어느 숫자가 변했는지에 따라"},{"start":63.5,"end":66.3,"text":"추가로 확인할 일과 우선순위가"},{"start":66.3,"end":69.3,"text":"달라집니다. 이미 먹는 양이 적거나"},{"start":69.3,"end":72.1,"text":"근력이 줄었다면 살을 더 빼는 게"},{"start":72.1,"end":75.0,"text":"먼저 할 일이 아닐 수도 있어요."}]},{"start":75,"end":81,"text":"몸무게가 그대로라면, 검진에서 달라진 수치부터 살펴보세요.","cues":[{"start":75.0,"end":78.0,"text":"몸무게가 그대로라면, 검진에서"},{"start":78.0,"end":81.0,"text":"달라진 수치부터 살펴보세요."}]}],"sources":[{"title":"Metabolic Syndrome — Diagnosis","url":"https://www.nhlbi.nih.gov/health/metabolic-syndrome/diagnosis"},{"title":"About Insulin Resistance and Type 2 Diabetes","url":"https://www.cdc.gov/diabetes/about/insulin-resistance-type-2-diabetes.html"},{"title":"Am I at a Healthy Weight?","url":"https://www.niddk.nih.gov/health-information/weight-management/adult-overweight-obesity/am-i-healthy-weight"}]},{"id":36,"title":"폐경 전후 몸무게는 그대로인데 허리둘레와 힘은 왜 달라질까?","category":"체중·대사","original":"폐경 전후 몸무게는 그대로인데 왜 허리둘레가 늘고 힘이 줄까?","length":84,"parts":[{"start":0,"end":2,"text":"체중은 그대로, 허리만 꽉 껴요.","cues":[{"start":0.0,"end":2.0,"text":"체중은 그대로, 허리만 꽉 껴요."}]},{"start":2,"end":8,"text":"몸무게가 같은데 옷이 끼고 힘은 줄었다고 느끼는 이유가 있어요.","cues":[{"start":2.0,"end":4.8,"text":"몸무게가 같은데 옷이 끼고 힘은"},{"start":4.8,"end":8.0,"text":"줄었다고 느끼는 이유가 있어요."}]},{"start":8,"end":31,"text":"바지 허리는 조이는데 몸무게는 작년과 비슷해요. 장을 보고 오는 길엔 장바구니가 더 무겁게 느껴져요. 폐경 전후에는 나이가 드는 과정과 함께 지방의 분포나 근육 상태가 달라질 수 있습니다. 몸무게가 같아도 허리둘레가 달라지고 예전만큼 힘이 안 날 수 있는 거죠.","cues":[{"start":8.0,"end":10.7,"text":"바지 허리는 조이는데 몸무게는"},{"start":10.7,"end":13.5,"text":"작년과 비슷해요. 장을 보고 오는"},{"start":13.5,"end":16.9,"text":"길엔 장바구니가 더 무겁게 느껴져요."},{"start":16.9,"end":19.2,"text":"폐경 전후에는 나이가 드는"},{"start":19.2,"end":22.0,"text":"과정과 함께 지방의 분포나 근육"},{"start":22.0,"end":24.6,"text":"상태가 달라질 수 있습니다."},{"start":24.6,"end":28.0,"text":"몸무게가 같아도 허리둘레가 달라지고"},{"start":28.0,"end":31.0,"text":"예전만큼 힘이 안 날 수 있는 거죠."}]},{"start":31,"end":35,"text":"그럼 체성분 검사표의 근육량만 보면 될까요?","cues":[{"start":31.0,"end":32.9,"text":"그럼 체성분 검사표의"},{"start":32.9,"end":35.0,"text":"근육량만 보면 될까요?"}]},{"start":35,"end":76,"text":"가령 바지 치수는 달라졌는데 계단을 오르는 힘은 그대로일 수 있어요. 반대로 옷은 비슷하게 맞아도 장을 본 뒤 가방을 들기 힘든 사람이 있죠. 같은 몸무게라도 일상에서 지켜야 할 능력은 사람마다 달라요. 근육이 얼마나 있는지와 실제로 얼마나 힘을 낼 수 있는지는 따로 봅니다. 의자에서 일어나기, 계단 오르기, 가방 들기가 어떻게 바뀌었는지 보면 생활 목표를 잡는 데 도움이 돼요. 몸무게만 보며 식사를 계속 줄이다 보면 가방을 들 힘처럼 지켜야 할 기능도 놓칠 수 있죠.","cues":[{"start":35.0,"end":38.2,"text":"가령 바지 치수는 달라졌는데 계단을"},{"start":38.2,"end":41.2,"text":"오르는 힘은 그대로일 수 있어요."},{"start":41.2,"end":44.2,"text":"반대로 옷은 비슷하게 맞아도 장을"},{"start":44.2,"end":47.4,"text":"본 뒤 가방을 들기 힘든 사람이 있죠."},{"start":47.4,"end":49.7,"text":"같은 몸무게라도 일상에서"},{"start":49.7,"end":53.0,"text":"지켜야 할 능력은 사람마다 달라요."},{"start":53.0,"end":55.7,"text":"근육이 얼마나 있는지와 실제로"},{"start":55.7,"end":59.4,"text":"얼마나 힘을 낼 수 있는지는 따로 봅니다."},{"start":59.4,"end":62.1,"text":"의자에서 일어나기, 계단 오르기,"},{"start":62.1,"end":65.3,"text":"가방 들기가 어떻게 바뀌었는지 보면"},{"start":65.3,"end":68.3,"text":"생활 목표를 잡는 데 도움이 돼요."},{"start":68.3,"end":70.6,"text":"몸무게만 보며 식사를 계속"},{"start":70.6,"end":73.2,"text":"줄이다 보면 가방을 들 힘처럼"},{"start":73.2,"end":76.0,"text":"지켜야 할 기능도 놓칠 수 있죠."}]},{"start":76,"end":84,"text":"몸무게가 그대로여도 바지 허리가 끼고 장바구니가 무거워졌다면, 그 변화도 살펴보세요.","cues":[{"start":76.0,"end":79.0,"text":"몸무게가 그대로여도 바지 허리가"},{"start":79.0,"end":81.8,"text":"끼고 장바구니가 무거워졌다면,"},{"start":81.8,"end":84.0,"text":"그 변화도 살펴보세요."}]}],"sources":[{"title":"Changes in body composition and weight during the menopause transition","url":"https://insight.jci.org/articles/view/124865"},{"title":"Menopause Topics: Hormone Therapy","url":"https://menopause.org/patient-education/menopause-topics/hormone-therapy"},{"title":"Can hormone therapy during menopause help me lose weight?","url":"https://www.acog.org/womens-health/experts-and-stories/ask-acog/can-hormone-therapy-help-me-lose-weight"},{"title":"Older Adult Activity: An Overview","url":"https://www.cdc.gov/physical-activity-basics/guidelines/older-adults.html"}]},{"id":37,"title":"지난번처럼 먹었는데 이번엔 왜 살이 잘 안 빠질까?","category":"체중·대사","original":"지난번과 똑같이 먹었는데 이번엔 왜 살이 잘 안 빠질까?","length":84,"parts":[{"start":0,"end":2,"text":"같은 식단, 왜 이번엔 안 빠져요?","cues":[{"start":0.0,"end":2.0,"text":"같은 식단, 왜 이번엔 안 빠져요?"}]},{"start":2,"end":8,"text":"지난번 첫 주에 빠진 몸무게와 지금을 비교할 때 놓치기 쉬운 게 있어요.","cues":[{"start":2.0,"end":5.1,"text":"지난번 첫 주에 빠진 몸무게와 지금을"},{"start":5.1,"end":8.0,"text":"비교할 때 놓치기 쉬운 게 있어요."}]},{"start":8,"end":33,"text":"처음 식단을 바꿨을 땐 첫 주에 숫자가 훅 내려갔을 수 있어요. 몸에 저장된 탄수화물이 줄면서 같이 빠진 수분도 그 무게에 들어가요. 시작할 때 몸무게가 다르면 같은 양을 먹어도 몸이 쓰는 에너지가 달라질 수 있죠. 게다가 이번엔 야근이 많거나, 저녁마다 허기가 더 셀 수도 있습니다.","cues":[{"start":8.0,"end":10.6,"text":"처음 식단을 바꿨을 땐 첫 주에"},{"start":10.6,"end":13.4,"text":"숫자가 훅 내려갔을 수 있어요."},{"start":13.4,"end":16.2,"text":"몸에 저장된 탄수화물이 줄면서"},{"start":16.2,"end":19.7,"text":"같이 빠진 수분도 그 무게에 들어가요."},{"start":19.7,"end":22.1,"text":"시작할 때 몸무게가 다르면"},{"start":22.1,"end":24.5,"text":"같은 양을 먹어도 몸이 쓰는"},{"start":24.5,"end":26.9,"text":"에너지가 달라질 수 있죠."},{"start":26.9,"end":29.5,"text":"게다가 이번엔 야근이 많거나,"},{"start":29.5,"end":33.0,"text":"저녁마다 허기가 더 셀 수도 있습니다."}]},{"start":33,"end":39,"text":"엑셀에 적힌 메뉴는 같아도 이번엔 그대로 먹기가 더 힘들 수 있어요.","cues":[{"start":33.0,"end":36.0,"text":"엑셀에 적힌 메뉴는 같아도 이번엔"},{"start":36.0,"end":39.0,"text":"그대로 먹기가 더 힘들 수 있어요."}]},{"start":39,"end":77,"text":"예전엔 퇴근하고 바로 밥을 먹었지만 지금은 일곱 시까지 회의가 계속된다고 해볼게요. 식단표에 저녁 메뉴는 같아도 그 전에 참은 시간은 다릅니다. 식단을 지키기 어렵다면 메뉴 말고 식사 시간도 바꿔 볼 수 있어요. 지난번의 가장 낮은 숫자와 오늘을 바로 견주기보다 같은 조건에서 며칠 동안 잰 몸무게를 보세요. 요즘 잠을 덜 자는지, 끼니 사이가 더 길어졌는지도 확인해 보세요. 무조건 양을 더 줄이면 하루의 부담까지 커질 수 있죠.","cues":[{"start":39.0,"end":41.3,"text":"예전엔 퇴근하고 바로 밥을"},{"start":41.3,"end":43.9,"text":"먹었지만 지금은 일곱 시까지"},{"start":43.9,"end":46.7,"text":"회의가 계속된다고 해볼게요."},{"start":46.7,"end":49.3,"text":"식단표에 저녁 메뉴는 같아도"},{"start":49.3,"end":52.1,"text":"그 전에 참은 시간은 다릅니다."},{"start": rt":39.0,"end":41.8,"text":"어제 먹은 음식 이야기도 도움이"},{"start":41.8,"end":44.9,"text":"되지만 평소와 얼마나 달라졌는지가"},{"start":44.9,"end":48.0,"text":"진료에서는 중요할 수 있습니다."}]},{"start":48,"end":54,"text":"발목이나 종아리가 갑자기 부었다면 어느 쪽인지부터 보세요.","cues":[{"start":48.0,"end":50.5,"text":"발목이나 종아리가 갑자기"},{"start":50.5,"end":54.0,"text":"부었다면 어느 쪽인지부터 보세요."}]},{"start":54,"end":76,"text":"양말 자국이 평소보다 깊어졌는지, 한쪽만 붓는지, 숨도 차는지 봐야 해요. 새로 생긴 한쪽 다리 붓기와 통증, 또는 갑작스러운 호흡곤란이 있으면 신속한 의료 평가가 필요합니다. 평소에는 비슷한 조건에서 몸무게를 재고 언제 부었는지도 같이 기록하세요.","cues":[{"start":54.0,"end":56.9,"text":"양말 자국이 평소보다 깊어졌는지,"},{"start":56.9,"end":60.4,"text":"한쪽만 붓는지, 숨도 차는지 봐야 해요."},{"start":60.4,"end":63.1,"text":"새로 생긴 한쪽 다리 붓기와 통증,"},{"start":63.1,"end":66.2,"text":"또는 갑작스러운 호흡곤란이 있으면"},{"start":66.2,"end":69.2,"text":"신속한 의료 평가가 필요합니다."},{"start":69.2,"end":72.4,"text":"평소에는 비슷한 조건에서 몸무게를"},{"start":72.4,"end":76.0,"text":"재고 언제 부었는지도 같이 기록하세요."}]},{"start":76,"end":81,"text":"몸무게를 적을 땐 어디가 언제 부었는지도 적어 두세요.","cues":[{"start":76.0,"end":78.1,"text":"몸무게를 적을 땐 어디가"},{"start":78.1,"end":81.0,"text":"언제 부었는지도 적어 두세요."}]}],"sources":[{"title":"Weight gain — unintentional","url":"https://medlineplus.gov/ency/article/003084.htm"},{"title":"Swelling","url":"https://medlineplus.gov/ency/article/003103.htm"},{"title":"Relationship between muscle water and glycogen recovery after prolonged exercise in the heat in humans","url":"https://pubmed.ncbi.nlm.nih.gov/25911631/"},{"title":"한쪽 팔다리의 붓기와 폐색전증의 신호 · CDC","url":"https://www.cdc.gov/blood-clots/about/"}]},{"id":40,"title":"술을 안 마셔도 간에 흉터가 있는지 확인하는 이유","category":"체중·대사","original":"술을 안 마시는데 간 수치가 높다. 지방간이 있다면 왜 간 흉터까지 봐야 할까?","length":89,"parts":[{"start":0,"end":2,"text":"술 안 마셔도 간 수치가 높아요?","cues":[{"start":0.0,"end":2.0,"text":"술 안 마셔도 간 수치가 높아요?"}]},{"start":2,"end":8,"text":"간 수치가 올라간 이유와 간에 흉터가 쌓였는지는 다른 질문이에요.","cues":[{"start":2.0,"end":4.5,"text":"간 수치가 올라간 이유와 간에"},{"start":4.5,"end":8.0,"text":"흉터가 쌓였는지는 다른 질문이에요."}]},{"start":8,"end":36,"text":"혈액검사에서 간효소 수치가 높으면 간세포가 자극을 받았는지 살펴요. 먹는 약이나 다른 질환도 원인일 수 있죠. 술을 안 마셔도 혈당이나 지질 문제와 함께 간에 지방이 쌓일 수 있습니다. 염증이 이어지면 간에 흉터 조직이 생기기도 해요. 이걸 간 섬유화라고 합니다. 지방이 있다는 사실만으로 그 정도를 알 순 없습니다.","cues":[{"start":8.0,"end":11.2,"text":"혈액검사에서 간효소 수치가 높으면"},{"start":11.2,"end":14.4,"text":"간세포가 자극을 받았는지 살펴요."},{"start":14.4,"end":18.1,"text":"먹는 약이나 다른 질환도 원인일 수 있죠."},{"start":18.1,"end":20.6,"text":"술을 안 마셔도 혈당이나 지질"},{"start":20.6,"end":23.3,"text":"문제와 함께 간에 지방이 쌓일 수"},{"start":23.3,"end":25.6,"text":"있습니다. 염증이 이어지면"},{"start":25.6,"end":28.7,"text":"간에 흉터 조직이 생기기도 해요."},{"start":28.7,"end":31.3,"text":"이걸 간 섬유화라고 합니다."},{"start":31.3,"end":33.6,"text":"지방이 있다는 사실만으로"},{"start":33.6,"end":36.0,"text":"그 정도를 알 순 없습니다."}]},{"start":36,"end":42,"text":"간 수치가 정상으로 돌아와도 흉터가 없어졌다고 볼 수는 없어요.","cues":[{"start":36.0,"end":38.6,"text":"간 수치가 정상으로 돌아와도"},{"start":38.6,"end":42.0,"text":"흉터가 없어졌다고 볼 수는 없어요."}]},{"start":42,"end":82,"text":"예를 들어 두 사람의 간효소가 비슷하더라도 그중 한 사람은 당뇨가 오래됐고, 다른 사람은 최근에 약을 바꿨어요. 두 사람에게 먼저 확인해야 할 게 다를 수 있죠. 이전 결과가 있으면 같이 보여 주세요. 필요할 때는 나이와 혈액검사 결과로 점수를 내거나 간 탄성도 검사로 간이 얼마나 단단한지 살펴요. 누구에게 어떤 검사가 필요한지는 이전 수치와 대사 상태를 함께 보고 판단합니다. 관리할 때는 간 수치가 어떻게 달라지는지 보고 혈당이나 혈압도 살펴요.","cues":[{"start":42.0,"end":44.6,"text":"예를 들어 두 사람의 간효소가"},{"start":44.6,"end":47.2,"text":"비슷하더라도 그중 한 사람은"},{"start":47.2,"end":49.8,"text":"당뇨가 오래됐고, 다른 사람은"},{"start":49.8,"end":52.8,"text":"최근에 약을 바꿨어요. 두 사람에게"},{"start":52.8,"end":55.9,"text":"먼저 확인해야 할 게 다를 수 있죠."},{"start":55.9,"end":59.4,"text":"이전 결과가 있으면 같이 보여 주세요."},{"start":59.4,"end":62.0,"text":"필요할 때는 나이와 혈액검사"},{"start":62.0,"end":64.8,"text":"결과로 점수를 내거나 간 탄성도"},{"start":64.8,"end":68.3,"text":"검사로 간이 얼마나 단단한지 살펴요."},{"start":68.3,"end":71.4,"text":"누구에게 어떤 검사가 필요한지는"},{"start":71.4,"end":74.4,"text":"이전 수치와 대사 상태를 함께 보고"},{"start":74.4,"end":76.7,"text":"판단합니다. 관리할 때는 간"},{"start":76.7,"end":79.5,"text":"수치가 어떻게 달라지는지 보고"},{"start":79.5,"end":82.0,"text":"혈당이나 혈압도 살펴요."}]},{"start":82,"end":89,"text":"검사표를 볼 때 두 질문을 챙기세요. ‘왜 올랐지?’ 그리고 ‘흉터 위험은 어떤가?’","cues":[{"start":82.0,"end":85.4,"text":"검사표를 볼 때 두 질문을 챙기세요."},{"start":85.4,"end":89.0,"text":"‘왜 올랐지?’ 그리고 ‘흉터 위험은 어떤가?’"}]}],"sources":[{"title":"Diagnosis of NAFLD & NASH","url":"https://www.niddk.nih.gov/health-information/liver-disease/nafld-nash/diagnosis"},{"title":"EASL–EASD–EASO Clinical Practice Guidelines on the management of metabolic dysfunction-associated steatotic liver disease (MASLD)","url":"https://easlcampus.eu/sites/default/files/2024-08/EASL_CPGs_management_of_MASLD.pdf"},{"title":"Screening and Diagnosing MASLD","url":"https://professional.diabetes.org/sites/dpro/files/2026-03/031926-hcp-screening-and-diagnosing-masld-final-3-23-26.pdf"}]},{"id":41,"title":"점심에 배가 안 고프면 그냥 건너뛰어도 될까?","category":"식사·영양","original":"점심시간인데 배가 안 고프다. 배고파질 때까지 기다려도 될까?","length":87,"parts":[{"start":0,"end":2,"text":"점심인데, 배가 안 고프세요?","cues":[{"start":0.0,"end":2.0,"text":"점심인데, 배가 안 고프세요?"}]},{"start":2,"end":8,"text":"점심을 거를지 고민이라면 어제 오후에 어땠는지 떠올려 보세요.","cues":[{"start":2.0,"end":4.8,"text":"점심을 거를지 고민이라면 어제"},{"start":4.8,"end":8.0,"text":"오후에 어땠는지 떠올려 보세요."}]},{"start":8,"end":34,"text":"배고픔엔 위뿐 아니라 여러 요인이 관여해요. 식사 습관, 약, 긴장, 몸 상태에 따라 달라질 수 있습니다. 예를 들어 일이 몰려 점심 생각이 안 나서 넘겼죠. 그런데 오후에 기운이 빠지고 집에 가는 길에 몹시 배고파질 수도 있어요. 식사를 안 하는 동안에도 간은 혈당을 유지하도록 포도당을 내보냅니다.","cues":[{"start":8.0,"end":11.0,"text":"배고픔엔 위뿐 아니라 여러 요인이"},{"start":11.0,"end":13.4,"text":"관여해요. 식사 습관, 약, 긴장,"},{"start":13.4,"end":16.7,"text":"몸 상태에 따라 달라질 수 있습니다."},{"start":16.7,"end":19.6,"text":"예를 들어 일이 몰려 점심 생각이"},{"start":19.6,"end":22.1,"text":"안 나서 넘겼죠. 그런데 오후에"},{"start":22.1,"end":24.7,"text":"기운이 빠지고 집에 가는 길에"},{"start":24.7,"end":27.4,"text":"몹시 배고파질 수도 있어요."},{"start":27.4,"end":30.7,"text":"식사를 안 하는 동안에도 간은 혈당을"},{"start":30.7,"end":34.0,"text":"유지하도록 포도당을 내보냅니다."}]},{"start":34,"end":41,"text":"점심때 배가 안 고파도 오후에 기운이나 허기가 어떻게 변하는지 봐야 해요.","cues":[{"start":34.0,"end":37.6,"text":"점심때 배가 안 고파도 오후에 기운이나"},{"start":37.6,"end":41.0,"text":"허기가 어떻게 변하는지 봐야 해요."}]},{"start":41,"end":81,"text":"예를 들면 어제는 점심 생각이 안 나 그냥 일했고, 오늘은 작은 샌드위치를 먹었다고 해볼게요. 두 날 다 점심엔 배가 고프지 않았는데 오후에 집중이 달라질 수 있죠. 두 날을 비교해 보면 다음 끼니를 정하기가 좀 쉬워요. 비슷한 날, 먹을 수 있는 작은 식사를 한 뒤 오후의 기운과 저녁 허기가 어떤지 비교해 보세요. 식욕이 계속 떨어지거나 체중이 의도치 않게 줄면, 습관으로만 보지 말고 원인을 확인해야 해요. 먹고 있는 약이 있다면 언제부터 먹었는지도 알려 주세요.","cues":[{"start":41.0,"end":43.5,"text":"예를 들면 어제는 점심 생각이"},{"start":43.5,"end":46.0,"text":"안 나 그냥 일했고, 오늘은 작은"},{"start":46.0,"end":49.1,"text":"샌드위치를 먹었다고 해볼게요."},{"start":49.1,"end":52.2,"text":"두 날 다 점심엔 배가 고프지 않았는데"},{"start":52.2,"end":55.0,"text":"오후에 집중이 달라질 수 있죠."},{"start":55.0,"end":57.1,"text":"두 날을 비교해 보면 다음"},{"start":57.1,"end":59.7,"text":"끼니를 정하기가 좀 쉬워요."},{"start":59.7,"end":62.1,"text":"비슷한 날, 먹을 수 있는 작은"},{"start":62.1,"end":64.8,"text":"식사를 한 뒤 오후의 기운과 저녁"},{"start":64.8,"end":67.6,"text":"허기가 어떤지 비교해 보세요."},{"start":67.6,"end":70.3,"text":"식욕이 계속 떨어지거나 체중이"},{"start":70.3,"end":72.8,"text":"의도치 않게 줄면, 습관으로만"},{"start":72.8,"end":75.9,"text":"보지 말고 원인을 확인해야 해요."},{"start":75.9,"end":78.6,"text":"먹고 있는 약이 있다면 언제부터"},{"start":78.6,"end":81.0,"text":"먹었는지도 알려 주세요."}]},{"start":81,"end":87,"text":"점심때 배가 고팠는지, 그날 오후 기운은 어땠는지 적어 보세요.","cues":[{"start":81.0,"end":84.0,"text":"점심때 배가 고팠는지, 그날 오후"},{"start":84.0,"end":87.0,"text":"기운은 어땠는지 적어 보세요."}]}],"sources":[{"title":"Your Digestive System & How it Works","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/digestive-system-how-it-works"},{"title":"Low Blood Glucose (Hypoglycemia)","url":"https://www.niddk.nih.gov/health-information/diabetes/overview/preventing-problems/low-blood-glucose-hypoglycemia"},{"title":"Food first advice for adults with a small appetite","url":"https://cios.icb.nhs.uk/health/nutrition/small-appetite/"},{"title":"About Insulin Resistance and Type 2 Diabetes","url":"https://www.cdc.gov/diabetes/about/insulin-resistance-type-2-diabetes.html"}]},{"id":42,"title":"연속혈당측정기 그래프는 꼭 평평해야 할까?","category":"식사·영양","original":"혈당 그래프를 평평하게 만들면 더 건강해질까?","length":89,"parts":[{"start":0,"end":2,"text":"혈당 그래프, 평평해야 좋을까요?","cues":[{"start":0.0,"end":2.0,"text":"혈당 그래프, 평평해야 좋을까요?"}]},{"start":2,"end":8,"text":"혈당 그래프가 비슷해도 실제로 먹은 음식은 전혀 다를 수 있어요.","cues":[{"start":2.0,"end":4.8,"text":"혈당 그래프가 비슷해도 실제로"},{"start":4.8,"end":8.0,"text":"먹은 음식은 전혀 다를 수 있어요."}]},{"start":8,"end":32,"text":"먹고 난 뒤 포도당이 들어오고 몸은 그걸 사용하거나 저장합니다. 먹은 포도당이 들어오는 동안 몸도 포도당을 쓰기 때문에 식후 혈당은 오르내릴 수 있어요. 연속혈당측정기는 피부 아래 조직액의 포도당을 재요. 혈당이 빠르게 바뀌면 혈액에서 잰 값과 시간차가 날 수 있죠.","cues":[{"start":8.0,"end":10.5,"text":"먹고 난 뒤 포도당이 들어오고"},{"start":10.5,"end":13.8,"text":"몸은 그걸 사용하거나 저장합니다."},{"start":13.8,"end":16.3,"text":"먹은 포도당이 들어오는 동안"},{"start":16.3,"end":19.1,"text":"몸도 포도당을 쓰기 때문에 식후"},{"start":19.1,"end":21.7,"text":"혈당은 오르내릴 수 있어요."},{"start":21.7,"end":23.8,"text":"연속혈당측정기는 피부"},{"start":23.8,"end":26.6,"text":"아래 조직액의 포도당을 재요."},{"start":26.6,"end":29.4,"text":"혈당이 빠르게 바뀌면 혈액에서"},{"start":29.4,"end":32.0,"text":"잰 값과 시간차가 날 수 있죠."}]},{"start":32,"end":39,"text":"그래프가 비슷하게 나왔다면, 그날 먹은 음식과 무엇을 했는지도 보세요.","cues":[{"start":32.0,"end":35.2,"text":"그래프가 비슷하게 나왔다면, 그날"},{"start":35.2,"end":39.0,"text":"먹은 음식과 무엇을 했는지도 보세요."}]},{"start":39,"end":82,"text":"예를 들어 같은 메뉴를 먹어도 장을 보고 걸은 날과 앉아서 일한 날의 혈당은 다를 수 있어요. 그 차이로 음식 하나가 늘 나쁘다고 결론 내리기 전에, 무엇을 먹고 얼마나 움직였는지도 보세요. 섬유질이나 단백질을 얼마나 먹었는지, 배가 충분히 찼는지, 이 식사를 계속 할 수 있는지는 곡선에 바로 찍히지 않습니다. 당뇨를 진단할 때는 정해진 검사를 쓰고, 이미 치료 중이라면 센서 해석과 목표도 개인마다 달라져요. 건강한 사람 모두에게 평평한 곡선이 건강 개선으로 이어진다는 근거도 제한적입니다.","cues":[{"start":39.0,"end":41.5,"text":"예를 들어 같은 메뉴를 먹어도"},{"start":41.5,"end":43.9,"text":"장을 보고 걸은 날과 앉아서"},{"start":43.9,"end":46.9,"text":"일한 날의 혈당은 다를 수 있어요."},{"start":46.9,"end":49.9,"text":"그 차이로 음식 하나가 늘 나쁘다고"},{"start":49.9,"end":52.5,"text":"결론 내리기 전에, 무엇을 먹고"},{"start":52.5,"end":55.3,"text":"얼마나 움직였는지도 보세요."},{"start":55.3,"end":57.8,"text":"섬유질이나 단백질을 얼마나"},{"start":57.8,"end":60.4,"text":"먹었는지, 배가 충분히 찼는지,"},{"start":60.4,"end":62.9,"text":"이 식사를 계속 할 수 있는지는"},{"start":62.9,"end":65.8,"text":"곡선에 바로 찍히지 않습니다."},{"start":65.8,"end":68.1,"text":"당뇨를 진단할 때는 정해진"},{"start":68.1,"end":70.9,"text":"검사를 쓰고, 이미 치료 중이라면"},{"start":70.9,"end":73.4,"text":"센서 해석과 목표도 개인마다"},{"start":73.4,"end":76.2,"text":"달라져요. 건강한 사람 모두에게"},{"start":76.2,"end":78.7,"text":"평평한 곡선이 건강 개선으로"},{"start":78.7,"end":82.0,"text":"이어진다는 근거도 제한적입니다."}]},{"start":82,"end":89,"text":"그래프 한 구간만 보지 말고 어떤 음식을 먹으며 하루를 보냈는지도 살펴보세요.","cues":[{"start":82.0,"end":84.3,"text":"그래프 한 구간만 보지 말고"},{"start":84.3,"end":86.6,"text":"어떤 음식을 먹으며 하루를"},{"start":86.6,"end":89.0,"text":"보냈는지도 살펴보세요."}]}],"sources":[{"title":"FDA Clears First Over-the-Counter Continuous Glucose Monitor","url":"https://www.fda.gov/news-events/press-announcements/fda-clears-first-over-counter-continuous-glucose-monitor"},{"title":"Continuous Glucose Monitoring Profiles in Healthy Nondiabetic Participants: A Multicenter Prospective Study","url":"https://pubmed.ncbi.nlm.nih.gov/31127824/"},{"title":"How Do Glucose Monitors Measure Sugar Levels in the Blood?","url":"https://www.nist.gov/how-do-you-measure-it/how-do-glucose-monitors-measure-sugar-levels-blood"},{"title":"Diabetes & Prediabetes Tests","url":"https://www.niddk.nih.gov/health-information/professionals/clinical-tools-patient-management/diabetes/diabetes-prediabetes"},{"title":"About Insulin Resistance and Type 2 Diabetes","url":"https://www.cdc.gov/diabetes/about/insulin-resistance-type-2-diabetes.html"}]},{"id":43,"title":"밥 먹고 손이 떨리면 정말 저혈당일까?","category":"식사·영양","original":"식후 손떨림, 먹고 좋아지면 저혈당일까?","length":77,"parts":[{"start":0,"end":2,"text":"단 거 먹고 손떨림이 멎었나요?","cues":[{"start":0.0,"end":2.0,"text":"단 거 먹고 손떨림이 멎었나요?"}]},{"start":2,"end":8,"text":"저혈당인지 알려면 손이 떨릴 때 혈당이 얼마였는지 봐야 해요.","cues":[{"start":2.0,"end":5.0,"text":"저혈당인지 알려면 손이 떨릴 때"},{"start":5.0,"end":8.0,"text":"혈당이 얼마였는지 봐야 해요."}]},{"start":8,"end":43,"text":"식사 뒤 손이 떨리고 식은땀이 납니다. 달달한 걸 먹고 나니 잦아들었죠. 이런 변화는 저혈당에서 올 수 있지만 떨림과 좋아졌다는 느낌만으론 그때 수치를 알지 못해요. 진료에선 증상이 있을 때 혈당이 낮았는지, 혈당이 다시 오르면서 증상도 풀렸는지 확인해요. 손이 떨릴 땐 못 재고 뭔가 먹은 뒤에야 쟀다고 해볼게요. 그때 혈당이 정상이어도 먹기 전에 어땠는지는 알 수 없죠. 잰 시간도 적어 두세요.","cues":[{"start":8.0,"end":11.4,"text":"식사 뒤 손이 떨리고 식은땀이 납니다."},{"start":11.4,"end":14.5,"text":"달달한 걸 먹고 나니 잦아들었죠."},{"start":14.5,"end":16.6,"text":"이런 변화는 저혈당에서"},{"start":16.6,"end":19.3,"text":"올 수 있지만 떨림과 좋아졌다는"},{"start":19.3,"end":22.7,"text":"느낌만으론 그때 수치를 알지 못해요."},{"start":22.7,"end":25.5,"text":"진료에선 증상이 있을 때 혈당이"},{"start":25.5,"end":28.2,"text":"낮았는지, 혈당이 다시 오르면서"},{"start":28.2,"end":30.8,"text":"증상도 풀렸는지 확인해요."},{"start":30.8,"end":32.9,"text":"손이 떨릴 땐 못 재고 뭔가"},{"start":32.9,"end":35.7,"text":"먹은 뒤에야 쟀다고 해볼게요."},{"start":35.7,"end":38.2,"text":"그때 혈당이 정상이어도 먹기"},{"start":38.2,"end":40.8,"text":"전에 어땠는지는 알 수 없죠."},{"start":40.8,"end":43.0,"text":"잰 시간도 적어 두세요."}]},{"start":43,"end":50,"text":"그런데 인슐린처럼 저혈당을 일으킬 수 있는 약을 쓰고 있다면 순서가 달라요.","cues":[{"start":43.0,"end":45.6,"text":"그런데 인슐린처럼 저혈당을"},{"start":45.6,"end":47.8,"text":"일으킬 수 있는 약을 쓰고"},{"start":47.8,"end":50.0,"text":"있다면 순서가 달라요."}]},{"start":50,"end":70,"text":"약을 쓰는 사람은 증상이 올 때 의료진과 미리 정한 대처법부터 따르세요. 정신이 심하게 혼란스럽거나 의식을 잃으면 응급이에요. 반복되는 식후 증상을 상담할 때는 식사 시점, 떨림이 시작된 때, 잰 혈당과 약 이름을 알려 주세요.","cues":[{"start":50.0,"end":53.4,"text":"약을 쓰는 사람은 증상이 올 때 의료진과"},{"start":53.4,"end":56.5,"text":"미리 정한 대처법부터 따르세요."},{"start":56.5,"end":59.0,"text":"정신이 심하게 혼란스럽거나"},{"start":59.0,"end":61.6,"text":"의식을 잃으면 응급이에요."},{"start":61.6,"end":64.6,"text":"반복되는 식후 증상을 상담할 때는"},{"start":64.6,"end":66.9,"text":"식사 시점, 떨림이 시작된 때,"},{"start":66.9,"end":70.0,"text":"잰 혈당과 약 이름을 알려 주세요."}]},{"start":70,"end":77,"text":"손이 떨리기 시작한 때, 그때의 혈당, 떨림이 가라앉은 때를 적어 두세요.","cues":[{"start":70.0,"end":73.3,"text":"손이 떨리기 시작한 때, 그때의 혈당,"},{"start":73.3,"end":77.0,"text":"떨림이 가라앉은 때를 적어 두세요."}]}],"sources":[{"title":"Hypoglycemia","url":"https://www.endocrine.org/patient-engagement/endocrine-library/hypoglycemia"},{"title":"Low Blood Glucose (Hypoglycemia)","url":"https://www.niddk.nih.gov/health-information/diabetes/overview/preventing-problems/low-blood-glucose-hypoglycemia"},{"title":"Evaluation and Management of Adult Hypoglycemic Disorders: An Endocrine Society Clinical Practice Guideline","url":"https://academic.oup.com/jcem/article/94/3/709/2596247"},{"title":"Low blood sugar (hypoglycaemia)","url":"https://www.nhs.uk/conditions/low-blood-sugar-hypoglycaemia/"}]},{"id":44,"title":"단백질을 챙겨 먹어도 근육이 그대로인 이유","category":"식사·영양","original":"단백질을 챙겨 먹는데 근육이 안 늘면 운동에서 뭘 봐야 할까?","length":83,"parts":[{"start":0,"end":2,"text":"단백질은 늘고, 근육은 그대로?","cues":[{"start":0.0,"end":2.0,"text":"단백질은 늘고, 근육은 그대로?"}]},{"start":2,"end":9,"text":"단백질 셰이크를 몇 번 마셨는지와 함께 이번 주에 어떤 운동을 했는지 보세요.","cues":[{"start":2.0,"end":3.9,"text":"단백질 셰이크를 몇 번"},{"start":3.9,"end":6.3,"text":"마셨는지와 함께 이번 주에"},{"start":6.3,"end":9.0,"text":"어떤 운동을 했는지 보세요."}]},{"start":9,"end":32,"text":"근육은 몸 안에서 계속 분해되고 다시 만들어집니다. 단백질은 만드는 데 쓰는 재료예요. 저항운동, 흔히 말하는 근력운동을 하면서 힘을 쓰면 몸에 근육이 더 필요하다는 신호를 줍니다. 재료를 충분히 먹어도 어떤 동작을 어느 정도 해 왔는지에 따라 변화는 달라져요.","cues":[{"start":9.0,"end":11.8,"text":"근육은 몸 안에서 계속 분해되고"},{"start":11.8,"end":14.4,"text":"다시 만들어집니다. 단백질은"},{"start":14.4,"end":17.4,"text":"만드는 데 쓰는 재료예요. 저항운동,"},{"start":17.4,"end":20.2,"text":"흔히 말하는 근력운동을 하면서"},{"start":20.2,"end":23.5,"text":"힘을 쓰면 몸에 근육이 더 필요하다는"},{"start":23.5,"end":26.1,"text":"신호를 줍니다. 재료를 충분히"},{"start":26.1,"end":28.9,"text":"먹어도 어떤 동작을 어느 정도 해"},{"start":28.9,"end":32.0,"text":"왔는지에 따라 변화는 달라져요."}]},{"start":32,"end":37,"text":"운동하고 힘이 늘었다고 전부 근육이 커진 건 아니에요.","cues":[{"start":32.0,"end":34.1,"text":"운동하고 힘이 늘었다고"},{"start":34.1,"end":37.0,"text":"전부 근육이 커진 건 아니에요."}]},{"start":37,"end":75,"text":"가령 지난달과 무게가 같아도 더 안정적으로 움직였다면 기록할 변화가 있어요. 반대로 운동을 계속 빠뜨렸다면, 단백질을 추가한 것만으론 훈련 내용이 달라지지 않았죠. 이번 주에 어떤 동작으로 얼마나 힘을 썼는지부터 보세요. 처음에는 동작이 익숙해지면서 힘을 더 잘 쓸 수도 있습니다. 체성분 검사표를 볼 때 같은 동작을 전보다 쉽게 하는지도 살펴보세요. 운동량에 비해 너무 적게 먹거나 제대로 쉬지 못했다면 그 점도 살펴야 해요.","cues":[{"start":37.0,"end":39.5,"text":"가령 지난달과 무게가 같아도"},{"start":39.5,"end":41.8,"text":"더 안정적으로 움직였다면"},{"start":41.8,"end":44.0,"text":"기록할 변화가 있어요."},{"start":44.0,"end":46.7,"text":"반대로 운동을 계속 빠뜨렸다면,"},{"start":46.7,"end":49.0,"text":"단백질을 추가한 것만으론"},{"start":49.0,"end":51.8,"text":"훈련 내용이 달라지지 않았죠."},{"start":51.8,"end":53.9,"text":"이번 주에 어떤 동작으로"},{"start":53.9,"end":56.9,"text":"얼마나 힘을 썼는지부터 보세요."},{"start":56.9,"end":59.7,"text":"처음에는 동작이 익숙해지면서"},{"start":59.7,"end":62.3,"text":"힘을 더 잘 쓸 수도 있습니다."},{"start":62.3,"end":65.2,"text":"체성분 검사표를 볼 때 같은 동작을"},{"start":65.2,"end":68.4,"text":"전보다 쉽게 하는지도 살펴보세요."},{"start":68.4,"end":71.8,"text":"운동량에 비해 너무 적게 먹거나 제대로"},{"start":71.8,"end":75.0,"text":"쉬지 못했다면 그 점도 살펴야 해요."}]},{"start":75,"end":83,"text":"단백질을 이미 충분히 먹고 있다면 이번 주 운동에서 근육에 얼마나 힘을 줬는지 확인하세요.","cues":[{"start":75.0,"end":77.3,"text":"단백질을 이미 충분히 먹고"},{"start":77.3,"end":80.0,"text":"있다면 이번 주 운동에서 근육에"},{"start":80.0,"end":83.0,"text":"얼마나 힘을 줬는지 확인하세요."}]}],"sources":[{"title":"Dietary Supplements for Exercise and Athletic Performance: Health Professional Fact Sheet","url":"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"},{"title":"Resistance Training Prescription for Muscle Function, Hypertrophy, and Physical Performance in Healthy Adults","url":"https://doi.org/10.1249/MSS.0000000000003897"},{"title":"Protein supplementation during resistance-type exercise training in the elderly","url":"https://pubmed.ncbi.nlm.nih.gov/22968306/"}]},{"id":45,"title":"채식하고 피곤하다면 식단에서 먼저 볼 것","category":"식사·영양","original":"채식한 뒤 피곤할 때 철분과 비타민 B12는 어떻게 확인할까?","length":86,"parts":[{"start":0,"end":2,"text":"채식 뒤 피곤해졌나요?","cues":[{"start":0.0,"end":2.0,"text":"채식 뒤 피곤해졌나요?"}]},{"start":2,"end":7,"text":"고기를 뺐다면 대신 어떤 음식을 먹는지 살펴보세요.","cues":[{"start":2.0,"end":3.8,"text":"고기를 뺐다면 대신"},{"start":3.8,"end":7.0,"text":"어떤 음식을 먹는지 살펴보세요."}]},{"start":7,"end":32,"text":"이전보다 음식 종류와 양이 함께 줄었다면 원인은 하나로 정하기 어렵습니다. 철은 몸이 산소를 운반하는 데 쓰이고, 비타민 비십이는 피를 만들고 신경이 제 역할을 하는 데 쓰여요. 동물성 식품을 완전히 뺐다면 이 비타민을 넣은 식품이나 보충제로 충분히 먹는지 확인할 필요가 있어요.","cues":[{"start":7.0,"end":9.4,"text":"이전보다 음식 종류와 양이"},{"start":9.4,"end":12.0,"text":"함께 줄었다면 원인은 하나로"},{"start":12.0,"end":14.6,"text":"정하기 어렵습니다. 철은 몸이"},{"start":14.6,"end":16.9,"text":"산소를 운반하는 데 쓰이고,"},{"start":16.9,"end":19.5,"text":"비타민 비십이는 피를 만들고"},{"start":19.5,"end":22.6,"text":"신경이 제 역할을 하는 데 쓰여요."},{"start":22.6,"end":25.2,"text":"동물성 식품을 완전히 뺐다면"},{"start":25.2,"end":28.5,"text":"이 비타민을 넣은 식품이나 보충제로"},{"start":28.5,"end":32.0,"text":"충분히 먹는지 확인할 필요가 있어요."}]},{"start":32,"end":37,"text":"먹은 양과 몸이 실제로 흡수한 양은 다를 수 있습니다.","cues":[{"start":32.0,"end":34.0,"text":"먹은 양과 몸이 실제로"},{"start":34.0,"end":37.0,"text":"흡수한 양은 다를 수 있습니다."}]},{"start":37,"end":80,"text":"예를 들어 단백질 식품이나 강화 식품도 찾지 않은 채 샐러드만 남은 식단과, 여러 식품을 챙기는 채식은 같은 조건이 아니에요. 장보기 목록과 실제로 먹은 끼니를 함께 보면 진료에서 무엇을 더 물어야 할지 가늠할 수 있습니다. 철이 부족하다면 생리나 다른 출혈로 피를 잃었는지도 살펴요. 피로에 손발 저림이나 감각 변화가 더해지면 진료에서 그 증상도 알려 주세요. 영양소 하나를 추측해 계속 보충하기보다 무엇을 먹는지, 언제부터 달라졌는지, 필요한 검사가 있는지를 같이 확인하면 됩니다.","cues":[{"start":37.0,"end":39.8,"text":"예를 들어 단백질 식품이나 강화"},{"start":39.8,"end":42.4,"text":"식품도 찾지 않은 채 샐러드만"},{"start":42.4,"end":45.2,"text":"남은 식단과, 여러 식품을 챙기는"},{"start":45.2,"end":48.0,"text":"채식은 같은 조건이 아니에요."},{"start":48.0,"end":50.4,"text":"장보기 목록과 실제로 먹은"},{"start":50.4,"end":52.8,"text":"끼니를 함께 보면 진료에서"},{"start":52.8,"end":55.6,"text":"무엇을 더 물어야 할지 가늠할 수"},{"start":55.6,"end":57.9,"text":"있습니다. 철이 부족하다면"},{"start":57.9,"end":60.1,"text":"생리나 다른 출혈로 피를"},{"start":60.1,"end":62.9,"text":"잃었는지도 살펴요. 피로에 손발"},{"start":62.9,"end":65.7,"text":"저림이나 감각 변화가 더해지면"},{"start":65.7,"end":68.7,"text":"진료에서 그 증상도 알려 주세요."},{"start":68.7,"end":71.1,"text":"영양소 하나를 추측해 계속"},{"start":71.1,"end":73.7,"text":"보충하기보다 무엇을 먹는지,"},{"start":73.7,"end":76.9,"text":"언제부터 달라졌는지, 필요한 검사가"},{"start":76.9,"end":80.0,"text":"있는지를 같이 확인하면 됩니다."}]},{"start":80,"end":86,"text":"식사 기록에는 뺀 음식과 대신 먹기 시작한 음식이 둘 다 필요합니다.","cues":[{"start":80.0,"end":83.0,"text":"식사 기록에는 뺀 음식과 대신 먹기"},{"start":83.0,"end":86.0,"text":"시작한 음식이 둘 다 필요합니다."}]}],"sources":[{"title":"Vitamin B12: Health Professional Fact Sheet","url":"https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/"},{"title":"Iron: Health Professional Fact Sheet","url":"https://ods.od.nih.gov/factsheets/Iron-HealthProfessional/"},{"title":"The vegan diet","url":"https://www.nhs.uk/live-well/eat-well/how-to-eat-a-balanced-diet/the-vegan-diet/"}]},{"id":46,"title":"건강식인데 외식이 무서워졌다면","category":"식사·영양","original":"건강하게 먹으려다 외식이 무서워졌다면, 어떤 점이 걱정되는 걸까?","length":86,"parts":[{"start":0,"end":2,"text":"건강식 하는데 외식은 겁나요?","cues":[{"start":0.0,"end":2.0,"text":"건강식 하는데 외식은 겁나요?"}]},{"start":2,"end":10,"text":"식단을 지켰는지뿐 아니라 그 규칙 때문에 같이 밥 먹을 약속을 피하게 됐는지도 돌아보세요.","cues":[{"start":2.0,"end":4.5,"text":"식단을 지켰는지뿐 아니라 그"},{"start":4.5,"end":7.2,"text":"규칙 때문에 같이 밥 먹을 약속을"},{"start":7.2,"end":10.0,"text":"피하게 됐는지도 돌아보세요."}]},{"start":10,"end":31,"text":"음식 알레르기가 확인됐을 때는 반응 위험을 줄이려고 그 재료를 피하죠. 그런데 ‘몸에 안 좋을 것 같다’는 걱정으로 음식을 하나씩 빼다 보면 외식할 때 마음 놓고 고를 메뉴가 거의 없어질 수 있어요. 약속을 취소하면 지금 마음은 편해집니다.","cues":[{"start":10.0,"end":13.3,"text":"음식 알레르기가 확인됐을 때는 반응"},{"start":13.3,"end":16.6,"text":"위험을 줄이려고 그 재료를 피하죠."},{"start":16.6,"end":19.2,"text":"그런데 ‘몸에 안 좋을 것 같다’는"},{"start":19.2,"end":22.2,"text":"걱정으로 음식을 하나씩 빼다 보면"},{"start":22.2,"end":25.1,"text":"외식할 때 마음 놓고 고를 메뉴가"},{"start":25.1,"end":27.7,"text":"거의 없어질 수 있어요. 약속을"},{"start":27.7,"end":31.0,"text":"취소하면 지금 마음은 편해집니다."}]},{"start":31,"end":36,"text":"그 안도감 때문에 다음 약속도 피하고 싶어질 수 있죠.","cues":[{"start":31.0,"end":33.0,"text":"그 안도감 때문에 다음"},{"start":33.0,"end":36.0,"text":"약속도 피하고 싶어질 수 있죠."}]},{"start":36,"end":78,"text":"약속을 잡아 놓고 음식에 든 재료를 몇 시간씩 검색하다 약속을 취소했다고 해볼게요. 이때 매번 검사 결과나 몸무게만 확인하면, 식단 때문에 평소 하던 일이 얼마나 줄었는지는 놓치게 돼요. 몸무게가 일반적인 범위여도 음식 종류가 크게 줄고, 식사 계획에 하루가 묶이면 도움이 필요할 수 있어요. 진료에선 피해야 할 재료가 있는지 살펴요. 무엇이 불안한지, 영양은 충분한지, 가족이나 친구와 같이 먹을 수 있는지도 봅니다. 다시 사람들과 편하게 밥을 먹는 게 목표가 될 수도 있어요.","cues":[{"start":36.0,"end":38.4,"text":"약속을 잡아 놓고 음식에 든"},{"start":38.4,"end":40.7,"text":"재료를 몇 시간씩 검색하다"},{"start":40.7,"end":43.6,"text":"약속을 취소했다고 해볼게요."},{"start":43.6,"end":46.4,"text":"이때 매번 검사 결과나 몸무게만"},{"start":46.4,"end":48.8,"text":"확인하면, 식단 때문에 평소"},{"start":48.8,"end":51.3,"text":"하던 일이 얼마나 줄었는지는"},{"start":51.3,"end":54.1,"text":"놓치게 돼요. 몸무게가 일반적인"},{"start":54.1,"end":56.9,"text":"범위여도 음식 종류가 크게 줄고,"},{"start":56.9,"end":59.3,"text":"식사 계획에 하루가 묶이면"},{"start":59.3,"end":61.7,"text":"도움이 필요할 수 있어요."},{"start":61.7,"end":64.1,"text":"진료에선 피해야 할 재료가"},{"start":64.1,"end":66.9,"text":"있는지 살펴요. 무엇이 불안한지,"},{"start":66.9,"end":69.9,"text":"영양은 충분한지, 가족이나 친구와"},{"start":69.9,"end":72.8,"text":"같이 먹을 수 있는지도 봅니다."},{"start":72.8,"end":75.1,"text":"다시 사람들과 편하게 밥을"},{"start":75.1,"end":78.0,"text":"먹는 게 목표가 될 수도 있어요."}]},{"start":78,"end":86,"text":"지난달과 비교해 보세요. 고를 수 있는 음식도 줄고 함께 밥 먹는 약속도 줄었나요?","cues":[{"start":78.0,"end":80.6,"text":"지난달과 비교해 보세요."},{"start":80.6,"end":82.9,"text":"고를 수 있는 음식도 줄고"},{"start":82.9,"end":86.0,"text":"함께 밥 먹는 약속도 줄었나요?"}]}],"sources":[{"title":"Eating disorders: recognition and treatment — Recommendations","url":"https://www.nice.org.uk/guidance/ng69/chapter/Recommendations"},{"title":"Overview — Eating disorders","url":"https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/behaviours/eating-disorders/overview/"},{"title":"Eating Disorders: What You Need to Know","url":"https://www.nimh.nih.gov/sites/default/files/documents/health/publications/eating-disorders/eating-disorders-what-you-need-to-know.pdf"}]},{"id":47,"title":"간헐적 단식 전에 먹는 약부터 확인해야 하는 이유","category":"식사·영양","original":"간헐적 단식을 시작하기 전에 먹고 있는 약을 확인하는 이유","length":87,"parts":[{"start":0,"end":2,"text":"단식해도 약은 계속 작용해요.","cues":[{"start":0.0,"end":2.0,"text":"단식해도 약은 계속 작용해요."}]},{"start":2,"end":7,"text":"끼니를 미뤄도 몸에 들어간 약은 계속 작용합니다.","cues":[{"start":2.0,"end":4.6,"text":"끼니를 미뤄도 몸에 들어간"},{"start":4.6,"end":7.0,"text":"약은 계속 작용합니다."}]},{"start":7,"end":52,"text":"공복이 길어지면 몸은 저장해 둔 에너지를 써요. 그런데 인슐린이나 일부 혈당약은 식사를 미뤘다고 알아서 작용을 멈추지 않아요. 먹는 시간이 달라지면 혈당이 지나치게 내려갈 위험도 달라집니다. 또 일부 당뇨약을 쓰는 상황에선 오래 굶거나 아플 때 케톤산증 위험을 따로 살펴야 해요. 평소 아침 약을 밥과 같은 시각에 챙기다가, 어느 날 앱에 맞춰 점심까지 기다린다고 해볼게요. 아침부터 점심 사이의 몸 상태는 예전의 일정과 달라집니다. 몇 시에 첫 끼를 먹을지 정하기 전에 아침부터 점심까지 몸 상태를 먼저 봐야 해요.","cues":[{"start":7.0,"end":9.7,"text":"공복이 길어지면 몸은 저장해 둔"},{"start":9.7,"end":12.6,"text":"에너지를 써요. 그런데 인슐린이나"},{"start":12.6,"end":15.4,"text":"일부 혈당약은 식사를 미뤘다고"},{"start":15.4,"end":18.2,"text":"알아서 작용을 멈추지 않아요."},{"start":18.2,"end":20.7,"text":"먹는 시간이 달라지면 혈당이"},{"start":20.7,"end":24.1,"text":"지나치게 내려갈 위험도 달라집니다."},{"start":24.1,"end":26.8,"text":"또 일부 당뇨약을 쓰는 상황에선"},{"start":26.8,"end":29.3,"text":"오래 굶거나 아플 때 케톤산증"},{"start":29.3,"end":31.7,"text":"위험을 따로 살펴야 해요."},{"start":31.7,"end":34.4,"text":"평소 아침 약을 밥과 같은 시각에"},{"start":34.4,"end":36.7,"text":"챙기다가, 어느 날 앱에 맞춰"},{"start":36.7,"end":39.7,"text":"점심까지 기다린다고 해볼게요."},{"start":39.7,"end":42.4,"text":"아침부터 점심 사이의 몸 상태는"},{"start":42.4,"end":45.0,"text":"예전의 일정과 달라집니다."},{"start":45.0,"end":47.5,"text":"몇 시에 첫 끼를 먹을지 정하기"},{"start":47.5,"end":49.6,"text":"전에 아침부터 점심까지"},{"start":49.6,"end":52.0,"text":"몸 상태를 먼저 봐야 해요."}]},{"start":52,"end":59,"text":"단식 앱에 열여섯 시간이라고 떠도 내 약에 맞는 일정인지는 따로 확인해야 해요.","cues":[{"start":52.0,"end":54.5,"text":"단식 앱에 열여섯 시간이라고"},{"start":54.5,"end":57.0,"text":"떠도 내 약에 맞는 일정인지는"},{"start":57.0,"end":59.0,"text":"따로 확인해야 해요."}]},{"start":59,"end":80,"text":"당뇨 치료 중이라면 식사 시간과 약을 어떻게 맞출지 먼저 의료진과 상의하세요. 혼자 약을 줄이거나 빼서 맞추면 위험할 수 있어요. 단식하다 증상이 생기거나 혈당이 안전 범위를 벗어날 때 어떻게 대처할지도 치료 계획에 있어야 합니다.","cues":[{"start":59.0,"end":61.2,"text":"당뇨 치료 중이라면 식사"},{"start":61.2,"end":63.6,"text":"시간과 약을 어떻게 맞출지"},{"start":63.6,"end":66.2,"text":"먼저 의료진과 상의하세요."},{"start":66.2,"end":69.1,"text":"혼자 약을 줄이거나 빼서 맞추면"},{"start":69.1,"end":71.5,"text":"위험할 수 있어요. 단식하다"},{"start":71.5,"end":74.1,"text":"증상이 생기거나 혈당이 안전"},{"start":74.1,"end":77.3,"text":"범위를 벗어날 때 어떻게 대처할지도"},{"start":77.3,"end":80.0,"text":"치료 계획에 있어야 합니다."}]},{"start":80,"end":87,"text":"시작 시간을 정하기 전에 내 약에 맞춰 언제 단식을 멈출지부터 상의하세요.","cues":[{"start":80.0,"end":83.3,"text":"시작 시간을 정하기 전에 내 약에 맞춰"},{"start":83.3,"end":87.0,"text":"언제 단식을 멈출지부터 상의하세요."}]}],"sources":[{"title":"Diabetes and fasting","url":"https://idf.org/managing-diabetes/fasting/"},{"title":"Calorie Restriction with or without Time-Restricted Eating in Weight Loss","url":"https://www.nejm.org/doi/10.1056/NEJMoa2114833"},{"title":"Low Blood Glucose (Hypoglycemia)","url":"https://www.niddk.nih.gov/health-information/diabetes/overview/preventing-problems/low-blood-glucose-hypoglycemia"},{"title":"Reminder: risk factors for ketoacidosis with SGLT-2 inhibitors","url":"https://www.medsafe.govt.nz/profs/PUArticles/December2024/Reminder-risk-factors-for-ketoacidosis-with-SGLT-2-inhibitors.html"}]},{"id":48,"title":"탄수화물을 줄인 뒤 변비가 생긴 이유","category":"식사·영양","original":"탄수화물을 줄인 뒤 피곤하고 변비가 생겼다면 식단에서 뭘 살펴볼까?","length":80,"parts":[{"start":0,"end":2,"text":"탄수화물 줄이고 변비가 왔나요?","cues":[{"start":0.0,"end":2.0,"text":"탄수화물 줄이고 변비가 왔나요?"}]},{"start":2,"end":7,"text":"탄수화물을 줄인 뒤 안 먹게 된 음식이 뭔지 살펴보세요.","cues":[{"start":2.0,"end":4.4,"text":"탄수화물을 줄인 뒤 안 먹게"},{"start":4.4,"end":7.0,"text":"된 음식이 뭔지 살펴보세요."}]},{"start":7,"end":29,"text":"예전엔 아침에 귀리를 먹고, 점심엔 콩과 채소를 먹었습니다. 식단을 바꾸며 이걸 다 빼고 고기와 치즈가 주로 남았다고 해볼게요. 그러면 탄수화물과 함께 변의 상태에 영향을 주는 식이섬유도 덜 먹게 될 수 있죠. 먹는 양과 물의 양도 달라졌을 수 있습니다.","cues":[{"start":7.0,"end":9.3,"text":"예전엔 아침에 귀리를 먹고,"},{"start":9.3,"end":12.4,"text":"점심엔 콩과 채소를 먹었습니다."},{"start":12.4,"end":15.3,"text":"식단을 바꾸며 이걸 다 빼고 고기와"},{"start":15.3,"end":18.4,"text":"치즈가 주로 남았다고 해볼게요."},{"start":18.4,"end":20.9,"text":"그러면 탄수화물과 함께 변의"},{"start":20.9,"end":23.6,"text":"상태에 영향을 주는 식이섬유도"},{"start":23.6,"end":26.0,"text":"덜 먹게 될 수 있죠. 먹는 양과"},{"start":26.0,"end":29.0,"text":"물의 양도 달라졌을 수 있습니다."}]},{"start":29,"end":35,"text":"그냥 몸이 적응하는 중이라고 생각하면 이런 변화를 놓칠 수 있어요.","cues":[{"start":29.0,"end":31.5,"text":"그냥 몸이 적응하는 중이라고"},{"start":31.5,"end":35.0,"text":"생각하면 이런 변화를 놓칠 수 있어요."}]},{"start":35,"end":74,"text":"밥만 덜어낸 사람도, 콩이나 채소까지 뺀 사람도 탄수화물을 줄인 거죠. 그런데 먹는 양과 음식 종류는 둘이 전혀 다를 수 있습니다. 내 식단은 어느 쪽에 가까운지 봐야 해요. 먼저 바꾸기 전후 식사에서 식이섬유가 든 음식, 마시는 물, 전체 양을 비교해 보세요. 감량을 시작하면 몸속 수분도 달라질 수 있어요. 체중 변화만 보고 나에게 맞는 식단이라고 판단하긴 어려워요. 약을 쓰거나 불편이 계속된다면 식사 내용과 증상을 함께 확인하세요.","cues":[{"start":35.0,"end":38.2,"text":"밥만 덜어낸 사람도, 콩이나 채소까지"},{"start":38.2,"end":41.3,"text":"뺀 사람도 탄수화물을 줄인 거죠."},{"start":41.3,"end":43.9,"text":"그런데 먹는 양과 음식 종류는"},{"start":43.9,"end":46.5,"text":"둘이 전혀 다를 수 있습니다."},{"start":46.5,"end":50.3,"text":"내 식단은 어느 쪽에 가까운지 봐야 해요."},{"start":50.3,"end":52.6,"text":"먼저 바꾸기 전후 식사에서"},{"start":52.6,"end":55.2,"text":"식이섬유가 든 음식, 마시는 물,"},{"start":55.2,"end":57.7,"text":"전체 양을 비교해 보세요."},{"start":57.7,"end":59.6,"text":"감량을 시작하면 몸속"},{"start":59.6,"end":62.0,"text":"수분도 달라질 수 있어요."},{"start":62.0,"end":64.6,"text":"체중 변화만 보고 나에게 맞는"},{"start":64.6,"end":67.7,"text":"식단이라고 판단하긴 어려워요."},{"start":67.7,"end":70.5,"text":"약을 쓰거나 불편이 계속된다면"},{"start":70.5,"end":74.0,"text":"식사 내용과 증상을 함께 확인하세요."}]},{"start":74,"end":80,"text":"탄수화물 양만 세지 말고 끼니에서 어떤 음식이 빠졌는지 보세요.","cues":[{"start":74.0,"end":77.1,"text":"탄수화물 양만 세지 말고 끼니에서"},{"start":77.1,"end":80.0,"text":"어떤 음식이 빠졌는지 보세요."}]}],"sources":[{"title":"Effect of carbohydrate-restricted diets and intermittent fasting on obesity, type 2 diabetes mellitus, and hypertension management: consensus statement","url":"https://link.springer.com/article/10.1186/s40885-022-00207-4"},{"title":"Symptoms & Causes of Constipation","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/symptoms-causes"},{"title":"Reminder: risk factors for ketoacidosis with SGLT-2 inhibitors","url":"https://www.medsafe.govt.nz/profs/PUArticles/December2024/Reminder-risk-factors-for-ketoacidosis-with-SGLT-2-inhibitors.html"},{"title":"Relationship between muscle water and glycogen recovery after prolonged exercise in the heat in humans","url":"https://pubmed.ncbi.nlm.nih.gov/25911631/"}]},{"id":49,"title":"일어설 때 어지러우면 소금을 더 먹어도 될까?","category":"식사·영양","original":"어지러울 때 소금을 늘리라는데 혈압이 높으면 어떡할까?","length":89,"parts":[{"start":0,"end":2,"text":"일어서면 어지러워요?","cues":[{"start":0.0,"end":2.0,"text":"일어서면 어지러워요?"}]},{"start":2,"end":10,"text":"소금을 늘리기 전에 어떤 자세에서 혈압을 쟀는지, 무슨 약을 먹는지부터 확인하세요.","cues":[{"start":2.0,"end":5.2,"text":"소금을 늘리기 전에 어떤 자세에서"},{"start":5.2,"end":7.4,"text":"혈압을 쟀는지, 무슨 약을"},{"start":7.4,"end":10.0,"text":"먹는지부터 확인하세요."}]},{"start":10,"end":34,"text":"일어서면 몸 아래쪽으로 혈액이 더 모일 수 있어요. 몸은 그 변화에 맞춰 맥박과 혈관을 조절해요. 그런데 앉아서 잰 혈압만으로 일어난 뒤의 변화를 알기 어렵죠. 어떤 경우엔 의료진이 물이나 염분을 조정하지만 혈압이 높거나 심장이나 콩팥 질환이 있다면 조건이 달라요.","cues":[{"start":10.0,"end":12.8,"text":"일어서면 몸 아래쪽으로 혈액이"},{"start":12.8,"end":15.6,"text":"더 모일 수 있어요. 몸은 그 변화에"},{"start":15.6,"end":18.5,"text":"맞춰 맥박과 혈관을 조절해요."},{"start":18.5,"end":21.1,"text":"그런데 앉아서 잰 혈압만으로"},{"start":21.1,"end":24.2,"text":"일어난 뒤의 변화를 알기 어렵죠."},{"start":24.2,"end":27.4,"text":"어떤 경우엔 의료진이 물이나 염분을"},{"start":27.4,"end":30.7,"text":"조정하지만 혈압이 높거나 심장이나"},{"start":30.7,"end":34.0,"text":"콩팥 질환이 있다면 조건이 달라요."}]},{"start":34,"end":40,"text":"똑같이 어지러워도 먹는 약이나 몸 상태에 따라 확인할 게 달라요.","cues":[{"start":34.0,"end":36.8,"text":"똑같이 어지러워도 먹는 약이나"},{"start":36.8,"end":40.0,"text":"몸 상태에 따라 확인할 게 달라요."}]},{"start":40,"end":82,"text":"어떤 사람은 일어나자마자 어지럽고, 다른 사람은 오래 서 있던 날에만 그래요. 두 사람 다 앉아서 잰 혈압만 알려 주면 언제 어지러웠는지가 빠져요. 혈압과 함께 먹는 약이나 앓고 있는 질환도 확인해야 무엇을 바꿀지 정할 수 있어요. 최근 혈압약이 바뀌었는지, 오래 서 있을 때 생기는지, 앉으면 가라앉는지를 적어 가져가세요. 약을 혼자 끊거나 소금을 크게 늘리기 전에 상담하면 필요한 조정을 찾는 데 도움이 됩니다. 실제로 쓰러지거나 가슴 통증이 같이 오면 빨리 진료를 받아야 해요.","cues":[{"start":40.0,"end":42.3,"text":"어떤 사람은 일어나자마자"},{"start":42.3,"end":44.9,"text":"어지럽고, 다른 사람은 오래 서"},{"start":44.9,"end":47.4,"text":"있던 날에만 그래요. 두 사람 다"},{"start":47.4,"end":49.8,"text":"앉아서 잰 혈압만 알려 주면"},{"start":49.8,"end":52.6,"text":"언제 어지러웠는지가 빠져요."},{"start":52.6,"end":55.1,"text":"혈압과 함께 먹는 약이나 앓고"},{"start":55.1,"end":57.1,"text":"있는 질환도 확인해야"},{"start":57.1,"end":59.9,"text":"무엇을 바꿀지 정할 수 있어요."},{"start":59.9,"end":62.2,"text":"최근 혈압약이 바뀌었는지,"},{"start":62.2,"end":65.0,"text":"오래 서 있을 때 생기는지, 앉으면"},{"start":65.0,"end":68.0,"text":"가라앉는지를 적어 가져가세요."},{"start":68.0,"end":70.6,"text":"약을 혼자 끊거나 소금을 크게"},{"start":70.6,"end":73.1,"text":"늘리기 전에 상담하면 필요한"},{"start":73.1,"end":76.0,"text":"조정을 찾는 데 도움이 됩니다."},{"start":76.0,"end":78.7,"text":"실제로 쓰러지거나 가슴 통증이"},{"start":78.7,"end":82.0,"text":"같이 오면 빨리 진료를 받아야 해요."}]},{"start":82,"end":89,"text":"소금을 늘리기 전에 앉아서 잰 혈압과 일어선 뒤 어떤 증상이 있었는지 알려 주세요.","cues":[{"start":82.0,"end":84.2,"text":"소금을 늘리기 전에 앉아서"},{"start":84.2,"end":86.9,"text":"잰 혈압과 일어선 뒤 어떤 증상이"},{"start":86.9,"end":89.0,"text":"있었는지 알려 주세요."}]}],"sources":[{"title":"Orthostatic Hypotension in Adults With Hypertension: A Scientific Statement From the American Heart Association","url":"https://www.ahajournals.org/doi/10.1161/HYP.0000000000000236"},{"title":"2025 Guideline for the Prevention, Detection, Evaluation, and Management of High Blood Pressure in Adults","url":"https://www.jacc.org/doi/10.1016/j.jacc.2025.05.007"},{"title":"Fainting","url":"https://www.nhs.uk/symptoms/fainting/"}]},{"id":50,"title":"영양제 세 통에서 겹치는 한 성분 찾기","category":"식사·영양","original":"영양제를 몇 가지 같이 먹을 때 겹치는 성분과 양을 확인하는 법","length":83,"parts":[{"start":0,"end":2,"text":"영양제 세 통에 같은 성분이요?","cues":[{"start":0.0,"end":2.0,"text":"영양제 세 통에 같은 성분이요?"}]},{"start":2,"end":7,"text":"통 앞면에 적힌 이름만 보면 성분이 겹치는 걸 놓칠 수 있어요.","cues":[{"start":2.0,"end":4.2,"text":"통 앞면에 적힌 이름만 보면"},{"start":4.2,"end":7.0,"text":"성분이 겹치는 걸 놓칠 수 있어요."}]},{"start":7,"end":29,"text":"종합 비타민, 뼈 영양제, 면역 제품이 있다고 해볼게요. 앞면엔 무슨 용도로 먹는지가 다르게 적혀 있어도 성분표를 보면 같은 비타민이 들었을 수 있어요. 성분표의 숫자가 한 알 기준인지, 한 번에 먹는 두 알 기준인지 먼저 봐야 실제 먹는 양을 알 수 있어요.","cues":[{"start":7.0,"end":8.9,"text":"종합 비타민, 뼈 영양제,"},{"start":8.9,"end":11.8,"text":"면역 제품이 있다고 해볼게요."},{"start":11.8,"end":14.3,"text":"앞면엔 무슨 용도로 먹는지가"},{"start":14.3,"end":17.3,"text":"다르게 적혀 있어도 성분표를 보면"},{"start":17.3,"end":20.4,"text":"같은 비타민이 들었을 수 있어요."},{"start":20.4,"end":23.2,"text":"성분표의 숫자가 한 알 기준인지,"},{"start":23.2,"end":25.5,"text":"한 번에 먹는 두 알 기준인지"},{"start":25.5,"end":29.0,"text":"먼저 봐야 실제 먹는 양을 알 수 있어요."}]},{"start":29,"end":35,"text":"같은 성분을 얼마나 먹는지 더해 보고, 같이 먹는 약도 확인하세요.","cues":[{"start":29.0,"end":32.3,"text":"같은 성분을 얼마나 먹는지 더해 보고,"},{"start":32.3,"end":35.0,"text":"같이 먹는 약도 확인하세요."}]},{"start":35,"end":77,"text":"예를 들어 뼈 영양제에 든 비타민과 종합 비 쓰림과 트림이 같은 때 생기는지, 어느 쪽이 약을 먹고 바뀌었는지 보세요. 필요하면 산도와 내용물이 움직이는 모습을 따로 재는 검사를 하기도 합니다. 남은 증상을 어떻게 다룰지는 그 결과에 따라 달라질 수 있어요.","cues":[{"start":38.0,"end":40.5,"text":"탄산을 마시고 한참 뒤 트림이"},{"start":40.5,"end":42.7,"text":"난 적도 있고, 이야기하다"},{"start":42.7,"end":45.3,"text":"트림이 연달아 난 적도 있죠."},{"start":45.3,"end":47.4,"text":"언제 어떻게 반복됐는지"},{"start":47.4,"end":49.5,"text":"적어 두면 위산 문제인지,"},{"start":49.5,"end":52.1,"text":"공기가 움직이는 쪽을 더 봐야"},{"start":52.1,"end":55.2,"text":"하는지 판단하는 데 도움이 돼요."},{"start":55.2,"end":57.3,"text":"속쓰림과 트림이 같은 때"},{"start":57.3,"end":59.8,"text":"생기는지, 어느 쪽이 약을 먹고"},{"start":59.8,"end":62.4,"text":"바뀌었는지 보세요. 필요하면"},{"start":62.4,"end":65.3,"text":"산도와 내용물이 움직이는 모습을"},{"start":65.3,"end":68.4,"text":"따로 재는 검사를 하기도 합니다."},{"start":68.4,"end":70.9,"text":"남은 증상을 어떻게 다룰지는"},{"start":70.9,"end":74.0,"text":"그 결과에 따라 달라질 수 있어요."}]},{"start":74,"end":82,"text":"‘위산약이 안 들어요’ 대신 이렇게 말해 주세요. ‘속쓰림은 줄었는데 트림은 그대로예요.’","cues":[{"start":74.0,"end":76.3,"text":"‘위산약이 안 들어요’ 대신"},{"start":76.3,"end":79.0,"text":"이렇게 말해 주세요. ‘속쓰림은"},{"start":79.0,"end":82.0,"text":"줄었는데 트림은 그대로예요.’"}]}],"sources":[{"title":"Treatment for GER & GERD","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/acid-reflux-ger-gerd-adults/treatment"},{"title":"Diagnosis of GER & GERD","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/acid-reflux-ger-gerd-adults/diagnosis"},{"title":"AGA Clinical Practice Update on Evaluation and Management of Belching, Abdominal Bloating, and Distention: Expert Review","url":"https://gastro.org/clinical-guidance/evaluation-and-management-of-belching-abdominal-bloating-and-distention/"},{"title":"ACG Clinical Guideline: Guidelines for the Diagnosis and Management of Gastroesophageal Reflux Disease","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8754510/"},{"title":"Chest pain","url":"https://www.nhs.uk/symptoms/chest-pain/"}]},{"id":54,"title":"입 냄새가 걱정될 때 먼저 볼 곳","category":"소화·장","original":"입 냄새가 나는데 왜 입안부터 살펴봐야 할까?","length":84,"parts":[{"start":0,"end":2,"text":"입 냄새, 위부터 의심하나요?","cues":[{"start":0.0,"end":2.0,"text":"입 냄새, 위부터 의심하나요?"}]},{"start":2,"end":8,"text":"병원을 찾아가기 전에 냄새가 잘 생기는 입안부터 살펴보세요.","cues":[{"start":2.0,"end":4.7,"text":"병원을 찾아가기 전에 냄새가"},{"start":4.7,"end":8.0,"text":"잘 생기는 입안부터 살펴보세요."}]},{"start":8,"end":28,"text":"혀에 낀 설태나 염증이 생긴 잇몸, 음식물이 잘 끼는 곳을 살펴보세요. 입안의 세균이 남은 물질을 분해할 때 냄새가 날 수 있습니다. 침은 입안을 씻어주는 역할도 하죠. 입이 마르면 같은 날에도 냄새가 더 두드러질 수 있어요.","cues":[{"start":8.0,"end":10.8,"text":"혀에 낀 설태나 염증이 생긴 잇몸,"},{"start":10.8,"end":14.1,"text":"음식물이 잘 끼는 곳을 살펴보세요."},{"start":14.1,"end":16.5,"text":"입안의 세균이 남은 물질을"},{"start":16.5,"end":19.6,"text":"분해할 때 냄새가 날 수 있습니다."},{"start":19.6,"end":22.9,"text":"침은 입안을 씻어주는 역할도 하죠."},{"start":22.9,"end":25.1,"text":"입이 마르면 같은 날에도"},{"start":25.1,"end":28.0,"text":"냄새가 더 두드러질 수 있어요."}]},{"start":28,"end":34,"text":"장 해독부터 하다 보면 정작 입안에서 냄새가 나는 곳을 놓칠 수 있어요.","cues":[{"start":28.0,"end":31.1,"text":"장 해독부터 하다 보면 정작 입안에서"},{"start":31.1,"end":34.0,"text":"냄새가 나는 곳을 놓칠 수 있어요."}]},{"start":34,"end":76,"text":"예를 들어 아침에 입이 바싹 마른 날 특히 심했고, 잇몸에서 피도 났다고 해볼게요. 그럴 땐 입안을 먼저 살펴봐야 해요. 약을 새로 먹고 입이 마르기 시작했는지도 같이 말할 수 있어요. 입이 언제 마르는지, 잇몸에서 피가 나는지, 양치해도 냄새가 지속되는지부터 확인해 보세요. 치과에서 입안을 살핀 뒤에도 냄새가 나거나 다른 증상이 함께 있다면, 그에 맞춰 원인을 더 확인할 수 있어요. 냄새가 실제로 어떤지, 냄새가 걱정돼 일상에서 불편해진 점이 있는지도 이야기할 수 있습니다.","cues":[{"start":34.0,"end":35.9,"text":"예를 들어 아침에 입이"},{"start":35.9,"end":38.0,"text":"바싹 마른 날 특히 심했고,"},{"start":38.0,"end":41.1,"text":"잇몸에서 피도 났다고 해볼게요."},{"start":41.1,"end":44.4,"text":"그럴 땐 입안을 먼저 살펴봐야 해요."},{"start":44.4,"end":46.7,"text":"약을 새로 먹고 입이 마르기"},{"start":46.7,"end":50.0,"text":"시작했는지도 같이 말할 수 있어요."},{"start":50.0,"end":52.6,"text":"입이 언제 마르는지, 잇몸에서"},{"start":52.6,"end":55.1,"text":"피가 나는지, 양치해도 냄새가"},{"start":55.1,"end":58.2,"text":"지속되는지부터 확인해 보세요."},{"start":58.2,"end":61.4,"text":"치과에서 입안을 살핀 뒤에도 냄새가"},{"start":61.4,"end":64.1,"text":"나거나 다른 증상이 함께 있다면,"},{"start":64.1,"end":67.6,"text":"그에 맞춰 원인을 더 확인할 수 있어요."},{"start":67.6,"end":70.2,"text":"냄새가 실제로 어떤지, 냄새가"},{"start":70.2,"end":72.9,"text":"걱정돼 일상에서 불편해진 점이"},{"start":72.9,"end":76.0,"text":"있는지도 이야기할 수 있습니다."}]},{"start":76,"end":84,"text":"입 냄새가 신경 쓰인다면 혀에 설태가 끼는지, 잇몸이 어떤지, 입이 마르는지부터 보세요.","cues":[{"start":76.0,"end":78.6,"text":"입 냄새가 신경 쓰인다면 혀에"},{"start":78.6,"end":81.3,"text":"설태가 끼는지, 잇몸이 어떤지,"},{"start":81.3,"end":84.0,"text":"입이 마르는지부터 보세요."}]}],"sources":[{"title":"Bad Breath","url":"https://www.mouthhealthy.org/all-topics-a-z/bad-breath/"},{"title":"Bad breath","url":"https://www.nhs.uk/symptoms/bad-breath/"},{"title":"Dry mouth","url":"https://www.nhs.uk/symptoms/dry-mouth/"},{"title":"Detoxes and Cleanses: What You Need To Know","url":"https://www.nccih.nih.gov/health/detoxes-and-cleanses-what-you-need-to-know"}]},{"id":55,"title":"몇 입만 먹어도 배가 꽉 차는 이유","category":"소화·장","original":"몇 숟갈만 먹어도 배가 꽉 찬다. 위에서 음식이 늦게 내려가는 걸까?","length":86,"parts":[{"start":0,"end":2,"text":"세 입 먹으면 배가 꽉 차나요?","cues":[{"start":0.0,"end":2.0,"text":"세 입 먹으면 배가 꽉 차나요?"}]},{"start":2,"end":8,"text":"그 느낌만으로 음식이 위에 오래 머문다고 판단하긴 어려워요.","cues":[{"start":2.0,"end":5.0,"text":"그 느낌만으로 음식이 위에 오래"},{"start":5.0,"end":8.0,"text":"머문다고 판단하긴 어려워요."}]},{"start":8,"end":33,"text":"위는 음식을 받으면서 여유 공간을 만들고, 나중엔 소장 쪽으로 조금씩 보냅니다. 위가 음식을 받아들이기 불편한 경우도 있고 음식이 장으로 늦게 넘어가는 경우도 있어요. 둘 다 몇 입 먹기 힘들 수 있죠. 당뇨가 있는지, 수술받은 적이 있는지, 최근 먹기 시작한 약이 있는지도 확인해요.","cues":[{"start":8.0,"end":10.0,"text":"위는 음식을 받으면서"},{"start":10.0,"end":12.4,"text":"여유 공간을 만들고, 나중엔"},{"start":12.4,"end":15.3,"text":"소장 쪽으로 조금씩 보냅니다."},{"start":15.3,"end":18.2,"text":"위가 음식을 받아들이기 불편한"},{"start":18.2,"end":21.0,"text":"경우도 있고 음식이 장으로 늦게"},{"start":21.0,"end":23.7,"text":"넘어가는 경우도 있어요. 둘 다"},{"start":23.7,"end":27.0,"text":"몇 입 먹기 힘들 수 있죠. 당뇨가 있는지,"},{"start":27.0,"end":29.8,"text":"수술받은 적이 있는지, 최근 먹기"},{"start":29.8,"end":33.0,"text":"시작한 약이 있는지도 확인해요."}]},{"start":33,"end":41,"text":"몇 입 만에 배가 부른 것과 음식이 실제로 얼마나 빨리 넘어가는지는 따로 봐야 할 때가 있어요.","cues":[{"start":33.0,"end":35.7,"text":"몇 입 만에 배가 부른 것과 음식이"},{"start":35.7,"end":38.6,"text":"실제로 얼마나 빨리 넘어가는지는"},{"start":38.6,"end":41.0,"text":"따로 봐야 할 때가 있어요."}]},{"start":41,"end":81,"text":"예를 들어 조금만 먹어도 꽉 차서 중간에 숟가락을 놓는데 한참 지나선 다시 가벼워지는 날이 있어요. 다른 날엔 식후 오래 불편하고 토하기도 합니다. 먹은 양이 같아도 불편이 얼마나 오래가느냐에 따라 진료에서 더 물어볼 게 달라지죠. 필요하면 정해진 음식을 먹고 나서 위에서 얼마나 빠져나가는지 검사해요. 진료에선 몇 입 만에 배가 찼는지, 얼마나 오래 배불렀는지, 토했거나 몸무게가 줄었는지 알려 주세요. 먹거나 마시기 힘들 정도라면 진료를 미루지 마세요.","cues":[{"start":41.0,"end":43.8,"text":"예를 들어 조금만 먹어도 꽉 차서"},{"start":43.8,"end":46.3,"text":"중간에 숟가락을 놓는데 한참"},{"start":46.3,"end":48.9,"text":"지나선 다시 가벼워지는 날이"},{"start":48.9,"end":51.2,"text":"있어요. 다른 날엔 식후 오래"},{"start":51.2,"end":53.8,"text":"불편하고 토하기도 합니다."},{"start":53.8,"end":56.6,"text":"먹은 양이 같아도 불편이 얼마나"},{"start":56.6,"end":59.2,"text":"오래가느냐에 따라 진료에서"},{"start":59.2,"end":61.9,"text":"더 물어볼 게 달라지죠. 필요하면"},{"start":61.9,"end":64.7,"text":"정해진 음식을 먹고 나서 위에서"},{"start":64.7,"end":67.7,"text":"얼마나 빠져나가는지 검사해요."},{"start":67.7,"end":70.5,"text":"진료에선 몇 입 만에 배가 찼는지,"},{"start":70.5,"end":72.6,"text":"얼마나 오래 배불렀는지,"},{"start":72.6,"end":75.2,"text":"토했거나 몸무게가 줄었는지"},{"start":75.2,"end":77.9,"text":"알려 주세요. 먹거나 마시기 힘들"},{"start":77.9,"end":81.0,"text":"정도라면 진료를 미루지 마세요."}]},{"start":81,"end":86,"text":"먹은 양과 배가 꽉 찬 느낌이 시작된 때를 적어 보세요.","cues":[{"start":81.0,"end":83.5,"text":"먹은 양과 배가 꽉 찬 느낌이"},{"start":83.5,"end":86.0,"text":"시작된 때를 적어 보세요."}]}],"sources":[{"title":"Symptoms & Causes of Gastroparesis","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/gastroparesis/symptoms-causes"},{"title":"Diagnosis of Gastroparesis","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/gastroparesis/diagnosis"},{"title":"Clinical guidance on the management of gastroparesis","url":"https://gastro.org/clinical-guidance/clinical-guidance-on-the-management-of-gastroparesis/"},{"title":"Indigestion (Dyspepsia)","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/indigestion-dyspepsia"}]},{"id":56,"title":"밀을 끊고 배가 편해졌다면 검사 전에 알려 주세요","category":"소화·장","original":"글루텐을 끊고 편해졌다면, 검사 전에 알아야 할 세 가지","length":83,"parts":[{"start":0,"end":2,"text":"밀 끊으니 배가 편해졌어요?","cues":[{"start":0.0,"end":2.0,"text":"밀 끊으니 배가 편해졌어요?"}]},{"start":2,"end":7,"text":"밀을 끊고 나면 오히려 검사에서 놓칠 수 있는 게 있어요.","cues":[{"start":2.0,"end":4.8,"text":"밀을 끊고 나면 오히려 검사에서"},{"start":4.8,"end":7.0,"text":"놓칠 수 있는 게 있어요."}]},{"start":7,"end":31,"text":"밀을 빼면 글루텐이라는 단백질뿐 아니라 발효될 수 있는 탄수화물도 같이 줄어요. 식사 전체가 바뀌기도 하죠. 덜 아팠다는 경험만으로 셀리악병인지, 글루텐에 반응한 건지 판단하기는 어려워요. 셀리악병은 글루텐에 대한 면역 반응이 소장에 영향을 주는 질환이에요.","cues":[{"start":7.0,"end":9.1,"text":"밀을 빼면 글루텐이라는"},{"start":9.1,"end":11.5,"text":"단백질뿐 아니라 발효될 수"},{"start":11.5,"end":14.3,"text":"있는 탄수화물도 같이 줄어요."},{"start":14.3,"end":17.0,"text":"식사 전체가 바뀌기도 하죠."},{"start":17.0,"end":19.1,"text":"덜 아팠다는 경험만으로"},{"start":19.1,"end":21.9,"text":"셀리악병인지, 글루텐에 반응한"},{"start":21.9,"end":24.5,"text":"건지 판단하기는 어려워요."},{"start":24.5,"end":27.3,"text":"셀리악병은 글루텐에 대한 면역"},{"start":27.3,"end":31.0,"text":"반응이 소장에 영향을 주는 질환이에요."}]},{"start":31,"end":38,"text":"이미 글루텐을 줄였다면 검사에서 셀리악병을 확인하기가 어려워질 수 있어요.","cues":[{"start":31.0,"end":33.1,"text":"이미 글루텐을 줄였다면"},{"start":33.1,"end":35.0,"text":"검사에서 셀리악병을"},{"start":35.0,"end":38.0,"text":"확인하기가 어려워질 수 있어요."}]},{"start":38,"end":78,"text":"가령 빵을 빼면서 점심 메뉴가 바뀌고 양파나 소스도 덜 먹었다면, 밀 외에 먹은 음식도 달라졌죠. 어떤 음식을 빼고 증상이 어떻게 달라졌는지 알아야 검사 결과도 제대로 해석할 수 있어요. 검사를 생각 중이라면 지금 뭘 먹는지, 밀을 언제부터 제한했는지를 의료진에게 알려 주세요. 밀을 먹고 곧바로 두드러기나 호흡 증상이 있었던 경우에는 알레르기 평가가 필요하며 집에서 다시 먹어 확인하면 위험합니다. 어떤 검사가 맞는지는 반응의 종류에 따라 달라요.","cues":[{"start":38.0,"end":41.2,"text":"가령 빵을 빼면서 점심 메뉴가 바뀌고"},{"start":41.2,"end":43.5,"text":"양파나 소스도 덜 먹었다면,"},{"start":43.5,"end":46.3,"text":"밀 외에 먹은 음식도 달라졌죠."},{"start":46.3,"end":48.5,"text":"어떤 음식을 빼고 증상이"},{"start":48.5,"end":51.2,"text":"어떻게 달라졌는지 알아야 검사"},{"start":51.2,"end":54.3,"text":"결과도 제대로 해석할 수 있어요."},{"start":54.3,"end":57.4,"text":"검사를 생각 중이라면 지금 뭘 먹는지,"},{"start":57.4,"end":60.0,"text":"밀을 언제부터 제한했는지를"},{"start":60.0,"end":62.4,"text":"의료진에게 알려 주세요."},{"start":62.4,"end":64.9,"text": le":"Symptoms & Causes of Diarrhea","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/diarrhea/symptoms-causes"}]},{"id":58,"title":"저녁마다 배가 불룩해진다면 가스 때문일까?","category":"소화·장","original":"아침엔 괜찮은데 저녁이면 배가 나온다. 전부 가스 때문일까?","length":84,"parts":[{"start":0,"end":2,"text":"저녁만 되면 단추가 조여요.","cues":[{"start":0.0,"end":2.0,"text":"저녁만 되면 단추가 조여요."}]},{"start":2,"end":8,"text":"아침엔 맞던 바지가 저녁에 조인다면 가스 말고도 살펴볼 게 있어요.","cues":[{"start":2.0,"end":5.2,"text":"아침엔 맞던 바지가 저녁에 조인다면"},{"start":5.2,"end":8.0,"text":"가스 말고도 살펴볼 게 있어요."}]},{"start":8,"end":32,"text":"먹은 음식이 장에서 발효되며 가스가 생기거나 장으로 물이 더 들어올 수 있습니다. 그날 변이 잘 내려가지 않아 더부룩할 수도 있죠. 같은 정도로 장이 늘어나도 어떤 사람은 불편을 더 크게 느낍니다. 실제로 배 둘레가 늘어날 때는 배와 횡격막의 움직임도 영향을 줄 수 있어요.","cues":[{"start":8.0,"end":10.6,"text":"먹은 음식이 장에서 발효되며"},{"start":10.6,"end":13.3,"text":"가스가 생기거나 장으로 물이 더"},{"start":13.3,"end":16.1,"text":"들어올 수 있습니다. 그날 변이 잘"},{"start":16.1,"end":19.4,"text":"내려가지 않아 더부룩할 수도 있죠."},{"start":19.4,"end":21.8,"text":"같은 정도로 장이 늘어나도"},{"start":21.8,"end":25.3,"text":"어떤 사람은 불편을 더 크게 느낍니다."},{"start":25.3,"end":28.3,"text":"실제로 배 둘레가 늘어날 때는 배와"},{"start":28.3,"end":32.0,"text":"횡격막의 움직임도 영향을 줄 수 있어요."}]},{"start":32,"end":37,"text":"그래서 꽉 찬 느낌과 눈에 보이는 불룩함을 따로 물어봅니다.","cues":[{"start":32.0,"end":34.6,"text":"그래서 꽉 찬 느낌과 눈에 보이는"},{"start":34.6,"end":37.0,"text":"불룩함을 따로 물어봅니다."}]},{"start":37,"end":77,"text":"같은 바지를 입은 두 날을 떠올려 보세요. 하루는 배가 꽉 찬 느낌이 들었는데도 바지는 맞았고, 다른 날은 사진으로 봐도 배가 더 나왔어요. 두 날을 같은 ‘가스’로 적으면 차이가 사라집니다. 배가 불편했지만 옷은 편한 날이 있었나요? 반대로 식후 배 모양이 크게 바뀌었는데 통증은 덜했을 수도 있죠. 변을 본 뒤 느낌이 어땠는지, 언제 불편했는지, 실제로 배가 나왔는지 같이 보면 도움이 돼요. 최근에 배가 불룩해지기 시작해 계속 심해진다면 진료를 받아 보세요.","cues":[{"start":37.0,"end":39.8,"text":"같은 바지를 입은 두 날을 떠올려"},{"start":39.8,"end":42.6,"text":"보세요. 하루는 배가 꽉 찬 느낌이"},{"start":42.6,"end":45.0,"text":"들었는데도 바지는 맞았고,"},{"start":45.0,"end":47.6,"text":"다른 날은 사진으로 봐도 배가"},{"start":47.6,"end":50.4,"text":"더 나왔어요. 두 날을 같은 ‘가스’로"},{"start":50.4,"end":53.0,"text":"적으면 차이가 사라집니다."},{"start":53.0,"end":55.8,"text": 는지 봐야 해요."}]},{"start":77,"end":85,"text":"검사표에서 높다고 표시된 항목을 보면 먼저 물으세요. ‘실제 양인가요, 전체 중 비율인가요?’","cues":[{"start":77.0,"end":79.3,"text":"검사표에서 높다고 표시된"},{"start":79.3,"end":81.8,"text":"항목을 보면 먼저 물으세요."},{"start":81.8,"end":85.0,"text":"‘실제 양인가요, 전체 중 비율인가요?’"}]}],"sources":[{"title":"International consensus statement on microbiome testing in clinical practice","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12343204/"},{"title":"Quantitative microbiome profiling links gut community variation to microbial load","url":"https://pubmed.ncbi.nlm.nih.gov/29143816/"},{"title":"Structure, function and diversity of the healthy human microbiome","url":"https://www.genome.gov/Pages/Newsroom/CurrentNewsReleases/Nature_HMP_061312.pdf"},{"title":"Evaluating the analytical performance of direct-to-consumer gut microbiome testing services","url":"https://www.nature.com/articles/s42003-025-09301-3"},{"title":"VOWST","url":"https://www.fda.gov/vaccines-blood-biologics/vowst"},{"title":"C. diff: Facts for Clinicians","url":"https://www.cdc.gov/c-diff/hcp/clinical-overview/"}]},{"id":60,"title":"저포드맵 식단에서 뺐던 음식을 왜 다시 먹어볼까?","category":"소화·장","original":"저포드맵 식단에서 줄였던 음식을 왜 다시 먹어볼까?","length":83,"parts":[{"start":0,"end":2,"text":"저포드맵, 계속해야 할까요?","cues":[{"start":0.0,"end":2.0,"text":"저포드맵, 계속해야 할까요?"}]},{"start":2,"end":8,"text":"배가 편해진 다음엔 뺐던 음식을 다시 먹어 보는 단계가 있어요.","cues":[{"start":2.0,"end":5.0,"text":"배가 편해진 다음엔 뺐던 음식을"},{"start":5.0,"end":8.0,"text":"다시 먹어 보는 단계가 있어요."}]},{"start":8,"end":32,"text":"포드맵은 장에서 발효되기 쉬운 일부 탄수화물의 묶음이에요. 사람에 따라 장에 가스나 물이 늘어 더부룩하거나 배가 더 아플 수 있습니다. 잠시 줄여 보는 건 그 변화가 있는지 확인하는 단계죠. 편해졌다고 그 목록에 들어 있는 음식을 전부 피해야 한다는 결론이 나오진 않아요.","cues":[{"start":8.0,"end":10.8,"text":"포드맵은 장에서 발효되기 쉬운"},{"start":10.8,"end":13.6,"text":"일부 탄수화물의 묶음이에요."},{"start":13.6,"end":16.1,"text":"사람에 따라 장에 가스나 물이"},{"start":16.1,"end":19.1,"text":"늘어 더부룩하거나 배가 더 아플 수"},{"start":19.1,"end":21.7,"text":"있습니다. 잠시 줄여 보는 건 그"},{"start":21.7,"end":24.7,"text":"변화가 있는지 확인하는 단계죠."},{"start":2 t in Irritable Bowel Syndrome: Expert Review","url":"https://pubmed.ncbi.nlm.nih.gov/35337654/"},{"title":"FODMAP FAQs","url":"https://www.monashfodmap.com/about-fodmap-and-ibs/frequently-asked-questions/"},{"title":"Symptoms & Causes of Irritable Bowel Syndrome","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/irritable-bowel-syndrome/symptoms-causes"},{"title":"Wheat & Gluten Allergy","url":"https://acaai.org/allergies/allergic-conditions/food/wheat-gluten/"}]},{"id":61,"title":"회사에서 참았더니 집에 와서도 변이 안 마려운 이유","category":"배변","original":"회사에서 변을 참았더니 집에 와서도 신호가 없는 이유","length":83,"parts":[{"start":0,"end":2,"text":"참고 집에 오니 안 마려워요.","cues":[{"start":0.0,"end":2.0,"text":"참고 집에 오니 안 마려워요."}]},{"start":2,"end":8,"text":"회사에선 분명 마려웠는데 왜 집에 오면 그 느낌이 사라질까요?","cues":[{"start":2.0,"end":4.7,"text":"회사에선 분명 마려웠는데 왜"},{"start":4.7,"end":8.0,"text":"집에 오면 그 느낌이 사라질까요?"}]},{"start":8,"end":31,"text":"장이 변을 아래로 보내면 대장의 끝부분인 직장에 잠시 머물러요. 직장 벽이 늘어나면서 화장실에 가고 싶다는 신호가 들어올 수 있어요. 그때 회의에 들어가려고 참았습니다. 시간이 지나 직장이 늘어난 상태에 적응하면 변이 그대로 있어도 급한 느낌이 줄어들 수 있죠.","cues":[{"start":8.0,"end":10.7,"text":"장이 변을 아래로 보내면 대장의"},{"start":10.7,"end":13.6,"text":"끝부분인 직장에 잠시 머물러요."},{"start":13.6,"end":16.7,"text":"직장 벽이 늘어나면서 화장실에 가고"},{"start":16.7,"end":19.7,"text":"싶다는 신호가 들어올 수 있어요."},{"start":19.7,"end":23.1,"text":"그때 회의에 들어가려고 참았습니다."},{"start":23.1,"end":25.4,"text":"시간이 지나 직장이 늘어난"},{"start":25.4,"end":27.8,"text":"상태에 적응하면 변이 그대로"},{"start":27.8,"end":31.0,"text":"있어도 급한 느낌이 줄어들 수 있죠."}]},{"start":31,"end":37,"text":"식사 뒤 생기는 신호는 방금 먹은 음식이 벌써 내려와서만은 아니에요.","cues":[{"start":31.0,"end":33.7,"text":"식사 뒤 생기는 신호는 방금 먹은"},{"start":33.7,"end":37.0,"text":"음식이 벌써 내려와서만은 아니에요."}]},{"start":37,"end":77,"text":"예를 들어 아침마다 밥을 먹고 비슷한 때에 신호가 왔는데 출근 버스에선 내려갈 수가 없었어요. 회사에 도착하니 신호가 약해져 그냥 일했죠. 퇴근 뒤에만 화장실 갈 시간을 챙기면 아침에 마려웠던 걸 놓치기 쉬워요. 밥을 먹으면 그 자극으로 대장이 움직이면서 이미 장에 있던 내용물이 이동할 수 있어요. 무엇을 먹었는지와 함께, 실제로 언제 화장실에 갈 수 있었는지도 적어 보세요. 자꾸 참다가 변 보기가 어렵다면, 언제 어디서 변이 마려운지 적어 보세요.","cues":[{"start":37.0,"end":39.6,"text":"예를 들어 아침마다 밥을 먹고"},{"start":39.6,"end":42.3,"text":"비슷한 때에 신호가 왔는데 출근"},{"start":42.3,"end":45.4,"text":"버스에선 내려갈 수가 없었어요."},{"start":45.4,"end":47.6,"text":"회사에 도착하니 신호가"},{"start":47.6,"end":49.7,"text":"약해져 그냥 일했죠. 퇴근"},{"start":49.7,"end":52.5,"text":"뒤에만 화장실 갈 시간을 챙기면"},{"start":52.5,"end":55.8,"text":"아침에 마려웠던 걸 놓치기 쉬워요."},{"start":55.8,"end":58.6,"text":"밥을 먹으면 그 자극으로 대장이"},{"start":58.6,"end":60.9,"text":"움직이면서 이미 장에 있던"},{"start":60.9,"end":63.6,"text":"내용물이 이동할 수 있어요."},{"start":63.6,"end":65.7,"text":"무엇을 먹었는지와 함께,"},{"start":65.7,"end":68.1,"text":"실제로 언제 화장실에 갈 수"},{"start":68.1,"end":70.5,"text":"있었는지도 적어 보세요."},{"start":70.5,"end":73.3,"text":"자꾸 참다가 변 보기가 어렵다면,"},{"start":73.3,"end":77.0,"text":"언제 어디서 변이 마려운지 적어 보세요."}]},{"start":77,"end":83,"text":"퇴근하고 안 마려웠더라도 처음 변이 마려웠던 때부터 적어 보세요.","cues":[{"start":77.0,"end":79.7,"text":"퇴근하고 안 마려웠더라도 처음"},{"start":79.7,"end":83.0,"text":"변이 마려웠던 때부터 적어 보세요."}]}],"sources":[{"title":"Constipation Expanded Information","url":"https://fascrs.org/Web/Web/Patients/Diseases-and-Conditions/A-Z/Constipation-Expanded-Information.aspx"},{"title":"Symptoms & Causes of Constipation","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/symptoms-causes"},{"title":"Treatment for Constipation","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/treatment"}]},{"id":62,"title":"변이 부드러운데도 잘 안 나오는 이유","category":"배변","original":"변이 부드러운데도 잘 안 나온다면, 배변할 때 쓰는 근육도 원인일 수 있을까요?","length":77,"parts":[{"start":0,"end":2,"text":"변은 무른데 안 나오나요?","cues":[{"start":0.0,"end":2.0,"text":"변은 무른데 안 나오나요?"}]},{"start":2,"end":8,"text":"변을 더 무르게 만들기 전에 힘줄 때 어떻게 되는지 살펴보세요.","cues":[{"start":2.0,"end":4.5,"text":"변을 더 무르게 만들기 전에"},{"start":4.5,"end":8.0,"text":"힘줄 때 어떻게 되는지 살펴보세요."}]},{"start":8,"end":27,"text":"변을 보려면 배에 힘을 줘 밀어내는 동안 골반 아래 근육과 항문 쪽은 풀려야 해요. 그런데 힘주는 순간 오히려 출구 쪽도 같이 조여질 수 있어요. 그러면 변이 딱딱하지 않아도 오래 앉아 있거나 덜 나온 느낌이 들 수 있습니다.","cues":[{"start":8.0,"end":10.1,"text":"변을 보려면 배에 힘을 줘"},{"start":10.1,"end":12.2,"text":"밀어내는 동안 골반 아래"},{"start":12.2,"end":15.1,"text":"근육과 항문 쪽은 풀려야 해요."},{"start":15.1,"end":17.8,"text":"그런데 힘주는 순간 오히려 출구"},{"start":17.8,"end":20.8,"text":"쪽도 같이 조여질 수 있어요. 그러면"},{"start":20.8,"end":23.5,"text":"변이 딱딱하지 않아도 오래 앉아"},{"start":23.5,"end":27.0,"text":"있거나 덜 나온 느낌이 들 수 있습니다."}]},{"start":27,"end":32,"text":"이 경우엔 얼마나 세게 힘을 줬는지보다 그 순서가 단서예요.","cues":[{"start":27.0,"end":29.2,"text":"이 경우엔 얼마나 세게 힘을"},{"start":29.2,"end":32.0,"text":"줬는지보다 그 순서가 단서예요."}]},{"start":32,"end":71,"text":"변기에 오래 앉아도 덜 나온 느낌이 들고 더 힘을 줄수록 막히는 것 같을 때가 있어요. 이럴 때 변을 몇 번 봤는지, 얼마나 무른지만 물으면 정작 힘주는 순간에 뭐가 어려웠는지 놓치기 쉬워요. 병원에서는 항문직장 내압 검사로 압력을 재거나 풍선 배출 검사로 작은 풍선을 내보낼 수 있는지 살펴볼 수 있습니다. 문제에 따라 화면이나 신호를 보면서 힘주기와 이완을 맞추는 치료를 쓰기도 해요. 변이 무른데도 자꾸 잘 안 나오면 진료에서 꼭 말해 주세요.","cues":[{"start":32.0,"end":34.3,"text":"변기에 오래 앉아도 덜 나온"},{"start":34.3,"end":36.7,"text":"느낌이 들고 더 힘을 줄수록"},{"start":36.7,"end":39.3,"text":"막히는 것 같을 때가 있어요."},{"start":39.3,"end":41.4,"text":"이럴 때 변을 몇 번 봤는지,"},{"start":41.4,"end":43.5,"text":"얼마나 무른지만 물으면"},{"start":43.5,"end":45.7,"text":"정작 힘주는 순간에 뭐가"},{"start":45.7,"end":48.3,"text":"어려웠는지 놓치기 쉬워요."},{"start":48.3,"end":50.6,"text":"병원에서는 항문직장 내압"},{"start":50.6,"end":53.4,"text":"검사로 압력을 재거나 풍선 배출"},{"start":53.4,"end":55.9,"text":"검사로 작은 풍선을 내보낼 수"},{"start":55.9,"end":58.5,"text":"있는지 살펴볼 수 있습니다."},{"start":58.5,"end":61.1,"text":"문제에 따라 화면이나 신호를"},{"start":61.1,"end":63.2,"text":"보면서 힘주기와 이완을"},{"start":63.2,"end":65.8,"text":"맞추는 치료를 쓰기도 해요."},{"start":65.8,"end":68.6,"text":"변이 무른데도 자꾸 잘 안 나오면"},{"start":68.6,"end":71.0,"text":"진료에서 꼭 말해 주세요."}]},{"start":71,"end":77,"text":"‘변비예요’ 하고 끝내지 말고 ‘변이 무른데도 잘 안 나와요’라고 말해 주세요.","cues":[{"start":71.0,"end":73.6,"text":"‘변비예요’ 하고 끝내지 말고 ‘변이"},{"start":73.6,"end":77.0,"text":"무른데도 잘 안 나와요’라고 말해 주세요."}]}],"sources":[{"title":"Constipation Expanded Information","url":"https://fascrs.org/Web/Web/Patients/Diseases-and-Conditions/A-Z/Constipation-Expanded-Information.aspx"},{"title":"The American Society of Colon and Rectal Surgeons Clinical Practice Guidelines for the Evaluation and Management of Chronic Constipation","url":"https://www.ascrsu.com/ascrs/view/ASCRS-Toolkit/2851100/all/Evaluation_and_Management_of_Chronic_Constipation__2024_"},{"title":"Evaluation and management of refractory constipation","url":"https://gastro.org/clinical-guidance/evaluation-and-management-of-refractory-constipation/"}]},{"id":63,"title":"변비약을 쉬었더니 다시 변비가 생겼다면","category":"배변","original":"변비약을 끊으니 다시 변비가 생긴다. 장이 약에 익숙해진 걸까요?","length":77,"parts":[{"start":0,"end":2,"text":"변비약 쉬면 또 막히나요?","cues":[{"start":0.0,"end":2.0,"text":"변비약 쉬면 또 막히나요?"}]},{"start":2,"end":8,"text":"안 먹자마자 다시 불편했다면 그 약이 원래 어떤 작용을 했는지 봐야 해요.","cues":[{"start":2.0,"end":5.0,"text":"안 먹자마자 다시 불편했다면 그 약이"},{"start":5.0,"end":8.0,"text":"원래 어떤 작용을 했는지 봐야 해요."}]},{"start":8,"end":28,"text":"장에 물이 더 남도록 돕는 약이 있습니다. 변이 부드러워지면 배출이 수월해질 수 있죠. 어떤 약은 장의 움직임이나 장에 물이 나오는 과정에 영향을 줍니다. 약을 쉬면 원래처럼 변이 딱딱해지거나 다시 잘 나오지 않을 수 있어요.","cues":[{"start":8.0,"end":10.6,"text":"장에 물이 더 남도록 돕는 약이"},{"start":10.6,"end":13.2,"text":"있습니다. 변이 부드러워지면"},{"start":13.2,"end":15.6,"text":"배출이 수월해질 수 있죠."},{"start":15.6,"end":18.4,"text":"어떤 약은 장의 움직임이나 장에"},{"start":18.4,"end":21.7,"text":"물이 나오는 과정에 영향을 줍니다."},{"start":21.7,"end":25.1,"text":"약을 쉬면 원래처럼 변이 딱딱해지거나"},{"start":25.1,"end":28.0,"text":"다시 잘 나오지 않을 수 있어요."}]},{"start":28,"end":33,"text":"다시 변비가 왔다고 장이 손상됐다는 증거는 아니에요.","cues":[{"start":28.0,"end":30.1,"text":"다시 변비가 왔다고 장이"},{"start":30.1,"end":33.0,"text":"손상됐다는 증거는 아니에요."}]},{"start":33,"end":70,"text":"같은 변비약이라고 써 있어도 어떤 사람이 먹은 건 물이 남게 돕는 약, 다른 사람이 먹은 건 움직임에 작용하는 약일 수 있어요. 쉬었을 때 다시 힘들었다는 경험이 같아도 확인할 부작용과 치료 계획은 다르죠. 오래 쓸 때의 주의점이나 부작용은 약 종류에 따라 달라요. 약 이름을 확인한 뒤 먹는 동안 뭐가 나아졌고 뭐가 여전히 불편했는지 말해 주세요. 변은 무른데도 계속 힘을 줘야 한다면 변이 나올 때 어떤 점이 힘든지 더 살펴야 해요.","cues":[{"start":33.0,"end":35.5,"text":"같은 변비약이라고 써 있어도"},{"start":35.5,"end":38.7,"text":"어떤 사람이 먹은 건 물이 남게 돕는 약,"},{"start":38.7,"end":41.2,"text":"다른 사람이 먹은 건 움직임에"},{"start":41.2,"end":43.6,"text":"작용하는 약일 수 있어요."},{"start":43.6,"end":45.9,"text":"쉬었을 때 다시 힘들었다는"},{"start":45.9,"end":47.8,"text":"경험이 같아도 확인할"},{"start":47.8,"end":50.7,"text":"부작용과 치료 계획은 다르죠."},{"start":50.7,"end":52.8,"text":"오래 쓸 때의 주의점이나"},{"start":52.8,"end":55.8,"text":"부작용은 약 종류에 따라 달라요."},{"start":55.8,"end":58.7,"text":"약 이름을 확인한 뒤 먹는 동안 뭐가"},{"start":58.7,"end":61.7,"text":"나아졌고 뭐가 여전히 불편했는지"},{"start":61.7,"end":64.4,"text":"말해 주세요. 변은 무른데도 계속"},{"start":64.4,"end":67.0,"text":"힘을 줘야 한다면 변이 나올 때"},{"start":67.0,"end":70.0,"text":"어떤 점이 힘든지 더 살펴야 해요."}]},{"start":70,"end":77,"text":"약 상자를 가져가 먹을 때 나아진 점과 쉬었을 때 다시 불편해진 점을 알려 주세요.","cues":[{"start":70.0,"end":72.1,"text":"약 상자를 가져가 먹을 때"},{"start":72.1,"end":74.4,"text":"나아진 점과 쉬었을 때 다시"},{"start":74.4,"end":77.0,"text":"불편해진 점을 알려 주세요."}]}],"sources":[{"title":"American Gastroenterological Association-American College of Gastroenterology Clinical Practice Guideline: Pharmacological Management of Chronic Idiopathic Constipation","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10542656/"},{"title":"Treatment for Constipation","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/treatment"},{"title":"Evaluation and management of refractory constipation","url":"https://gastro.org/clinical-guidance/evaluation-and-management-of-refractory-constipation/"}]},{"id":64,"title":"변비 며칠 뒤 묽은 변이 샐 때","category":"배변","original":"변비가 있는데 묽은 변이 샌다면 굳은 변 옆으로 흘러나온 것일 수 있습니다","length":77,"parts":[{"start":0,"end":2,"text":"변비 뒤 묽은 변이 새나요?","cues":[{"start":0.0,"end":2.0,"text":"변비 뒤 묽은 변이 새나요?"}]},{"start":2,"end":7,"text":"묽은 변이 나왔어도 장에 굳은 변이 남아 있는 경우가 있어요.","cues":[{"start":2.0,"end":4.4,"text":"묽은 변이 나왔어도 장에 굳은"},{"start":4.4,"end":7.0,"text":"변이 남아 있는 경우가 있어요."}]},{"start":7,"end":44,"text":"며칠 동안 제대로 변을 못 봤습니다. 그런데 갑자기 속옷에 묽은 변이 조금씩 묻어요. 단단한 변이 장 안에 쌓여 있으면 그 옆으로 묽은 변이 빠져나와 샐 수 있어요. 속옷에 묻은 것만 보면 설사약부터 생각하기 쉬워요. 예를 들어 며칠 제대로 변을 못 본 뒤 물 같은 변이 조금씩 묻기 시작했다면 ‘오늘 설사했어요’만으론 앞서 있었던 변비가 빠져요. 묽은 변을 많이 본 것인지, 제대로 변을 보지 못한 채 조금씩 샌 것인지부터 알려 주세요.","cues":[{"start":7.0,"end":10.3,"text":"며칠 동안 제대로 변을 못 봤습니다."},{"start":10.3,"end":12.2,"text":"그런데 갑자기 속옷에"},{"start":12.2,"end":14.6,"text":"묽은 변이 조금씩 묻어요."},{"start":14.6,"end":17.3,"text":"단단한 변이 장 안에 쌓여 있으면"},{"start":17.3,"end":19.9,"text":"그 옆으로 묽은 변이 빠져나와"},{"start":19.9,"end":22.8,"text":"샐 수 있어요. 속옷에 묻은 것만 보면"},{"start":22.8,"end":25.6,"text":"설사약부터 생각하기 쉬워요."},{"start":25.6,"end":28.8,"text":"예를 들어 며칠 제대로 변을 못 본 뒤 물"},{"start":28.8,"end":31.8,"text":"같은 변이 조금씩 묻기 시작했다면"},{"start":31.8,"end":34.3,"text":"‘오늘 설사했어요’만으론 앞서"},{"start":34.3,"end":36.5,"text":"있었던 변비가 빠져요."},{"start":36.5,"end":38.6,"text":"묽은 변을 많이 본 것인지,"},{"start":38.6,"end":41.4,"text":"제대로 변을 보지 못한 채 조금씩"},{"start":41.4,"end":44.0,"text":"샌 것인지부터 알려 주세요."}]},{"start":44,"end":51,"text":"하지만 막힌 변이 남았다면 지사제를 먹기 전에 쌓인 변부터 확인해야 해요.","cues":[{"start":44.0,"end":47.3,"text":"하지만 막힌 변이 남았다면 지사제를"},{"start":47.3,"end":51.0,"text":"먹기 전에 쌓인 변부터 확인해야 해요."}]},{"start":51,"end":70,"text":"이전 며칠 동안 변을 얼마나 봤는지, 배가 불러오거나 토하는지 함께 알려 주세요. 변이 쌓여 있는지 진찰로 확인해야 할 수 있습니다. 배가 심하게 아프거나 붓고, 토하거나 가스도 못 내보내면 신속하게 평가받으세요.","cues":[{"start":51.0,"end":54.0,"text":"이전 며칠 동안 변을 얼마나 봤는지,"},{"start":54.0,"end":56.8,"text":"배가 불러오거나 토하는지 함께"},{"start":56.8,"end":59.4,"text":"알려 주세요. 변이 쌓여 있는지"},{"start":59.4,"end":62.6,"text":"진찰로 확인해야 할 수 있습니다."},{"start":62.6,"end":64.9,"text":"배가 심하게 아프거나 붓고,"},{"start":64.9,"end":67.5,"text":"토하거나 가스도 못 내보내면"},{"start":67.5,"end":70.0,"text":"신속하게 평가받으세요."}]},{"start":70,"end":77,"text":"진료에선 순서대로 말해 주세요. ‘며칠 변을 못 봤고 그다음 묽은 변이 샜어요.’","cues":[{"start":70.0,"end":72.2,"text":"진료에선 순서대로 말해"},{"start":72.2,"end":74.5,"text":"주세요. ‘며칠 변을 못 봤고"},{"start":74.5,"end":77.0,"text":"그다음 묽은 변이 샜어요.’"}]}],"sources":[{"title":"Fecal impaction","url":"https://medlineplus.gov/ency/article/000230.htm"},{"title":"Constipation","url":"https://www.nhs.uk/conditions/constipation/"},{"title":"Symptoms & Causes of Constipation","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/symptoms-causes"}]},{"id":65,"title":"철분제 먹고 검은 변이 나올 때 봐야 할 증상","category":"배변","original":"철분제를 먹고 변이 검어졌다. 약 때문인지 출혈인지 어떻게 살필까요?","length":84,"parts":[{"start":0,"end":2,"text":"철분 먹고 검은 변이 나와요?","cues":[{"start":0.0,"end":2.0,"text":"철분 먹고 검은 변이 나와요?"}]},{"start":2,"end":9,"text":"철분제 때문에 변 색이 바뀔 수 있어요. 다만 새로 생긴 증상이 있는지 봐야 해요.","cues":[{"start":2.0,"end":5.4,"text":"철분제 때문에 변 색이 바뀔 수 있어요."},{"start":5.4,"end":9.0,"text":"다만 새로 생긴 증상이 있는지 봐야 해요."}]},{"start":9,"end":50,"text":"먹은 철분 중 몸에 흡수되지 않고 남은 철분이 변을 검게 만들 수 있습니다. 한편 위나 장에서 피가 나 소화되면서 검고 끈적한 변이 나올 수도 있어요. 새까맣다는 말만으로 둘을 확실히 가르기는 어렵습니다. 철분제를 먹기 시작했다고 출혈 가능성이 없어지는 건 아니에요. 철분제를 먹기 시작한 뒤 변 색만 어두워지고 몸 상태는 그대로일 수 있어요. 어떤 날은 검고 끈적한 변과 함께 일어설 때 어지러움이 새로 생기죠. 두 경우 모두 철분제를 먹었다고 같은 상황으로 보면 안 돼요.","cues":[{"start":9.0,"end":11.7,"text":"먹은 철분 중 몸에 흡수되지 않고"},{"start":11.7,"end":14.3,"text":"남은 철분이 변을 검게 만들 수"},{"start":14.3,"end":16.6,"text":"있습니다. 한편 위나 장에서"},{"start":16.6,"end":18.7,"text":"피가 나 소화되면서 검고"},{"start":18.7,"end":21.5,"text":"끈적한 변이 나올 수도 있어요."},{"start":21.5,"end":23.8,"text":"새까맣다는 말만으로 둘을"},{"start":23.8,"end":26.6,"text":"확실히 가르기는 어렵습니다."},{"start":26.6,"end":28.9,"text":"철분제를 먹기 시작했다고"},{"start":28.9,"end":31.0,"text":"출혈 가능성이 없어지는"},{"start":31.0,"end":33.3,"text":"건 아니에요. 철분제를 먹기"},{"start":33.3,"end":35.9,"text":"시작한 뒤 변 색만 어두워지고"},{"start":35.9,"end":38.7,"text":"몸 상태는 그대로일 수 있어요."},{"start":38.7,"end":41.4,"text":"어떤 날은 검고 끈적한 변과 함께"},{"start":41.4,"end":44.7,"text":"일어설 때 어지러움이 새로 생기죠."},{"start":44.7,"end":47.4,"text":"두 경우 모두 철분제를 먹었다고"},{"start":47.4,"end":50.0,"text":"같은 상황으로 보면 안 돼요."}]},{"start":50,"end":57,"text":"변 색을 볼 때 전에 없던 어지러움이나 식은땀이 함께 생겼는지도 봐야 해요.","cues":[{"start":50.0,"end":53.3,"text":"변 색을 볼 때 전에 없던 어지러움이나"},{"start":53.3,"end":57.0,"text":"식은땀이 함께 생겼는지도 봐야 해요."}]},{"start":57,"end":78,"text":"끈적한 검은 변이 새로 나오거나 어지럽고 식은땀이 나는 등 전신 증상이 있다면 빠른 의료 평가가 필요합니다. 피를 토하거나 정신을 잃으면 응급이에요. 진료에선 철분제를 시작한 날과 변 색이 달라진 날, 같이 생긴 증상 "}]},{"id":67,"title":"여행 가면 왜 변비가 생길까?","category":"배변","original":"여행만 가면 변비가 생긴다. 집에서와 뭐가 달라졌을까요?","length":81,"parts":[{"start":0,"end":2,"text":"여행 가면 꼭 변비가 오나요?","cues":[{"start":0.0,"end":2.0,"text":"여행 가면 꼭 변비가 오나요?"}]},{"start":2,"end":8,"text":"평소 아침에 하는 일과 여행 첫날 아침에 한 일을 비교해 보세요.","cues":[{"start":2.0,"end":5.0,"text":"평소 아침에 하는 일과 여행 첫날"},{"start":5.0,"end":8.0,"text":"아침에 한 일을 비교해 보세요."}]},{"start":8,"end":32,"text":"집에서는 아침밥 먹고 화장실에 갈 시간이 있죠. 여행 첫날엔 새벽에 나와 아침밥을 거르고 변이 마려울 때는 이동 중일 수 있어요. 낯선 화장실이라 미루기도 합니다. 먹는 양이 줄면 변을 이루는 내용도 달라져요. 물을 얼마나 마셨는지와 평소 안 먹던 약도 영향을 줄 수 있어요.","cues":[{"start":8.0,"end":9.9,"text":"집에서는 아침밥 먹고"},{"start":9.9,"end":12.4,"text":"화장실에 갈 시간이 있죠."},{"start":12.4,"end":15.4,"text":"여행 첫날엔 새벽에 나와 아침밥을"},{"start":15.4,"end":17.9,"text":"거르고 변이 마려울 때는 이동"},{"start":17.9,"end":20.7,"text":"중일 수 있어요. 낯선 화장실이라"},{"start":20.7,"end":23.5,"text":"미루기도 합니다. 먹는 양이 줄면"},{"start":23.5,"end":26.4,"text":"변을 이루는 내용도 달라져요."},{"start":26.4,"end":28.9,"text":"물을 얼마나 마셨는지와 평소"},{"start":28.9,"end":32.0,"text":"안 먹던 약도 영향을 줄 수 있어요."}]},{"start":32,"end":38,"text":"여행 중 며칠 화장실에 못 갔다는 말만으로 한 가지 원인을 꼽긴 어려워요.","cues":[{"start":32.0,"end":34.6,"text":"여행 중 며칠 화장실에 못 갔다는"},{"start":34.6,"end":38.0,"text":"말만으로 한 가지 원인을 꼽긴 어려워요."}]},{"start":38,"end":73,"text":"평소 안 먹던 멀미약이나 다른 약을 챙겼다면 그 약을 언제 먹었는지도 보세요. 약을 먹은 날에 정해진 시간에 출발하느라 화장실까지 미뤘을 수도 있죠. 다음 일정에는 아침이나 첫 식사 뒤 화장실을 쓸 여유가 있었는지, 물을 얼마나 마셨는지 살펴보세요. 집에 돌아와 평소대로 지내면서 변 보기가 나아졌는지도 보세요. 불편이 계속되거나 심한 복통이나 구토가 동반되면 여행 탓으로 넘기지 마세요.","cues":[{"start":38.0,"end":40.1,"text":"평소 안 먹던 멀미약이나"},{"start":40.1,"end":42.9,"text":"다른 약을 챙겼다면 그 약을 언제"},{"start":42.9,"end":45.5,"text":"먹었는지도 보세요. 약을 먹은"},{"start":45.5,"end":48.3,"text":"날에 정해진 시간에 출발하느라"},{"start":48.3,"end":51.1,"text":"화장실까지 미뤘을 수도 있죠."},{"start":51.1,"end":54.1,"text":"다음 일정에는 아침이나 첫 식사 뒤"},{"start":54.1,"end":56.7,"text":"화장실을 쓸 여유가 있었는지,"},{"start":56.7,"end":60.0,"text":"물을 얼마나 마셨는지 살펴보세요."},{"start":60.0,"end":62.8,"text":"집에 돌아와 평소대로 지내면서"},{"start":62.8,"end":65.9,"text":"변 보기가 나아졌는지도 보세요."},{"start":65.9,"end":68.0,"text":"불편이 계속되거나 심한"},{"start":68.0,"end":70.3,"text":"복통이나 구토가 동반되면"},{"start":70.3,"end":73.0,"text":"여행 탓으로 넘기지 마세요."}]},{"start":73,"end":81,"text":"여행에서 언제 뭘 먹었는지, 언제 변이 마려웠고 실제로 화장실에 갈 수 있었는지 적어 보세요.","cues":[{"start":73.0,"end":75.3,"text":"여행에서 언제 뭘 먹었는지,"},{"start":75.3,"end":77.6,"text":"언제 변이 마려웠고 실제로"},{"start":77.6,"end":81.0,"text":"화장실에 갈 수 있었는지 적어 보세요."}]}],"sources":[{"title":"Symptoms & Causes of Constipation","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/symptoms-causes"},{"title":"Treatment for Constipation","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/treatment"},{"title":"Constipation","url":"https://www.nhs.uk/conditions/constipation/"}]},{"id":68,"title":"달릴 때 배가 아프면 무엇을 기록할까?","category":"배변","original":"달릴 때마다 배가 아프다면 장으로 가는 혈액과 먹은 음식도 살펴봅니다","length":80,"parts":[{"start":0,"end":2,"text":"뛰기만 하면 배가 아픈가요?","cues":[{"start":0.0,"end":2.0,"text":"뛰기만 하면 배가 아픈가요?"}]},{"start":2,"end":7,"text":"달리기 앱의 거리 옆에 운동 전 먹고 마신 것도 써 보세요.","cues":[{"start":2.0,"end":4.4,"text":"달리기 앱의 거리 옆에 운동"},{"start":4.4,"end":7.0,"text":"전 먹고 마신 것도 써 보세요."}]},{"start":7,"end":47,"text":"세게 달리면 몸은 근육과 체온을 조절하는 데 혈액을 더 써요. 그러면 장으로 가는 혈액은 상대적으로 줄 수 있어요. 뛰는 동안의 흔들림도 영향을 줄 수 있고요. 직전에 많이 먹었거나 운동 중 처음 마셔 본 음료가 있다면 소화하는 데도 부담이 달라져요. 예를 들어 시원한 날엔 같은 코스를 편하게 뛰었는데 더운 날 갑자기 달리는 속도를 높이고 새 음료를 마신 뒤 배가 아팠어요. 세 조건이 동시에 바뀌면 어느 한 요인만으로 설명할 수 없죠. 하나씩 비교하는 이유예요.","cues":[{"start":7.0,"end":9.7,"text":"세게 달리면 몸은 근육과 체온을"},{"start":9.7,"end":12.3,"text":"조절하는 데 혈액을 더 써요."},{"start":12.3,"end":14.6,"text":"그러면 장으로 가는 혈액은"},{"start":14.6,"end":17.2,"text":"상대적으로 줄 수 있어요. 뛰는"},{"start":17.2,"end":20.6,"text":"동안의 흔들림도 영향을 줄 수 있고요."},{"start":20.6,"end":23.1,"text":"직전에 많이 먹었거나 운동 중"},{"start":23.1,"end":25.4,"text":"처음 마셔 본 음료가 있다면"},{"start":25.4,"end":28.5,"text":"소화하는 데도 부담이 달라져요."},{"start":28.5,"end":31.4,"text":"예를 들어 시원한 날엔 같은 코스를"},{"start": "text":"바르는 방법이 달라질 수 있죠."},{"start":63.6,"end":66.2,"text":"혼자 발랐다 쉬었다 반복하기"},{"start":66.2,"end":68.1,"text":"전에 피부 상태와 처음"},{"start":68.1,"end":71.0,"text":"진단을 다시 살펴볼 수 있어요."}]},{"start":71,"end":79,"text":"진료 갈 땐 연고 이름과 바른 부위, 얼마나 오래 발랐는지, 다시 붉어진 모습을 가져가세요.","cues":[{"start":71.0,"end":73.9,"text":"진료 갈 땐 연고 이름과 바른 부위,"},{"start":73.9,"end":75.8,"text":"얼마나 오래 발랐는지,"},{"start":75.8,"end":79.0,"text":"다시 붉어진 모습을 가져가세요."}]}],"sources":[{"title":"Topical corticosteroids and withdrawal reactions","url":"https://www.gov.uk/guidance/topical-corticosteroids-and-withdrawal-reactions"},{"title":"Atopic dermatitis clinical guideline","url":"https://www.aad.org/member/clinical-quality/guidelines/atopic-dermatitis"},{"title":"Eczema types: Atopic dermatitis diagnosis and treatment","url":"https://www.aad.org/public/diseases/eczema/types/atopic-dermatitis/treatment"}]},{"id":72,"title":"크림을 발라도 얼굴이 화끈거리는 이유","category":"피부","original":"보습제를 발라도 얼굴이 계속 화끈거리면 무엇을 살펴볼까요?","length":81,"parts":[{"start":0,"end":2,"text":"크림 발라도 얼굴이 화끈해요?","cues":[{"start":0.0,"end":2.0,"text":"크림 발라도 얼굴이 화끈해요?"}]},{"start":2,"end":9,"text":"크림을 바꾸기 전에 따가움이 줄었는지, 붉은 기도 가라앉았는지 따로 보세요.","cues":[{"start":2.0,"end":5.5,"text":"크림을 바꾸기 전에 따가움이 줄었는지,"},{"start":5.5,"end":9.0,"text":"붉은 기도 가라앉았는지 따로 보세요."}]},{"start":9,"end":31,"text":"보습제는 피부의 장벽을 돕습니다. 그래서 씻고 난 뒤 당김이나 따가움은 편해질 수 있어요. 주사라는 피부 질환이 있으면 혈관과 염증 때문에 얼굴이 붉어질 수 있습니다. 그 경우 피부 촉감이 좋아져도 얼굴이 확 달아오르거나 붉은 병변이 남을 수 있죠.","cues":[{"start":9.0,"end":12.3,"text":"보습제는 피부의 장벽을 돕습니다."},{"start":12.3,"end":14.6,"text":"그래서 씻고 난 뒤 당김이나"},{"start":14.6,"end":17.3,"text":"따가움은 편해질 수 있어요."},{"start":17.3,"end":19.8,"text":"주사라는 피부 질환이 있으면"},{"start":19.8,"end":23.0,"text":"혈관과 염증 때문에 얼굴이 붉어질 수"},{"start":23.0,"end":25.6,"text":"있습니다. 그 경우 피부 촉감이"},{"start":25.6,"end":28.6,"text":"좋아져도 얼굴이 확 달아오르거나"},{"start":28.6,"end":31.0,"text":"붉은 병변이 남을 수 있죠."}]},{"start":31,"end":37,"text":"얼굴이 당기는 느낌과 확 달아오르는 느낌을 나눠서 말해 보세요.","cues":[{"start":31.0,"end":34.3,"text":"얼굴이 당기는 느낌과 확 달아오르는"},{"start":34.3,"end":37.0,"text":"느낌을 나눠서 말해 보세요."}]},{"start":37,"end":75,"text":"샤워 뒤에는 따끔거리다 보습하면 가라앉는데 뜨거운 음식을 먹을 땐 볼이 금세 달아오를 수 있어요. 둘 다 ‘얼굴이 예민해요’라고 하면 보습으로 뭐가 달라졌는지 잘 안 드러나죠. 더운 장소에서 갑자기 붉어지는지, 붉은 상태가 계속되는지, 뾰루지처럼 올라오는 것도 있는지 살펴보세요. 눈이 따갑거나 충혈이 같이 생겼다면 그 증상도 진료에서 알려 주세요. 크림을 바꾼 뒤 달라진 점을 들으면 다음에 어느 증상을 볼지 정하는 데 도움이 돼요.","cues":[{"start":37.0,"end":40.0,"text":"샤워 뒤에는 따끔거리다 보습하면"},{"start":40.0,"end":42.7,"text":"가라앉는데 뜨거운 음식을 먹을"},{"start":42.7,"end":45.8,"text":"땐 볼이 금세 달아오를 수 있어요."},{"start":45.8,"end":48.1,"text":"둘 다 ‘얼굴이 예민해요’라고"},{"start":48.1,"end":50.8,"text":"하면 보습으로 뭐가 달라졌는지"},{"start":50.8,"end":53.4,"text":"잘 안 드러나죠. 더운 장소에서"},{"start":53.4,"end":56.1,"text":"갑자기 붉어지는지, 붉은 상태가"},{"start":56.1,"end":59.1,"text":"계속되는지, 뾰루지처럼 올라오는"},{"start":59.1,"end":61.5,"text":"것도 있는지 살펴보세요."},{"start":61.5,"end":64.7,"text":"눈이 따갑거나 충혈이 같이 생겼다면"},{"start":64.7,"end":67.7,"text":"그 증상도 진료에서 알려 주세요."},{"start":67.7,"end":70.0,"text":"크림을 바꾼 뒤 달라진 점을"},{"start":70.0,"end":72.4,"text":"들으면 다음에 어느 증상을"},{"start":72.4,"end":75.0,"text":"볼지 정하는 데 도움이 돼요."}]},{"start":75,"end":81,"text":"‘당김은 줄었는데 이럴 때 얼굴이 빨개지고 뜨거워요’라고 말해 주세요.","cues":[{"start":75.0,"end":77.7,"text":"‘당김은 줄었는데 이럴 때 얼굴이"},{"start":77.7,"end":81.0,"text":"빨개지고 뜨거워요’라고 말해 주세요."}]}],"sources":[{"title":"Rosacea","url":"https://www.skinhealthinfo.org.uk/condition/rosacea/"},{"title":"Rosacea: Diagnosis and treatment","url":"https://www.aad.org/public/diseases/rosacea/treatment/diagnosis-treat"},{"title":"Rosacea","url":"https://www.nhs.uk/conditions/rosacea/"}]},{"id":73,"title":"턱 여드름이 반복되면 호르몬 검사부터 해야 할까?","category":"피부","original":"턱 여드름이 반복되면 호르몬 검사부터 해야 할까요?","length":79,"parts":[{"start":0,"end":2,"text":"턱 여드름, 호르몬 탓일까요?","cues":[{"start":0.0,"end":2.0,"text":"턱 여드름, 호르몬 탓일까요?"}]},{"start":2,"end":8,"text":"턱에 여드름이 날 무렵 몸에 다른 변화도 생겼는지 돌아보세요.","cues":[{"start":2.0,"end":4.5,"text":"턱에 여드름이 날 무렵 몸에"},{"start":4.5,"end":8.0,"text":"다른 변화도 생겼는지 돌아보세요."}]},{"start":8,"end":29,"text":"여드 text":"어떻게 먹고 지냈는지도 돌아보세요."}]},{"start":8,"end":33,"text":"머리카락은 모두 동시에 자라고 빠지지 않습니다. 모낭마다 자라는 때와 쉬는 때가 달라요. 급격한 체중 변화나 섭취 부족 뒤 더 많은 모낭이 쉬는 시기로 들어가면 시간이 지나 머리카락이 더 빠질 수 있습니다. 그래서 식사가 좀 나아진 뒤에야 샤워할 때 많이 빠지는 걸 알아차리기도 해요.","cues":[{"start":8.0,"end":10.8,"text":"머리카락은 모두 동시에 자라고"},{"start":10.8,"end":13.2,"text":"빠지지 않습니다. 모낭마다"},{"start":13.2,"end":16.1,"text":"자라는 때와 쉬는 때가 달라요."},{"start":16.1,"end":19.1,"text":"급격한 체중 변화나 섭취 부족 뒤 더"},{"start":19.1,"end":22.1,"text":"많은 모낭이 쉬는 시기로 들어가면"},{"start":22.1,"end":24.5,"text":"시간이 지나 머리카락이 더"},{"start":24.5,"end":27.3,"text":"빠질 수 있습니다. 그래서 식사가"},{"start":27.3,"end":30.1,"text":"좀 나아진 뒤에야 샤워할 때 많이"},{"start":30.1,"end":33.0,"text":"빠지는 걸 알아차리기도 해요."}]},{"start":33,"end":38,"text":"그렇다고 감량 뒤 탈모를 전부 같은 종류로 볼 수는 없습니다.","cues":[{"start":33.0,"end":35.4,"text":"그렇다고 감량 뒤 탈모를 전부"},{"start":35.4,"end":38.0,"text":"같은 종류로 볼 수는 없습니다."}]},{"start":38,"end":78,"text":"머리를 감을 때 빠진 양은 갑자기 늘었는데 두피 한 곳만 비어 보이는 건 아닐 수 있어요. 빠진 날의 사진 한 장만으로는 앞선 변화가 보이지 않죠. 그 전에 식사나 몸 상태가 달라진 때까지 같이 봐야 합니다. 머리 전체에서 고루 빠지는지, 가르마만 넓어지거나 한 부분이 비는지 살펴보세요. 언제부터 빠졌는지와 몇 달 전에 살을 뺐거나 아팠거나 약이 바뀐 일이 있었는지도 알려 주세요. 보충제부터 고르기 전에 어디서 얼마나 오래 빠지는지 보고 필요한 검사를 정해요.","cues":[{"start":38.0,"end":40.1,"text":"머리를 감을 때 빠진 양은"},{"start":40.1,"end":42.6,"text":"갑자기 늘었는데 두피 한 곳만"},{"start":42.6,"end":45.4,"text":"비어 보이는 건 아닐 수 있어요."},{"start":45.4,"end":47.9,"text":"빠진 날의 사진 한 장만으로는"},{"start":47.9,"end":50.3,"text":"앞선 변화가 보이지 않죠."},{"start":50.3,"end":53.0,"text":"그 전에 식사나 몸 상태가 달라진"},{"start":53.0,"end":55.4,"text":"때까지 같이 봐야 합니다."},{"start":55.4,"end":57.9,"text":"머리 전체에서 고루 빠지는지,"},{"start":57.9,"end":60.0,"text":"가르마만 넓어지거나 한"},{"start":60.0,"end":62.6,"text":"부분이 비는지 살펴보세요."},{"start":62.6,"end":65.3,"text":"언제부터 빠졌는지와 몇 달 전에"},{"start":65.3,"end":68.0,"text":"살을 뺐거나 아팠거나 약이 바뀐"},{"start":68.0,"end":70.8,"text":"일이 있었는지도 알려 주세요."},{"start":70.8,"end":73.5,"text":"보충제부터 고르기 전에 어디서"},{"start":73.5,"end":75.8,"text":"얼마나 오래 빠지는지 보고"},{"start":75.8,"end":78.0,"text":"필요한 검사를 정해요."
