:root {
  color-scheme: light;
  --bg:#eef3f0; --surface:#fff; --ink:#182c27; --muted:#4c635b;
  --line:#dce6df; --green:#1c5242; --deep:#122e26; --mint:#e2f0e8;
  --amber:#844819; --pale:#fff3e4; --round:18px;
  font-family:Pretendard, "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
* {box-sizing:border-box}
body {margin:0;background:var(--bg);color:var(--ink);line-height:1.5}
button,select,input,textarea {font:inherit;color:inherit}
button,select,summary {cursor:pointer}
button,select,input,textarea {border:1px solid var(--line);border-radius:9px;background:var(--surface)}
button,select {min-height:42px}
button {padding:8px 12px}
a {color:var(--green);text-underline-offset:3px}
:focus-visible {outline:3px solid #a06926;outline-offset:2px}
[hidden] {display:none!important}
.wrap {width:min(1352px,calc(100% - 64px));margin-inline:auto}
.hero {background:var(--deep);color:#f5fbf7;border-bottom:4px solid #80ad98}
.hero-inner {padding:30px 0 32px;display:flex;gap:24px;align-items:end;justify-content:space-between}
.brand {margin:0 0 4px;color:#a8cdbb;font-weight:700;font-size:.86rem;letter-spacing:.03em}
h1,h2,h3,p {margin:0}
h1 {font-size:clamp(2rem,4vw,3.15rem);line-height:1.12;letter-spacing:-.052em}
.hero p:last-child {margin-top:12px;color:#d5e7de;font-size:.96rem}
.progress {min-width:176px;display:grid;gap:8px;font-size:.9rem;color:#dcece3}
.progress strong {color:white;font-size:1.15rem}
progress {width:100%;height:7px;accent-color:#92c3aa}
.workspace {display:grid;grid-template-columns:minmax(268px,315px) minmax(0,1fr);align-items:start;gap:22px;padding-block:25px 40px}
.library,.reader {background:var(--surface);border:1px solid var(--line);border-radius:var(--round);min-width:0}
.library {position:sticky;top:16px}
.library > summary {list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 17px;font-weight:700;min-height:49px}
.library > summary::-webkit-details-marker {display:none}
.library > summary::after {content:"＋";color:var(--green)}
.library[open] > summary::after {content:"−"}
.library-controls {padding:0 14px 13px;border-bottom:1px solid var(--line)}
.filters {display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters label {min-width:0;display:grid;gap:5px;font-size:.79rem;color:var(--muted);font-weight:700}
.filters label:first-child {grid-column:1 / -1}
.filters input,.filters select {width:100%;min-width:0;min-height:42px;padding:7px 9px;font-size:.91rem;font-weight:400;color:var(--ink)}
.filter-foot {display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:.8rem}
.text-button {min-height:36px;border-color:transparent;background:transparent;color:var(--green);font-weight:700}
#list {max-height:clamp(240px,calc(100dvh - 260px),760px);overflow:auto;padding:6px;scrollbar-color:#b4c8bb transparent}
.entry {width:100%;text-align:left;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start;padding:10px 8px;border:1px solid transparent;background:white}
.entry:hover {background:#f3f8f5}
.entry[aria-current=true] {background:var(--mint);border-color:#b5d4c4}
.entry-num {font-variant-numeric:tabular-nums;color:var(--green);font-weight:700;font-size:.8rem;padding-top:2px}
.entry-title {display:block;font-size:.92rem;font-weight:700;word-break:keep-all;overflow-wrap:anywhere;line-height:1.36}
.entry-hook {display:block;margin-top:5px;color:var(--muted);font-size:.8rem;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.entry-state {display:inline-block;margin-top:4px;font-size:.72rem;color:var(--green);font-weight:700}
.reader {overflow:hidden}
.reader-header {padding:25px clamp(19px,3.5vw,40px) 20px;border-bottom:1px solid var(--line)}
.episode-meta {display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem;font-weight:700}
.episode-meta .num {border-radius:7px;background:var(--mint);color:var(--green);padding:3px 7px;font-variant-numeric:tabular-nums}
.episode-meta time {margin-inline-start:auto;color:var(--green);font-variant-numeric:tabular-nums}
h2 {font-size:clamp(1.55rem,2.8vw,2.45rem);line-height:1.2;letter-spacing:-.043em;margin-block:12px 17px;word-break:keep-all;overflow-wrap:anywhere}
.actions {display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions button,.actions select {font-size:.9rem;padding-inline:11px;font-weight:700}
.actions .primary,.primary:hover {background:var(--green);border-color:var(--green);color:white}
.actions button:hover,.move button:hover {border-color:var(--green)}
.actions button[aria-pressed=true] {background:var(--mint);border-color:#a3c8b5;color:var(--green)}
.actions label {margin-inline-start:auto;font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:7px}
.move {display:flex;justify-content:space-between;gap:8px}
.move button:disabled {opacity:.45;cursor:default}
.content {padding:0 clamp(19px,3.5vw,40px) 24px}
.hook {margin-top:19px;border:1px solid #b5d4c4;background:var(--mint);border-radius:14px;padding:17px 19px}
.hook p {font-size:clamp(1.33rem,3vw,1.75rem);letter-spacing:-.025em;font-weight:700;line-height:1.4}
.track {color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.beat {padding:15px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:110px minmax(0,1fr);gap:13px}
.beat h3,.hook h3 {font-size:.85rem;line-height:1.36;margin-bottom:4px}
.beat h3 .track,.hook h3 .track {display:block;font-size:.77rem;margin-top:5px;color:var(--muted);font-weight:400}
.beat p {font-size:1.04rem;line-height:1.67;word-break:keep-all;overflow-wrap:anywhere}
.pivot {background:var(--pale);border:0;border-radius:10px;padding:11px 13px;margin-block:7px 0}
.pivot h3,.pivot .track {color:var(--amber)!important}
.pivot p,.ending p {font-weight:700}
.ending {border-bottom:0}
.switch-panel {margin-top:15px}
.cuts-head {color:var(--muted);font-size:.84rem;margin-bottom:10px}
.cuts {display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.cue {border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
.cue time {font-size:.76rem;color:var(--green);font-variant-numeric:tabular-nums}
.cue p {font-size:.96rem;word-break:keep-all;overflow-wrap:anywhere}
.review {border-top:1px solid var(--line);padding-top:15px;margin-top:10px;display:grid;gap:13px}
.review label {font-size:.91rem;font-weight:700}
.review textarea {width:100%;min-height:83px;resize:vertical;padding:10px;display:block;margin-top:5px;font-size:.95rem}
.hint {margin-top:5px;color:var(--muted);font-size:.8rem}
.sources {border:1px solid var(--line);border-radius:10px}
.sources summary {font-weight:700;padding:11px 13px;font-size:.91rem}
.source-body {padding:0 13px 13px;font-size:.88rem;overflow-wrap:anywhere}
.source-body ul {padding-inline-start:19px;margin-block:8px 0}
.source-body li+li {margin-top:5px}
.empty {padding:30px 20px;color:var(--muted);text-align:center}
.footnote {padding:0 0 26px;color:var(--muted);font-size:.82rem}
#notice {position:fixed;z-index:2;bottom:16px;left:50%;transform:translateX(-50%);background:var(--deep);color:white;padding:10px 16px;border-radius:9px;max-width:calc(100% - 32px);font-size:.9rem}
#copy-fallback {width:min(520px,calc(100% - 32px));padding:20px;border:1px solid var(--line);border-radius:14px;color:var(--ink);background:var(--surface)}
#copy-fallback::backdrop {background:#122e2680}
#copy-fallback textarea {width:100%;padding:10px;margin-block:12px;resize:vertical}
#copy-fallback h2 {font-size:1.2rem}
#copy-fallback form {display:flex;justify-content:end}
noscript {display:block;padding:20px}
@media(max-width:760px) {
  .wrap {width:calc(100% - 28px)}
  .hero-inner {display:block;padding-block:20px}
  .hero p:last-child {margin-top:8px}
  .progress {margin-top:12px;width:145px;gap:2px;font-size:.8rem}
  .progress strong {font-size:1rem}
  .workspace {grid-template-columns:minmax(0,1fr);gap:12px;padding-block:13px 24px}
  .library {position:static}
  #list {max-height:310px}
  .reader-header {padding-block:18px 14px}
  .actions label {margin-inline-start:0}
  .beat {grid-template-columns:1fr;gap:3px;padding-block:11px}
  .beat h3,.hook h3 {display:flex;align-items:center;gap:8px}
  .beat h3 .track,.hook h3 .track {margin-top:0}
  .hook {margin-top:14px;padding:13px}
  .pivot {padding-inline:10px}
}
@media print {
  .hero-inner {padding:0;color:#000}
  .hero {background:white;border:0}
  .brand,.hero p:last-child {color:#333}
  .progress,.library,.actions,.review,.footnote,.move,#notice {display:none!important}
  .workspace {display:block;padding-top:12px;width:100%}
  .reader {border:0}
  .beat,.hook {break-inside:avoid}
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap hero-inner">
    <div>
      <p class="brand">온봄의원 유튜브</p>
      <h1>쇼츠 대본 검토</h1>
      <p>기존 대본 100편에서 뽑은 주제 100개 · 편당 60~90초</p>
    </div>
    <div class="progress">
      <span id="progress-label">검토 완료 <strong id="done">0</strong> / 100</span>
      <progress id="progress" value="0" max="100" aria-labelledby="progress-label"></progress>
    </div>
  </div>
</header>
<main class="wrap workspace">
  <details id="library" class="library" open>
    <summary><span>주제 목록</span></summary>
    <div class="library-controls">
      <div class="filters">
        <label>검색 <input id="search" type="search" placeholder="주제 번호, 제목, 대본 문장" autocomplete="off"></label>

        <label>상태 <select id="status-filter"><option value="">모든 상태</option><option value="todo">미검토</option><option value="revise">수정 필요</option><option value="done">검토 완료</option></select></label>

  </details>
  <article id="reader" class="reader" aria-label="선택한 쇼츠 대본"></article>
</main>

<div id="notice" role="status" hidden></div>
<dialog id="copy-fallback" aria-labelledby="copy-fallback-title">
  <h2 id="copy-fallback-title">대본 전체 복사</h2>
  <p id="copy-fallback-hint">브라우저가 자동 복사를 막았습니다. 아래 선택된 대본을 복사하세요.</p>
  <textarea id="copy-text" rows="9" readonly aria-label="이 편의 낭독문 전체" aria-describedby="copy-fallback-hint"></textarea>
  <form method="dialog"><button type="submit">닫기</button></form>
</dialog>

nical-care/treating-the-most-disruptive-symptoms-first-and-preventing-worsening-of-symptoms.html"}]},{"id":5,"title":"뜨거운 샤워와 줄 서기에서만 힘이 빠지는 이유","category":"피로","original":"누워 있으면 괜찮은데 샤워하고 줄 서면 기운이 빠진다","length":84,"parts":[{"start":0,"end":2,"text":"샤워할 때만 어지럽나요?","cues":[{"start":0.0,"end":2.0,"text":"샤워할 때만 어지럽나요?"}]},{"start":2,"end":8,"text":"더운 욕실과 계산대 앞을 이어 보면 어지럼이 시작되는 조건이 보입니다.","cues":[{"start":2.0,"end":4.8,"text":"더운 욕실과 계산대 앞을 이어 보면"},{"start":4.8,"end":8.0,"text":"어지럼이 시작되는 조건이 보입니다."}]},{"start":8,"end":31,"text":"누워 있다가 일어서면 중력 때문에 혈액이 아래쪽에 더 모일 수 있어요. 몸은 혈관과 맥박을 조절해 거기에 대응합니다. 줄을 서면 다리를 움직일 기회가 적죠. 더운 샤워 중엔 피부 혈관이 넓어질 수 있습니다. 그래서 둘 다 가만히 서서 버티기 힘든 상황이 될 수 있어요.","cues":[{"start":8.0,"end":11.0,"text":"누워 있다가 일어서면 중력 때문에"},{"start":11.0,"end":14.2,"text":"혈액이 아래쪽에 더 모일 수 있어요."},{"start":14.2,"end":16.6,"text":"몸은 혈관과 맥박을 조절해"},{"start":16.6,"end":19.1,"text":"거기에 대응합니다. 줄을 서면"},{"start":19.1,"end":21.8,"text":"다리를 움직일 기회가 적죠."},{"start":21.8,"end":25.0,"text":"더운 샤워 중엔 피부 혈관이 넓어질 수"},{"start":25.0,"end":27.9,"text":"있습니다. 그래서 둘 다 가만히 서서"},{"start":27.9,"end":31.0,"text":"버티기 힘든 상황이 될 수 있어요."}]},{"start":31,"end":35,"text":"이때 워치 맥박 하나로 병명을 붙이긴 어려워요.","cues":[{"start":31.0,"end":32.8,"text":"이때 워치 맥박 하나로"},{"start":32.8,"end":35.0,"text":"병명을 붙이긴 어려워요."}]},{"start":35,"end":78,"text":"가령 같은 십 분이라도 걸을 땐 괜찮고 줄에서 가만히 기다릴 때만 힘들 수 있어요. 혹은 샤워를 끝내고 앉자 빠르게 편해졌을 수 있고요. 이런 정보가 검사를 할 때 어떤 상황을 봐야 할지 알려줍니다. 탈수나 빈혈처럼 비슷한 반응을 보이는 원인도 있습니다. 반복된다면 얼마나 서 있었는지, 두근거림이 있었는지, 앉거나 누웠을 때 풀렸는지를 진료에서 말해 주세요. 의식을 잃거나 가슴통증이 동반되면 빠른 평가가 필요합니다. 샤워 중 어지러우면 넘어지지 않도록 먼저 안전하게 앉으세요.","cues":[{"start":35.0,"end":38.2,"text":"가령 같은 십 분이라도 걸을 땐 괜찮고"},{"start":38.2,"end":40.6,"text":"줄에서 가만히 기다릴 때만"},{"start":40.6,"end":43.6,"text":"힘들 수 있어요. 혹은 샤워를 끝내고"},{"start":43.6,"end":46.7,"text":"앉자 빠르게 편해졌을 수 있고요."},{"start":46.7,"end":48.8,"text":"이런 정보가 검사를 할 때"},{"start":48.8,"end":52.2,"text":"어떤 상황을 봐야 할지 알려줍니다."},{"start":52.2,"end":55.0,"text":"탈수나 빈혈처럼 비슷한 반응을"},{"start":55.0,"end":57.4,"t :"Tiredness and fatigue","url":"https://www.nhs.uk/symptoms/tiredness-and-fatigue/"},{"title":"Fatigue in Adults: Evaluation and Management","url":"https://www.aafp.org/afp/2023/0700/fatigue-adults"}]},{"id":7,"title":"감량 중 생리가 멈췄을 때 체중계에 없는 정보","category":"피로","original":"살이 빠진 뒤 생리가 멈췄다면 몸에 필요한 에너지는 충분할까요?","length":82,"parts":[{"start":0,"end":2,"text":"살 빠지고, 생리도 멈췄나요?","cues":[{"start":0.0,"end":2.0,"text":"살 빠지고, 생리도 멈췄나요?"}]},{"start":2,"end":8,"text":"체중계가 내려갈 때 몸에는 어떤 계산이 따로 돌아가는지 볼게요.","cues":[{"start":2.0,"end":4.4,"text":"체중계가 내려갈 때 몸에는"},{"start":4.4,"end":8.0,"text":"어떤 계산이 따로 돌아가는지 볼게요."}]},{"start":8,"end":32,"text":"먹은 에너지 중 일부는 걷고 운동하는 데 쓰입니다. 남은 몫으로 체온도 유지하고 몸 여러 기능을 돌리죠. 먹는 양이 크게 줄거나 운동 부담이 커지면 남는 몫이 부족할 수 있어요. 그 상태가 이어지면 뇌에서 난소에 보내는 신호가 달라져 월경이 드물어지거나 멈출 수 있습니다.","cues":[{"start":8.0,"end":10.4,"text":"먹은 에너지 중 일부는 걷고"},{"start":10.4,"end":12.6,"text":"운동하는 데 쓰입니다."},{"start":12.6,"end":15.1,"text":"남은 몫으로 체온도 유지하고"},{"start":15.1,"end":17.9,"text":"몸 여러 기능을 돌리죠. 먹는 양이"},{"start":17.9,"end":20.7,"text":"크게 줄거나 운동 부담이 커지면"},{"start":20.7,"end":23.4,"text":"남는 몫이 부족할 수 있어요."},{"start":23.4,"end":25.7,"text":"그 상태가 이어지면 뇌에서"},{"start":25.7,"end":28.9,"text":"난소에 보내는 신호가 달라져 월경이"},{"start":28.9,"end":32.0,"text":"드물어지거나 멈출 수 있습니다."}]},{"start":32,"end":38,"text":"체중이 많이 나가거나 변화가 작아도 이 문제는 생길 수 있어요.","cues":[{"start":32.0,"end":34.7,"text":"체중이 많이 나가거나 변화가"},{"start":34.7,"end":38.0,"text":"작아도 이 문제는 생길 수 있어요."}]},{"start":38,"end":76,"text":"예를 들어 체중 변화는 크지 않았는데, 점심 양을 줄인 채 운동하는 날을 크게 늘렸다고 해볼게요. 운동에 먼저 쓰고 남은 몫은 체중계에 표시되지 않죠. 월경 간격이 달라진 건 그때 같이 볼 정보예요. 월경이 멈추면 임신 가능성 등 다른 원인도 확인해야 해요. 낮은 에너지 상태가 이어지면 뼈 건강도 함께 봅니다. 진료에서는 지난 몇 달의 식사와 운동 변화, 월경 날짜를 같이 놓고 봐요. 체중이 얼마나 줄었는지만으로는 판단하기 어렵거든요.","cues":[{"start":38.0,"end":41.2,"text":"예를 들어 체중 변화는 크지 않았는데,"},{"start":41.2,"end":43.5,"text":"점심 양을 줄인 채 운동하는"},{"start":43.5,"end":46.4,"text":"날을 크게 늘렸다고 해볼게요."},{"start":46.4,"end":48.7,"text":"운동에 먼저 쓰고 남은 몫은"},{"start":48.7,"end":51.9,"text":"체중계에 표시되지 않죠. 월경 간 /2023/0700/fatigue-adults"}]},{"id":11,"title":"워치가 찍은 ‘깊은 잠 20분’의 정체","category":"수면","original":"스마트워치는 내가 잠든 걸 어떻게 알까? 수면 점수가 놓치는 것","length":82,"parts":[{"start":0,"end":2,"text":"워치의 깊은 잠은 추정치예요.","cues":[{"start":0.0,"end":2.0,"text":"워치의 깊은 잠은 추정치예요."}]},{"start":2,"end":7,"text":"손목에서 직접 잰 것과 앱이 계산한 것을 구분해 볼게요.","cues":[{"start":2.0,"end":4.4,"text":"손목에서 직접 잰 것과 앱이"},{"start":4.4,"end":7.0,"text":"계산한 것을 구분해 볼게요."}]},{"start":7,"end":49,"text":"손목 워치는 움직임과 맥박 같은 신호를 모읍니다. 그런 신호의 조합을 보고 잠든 때나 수면 단계를 추정해요. 침대에서 눈만 뜬 채 가만히 누워 있으면 자는 걸로 잡히기도 하죠. 수면검사에서 깊은 잠을 나눌 때 보는 뇌파를 일반 워치가 손목에서 직접 읽는 건 아닙니다. 앱이 한밤중에 깼다고 찍어도 실제로 뒤척인 것인지 알기 어렵습니다. 반대로 앱에 잘 잤다고 나와도 오전에 회의마다 졸면 그건 실제로 겪는 문제죠. 점수와 생활이 어긋날 때 무엇부터 확인할지 정하는 기준입니다.","cues":[{"start":7.0,"end":9.3,"text":"손목 워치는 움직임과 맥박"},{"start":9.3,"end":11.5,"text":"같은 신호를 모읍니다."},{"start":11.5,"end":13.6,"text":"그런 신호의 조합을 보고"},{"start":13.6,"end":16.6,"text":"잠든 때나 수면 단계를 추정해요."},{"start":16.6,"end":19.4,"text":"침대에서 눈만 뜬 채 가만히 누워"},{"start":19.4,"end":22.4,"text":"있으면 자는 걸로 잡히기도 하죠."},{"start":22.4,"end":24.5,"text":"수면검사에서 깊은 잠을"},{"start":24.5,"end":27.2,"text":"나눌 때 보는 뇌파를 일반 워치가"},{"start":27.2,"end":30.2,"text":"손목에서 직접 읽는 건 아닙니다."},{"start":30.2,"end":33.4,"text":"앱이 한밤중에 깼다고 찍어도 실제로"},{"start":33.4,"end":36.4,"text":"뒤척인 것인지 알기 어렵습니다."},{"start":36.4,"end":38.3,"text":"반대로 앱에 잘 잤다고"},{"start":38.3,"end":40.8,"text":"나와도 오전에 회의마다 졸면"},{"start":40.8,"end":43.2,"text":"그건 실제로 겪는 문제죠."},{"start":43.2,"end":46.2,"text":"점수와 생활이 어긋날 때 무엇부터"},{"start":46.2,"end":49.0,"text":"확인할지 정하는 기준입니다."}]},{"start":49,"end":54,"text":"그래서 점수는 낮은데 아침 컨디션은 괜찮을 수 있어요.","cues":[{"start":49.0,"end":51.4,"text":"그래서 점수는 낮은데 아침"},{"start":51.4,"end":54.0,"text":"컨디션은 괜찮을 수 있어요."}]},{"start":54,"end":76,"text":"매일 확인할수록 오히려 잠이 걱정된다면, 점수 대신 낮에 졸아서 하던 일이 끊기는지부터 보세요. 반복되는 심한 졸림, 큰 코골이나 목격된 숨 멎음이 있다면 앱 점수와 별개로 평가할 이유가 됩니다. 워치는 여러 날의 대략적인 흐름을 보는 데 활용할 수 있어요.","cues":[{"start":54.0,"end":56.5,"text":"매일 확인할수록 오히려 잠이"},{"start":56.5,"end":59.4,"text":"걱정된다면, 점수 대신 낮에 졸아서"},{"start":59.4,"end":62.4,"text":"하던 일이 끊기는지부터 보세요."},{"start":62.4,"end":65.1,"text":"반복되는 심한 졸림, 큰 코골이나"},{"start":65.1,"end":68.0,"text":"목격된 숨 멎음이 있다면 앱 점수와"},{"start":68.0,"end":70.7,"text":"별개로 평가할 이유가 됩니다."},{"start":70.7,"end":73.0,"text":"워치는 여러 날의 대략적인"},{"start":73.0,"end":76.0,"text":"흐름을 보는 데 활용할 수 있어요."}]},{"start":76,"end":82,"text":"오늘 아침엔 두 가지를 따로 보세요. 워치가 추정한 밤, 내가 보낸 낮.","cues":[{"start":76.0,"end":79.2,"text":"오늘 아침엔 두 가지를 따로 보세요."},{"start":79.2,"end":82.0,"text":"워치가 추정한 밤, 내가 보낸 낮."}]}],"sources":[{"title":"Consumer Sleep Technology: An American Academy of Sleep Medicine Position Statement","url":"https://pubmed.ncbi.nlm.nih.gov/29734997/"},{"title":"Orthosomnia: Are Some Patients Taking the Quantified Self Too Far?","url":"https://pubmed.ncbi.nlm.nih.gov/27855740/"},{"title":"510(k) Premarket Notification: Sleep Apnea Notification Feature K240929","url":"https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfPMN/pmn.cfm?ID=K240929"},{"title":"Performance of seven consumer sleep-tracking devices compared with polysomnography","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8120339/"},{"title":"How Sleep Works – Sleep Phases and Stages","url":"https://www.nhlbi.nih.gov/health/sleep/stages-of-sleep"}]},{"id":12,"title":"새벽에 깬 이유와 다시 못 잔 이유는 따로 있다","category":"수면","original":"새벽 세 시에 깨는 이유와 다시 잠들기 힘든 이유는 같을까?","length":81,"parts":[{"start":0,"end":2,"text":"새벽 세 시, 또 깼나요?","cues":[{"start":0.0,"end":2.0,"text":"새벽 세 시, 또 깼나요?"}]},{"start":2,"end":8,"text":"같은 시각에 깨도 다시 잠드는 걸 막는 건 다른 데 있을 수 있어요.","cues":[{"start":2.0,"end":4.7,"text":"같은 시각에 깨도 다시 잠드는"},{"start":4.7,"end":8.0,"text":"걸 막는 건 다른 데 있을 수 있어요."}]},{"start":8,"end":33,"text":"밤이 깊어지면 잠의 구성이 달라집니다. 화장실이 급하거나 통증, 코골이와 함께 잠이 끊기는 사람도 있어요. 어떤 밤에는 특별한 이유를 기억하지 못한 채 잠깐 눈이 떠지죠. 그런데 그 순간 시계를 봅니다. 세 시간 남았네, 내일 발표 망치겠네. 이제 계산을 하는 쪽에 정신이 쏠려요.","cues":[{"start":8.0,"end":11.7,"text":"밤이 깊어지면 잠의 구성이 달라집니다."},{"start":11.7,"end":14.7,"text":"화장실이 급하거나 통증, 코골이와"},{"start":14.7,"end":17.8,"text":"함께 잠이 끊기는 사람도 있어요."},{"start":17.8,"end":20.1,"text":"어떤 밤에는 특별한 이유를"},{"start":20.1,"end":23.4,"text":"기억하지 못한 채 잠깐 눈이 떠지죠."},{"start":23.4,"end":26.2,"text":"그런데 그 순간 시계를 봅니다."},{"start":26.2,"end":29.5,"text":"세 시간 남았네, 내일 발표 망치겠네."},{"start":29.5,"end":33.0,"text":"이제 계산을 하는 쪽에 정신이 쏠려요."}]},{"start":33,"end":39,"text":"그러면 처음 눈을 뜬 계기와 계속 깨어 있게 된 과정이 갈립니다.","cues":[{"start":33.0,"end":36.0,"text":"그러면 처음 눈을 뜬 계기와 계속"},{"start":36.0,"end":39.0,"text":"깨어 있게 된 과정이 갈립니다."}]},{"start":39,"end":74,"text":"가령 첫 번째 밤엔 화장실에서 돌아와 바로 잤고, 다음 날엔 눈을 뜨자마자 시간을 계산하다 한참 깨어 있었어요. 두 날의 시계가 똑같이 세 시였어도 그 뒤에 잠을 붙잡은 과정은 달랐던 거죠. 진료에서 ‘세 시에 깨요’라고 말할 때 두 장면을 나눠 보세요. 깼을 때 몸에서 느껴진 것, 그 뒤 침대에서 무슨 생각이나 행동을 했는지요. 반복되는 불면을 다루는 인지행동치료는 이렇게 잠을 밀어내는 반응도 살핍니다.","cues":[{"start":39.0,"end":41.6,"text":"가령 첫 번째 밤엔 화장실에서"},{"start":41.6,"end":43.9,"text":"돌아와 바로 잤고, 다음 날엔"},{"start":43.9,"end":46.7,"text":"눈을 뜨자마자 시간을 계산하다"},{"start":46.7,"end":49.1,"text":"한참 깨어 있었어요. 두 날의"},{"start":49.1,"end":52.1,"text":"시계가 똑같이 세 시였어도 그 뒤에"},{"start":52.1,"end":55.2,"text":"잠을 붙잡은 과정은 달랐던 거죠."},{"start":55.2,"end":57.5,"text":"진료에서 ‘세 시에 깨요’라고"},{"start":57.5,"end":60.4,"text":"말할 때 두 장면을 나눠 보세요."},{"start":60.4,"end":62.5,"text":"깼을 때 몸에서 느껴진 것,"},{"start":62.5,"end":65.1,"text":"그 뒤 침대에서 무슨 생각이나"},{"start":65.1,"end":68.1,"text":"행동을 했는지요. 반복되는 불면을"},{"start":68.1,"end":70.9,"text":"다루는 인지행동치료는 이렇게"},{"start":70.9,"end":74.0,"text":"잠을 밀어내는 반응도 살핍니다."}]},{"start":74,"end":81,"text":"새벽 세 시는 시각이에요. 풀어야 할 질문은 ‘뭐가 깨웠고, 뭐가 붙잡았나’입니다.","cues":[{"start":74.0,"end":76.4,"text":"새벽 세 시는 시각이에요."},{"start":76.4,"end":78.8,"text":"풀어야 할 질문은 ‘뭐가 깨웠고,"},{"start":78.8,"end":81.0,"text":"뭐가 붙잡았나’입니다."}]}],"sources":[{"title":"Insomnia – Symptoms","url":"https://www.nhlbi.nih.gov/health/insomnia/symptoms"},{"title":"Sleep Problems and Menopause: What Can I Do?","url":"https://www.nia.nih.gov/health/menopause/sleep-problems-and-menopause-what-can-i-do"},{"title":"Insomnia – Diagnosis","url":"https://www.nhlbi.nih.gov/health/insomnia/diagnosis"},{"title":"How Sleep Works – Sleep Phases and Stages","url":"https://www.nhlbi.nih.gov/health/sleep/stages-of-sleep"},{"title":"Behavioral and psychological treatments for chronic insomnia disorder in adults: an AASM clinical practice guideline","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7853203/"}]},{"id":13,"title":"일요일 밤잠을 밀어내는 일요일 아침","category":"수면","original":"주말에 늦잠을 잤더니 일요일 밤에 잠이 안 오는 이유","length":81,"parts":[{"start":0,"end":2,"text":"일요일 불면, 아침부터 봐요.","cues":[{"start":0.0,"end":2.0,"text":"일요일 불면, 아침부터 봐요."}]},{"start":2,"end":7,"text":"밤 열한 시보다 점심때 일어난 아침을 먼저 떠올려 보세요.","cues":[{"start":2.0,"end":4.5,"text":"밤 열한 시보다 점심때 일어난"},{"start":4.5,"end":7.0,"text":"아침을 먼저 떠올려 보세요."}]},{"start":7,"end":34,"text":"잠은 두 힘을 받습니다. 하나는 깨어 있는 동안 점점 쌓이는 잠의 압력이에요. 낮까지 자고 일어나면 같은 밤 열한 시에도 깨어 있던 시간이 짧죠. 또 하나는 몸의 시계입니다. 빛을 보는 시간이 달라지면 이 시계가 받는 신호도 바뀔 수 있어요. 주말에 늦게 자고 늦게 일어나면 두 힘이 평일 밤과 다르게 움직입니다.","cues":[{"start":7.0,"end":9.2,"text":"잠은 두 힘을 받습니다."},{"start":9.2,"end":11.5,"text":"하나는 깨어 있는 동안 점점"},{"start":11.5,"end":13.8,"text":"쌓이는 잠의 압력이에요."},{"start":13.8,"end":16.3,"text":"낮까지 자고 일어나면 같은 밤"},{"start":16.3,"end":19.6,"text":"열한 시에도 깨어 있던 시간이 짧죠."},{"start":19.6,"end":22.1,"text":"또 하나는 몸의 시계입니다."},{"start":22.1,"end":24.4,"text":"빛을 보는 시간이 달라지면"},{"start":24.4,"end":27.9,"text":"이 시계가 받는 신호도 바뀔 수 있어요."},{"start":27.9,"end":30.6,"text":"주말에 늦게 자고 늦게 일어나면"},{"start":30.6,"end":34.0,"text":"두 힘이 평일 밤과 다르게 움직입니다."}]},{"start":34,"end":39,"text":"그래서 피곤하다고 무조건 일찍 잠이 드는 건 아니죠.","cues":[{"start":34.0,"end":36.5,"text":"그래서 피곤하다고 무조건"},{"start":36.5,"end":39.0,"text":"일찍 잠이 드는 건 아니죠."}]},{"start":39,"end":76,"text":"예를 들어 토요일엔 두 시까지 깨어 있었고, 일요일에는 점심에 처음으로 밖에 나갔어요. 그러고 그날만 평소보다 이르게 눕습니다. 이불은 준비됐지만 몸이 받은 시간 신호는 그보다 늦을 수 있어요. 평일에 못 잔 잠을 보충하는 건 의미가 있어요. 일요일마다 밤잠이 밀린다면 평일 수면 시간을 확보하면서 주말 기상 차이가 어땠는지 살펴보세요. 일요일 밤에 침대부터 당겨도 잠이 올 조건이 준비되지 않았을 수 있거든요.","cues":[{"start":39.0,"end":41.6,"text":"예를 들어 토요일엔 두 시까지"},{"start":41.6,"end":44.4,"text":"깨어 있었고, 일요일에는 점심에"},{"start":44.4,"end":47.2,"text":"처음으로 밖에 나갔어요. 그러고"},{"start":47.2,"end":50.5,"text":"그날만 평소보다 이르게 눕습니다."},{"start":50.5,"end":53.1,"text":"이불은 준비됐지만 몸이 받은"},{"start":53.1,"end":56.4,"text":"시간 신호는 그보다 늦을 수 있어요."},{"start":56.4,"end":59.0,"text":"평일에 못 잔 잠을 보충하는 건"},{"start":59.0,"end":61.4,"text":"의미가 있어요. 일요일마다"},{"start":61.4,"end":63.8,"text":"밤잠이 밀린다면 평일 수면"},{"start":63.8,"end":66.3,"text":"시간을 확보하면서 주말 기상"},{"start":66.3,"end":69.2,"text":"차이가 어땠는지 살펴보세요."},{"start":69.2,"end":72.5,"text":"일요일 밤에 침대부터 당겨도 잠이 올"},{"start":72.5,"end":76.0,"text":"조건이 준비되지 않았을 수 있거든요."}]},{"start":76,"end":81,"text":"일요일 밤잠을 보고 싶으면, 일요일 아침 알람부터 보세요.","cues":[{"start":76.0,"end":78.3,"text":"일요일 밤잠을 보고 싶으면,"},{"start":78.3,"end":81.0,"text":"일요일 아침 알람부터 보세요."}]}],"sources":[{"title":"Circadian Rhythm Disorders – What Are Circadian Rhythm Disorders?","url":"https://www.nhlbi.nih.gov/health/circadian-rhythm-disorders"},{"title":"Sleep Deprivation and Deficiency – Healthy Sleep Habits","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits"},{"title":"Ad libitum Weekend Recovery Sleep Fails to Prevent Metabolic Dysregulation during a Repeating Pattern of Insufficient Sleep and Weekend Recovery Sleep","url":"https://pubmed.ncbi.nlm.nih.gov/30827911/"},{"title":"Sleep Deprivation and Deficiency – What Makes You Sleep?","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/body-clock"}]},{"id":14,"title":"침대에 8시간 누워서 실제로 잔 시간","category":"수면","original":"침대에 8시간 있었는데 몇 시간이나 잤을까?","length":81,"parts":[{"start":0,"end":2,"text":"여덟 시간 누워도, 잠은 덜 잤죠.","cues":[{"start":0.0,"end":2.0,"text":"여덟 시간 누워도, 잠은 덜 잤죠."}]},{"start":2,"end":9,"text":"시간을 한 토막씩 나눠 보면 아침에 피곤한 이유를 더 구체적으로 말할 수 있어요.","cues":[{"start":2.0,"end":4.3,"text":"시간을 한 토막씩 나눠 보면"},{"start":4.3,"end":6.4,"text":"아침에 피곤한 이유를 더"},{"start":6.4,"end":9.0,"text":"구체적으로 말할 수 있어요."}]},{"start":9,"end":30,"text":"밤 열한 시에 눕고 아침 일곱 시에 일어나면 침대에 있던 건 여덟 시간이에요. 잠들기까지 오래 걸렸을 수도 있죠. 두 번 깨서 한참 뒤척이고, 알람 전에 눈  on mental health at work","url":"https://www.who.int/publications/i/item/9789240053052"},{"title":"Depression","url":"https://www.nimh.nih.gov/health/publications/depression"},{"title":"I’m So Stressed Out! Fact Sheet","url":"https://www.nimh.nih.gov/health/publications/so-stressed-out-fact-sheet"},{"title":"Relaxation Techniques: What You Need To Know","url":"https://www.nccih.nih.gov/health/relaxation-techniques-what-you-need-to-know"}]},{"id":22,"title":"긁으면 편한데, 왜 조금 뒤 더 가려울까","category":"스트레스·마음","original":"긴장하면 가렵고 긁으면 더 가렵다. 피부와 신경에 무슨 일이 생길까?","length":84,"parts":[{"start":0,"end":2,"text":"긁을수록, 왜 더 가렵죠?","cues":[{"start":0.0,"end":2.0,"text":"긁을수록, 왜 더 가렵죠?"}]},{"start":2,"end":7,"text":"긁자마자 시원한 순간과 한참 뒤 따가운 순간을 이어볼게요.","cues":[{"start":2.0,"end":4.6,"text":"긁자마자 시원한 순간과 한참 뒤"},{"start":4.6,"end":7.0,"text":"따가운 순간을 이어볼게요."}]},{"start":7,"end":31,"text":"가려움은 피부에서 감각신경을 타고 뇌로 전해집니다. 손톱으로 긁을 때 들어오는 다른 감각이 잠깐 그 신호를 덮을 수 있어요. 그래서 그 순간엔 정말로 편해지죠. 그런데 같은 자리를 계속 긁으면 피부 겉이 상하고 염증이 더해질 수 있습니다. 다시 가렵고, 또 손이 갑니다.","cues":[{"start":7.0,"end":9.8,"text":"가려움은 피부에서 감각신경을"},{"start":9.8,"end":12.6,"text":"타고 뇌로 전해집니다. 손톱으로"},{"start":12.6,"end":15.2,"text":"긁을 때 들어오는 다른 감각이"},{"start":15.2,"end":18.1,"text":"잠깐 그 신호를 덮을 수 있어요."},{"start":18.1,"end":21.4,"text":"그래서 그 순간엔 정말로 편해지죠."},{"start":21.4,"end":23.5,"text":"그런데 같은 자리를 계속"},{"start":23.5,"end":25.7,"text":"긁으면 피부 겉이 상하고"},{"start":25.7,"end":28.3,"text":"염증이 더해질 수 있습니다."},{"start":28.3,"end":31.0,"text":"다시 가렵고, 또 손이 갑니다."}]},{"start":31,"end":35,"text":"여기에 스트레스가 들어오는 자리가 있어요.","cues":[{"start":31.0,"end":32.6,"text":"여기에 스트레스가"},{"start":32.6,"end":35.0,"text":"들어오는 자리가 있어요."}]},{"start":35,"end":78,"text":"예를 들어 같은 손등이 퇴근하고 유독 가려울 때, 그날 손을 많이 씻었는지와 집에 와서 얼마나 오래 긁었는지를 떠올려 보세요. 처음 자극과 그 뒤 상처가 겹치면 어느 순간을 보느냐에 따라 설명이 달라져요. 긴장하거나 지친 저녁에는 같은 신호에 더 신경이 쏠릴 수 있죠. 그렇다고 피부에 생긴 자극이나 염증이 사라지는 건 아닙니다. 가려움이 계속되면 처음에 발진이 있었는지, 긁고 나서 자국이 생겼는지 구분해 보세요. 피부를 치료하는 일과 긁는 고리를 끊는 방법을 함께 살필 수 있습니다.","cues":[{"start":35.0,"end":37.8,"text":"예를 들어 같은 손등이 퇴근하고"},{"start":37.8,"end":40.3,"text":"유독 가려울 때, 그날 손을 많이"},{"start":40.3,"end":42.9,"text":"씻었는지와 집에 와서 얼마나"},{"start":42.9,"end":46.0,"text":"오래 긁었는지를 떠올려 보세요."},{"start":46.0,"end":48.8,"text":"처음 자극과 그 뒤 상처가 겹치면"},{"start":48.8,"end":51.8,"text":"어느 순간을 보느냐에 따라 설명이"},{"start":51.8,"end":55.0,"text":"달라져요. 긴장하거나 지친 저녁에는"},{"start":55.0,"end":58.3,"text":"같은 신호에 더 신경이 쏠릴 수 있죠."},{"start":58.3,"end":61.1,"text":"그렇다고 피부에 생긴 자극이나"},{"start":61.1,"end":63.9,"text":"염증이 사라지는 건 아닙니다."},{"start":63.9,"end":66.3,"text":"가려움이 계속되면 처음에"},{"start":66.3,"end":68.6,"text":"발진이 있었는지, 긁고 나서"},{"start":68.6,"end":71.7,"text":"자국이 생겼는지 구분해 보세요."},{"start":71.7,"end":74.7,"text":"피부를 치료하는 일과 긁는 고리를"},{"start":74.7,"end":78.0,"text":"끊는 방법을 함께 살필 수 있습니다."}]},{"start":78,"end":84,"text":"기억할 순서는 하나예요. 먼저 가려웠나, 먼저 피부가 변했나.","cues":[{"start":78.0,"end":80.6,"text":"기억할 순서는 하나예요."},{"start":80.6,"end":84.0,"text":"먼저 가려웠나, 먼저 피부가 변했나."}]}],"sources":[{"title":"6 skin and hair conditions linked to stress","url":"https://www.aad.org/public/diseases/a-z/stress-skin-conditions"},{"title":"European Guideline on Chronic Pruritus: In cooperation with the European Dermatology Forum","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12529596/"},{"title":"Eczema types: Neurodermatitis diagnosis and treatment","url":"https://www.aad.org/public/diseases/eczema/types/neurodermatitis/treatment"}]},{"id":23,"title":"두근거림이 지나간 뒤 찍은 심전도는 무엇을 말할까","category":"스트레스·마음","original":"두근거림이 불안 때문인지 부정맥 때문인지, 심전도로 뭘 알 수 있을까?","length":82,"parts":[{"start":0,"end":2,"text":"두근거림, 검사 땐 없었나요?","cues":[{"start":0.0,"end":2.0,"text":"두근거림, 검사 땐 없었나요?"}]},{"start":2,"end":8,"text":"심전도에 정상이라고 쓰여 있어도 언제 찍었는지를 같이 봐야 해요.","cues":[{"start":2.0,"end":5.0,"text":"심전도에 정상이라고 쓰여 있어도"},{"start":5.0,"end":8.0,"text":"언제 찍었는지를 같이 봐야 해요."}]},{"start":8,"end":32,"text":"심전도는 그 순간 심장의 전기 신호를 기록합니다. 가만히 누워 있는 낮 두 시에 찍으면 그 시각의 리듬을 보죠. 그런데 두근거림이 퇴근길에 몇 분씩만 왔다면 낮 검사에 그 순간이 들어가진 않습니다. 반대로 두근거릴 때 기록이 잡히면, 느낌과 실제 리듬을 연결해 볼 수 있어요.","cues":[{"start":8.0,"end":10.1,"text":"심전도는 그 순간 심장의"},{"start":10.1,"end":12.5,"text":"전기 신호를 기록합니다."},{"start":12.5,"end":14.8,"text":"가만히 누워 있는 낮 두 시에"},{"start":14.8,"end":17.7,"text":"찍으면 그 시각의 리듬을 보죠."},{"start":17.7,"end":20.2,"text":"그런데 두근거림이 퇴근길에"},{"start":20.2,"end":22.5,"text":"몇 분씩만 왔다면 낮 검사에"},{"start":22.5,"end":25.4,"text":"그 순간이 들어가진 않습니다."},{"start":25.4,"end":28.3,"text":"반대로 두근거릴 때 기록이 잡히면,"},{"start":28.3,"end":32.0,"text":"느낌과 실제 리듬을 연결해 볼 수 있어요."}]},{"start":32,"end":38,"text":"그래서 검사는 길수록 좋은 게 아니라 시간표가 맞아야 합니다.","cues":[{"start":32.0,"end":34.7,"text":"그래서 검사는 길수록 좋은 게"},{"start":34.7,"end":38.0,"text":"아니라 시간표가 맞아야 합니다."}]},{"start":38,"end":75,"text":"가령 낮 검사에선 한 번도 두근대지 않았고, 밤에 갑자기 뛰던 순간은 찍히지 않았을 수 있어요. 그 반대라면 증상을 느끼던 바로 그때 전기 박자가 어땠는지 비교할 수 있습니다. 매일 생기는지, 며칠에 한 번인지, 갑자기 시작해 갑자기 멈추는지를 적어 보세요. 증상 빈도에 따라 기록하는 기간을 다르게 고를 수 있습니다. 긴장도 심장이 뛰는 느낌을 키울 수 있지만, 흉통이나 심한 숨참, 실신이 동반되면 즉시 평가가 필요합니다.","cues":[{"start":38.0,"end":40.1,"text":"가령 낮 검사에선 한 번도"},{"start":40.1,"end":43.1,"text":"두근대지 않았고, 밤에 갑자기 뛰던"},{"start":43.1,"end":46.2,"text":"순간은 찍히지 않았을 수 있어요."},{"start":46.2,"end":48.6,"text":"그 반대라면 증상을 느끼던"},{"start":48.6,"end":51.4,"text":"바로 그때 전기 박자가 어땠는지"},{"start":51.4,"end":54.4,"text":"비교할 수 있습니다. 매일 생기는지,"},{"start":54.4,"end":57.2,"text":"며칠에 한 번인지, 갑자기 시작해"},{"start":57.2,"end":60.3,"text":"갑자기 멈추는지를 적어 보세요."},{"start":60.3,"end":62.6,"text":"증상 빈도에 따라 기록하는"},{"start":62.6,"end":65.7,"text":"기간을 다르게 고를 수 있습니다."},{"start":65.7,"end":68.7,"text":"긴장도 심장이 뛰는 느낌을 키울 수"},{"start":68.7,"end":71.7,"text":"있지만, 흉통이나 심한 숨참, 실신이"},{"start":71.7,"end":75.0,"text":"동반되면 즉시 평가가 필요합니다."}]},{"start":75,"end":82,"text":"두근거림 기록에서 가장 귀한 줄은 이겁니다. 정확히 언제, 얼마나 오래.","cues":[{"start":75.0,"end":78.3,"text":"두근거림 기록에서 가장 귀한 줄은"},{"start":78.3,"end":82.0,"text":"이겁니다. 정확히 언제, 얼마나 오래."}]}],"sources":[{"title":"Heart palpitations","url":"https://www.nhs.uk/symptoms/heart-palpitations/"},{"title":"2017 ISHNE-HRS expert consensus statement on ambulatory ECG and external cardiac monitoring/telemetry","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6931745/"},{"title":"Arrhythmias – Diagnosis","url":"https://www.nhlbi.nih.gov/health/arrhythmias/diagnosis"},{"title":"Palpitations: Evaluation, Management, and Wearable Smart Devices","url":"https://www.aafp.org/afp/2024/0900/palpitations"}]},{"id":24,"title":"명상 중 심장이 더 크게 느껴지는 까닭","category":"스트레스·마음","original":"명상할 때 왜 심장 뛰는 느낌이 더 또렷해질까?","length":81,"parts":[{"start":0,"end":2,"text":"명상 중, 심장 소리만 커져요?","cues":[{"start":0.0,"end":2.0,"text":"명상 중, 심장 소리만 커져요?"}]},{"start":2,"end":8,"text":"박동을 더 크게 느끼는 것과 박동 자체가 달라지는 건 어떻게 구분할까요?","cues":[{"start":2.0,"end":4.6,"text":"박동을 더 크게 느끼는 것과 박동"},{"start":4.6,"end":8.0,"text":"자체가 달라지는 건 어떻게 구분할까요?"}]},{"start":8,"end":32,"text":"소음이 끝난 밤, 냉장고 돌아가는 소리가 갑자기 들릴 때가 있죠. 기계가 더 세게 돈 것처럼 느껴집니다. 몸도 비슷해요. 눈을 감고 숨이나 가슴에 집중하면 원래 지나가던 감각이 또렷해질 수 있어요. 그때 ‘뭔가 이상하다’고 받아들이면 그 신호를 더 열심히 찾게 되고요.","cues":[{"start":8.0,"end":10.8,"text":"소음이 끝난 밤, 냉장고 돌아가는"},{"start":10.8,"end":13.8,"text":"소리가 갑자기 들릴 때가 있죠."},{"start":13.8,"end":17.4,"text":"기계가 더 세게 돈 것처럼 느껴집니다."},{"start":17.4,"end":20.2,"text":"몸도 비슷해요. 눈을 감고 숨이나"},{"start":20.2,"end":23.1,"text":"가슴에 집중하면 원래 지나가던"},{"start":23.1,"end":25.8,"text":"감각이 또렷해질 수 있어요."},{"start":25.8,"end":28.8,"text":"그때 ‘뭔가 이상하다’고 받아들이면"},{"start":28.8,"end":32.0,"text":"그 신호를 더 열심히 찾게 되고요."}]},{"start":32,"end":36,"text":"그렇다면 더 오래 버티면서 집중해야 할까요?","cues":[{"start":32.0,"end":34.3,"text":"그렇다면 더 오래 버티면서"},{"start":34.3,"end":36.0,"text":"집중해야 할까요?"}]},{"start":36,"end":75,"text":"같은 자리에서 잠깐 눈을 뜨고 방 안의 소리를 들어보세요. 가슴이 덜 크게 느껴지는 사람도 있어요. 그래도 박자가 실제로 규칙적인지, 얼마나 빠른지는 감각을 옮겨 보는 것만으로 알 수 없습니다. 가슴에 주의를 두는 연습이 힘들다면 눈을 뜨고 발바닥이나 주변 소리로 집중 대상을 옮겨볼 수 있습니다. 쉬었다 다시 해도 되고요. 명상 밖에서도 새 두근거림이 반복되거나 흉통, 실신이 동반된다면 명상 때문으로 넘기지 말고 증상에 맞게 평가받으세요.","cues":[{"start":36.0,"end":38.5,"text":"같은 자리에서 잠깐 눈을 뜨고"},{"start":38.5,"end":41.1,"text":"방 안의 소리를 들어보세요."},{"start":41.1,"end":44.7,"text":"가슴이 덜 크게 느껴지는 사람도 있어요."},{"start":44.7,"end":47.7,"text":"그래도 박자가 실제로 규칙적인지,"},{"start":47.7,"end":50.2,"text":"얼마나 빠른지는 감각을 옮겨"},{"start":50.2,"end":53.0,"text":"보는 것만으로 알 수 없습니다."},{"start":53.0,"end":56.1,"text":"가슴에 주의를 두는 연습이 힘들다면"},{"start":56.1,"end":59.1,"text":"눈을 뜨고 발바닥이나 주변 소리로"},{"start":59.1,"end":62.1,"text":"집중 대상을 옮겨볼 수 있습니다."},{"start":62.1,"end":64.5,"text":"쉬었다 다시 해도 되고요."},{"start":64.5,"end":67.0,"text":"명상 밖에서도 새 두근거림이"},{"start":67.0,"end":70.1,"text":"반복되거나 흉통, 실신이 동반된다면"},{"start":70.1,"end":72.4,"text":"명상 때문으로 넘기지 말고"},{"start":72.4,"end":75.0,"text":"증상에 맞게 평가받으세요."}]},{"start":75,"end":81,"text":"연습을 바꾸는 첫 질문은 이겁니다. 더 세게 뛴 건가, 더 잘 들린 건가.","cues":[{"start":75.0,"end":78.2,"text":"연습을 바꾸는 첫 질문은 이겁니다."},{"start":78.2,"end":81.0,"text":"더 세게 뛴 건가, 더 잘 들린 건가."}]}],"sources":[{"title":"Meditation and Mindfulness: Effectiveness and Safety","url":"https://www.nccih.nih.gov/health/meditation-and-mindfulness-effectiveness-and-safety"},{"title":"Adverse events in meditation practices and meditation-based therapies: a systematic review","url":"https://pubmed.ncbi.nlm.nih.gov/32820538/"},{"title":"Chest pain","url":"https://www.nhs.uk/symptoms/chest-pain/"},{"title":"Shortness of breath","url":"https://www.nhs.uk/symptoms/shortness-of-breath/"},{"title":"Adverse Experiences in Brief Meditation Practices: Randomized Controlled Trial","url":"https://pubmed.ncbi.nlm.nih.gov/42735902/"},{"title":"Breathing exercises in the treatment of hyperventilation","url":"https://www.cuh.nhs.uk/patient-information/breathing-exercises-in-the-treatment-of-hyperventilation/"}]},{"id":25,"title":"저녁에 먹는 양을 바꿔 놓는 점심의 공백","category":"스트레스·마음","original":"낮에 먹는 걸 참다 보면 왜 밤에는 멈추기 어려울까?","length":85,"parts":[{"start":0,"end":2,"text":"밤에 몰아 먹나요?","cues":[{"start":0.0,"end":2.0,"text":"밤에 몰아 먹나요?"}]},{"start":2,"end":7,"text":"저녁 식탁을 보기 전에 점심시간으로 돌아가 보세요.","cues":[{"start":2.0,"end":4.0,"text":"저녁 식탁을 보기 전에"},{"start":4.0,"end":7.0,"text":"점심시간으로 돌아가 보세요."}]},{"start":7,"end":32,"text":"바빠서 점심을 넘깁니다. 오후엔 아메리카노로 tart":78.0,"end":81.1,"text":"밤 식탁 옆에 적어 보세요. 마지막"},{"start":81.1,"end":85.0,"text":"끼니는 몇 시였고, 그 뒤 얼마나 버텼나."}]}],"sources":[{"title":"Symptoms & Causes of Binge Eating Disorder","url":"https://www.niddk.nih.gov/health-information/weight-management/binge-eating-disorder/symptoms-causes"},{"title":"Eating disorders: recognition and treatment – Recommendations","url":"https://www.nice.org.uk/guidance/ng69/chapter/Recommendations"},{"title":"Treatment – Binge eating disorder","url":"https://www.nhs.uk/mental-health/conditions/binge-eating/treatment/"}]},{"id":26,"title":"쉬는 날에도 아무것도 즐겁지 않을 때","category":"스트레스·마음","original":"번아웃과 우울증은 어떻게 다를까? 쉬고 나서도 즐겁지 않다면","length":84,"parts":[{"start":0,"end":2,"text":"쉬는 날도, 재미가 없나요?","cues":[{"start":0.0,"end":2.0,"text":"쉬는 날도, 재미가 없나요?"}]},{"start":2,"end":8,"text":"일이 힘들다는 말 다음에, 쉬는 날엔 어떤지까지 물어야 해요.","cues":[{"start":2.0,"end":4.4,"text":"일이 힘들다는 말 다음에,"},{"start":4.4,"end":8.0,"text":"쉬는 날엔 어떤지까지 물어야 해요."}]},{"start":8,"end":30,"text":"업무 연락만 보면 몸이 무겁고, 일에 마음이 멀어지고, 전처럼 해낼 수 없다고 느낍니다. 번아웃을 말할 때는 이런 경험을 일의 맥락에서 봅니다. 그런데 쉬는 날에도 좋아하던 드라마가 재미없고, 식사나 잠, 집중까지 달라져 있다면 살펴볼 범위가 넓어져요.","cues":[{"start":8.0,"end":10.5,"text":"업무 연락만 보면 몸이 무겁고,"},{"start":10.5,"end":12.4,"text":"일에 마음이 멀어지고,"},{"start":12.4,"end":15.5,"text":"전처럼 해낼 수 없다고 느낍니다."},{"start":15.5,"end":18.2,"text":"번아웃을 말할 때는 이런 경험을"},{"start":18.2,"end":20.4,"text":"일의 맥락에서 봅니다."},{"start":20.4,"end":22.9,"text":"그런데 쉬는 날에도 좋아하던"},{"start":22.9,"end":25.5,"text":"드라마가 재미없고, 식사나 잠,"},{"start":25.5,"end":27.6,"text":"집중까지 달라져 있다면"},{"start":27.6,"end":30.0,"text":"살펴볼 범위가 넓어져요."}]},{"start":30,"end":36,"text":"일 때문이라는 설명과 우울 증상은 한 사람에게 겹칠 수 있습니다.","cues":[{"start":30.0,"end":33.1,"text":"일 때문이라는 설명과 우울 증상은"},{"start":33.1,"end":36.0,"text":"한 사람에게 겹칠 수 있습니다."}]},{"start":36,"end":77,"text":"평소 좋아하던 사람을 만나는 일도 미루고, 쉬어도 식사나 잠의 변화가 이어졌다면 회사 밖의 이야기까지 말해 주세요. 그걸 알아야 당장의 업무 조정 외에 따로 도움이 필요한 부분을 함께 볼 수 있어요. 휴가 때 느낌 하나로 구분하긴 어려워요. 이런 변화가 얼마나 이어졌는지, 사람을 만나고 일상을 챙기는 일이 얼마나 어려워졌는지 봐야 합니다. 몸 상태와 과거 기분의 큰 변화도 평가에 들어가죠. 즐거움과 생활 기능이 계속 떨어져 있다면 휴식에만 기대기보다 상담해 보세요.","cues":[{"start":36.0,"end":38.5,"text":"평소 좋아하던 사람을 만나는"},{"start":38.5,"end":40.9,"text":"일도 미루고, 쉬어도 식사나"},{"start":40.9,"end":43.4,"text":"잠의 변화가 이어졌다면 회사"},{"start":43.4,"end":46.2,"text":"밖의 이야기까지 말해 주세요."},{"start":46.2,"end":48.8,"text":"그걸 알아야 당장의 업무 조정"},{"start":48.8,"end":51.5,"text":"외에 따로 도움이 필요한 부분을"},{"start":51.5,"end":54.1,"text":"함께 볼 수 있어요. 휴가 때 느낌"},{"start":54.1,"end":56.7,"text":"하나로 구분하긴 어려워요."},{"start":56.7,"end":59.5,"text":"이런 변화가 얼마나 이어졌는지,"},{"start":59.5,"end":62.4,"text":"사람을 만나고 일상을 챙기는 일이"},{"start":62.4,"end":65.7,"text":"얼마나 어려워졌는지 봐야 합니다."},{"start":65.7,"end":68.4,"text":"몸 상태와 과거 기분의 큰 변화도"},{"start":68.4,"end":70.8,"text":"평가에 들어가죠. 즐거움과"},{"start":70.8,"end":73.5,"text":"생활 기능이 계속 떨어져 있다면"},{"start":73.5,"end":77.0,"text":"휴식에만 기대기보다 상담해 보세요."}]},{"start":77,"end":84,"text":"스스로에게 물을 한 문장. ‘일이 없는 날에도, 좋아하던 게 여전히 좋은가?’","cues":[{"start":77.0,"end":80.3,"text":"스스로에게 물을 한 문장. ‘일이 없는"},{"start":80.3,"end":84.0,"text":"날에도, 좋아하던 게 여전히 좋은가?’"}]}],"sources":[{"title":"Burn-out an occupational phenomenon","url":"https://www.who.int/standards/classifications/frequently-asked-questions/burn-out-an-occupational-phenomenon"},{"title":"Depression","url":"https://www.nimh.nih.gov/health/publications/depression"},{"title":"Guidelines on mental health at work","url":"https://www.who.int/publications/i/item/9789240053052"}]},{"id":27,"title":"퇴근만 빨라진 단축근무가 버거운 이유","category":"스트레스·마음","original":"쉬고 나아졌는데 출근하자 다시 힘들다. 일하는 시간 외에 뭘 봐야 할까?","length":78,"parts":[{"start":0,"end":2,"text":"일찍 퇴근해도, 일은 그대로.","cues":[{"start":0.0,"end":2.0,"text":"일찍 퇴근해도, 일은 그대로."}]},{"start":2,"end":6,"text":"복귀 시간표 옆에 업무 목록도 펼쳐 보세요.","cues":[{"start":2.0,"end":4.0,"text":"복귀 시간표 옆에 업무"},{"start":4.0,"end":6.0,"text":"목록도 펼쳐 보세요."}]},{"start":6,"end":30,"text":"쉬는 동안엔 불편할 때 멈출 수 있었죠. 복귀하면 회의는 정시에 시작하고 요청은 예고 없이 들어옵니다. 퇴근을 두 시간 당겨도 같은 보고서를 같은 날까지 내야 하면, 일하는 동안 더 서두르게 돼요. 연락에 바로 응답할 일도 그대로라면 업무의 밀도는 오히려 높아질 수 있습니다.","cues":[{"start":6.0,"end":9.4,"text":"쉬는 동안엔 불편할 때 멈출 수 있었죠."},{"start":9.4,"end":12.4,"text":"복귀하면 회의는 정시에 시작하고"},{"start":12.4,"end":15.2,"text":"요청은 예고 없이 들어옵니다."},{"start":15.2,"end":17.1,"text":"퇴근을 두 시간 당겨도"},{"start":17.1,"end":20.2,"text":"같은 보고서를 같은 날까지 내야 하면,"},{"start":20.2,"end":23.0,"text":"일하는 동안 더 서두르게 돼요."},{"start":23.0,"end":25.1,"text":"연락에 바로 응답할 일도"},{"start":25.1,"end":27.4,"text":"그대로라면 업무의 밀도는"},{"start":27.4,"end":30.0,"text":"오히려 높아질 수 있습니다."}]},{"start":30,"end":34,"text":"복귀 계획의 빈칸은 그래서 ‘몇 시간’ 옆에 있어요.","cues":[{"start":30.0,"end":31.6,"text":"복귀 계획의 빈칸은"},{"start":31.6,"end":34.0,"text":"그래서 ‘몇 시간’ 옆에 있어요."}]},{"start":34,"end":72,"text":"예를 들어 오후 회의를 하나 뺀 시간에 새 요청이 몰리면 실제로 줄어든 일이 없을 수 있죠. 반대로 보고서 하나를 분담하고 당일 연락 대응을 다른 사람과 나누면 같은 퇴근 시각이어도 부담은 달라집니다. 어떤 업무를 맡을지, 급한 연락을 누가 받을지, 일이 몰리면 무엇을 미룰지 정해 보세요. 퇴근 뒤에 식사와 잠을 챙길 여력이 남는지까지 보면 지속 가능한지 판단하기 쉬워요. 몸 상태에 대한 치료와 직장 안의 업무 조정은 함께 논의할 수 있습니다.","cues":[{"start":34.0,"end":36.3,"text":"예를 들어 오후 회의를 하나"},{"start":36.3,"end":38.6,"text":"뺀 시간에 새 요청이 몰리면"},{"start":38.6,"end":41.7,"text":"실제로 줄어든 일이 없을 수 있죠."},{"start":41.7,"end":44.4,"text":"반대로 보고서 하나를 분담하고"},{"start":44.4,"end":47.6,"text":"당일 연락 대응을 다른 사람과 나누면"},{"start":47.6,"end":50.1,"text":"같은 퇴근 시각이어도 부담은"},{"start":50.1,"end":52.9,"text":"달라집니다. 어떤 업무를 맡을지,"},{"start":52.9,"end":55.0,"text":"급한 연락을 누가 받을지,"},{"start":55.0,"end":57.7,"text":"일이 몰리면 무엇을 미룰지 정해"},{"start":57.7,"end":60.2,"text":"보세요. 퇴근 뒤에 식사와 잠을"},{"start":60.2,"end":62.8,"text":"챙길 여력이 남는지까지 보면"},{"start":62.8,"end":65.8,"text":"지속 가능한지 판단하기 쉬워요."},{"start":65.8,"end":68.5,"text":"몸 상태에 대한 치료와 직장 안의"},{"start":68.5,"end":72.0,"text":"업무 조정은 함께 논의할 수 있습니다."}]},{"start":72,"end":78,"text":"복귀표에 숫자 하나만 쓰지 마세요. 줄어드는 일을 한 줄에 적으세요.","cues":[{"start":72.0,"end":75.1,"text":"복귀표에 숫자 하나만 쓰지 마세요."},{"start":75.1,"end":78.0,"text":"줄어드는 일을 한 줄에 적으세요."}]}],"sources":[{"title":"Workplace health: long-term sickness absence and capability to work – Recommendations","url":"https://www.nice.org.uk/guidance/ng146/chapter/recommendations"},{"title":"Workplace health: long-term sickness absence and capability to work – Rationale and impact","url":"https://www.nice.org.uk/guidance/NG146/chapter/rationale-and-impact"},{"title":"Returning to work after mental health issues","url":"https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/return-to-work-after-mental-health-issues/"},{"title":"Guidelines on mental health at work","url":"https://www.who.int/publications/i/item/9789240053052"},{"title":"Strategies to Prevent Worsening of Symptoms","url":"https://www.cdc.gov/me-cfs/hcp/clinical-care/treating-the-most-disruptive-symptoms-first-and-preventing-worsening-of-symptoms.html"}]},{"id":28,"title":"휴가에서만 편한 배, 장소 말고 바뀐 조건","category":"스트레스·마음","original":"휴가 때는 배가 편했는데, 평소와 뭐가 달랐을까요?","length":90,"parts":[{"start":0,"end":2,"text":"휴가만 가면, 배가 편한가요?","cues":[{"start":0.0,"end":2.0,"text":"휴가만 가면, 배가 편한가요?"}]},{"start":2,"end":7,"text":"배가 좋아진 곳을 찾았다면 그날 달라진 조건도 찾아보세요.","cues":[{"start":2.0,"end":4.2,"text":"배가 좋아진 곳을 찾았다면"},{"start":4.2,"end":7.0,"text":"그날 달라진 조건도 찾아보세요."}]},{"start":7,"end":32,"text":"출근하는 날엔 커피부터 마시고, 회의 사이에 급히 먹고, 화장실은 미룹니다. 휴가 날엔 늦게 일어나 천천히 먹고, 불편하면 바로 갈 수 있죠. 장소를 옮겼을 때 식사, 잠, 긴장, 화장실 여건이 한 번에 바뀐 겁니다. 어느 하나를 범인으로 결정하기엔 정보가 너무 많이 같이 움직였어요.","cues":[{"start":7.0,"end":9.9,"text":"출근하는 날엔 커피부터 마시고,"},{"start":9.9,"end":11.9,"text":"회의 사이에 급히 먹고,"},{"start":11.9,"end":14.1,"text":"화장실은 미룹니다. 휴가"},{"start":14.1,"end":16.8,"text":"날엔 늦게 일어나 천천히 먹고,"},{"start":16.8,"end":19.3,"text":"불편하면 바로 갈 수 있죠."},{"start":19.3,"end":22.0,"text":"장소를 옮겼을 때 식사, 잠, 긴장,"},{"start":22.0,"end":25.4,"text":"화장실 여건이 한 번에 바뀐 겁니다."},{"start":25.4,"end":28.6,"text":"어느 하나를 범인으로 결정하기엔"},{"start":28.6,"end":32.0,"text":"정보가 너무 많이 같이 움직였어요."}]},{"start":32,"end":38,"text":"같은 만큼 장이 팽창해도 어떤 날엔 더 아프게 느낄 수 있습니다.","cues":[{"start":32.0,"end":35.2,"text":"같은 만큼 장이 팽창해도 어떤 날엔"},{"start":35.2,"end":38.0,"text":"더 아프게 느낄 수 있습니다."}]},{"start":38,"end":84,"text":"예를 들어 휴가 때 아침마다 화장실에 바로 갈 수 있었다면, 평일과 비교할 단서가 하나 생깁니다. 긴장 정도까지 함께 바뀌었으니 그 정보만으로 원인을 정하진 않아요. 한꺼번에 고치면 달라진 이유도 알기 어렵죠. 장은 내용물을 움직이고, 그 감각은 뇌에 전달됩니다. 몸 상태와 여건에 따라 불편의 정도는 달라질 수 있어요. 평일과 휴가의 차이를 보고 싶다면 먼저 한 조건을 바꿔 보세요. 예를 들어 아침 식사 속도를 늦춘 날과 급히 먹은 날을 비교하는 거죠. 증상이 지속되면 검사 결과와 함께 그 패턴을 진료에 가져가세요.","cues":[{"start":38.0,"end":40.4,"text":"예를 들어 휴가 때 아침마다"},{"start":40.4,"end":42.9,"text":"화장실에 바로 갈 수 있었다면,"},{"start":42.9,"end":46.4,"text":"평일과 비교할 단서가 하나 생깁니다."},{"start":46.4,"end":49.2,"text":"긴장 정도까지 함께 바뀌었으니"},{"start":49.2,"end":51.8,"text":"그 정보만으로 원인을 정하진"},{"start":51.8,"end":53.9,"text":"않아요. 한꺼번에 고치면"},{"start":53.9,"end":56.6,"text":"달라진 이유도 알기 어렵죠."},{"start":56.6,"end":58.7,"text":"장은 내용물을 움직이고,"},{"start":58.7,"end":61.4,"text":"그 감각은 뇌에 전달됩니다."},{"start":61.4,"end":64.0,"text":"몸 상태와 여건에 따라 불편의"},{"start":64.0,"end":66.4,"text":"정도는 달라질 수 있어요."},{"start":66.4,"end":68.8,"text":"평일과 휴가의 차이를 보고"},{"start":68.8,"end":72.1,"text":"싶다면 먼저 한 조건을 바꿔 보세요."},{"start":72.1,"end":74.8,"text":"예를 들어 아침 식사 속도를 늦춘"},{"start":74.8,"end":78.1,"text":"날과 급히 먹은 날을 비교하는 거죠."},{"start":78.1,"end":80.7,"text":"증상이 지속되면 검사 결과와"},{"start":80.7,"end":84.0,"text":"함께 그 패턴을 진료에 가져가세요."}]},{"start":84,"end":90,"text":"휴가에서 가져올 건 장소 이름보다, 평일에 옮겨 볼 조건 하나입니다.","cues":[{"start":84.0,"end":87.0,"text":"휴가에서 가져올 건 장소 이름보다,"},{"start":87.0,"end":90.0,"text":"평일에 옮겨 볼 조건 하나입니다."}]}],"sources":[{"title":"Symptoms & Causes of Irritable Bowel Syndrome","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/irritable-bowel-syndrome/symptoms-causes"},{"title":"British Society of Gastroenterology guidelines on the management of irritable bowel syndrome","url":"https://gut.bmj.com/content/early/2021/04/27/gutjnl-2021-324598"},{"title":"Effect of coffee on distal colon function","url":"https://pubmed.ncbi.nlm.nih.gov/2338272/"},{"title":"2025 Seoul Consensus on Clinical Practice Guidelines for Irritable Bowel Syndrome","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11986658/"}]},{"id":29,"title":"정상 검사 뒤에도 검색을 다시 켜게 되는 순간","category":"스트레스·마음","original":"검사 결과가 정상인데 왜 며칠 지나면 또 걱정될까?","length":85,"parts":[{"start":0,"end":2,"text":"정상인데, 또 증상 검색해요?","cues":[{"start":0.0,"end":2.0,"text":"정상인데, 또 증상 검색해요?"}]},{"start":2,"end":7,"text":"안심이 짧아지는 이유는 검색 버튼을 누른 직후에 보여요.","cues":[{"start":2.0,"end":4.5,"text":"안심이 짧아지는 이유는 검색"},{"start":4.5,"end":7.0,"text":"버튼을 누른 직후에 보여요."}]},{"start":7,"end":32,"text":"몸에 작은 감각이 생깁니다. 검색하면 걱정돼서 몸을 더 자세히 보죠. 검사에서 괜찮다는 말을 듣고 잠깐 숨이 놓입니다. 그런데 며칠 뒤 비슷한 감각이 오면 이번에도 확인부터 하고 싶어져요. 그때마다 확인 직후 안심을 얻었다면, 뇌는 확인하는 일이 꼭 필요하다고 배울 수 있습니다.","cues":[{"start":7.0,"end":9.7,"text":"몸에 작은 감각이 생깁니다."},{"start":9.7,"end":12.0,"text":"검색하면 걱정돼서 몸을 더"},{"start":12.0,"end":14.8,"text":"자세히 보죠. 검사에서 괜찮다는"},{"start":14.8,"end":17.7,"text":"말을 듣고 잠깐 숨이 놓입니다."},{"start":17.7,"end":20.7,"text":"그런데 며칠 뒤 비슷한 감각이 오면"},{"start":20.7,"end":24.0,"text":"이번에도 확인부터 하고 싶어져요."},{"start":24.0,"end":26.3,"text":"그때마다 확인 직후 안심을"},{"start":26.3,"end":28.9,"text":"얻었다면, 뇌는 확인하는 일이"},{"start":28.9,"end":32.0,"text":"꼭 필요하다고 배울 수 있습니다."}]},{"start":32,"end":38,"text":"문제는 안심이 돌아올 때마다 다음 확인까지 가까워질 수 있다는 거예요.","cues":[{"start":32.0,"end":34.8,"text":"문제는 안심이 돌아올 때마다 다음"},{"start":34.8,"end":38.0,"text":"확인까지 가까워질 수 있다는 거예요."}]},{"start":38,"end":78,"text":"어떤 날은 검색한 직후 마음이 놓였는데, 십 분 뒤 다른 글을 또 열 수 있어요. 그게 반복되면 어느 정보가 맞는지 찾아다니느라 불안해지는 시간 자체가 길어집니다. 이 흐름도 치료에서 살펴볼 수 있어요. 증상에 맞는 의료 평가와 함께 확인 행동이 어떻게 반복되는지도 볼 수 있어요. 새롭거나 지속되는 변화는 의료진과 정한 기준에 따라 확인하세요. 익숙한 걱정이 돌아올 땐 불안해진 시점과 검색하고 나서 편해진 시간이 얼마나 갔는지 적어볼 수 있습니다.","cues":[{"start":38.0,"end":41.4,"text":"어떤 날은 검색한 직후 마음이 놓였는데,"},{"start":41.4,"end":44.5,"text":"십 분 뒤 다른 글을 또 열 수 있어요."},{"start":44.5,"end":46.8,"text":"그게 반복되면 어느 정보가"},{"start":46.8,"end":49.8,"text":"맞는지 찾아다니느라 불안해지는"},{"start":49.8,"end":52.2,"text":"시간 자체가 길어집니다."},{"start":52.2,"end":55.7,"text":"이 흐름도 치료에서 살펴볼 수 있어요."},{"start":55.7,"end":57.8,"text":"증상에 맞는 의료 평가와"},{"start":57.8,"end":59.9,"text":"함께 확인 행동이 어떻게"},{"start
