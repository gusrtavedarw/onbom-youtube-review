ext":"같은 햇빛인데 이번에 유독 피부가"},{"start":4.8,"end":8.0,"text":"아팠다면 약을 시작한 날짜를 보세요."}]},{"start":8,"end":31,"text":"일부 약 성분은 피부에서 햇빛을 만나 반응을 일으킬 수 있어요. 그중에는 햇빛이 닿은 자리가 유난히 심하게 탄 것처럼 화끈거리는 반응이 있습니다. 어떤 경우엔 면역 반응이 일어나 한참 뒤 가려운 발진이 올라오기도 하죠. 모양만 보고 집에서 구분하긴 어렵습니다.","cues":[{"start":8.0,"end":10.7,"text":"일부 약 성분은 피부에서 햇빛을"},{"start":10.7,"end":13.6,"text":"만나 반응을 일으킬 수 있어요."},{"start":13.6,"end":16.1,"text":"그중에는 햇빛이 닿은 자리가"},{"start":16.1,"end":18.2,"text":"유난히 심하게 탄 것처럼"},{"start":18.2,"end":21.0,"text":"화끈거리는 반응이 있습니다."},{"start":21.0,"end":23.1,"text":"어떤 경우엔 면역 반응이"},{"start":23.1,"end":25.7,"text":"일어나 한참 뒤 가려운 발진이"},{"start":25.7,"end":28.2,"text":"올라오기도 하죠. 모양만 보고"},{"start":28.2,"end":31.0,"text":"집에서 구분하긴 어렵습니다."}]},{"start":31,"end":36,"text":"최근 피부에 바른 제품이나 보충제도 빠뜨리지 마세요.","cues":[{"start":31.0,"end":33.4,"text":"최근 피부에 바른 제품이나"},{"start":33.4,"end":36.0,"text":"보충제도 빠뜨리지 마세요."}]},{"start":36,"end":70,"text":"소매로 덮인 곳은 괜찮고 밖으로 나온 손등만 유난히 아팠다고 해볼게요. 햇빛에 닿은 곳이 어디까지였는지, 햇빛을 받고 얼마나 지나 피부가 달라졌는지 알려 주세요. 약을 바꾼 날과 피부가 처음 변한 날이 가까웠는지도 보고, 최근 바른 제품이나 보충제도 적어 오세요. 처방약을 혼자 끊기 전에 확인하세요. 넓게 물집이 잡히거나 입안이나 눈 같은 점막에도 통증이 생기면 신속히 진료받으세요.","cues":[{"start":36.0,"end":39.1,"text":"소매로 덮인 곳은 괜찮고 밖으로 나온"},{"start":39.1,"end":42.3,"text":"손등만 유난히 아팠다고 해볼게요."},{"start":42.3,"end":45.3,"text":"햇빛에 닿은 곳이 어디까지였는지,"},{"start":45.3,"end":48.0,"text":"햇빛을 받고 얼마나 지나 피부가"},{"start":48.0,"end":50.4,"text":"달라졌는지 알려 주세요."},{"start":50.4,"end":53.1,"text":"약을 바꾼 날과 피부가 처음 변한"},{"start":53.1,"end":56.0,"text":"날이 가까웠는지도 보고, 최근 바른"},{"start":56.0,"end":59.0,"text":"제품이나 보충제도 적어 오세요."},{"start":59.0,"end":62.4,"text":"처방약을 혼자 끊기 전에 확인하세요."},{"start":62.4,"end":65.1,"text":"넓게 물집이 잡히거나 입안이나"},{"start":65.1,"end":67.8,"text":"눈 같은 점막에도 통증이 생기면"},{"start":67.8,"end":70.0,"text":"신속히 진료받으세요."}]},{"start":70,"end":77,"text":"사진과 함께 새 약을 시작한 날과 햇빛을 받은 뒤 피부가 달라진 날을 알려 주세요.","cues":[{"start":70.0,"end":72.3,"text":"사진과 함께 새 약을 시작한"},{"start":72.3,"end":74.6,"text":"날과 햇빛을 받은 뒤 피부가"},{"start":74.6,"end":77.0,"text":"달라진 날을 알려 주세요."}]}],"sources":[{"title":"The Sun and Your Medicine","url":"https://www.fda.gov/drugs/understanding-over-counter-medicines/sun-and-your-medicine"},{"title":"Photodermatoses: drug-induced","url":"https://www.pcds.org.uk/clinical-guidance/drug-induced-photodermatoses"},{"title":"Stevens-Johnson syndrome","url":"https://www.nhs.uk/conditions/stevens-johnson-syndrome/"}]},{"id":78,"title":"크림을 발라도 손이 갈라지면 뭘 먼저 볼까?","category":"피부","original":"순한 크림을 발라도 손이 갈라진다면, 손에 닿는 것부터 살펴볼까요?","length":82,"parts":[{"start":0,"end":2,"text":"크림 발라도 손이 갈라져요?","cues":[{"start":0.0,"end":2.0,"text":"크림 발라도 손이 갈라져요?"}]},{"start":2,"end":8,"text":"아침부터 저녁까지 손에 닿는 것을 시간순으로 떠올려 보세요.","cues":[{"start":2.0,"end":4.7,"text":"아침부터 저녁까지 손에 닿는"},{"start":4.7,"end":8.0,"text":"것을 시간순으로 떠올려 보세요."}]},{"start":8,"end":29,"text":"아침엔 손을 씻고 일하면서 세정제를 쓰고 저녁엔 설거지를 하죠. 한 번은 괜찮아도 물과 세정제가 손에 자주 닿으면 피부 장벽이 자극을 받을 수 있습니다. 장갑이나 제품에 든 특정 성분에 알레르기가 생겨 손에 염증이 올라오는 사람도 있고요.","cues":[{"start":8.0,"end":10.3,"text":"아침엔 손을 씻고 일하면서"},{"start":10.3,"end":13.7,"text":"세정제를 쓰고 저녁엔 설거지를 하죠."},{"start":13.7,"end":16.5,"text":"한 번은 괜찮아도 물과 세정제가"},{"start":16.5,"end":19.0,"text":"손에 자주 닿으면 피부 장벽이"},{"start":19.0,"end":21.4,"text":"자극을 받을 수 있습니다."},{"start":21.4,"end":23.5,"text":"장갑이나 제품에 든 특정"},{"start":23.5,"end":26.0,"text":"성분에 알레르기가 생겨 손에"},{"start":26.0,"end":29.0,"text":"염증이 올라오는 사람도 있고요."}]},{"start":29,"end":34,"text":"장갑을 꼈다면 안쪽이 젖지는 않았는지도 보세요.","cues":[{"start":29.0,"end":31.1,"text":"장갑을 꼈다면 안쪽이"},{"start":31.1,"end":34.0,"text":"젖지는 않았는지도 보세요."}]},{"start":34,"end":76,"text":"아침엔 괜찮다가 설거지하고 손을 여러 번 씻은 뒤 쓰라린 날이 있을 수 있어요. 새 장갑으로 바꾼 뒤부터 손등이 가려웠을 수도 있고요. 손이 갈라져 보이는 건 같아도 언제 무엇이 닿았는지는 달라요. 장갑이 무슨 재질인지, 안이 젖었는지, 벗었을 때 어디가 특히 가려운지 살펴보세요. 쉬는 날 손이 좀 나아진다면 일하는 날 무엇이 손에 닿는지 짚어 보는 데 도움이 돼요. 쉬면 좋아진다는 사실만으로 원인을 확정하진 않아요. 피부 염증을 치료하면서 손에 자주 닿는 것도 살펴볼 수 있어요.","cues":[{"start":34.0,"end":36.5,"text":"아침엔 괜찮다가 설거지하고"},{"start":36.5,"end":39.3,"text":"손을 여러 번 씻은 뒤 쓰라린 날이"},{"start":39.3,"end":42.0,"text": e":"Consideration of underlying immunodeficiency in refractory or recalcitrant warts: A review of the literature","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9060099/"}]},{"id":80,"title":"겨드랑이 한 자리에 종기가 자꾸 난다면","category":"피부","original":"겨드랑이에 종기가 자꾸 난다면 모낭에서 시작된 염증일 수 있습니다","length":77,"parts":[{"start":0,"end":2,"text":"겨드랑이 종기, 또 그 자리예요?","cues":[{"start":0.0,"end":2.0,"text":"겨드랑이 종기, 또 그 자리예요?"}]},{"start":2,"end":8,"text":"이번에 아픈 곳만 보지 말고 지난번에 남은 흉터도 살펴 보세요.","cues":[{"start":2.0,"end":4.5,"text":"이번에 아픈 곳만 보지 말고"},{"start":4.5,"end":8.0,"text":"지난번에 남은 흉터도 살펴 보세요."}]},{"start":8,"end":31,"text":"겨드랑이나 사타구니처럼 접히는 곳에 깊고 아픈 덩어리가 반복해서 생길 수 있습니다. 화농성 한선염은 모낭 주변 염증이 관여하는 질환이에요. 처음에는 그냥 종기처럼 보일 수 있죠. 가라앉은 자리에 흉터가 남고 계속 반복되면 피부 아래에 통로가 생길 수도 있어요.","cues":[{"start":8.0,"end":10.3,"text":"겨드랑이나 사타구니처럼"},{"start":10.3,"end":12.9,"text":"접히는 곳에 깊고 아픈 덩어리가"},{"start":12.9,"end":15.5,"text":"반복해서 생길 수 있습니다."},{"start":15.5,"end":17.8,"text":"화농성 한선염은 모낭 주변"},{"start":17.8,"end":20.5,"text":"염증이 관여하는 질환이에요."},{"start":20.5,"end":23.9,"text":"처음에는 그냥 종기처럼 보일 수 있죠."},{"start":23.9,"end":26.4,"text":"가라앉은 자리에 흉터가 남고"},{"start":26.4,"end":28.7,"text":"계속 반복되면 피부 아래에"},{"start":28.7,"end":31.0,"text":"통로가 생길 수도 있어요."}]},{"start":31,"end":36,"text":"그때 고름이 보인다고 씻는 횟수만 늘리면 놓치는 게 있어요.","cues":[{"start":31.0,"end":33.2,"text":"그때 고름이 보인다고 씻는"},{"start":33.2,"end":36.0,"text":"횟수만 늘리면 놓치는 게 있어요."}]},{"start":36,"end":71,"text":"한쪽 겨드랑이에 몇 달 사이 세 번 생겼고 가까운 데 흉터도 남았다고 해볼게요. 날짜와 위치를 함께 보면 사진마다 따로 보이던 종기들이 반복해서 생겼다는 걸 알 수 있어요. 어디에 몇 번 났고 가라앉은 자리에 어떤 흔적이 남았는지 봐야 해요. 한 번 터지고 끝났을 때와 비슷한 자리에 자꾸 났을 때는 진료에서 보는 점이 달라요. 아픈 부위를 직접 짜지 말고 언제 어디에 났는지, 흉터는 어땠는지 보여 주세요.","cues":[{"start":36.0,"end":39.4,"text":"한쪽 겨드랑이에 몇 달 사이 세 번 생겼고"},{"start":39.4,"end":42.9,"text":"가까운 데 흉터도 남았다고 해볼게요."},{"start":42.9,"end":45.9,"text":"날짜와 위치를 함께 보면 사진마다"},{"start":45.9,"end":48.6,"text":"따로 보이던 종기들이 반복해서"},{"start":48.6,"end":51.1,"text":"생겼다는 걸 알 수 있어요."},{"start":51.1,"end":54.0,"text":"어디에 몇 번 났고 가라앉은 자 ,"end":14.1,"text":"양성이 나왔다는 건 그 음식의"},{"start":14.1,"end":16.4,"text":"단백질에 반응하는 항체가"},{"start":16.4,"end":19.1,"text":"있다는 단서일 수 있습니다."},{"start":19.1,"end":21.2,"text":"실제로 먹었을 때 증상이"},{"start":21.2,"end":23.4,"text":"생기는지는 따로 봐요."},{"start":23.4,"end":26.2,"text":"양성이 나와도 평소와 같은 양을"},{"start":26.2,"end":29.0,"text":"별일 없이 먹는 사람도 있어요."},{"start":29.0,"end":31.4,"text":"꽃가루와 비슷한 단백질에"},{"start":31.4,"end":34.0,"text":"검사에서 반응하기도 해요."}]},{"start":34,"end":38,"text":"검사표에서 어떤 항체 검사를 했는지도 보세요.","cues":[{"start":34.0,"end":35.8,"text":"검사표에서 어떤 항체"},{"start":35.8,"end":38.0,"text":"검사를 했는지도 보세요."}]},{"start":38,"end":69,"text":"한 그릇을 먹어도 괜찮았는지, 음식에 조금 섞였을 때만 괜찮았는지는 의미가 다를 수 있어요. 음식 아이 지 지 검사는 음식 알레르기를 진단하는 데 쓰는 검사가 아니에요. 먹고 반응한 적이 있다면 어떤 음식을 얼마나 먹었는지, 증상이 언제 시작됐는지 알려 주세요. 알레르기가 의심되는 음식은 집에서 다시 먹어 보지 말고 어떤 검사가 필요한지 의료진과 정하세요.","cues":[{"start":38.0,"end":40.5,"text":"한 그릇을 먹어도 괜찮았는지,"},{"start":40.5,"end":42.6,"text":"음식에 조금 섞였을 때만"},{"start":42.6,"end":46.0,"text":"괜찮았는지는 의미가 다를 수 있어요."},{"start":46.0,"end":49.3,"text":"음식 아이 지 지 검사는 음식 알레르기를"},{"start":49.3,"end":52.5,"text":"진단하는 데 쓰는 검사가 아니에요."},{"start":52.5,"end":54.5,"text":"먹고 반응한 적이 있다면"},{"start":54.5,"end":57.0,"text":"어떤 음식을 얼마나 먹었는지,"},{"start":57.0,"end":60.4,"text":"증상이 언제 시작됐는지 알려 주세요."},{"start":60.4,"end":63.5,"text":"알레르기가 의심되는 음식은 집에서"},{"start":63.5,"end":66.2,"text":"다시 먹어 보지 말고 어떤 검사가"},{"start":66.2,"end":69.0,"text":"필요한지 의료진과 정하세요."}]},{"start":69,"end":76,"text":"진료에 검사표를 가져갈 때는 먹고 나서 몸에 어떤 일이 있었는지도 말해 주세요.","cues":[{"start":69.0,"end":71.5,"text":"진료에 검사표를 가져갈 때는"},{"start":71.5,"end":73.6,"text":"먹고 나서 몸에 어떤 일이"},{"start":73.6,"end":76.0,"text":"있었는지도 말해 주세요."}]}],"sources":[{"title":"EAACI guidelines on the diagnosis of IgE-mediated food allergy","url":"https://pure.amsterdamumc.nl/ws/portalfiles/portal/137436001/Eaaci-guidelines-on-the-diagnosis-of-ige-mediated-food-allergy.pdf"},{"title":"Food Allergy Testing and Diagnosis","url":"https://acaai.org/allergies/testing-diagnosis/food-allergy-testing-and-diagnosis/"},{"title":"The Myth of IgG Food Panel Testing","url":"https://www.aaaai.org/tools-for-the-public/conditions-library/allergies/igg-food-test"},{"title":"Oral Allergy Syndrome (OAS) or Pollen Food Syndrome","url":"https://www.aaaai.org/tools-for-the-public/conditions-library/allergies/oral-allergy-syndrome-(oas)"},{"title":"AAAAI–EAACI PRACTALL: Standardizing oral food challenges—2024 Update","url":"https://eaaci.org/guidelines-position-papers/aaaai-eaaci-practall-standardizing-oral-food-challenges-2024-update/"},{"title":"Food Allergy","url":"https://acaai.org/allergies/allergic-conditions/food/"}]},{"id":82,"title":"같은 음식을 먹었는데 운동한 날만 반응했다면","category":"알레르기","original":"같은 음식인데 어떤 날만 반응한다. 음식 말고 무엇이 달랐을까?","length":78,"parts":[{"start":0,"end":2,"text":"같은 음식인데 뛴 날만요?","cues":[{"start":0.0,"end":2.0,"text":"같은 음식인데 뛴 날만요?"}]},{"start":2,"end":9,"text":"그날 무엇을 먹었는지 떠올릴 때 운동을 시작한 시간도 같이 확인해 보세요.","cues":[{"start":2.0,"end":5.6,"text":"그날 무엇을 먹었는지 떠올릴 때 운동을"},{"start":5.6,"end":9.0,"text":"시작한 시간도 같이 확인해 보세요."}]},{"start":9,"end":46,"text":"어제 먹고 괜찮았던 음식이 오늘은 알레르기 반응과 이어질 수도 있어요. 먹은 양이나 재료가 조금 달랐을 수도 있죠. 일부 사람은 운동 같은 조건이 겹치면 알레르기 반응이 더 쉽게 생길 수 있어요. 음식만 먹거나 운동만 했을 때 괜찮았는지도 진료에서 물어요. 점심을 먹자마자 불편했던 날과 점심 뒤 달리기를 시작하고 불편해진 날은 따로 적으세요. 그래야 음식과 운동의 순서를 보고 다른 조건이 있었는지도 살필 수 있어요.","cues":[{"start":9.0,"end":12.0,"text":"어제 먹고 괜찮았던 음식이 오늘은"},{"start":12.0,"end":15.4,"text":"알레르기 반응과 이어질 수도 있어요."},{"start":15.4,"end":18.2,"text":"먹은 양이나 재료가 조금 달랐을"},{"start":18.2,"end":20.5,"text":"수도 있죠. 일부 사람은 운동"},{"start":20.5,"end":23.0,"text":"같은 조건이 겹치면 알레르기"},{"start":23.0,"end":25.9,"text":"반응이 더 쉽게 생길 수 있어요."},{"start":25.9,"end":28.4,"text":"음식만 먹거나 운동만 했을 때"},{"start":28.4,"end":31.5,"text":"괜찮았는지도 진료에서 물어요."},{"start":31.5,"end":34.2,"text":"점심을 먹자마자 불편했던 날과"},{"start":34.2,"end":36.5,"text":"점심 뒤 달리기를 시작하고"},{"start":36.5,"end":39.4,"text":"불편해진 날은 따로 적으세요."},{"start":39.4,"end":42.3,"text":"그래야 음식과 운동의 순서를 보고"},{"start":42.3,"end":46.0,"text":"다른 조건이 있었는지 ort: An EAACI task force position paper","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/all.15431"},{"title":"Acute Anaphylaxis Clinical Care Standard","url":"https://www.safetyandquality.gov.au/clinical-care-standards/acute-anaphylaxis"},{"title":"아나필락시스 응급처치 · 질병관리청","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6684"}]},{"id":85,"title":"항히스타민제를 끊고 가렵다면 어떤 변화부터 볼까?","category":"알레르기","original":"항히스타민제를 끊은 뒤 다시 가렵다면 원래 증상이 돌아온 걸까요?","length":79,"parts":[{"start":0,"end":2,"text":"항히스타민제 끊고 가렵나요?","cues":[{"start":0.0,"end":2.0,"text":"항히스타민제 끊고 가렵나요?"}]},{"start":2,"end":7,"text":"늘 가렵던 곳이 다시 가려운지 처음 겪는 가려움인지 보세요.","cues":[{"start":2.0,"end":4.4,"text":"늘 가렵던 곳이 다시 가려운지"},{"start":4.4,"end":7.0,"text":"처음 겪는 가려움인지 보세요."}]},{"start":7,"end":28,"text":"항히스타민제는 히스타민의 작용을 막아 가려움이나 두드러기를 덜어 줄 수 있어요. 약을 쉬었을 때 원래 앓던 병의 증상이 돌아올 수 있죠. 세티리진이나 레보세티리진을 오랫동안 매일 쓰다 중단한 뒤 전에 없던 심한 가려움이 드물게 보고됐고요.","cues":[{"start":7.0,"end":9.5,"text":"항히스타민제는 히스타민의"},{"start":9.5,"end":11.6,"text":"작용을 막아 가려움이나"},{"start":11.6,"end":14.4,"text":"두드러기를 덜어 줄 수 있어요."},{"start":14.4,"end":16.9,"text":"약을 쉬었을 때 원래 앓던 병의"},{"start":16.9,"end":20.0,"text":"증상이 돌아올 수 있죠. 세티리진이나"},{"start":20.0,"end":22.7,"text":"레보세티리진을 오랫동안 매일"},{"start":22.7,"end":25.2,"text":"쓰다 중단한 뒤 전에 없던 심한"},{"start":25.2,"end":28.0,"text":"가려움이 드물게 보고됐고요."}]},{"start":28,"end":33,"text":"약 이름을 모르겠다면 약통에 적힌 성분을 확인해 보세요.","cues":[{"start":28.0,"end":30.5,"text":"약 이름을 모르겠다면 약통에"},{"start":30.5,"end":33.0,"text":"적힌 성분을 확인해 보세요."}]},{"start":33,"end":73,"text":"비염 때문에 먹던 약을 쉬었더니 전에 없던 가려움이 온몸에 생긴 경우가 있어요. 반대로 두드러기 때문에 먹던 사람이 늘 올라오던 자리에 다시 두드러기가 났다면 예전 질환이 남아 있는지도 살핍니다. 원래와 같은 곳이 가려운지, 발진이 있는지, 약을 쉰 뒤 며칠 만인지 살펴보세요. 가렵기 시작한 때를 보면 원래 있던 증상인지 전에 없던 가려움인지 살피는 데 도움이 돼요. 새로 생긴 증상이 심하다면 약을 먹기 시작한 날과 끊은 날을 적어서 처방한 곳에 문의하세요.","cues":[{"start":33.0,"end":35.7,"text":"비염 때문에 먹던 약을 쉬었더니"},{"start":35.7,"end":38.5,"text":"전에 없던 가려움이 온몸에 생긴"},{"start":38.5,"end":41.2,"text":"경우가 "end":2,"text":"운동하다 가렵고 숨도 찼나요?","cues":[{"start":0.0,"end":2.0,"text":"운동하다 가렵고 숨도 찼나요?"}]},{"start":2,"end":14,"text":"운동을 멈추세요. 목이 조이거나 숨쉬기 어려워 아나필락시스가 의심되면 처방된 에피네프린을 쓰고 즉시 일일구에 연락하세요.","cues":[{"start":2.0,"end":4.9,"text":"운동을 멈추세요. 목이 조이거나"},{"start":4.9,"end":7.8,"text":"숨쉬기 어려워 아나필락시스가"},{"start":7.8,"end":10.8,"text":"의심되면 처방된 에피네프린을"},{"start":10.8,"end":14.0,"text":"쓰고 즉시 일일구에 연락하세요."}]},{"start":14,"end":57,"text":"몸이 더워지면 작은 두드러기가 올라오는 사람이 있어요. 운동할 때나 뜨거운 물로 샤워할 때 비슷할 수 있죠. 가려우면서 목이 조이거나 숨이 차고 쓰러질 것 같다면 온몸에 생기는 심한 알레르기 반응일 수 있어요. 평소 운동하면서 느끼던 숨참과 다르다면 특히 살펴야 해요. 운동 뒤 팔에 작은 두드러기만 올라왔다면 어디까지 퍼졌는지, 몸이 식거나 쉬고 나서 어떻게 달라졌는지 알려 주세요. 목소리가 변했거나 숨쉬기 힘들었거나 어지러웠는지 기록하면 진료에서 위험을 판단하기 쉬워요.","cues":[{"start":14.0,"end":16.7,"text":"몸이 더워지면 작은 두드러기가"},{"start":16.7,"end":19.2,"text":"올라오는 사람이 있어요."},{"start":19.2,"end":21.3,"text":"운동할 때나 뜨거운 물로"},{"start":21.3,"end":23.7,"text":"샤워할 때 비슷할 수 있죠."},{"start":23.7,"end":26.9,"text":"가려우면서 목이 조이거나 숨이 차고"},{"start":26.9,"end":29.6,"text":"쓰러질 것 같다면 온몸에 생기는"},{"start":29.6,"end":32.6,"text":"심한 알레르기 반응일 수 있어요."},{"start":32.6,"end":35.4,"text":"평소 운동하면서 느끼던 숨참과"},{"start":35.4,"end":38.0,"text":"다르다면 특히 살펴야 해요."},{"start":38.0,"end":40.6,"text":"운동 뒤 팔에 작은 두드러기만"},{"start":40.6,"end":43.3,"text":"올라왔다면 어디까지 퍼졌는지,"},{"start":43.3,"end":45.2,"text":"몸이 식거나 쉬고 나서"},{"start":45.2,"end":48.2,"text":"어떻게 달라졌는지 알려 주세요."},{"start":48.2,"end":50.6,"text":"목소리가 변했거나 숨쉬기"},{"start":50.6,"end":53.7,"text":"힘들었거나 어지러웠는지 기록하면"},{"start":53.7,"end":57.0,"text":"진료에서 위험을 판단하기 쉬워요."}]},{"start":57,"end":63,"text":"피부에 두드러기가 없어도 심한 알레르기 반응이 생길 수 있어요.","cues":[{"start":57.0,"end":59.8,"text":"피부에 두드러기가 없어도 심한"},{"start":59.8,"end":63.0,"text":"알레르기 반응이 생길 수 있어요."}]},{"start":63,"end":77,"text":"상황이 가라앉은 뒤 진료에선 운동 전에 먹은 음식과 약, 증상이 시작된 시간을 알려 주세요. 원인을 알아보려고 운동하며 같은 상황을 다시 만들어 보진 마세요.","cues":[{"start":63.0,"end":65.6,"text":"상황이 가라앉은 뒤 진료에선"},{"start":65.6,"end":67.7,"text":"운동 전에 먹은 음식과 약,"},{"start":67.7,"end":71.0,"text":"증상이 시작된 시간을 알려 주세요."},{"start":71.0,"end":73.5,"text":"원인을 알아보려고 운동하며"},{"start":73.5,"end":77.0,"text":"같은 상황을 다시 만들어 보진 마세요."}]},{"start":77,"end":83,"text":"가려움이 피부에만 있었나요? 그때 목과 숨쉬는 것도 달라졌나요?","cues":[{"start":77.0,"end":79.8,"text":"가려움이 피부에만 있었나요?"},{"start":79.8,"end":83.0,"text":"그때 목과 숨쉬는 것도 달라졌나요?"}]}],"sources":[{"title":"Diagnosis and management of allergy and respiratory disorders in sport: An EAACI task force position paper","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/all.15431"},{"title":"Acute Anaphylaxis Clinical Care Standard","url":"https://www.safetyandquality.gov.au/clinical-care-standards/acute-anaphylaxis"},{"title":"The International Guideline for the Definition, Classification, Diagnosis and Management of Urticaria","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/all.70210"},{"title":"아나필락시스 응급처치 · 질병관리청","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6684"}]},{"id":89,"title":"새우 알레르기가 있다면 조영제 검사 전에 뭘 말해야 할까?","category":"알레르기","original":"새우 알레르기와 조영제 반응, 왜 따로 확인할까요?","length":82,"parts":[{"start":0,"end":2,"text":"새우 알레르기면 조영제 금지?","cues":[{"start":0.0,"end":2.0,"text":"새우 알레르기면 조영제 금지?"}]},{"start":2,"end":8,"text":"예전에 조영제를 맞고 어떤 일이 있었는지부터 떠올려 보세요.","cues":[{"start":2.0,"end":5.0,"text":"예전에 조영제를 맞고 어떤 일이"},{"start":5.0,"end":8.0,"text":"있었는지부터 떠올려 보세요."}]},{"start":8,"end":29,"text":"새우 알레르기는 해산물에 든 단백질에 몸이 반응하는 거예요. 요오드가 든 조영제라고 해서 그 둘이 같은 알레르기라고 말할 수는 없어요. 조영제 검사를 앞뒀다면 예전에 조영제를 맞고 어떤 반응이 있었는지가 더 직접적인 단서가 돼요.","cues":[{"start":8.0,"end":10.6,"text":"새우 알레르기는 해산물에 든"},{"start":10.6,"end":13.7,"text":"단백질에 몸이 반응하는 거예요."},{"start":13.7,"end":16.3,"text":"요오드가 든 조영제라고 해서"},{"start":16.3,"end":18.7,"text":"그 둘이 같은 알레르기라고"},{"start":18.7,"end":21.5,"text":"말할 수는 없어요. 조영제 검사를"},{"start":21.5,"end":24.4,"text":"앞뒀다면 예전에 조영제를 맞고"},{"start":24.4,"end":26.5,"text":"어떤 반응이 있었는지가"},{"start":26.5,"end":29.0,"text":"더 직접적인 단서가 돼요."}]},{"start":29,"end":35,"text":"‘맞고 이상했어요’라고 할 땐 몸이 어떻게 달라졌는지 설명해 주세요.","cues":[{"start":29.0,"end":31.7,"text":"‘맞고 이상했어요’라고 할 땐 몸이"},{"start":31.7,"end":35.0,"text":"어떻게 달라졌는지 설명해 주세요."}]},{"start":35,"end":73,"text":"조영제를 쓰는 검사도 종류가 여럿이죠. 컴퓨터 단층촬영인 CT였는지, 자기공명영상인 MRI였는지 알면 어떤 반응이 있었는지 확인하는 데 도움이 됩니다. 몸이 잠깐 따뜻해졌을 때와 두드러기가 나거나 숨이 찼을 때는 검사 계획이 달라질 수 있어요. 검사 이름이나 조영제 이름, 반응이 시작된 때와 어떤 치료를 받았는지 알려 주세요. 이름은 몰라도 당시 검사를 받은 병원과 날짜는 단서가 됩니다. 새우 알레르기가 있다는 사실도 같이 알려 주세요.","cues":[{"start":35.0,"end":38.6,"text":"조영제를 쓰는 검사도 종류가 여럿이죠."},{"start":38.6,"end":40.9,"text":"컴퓨터 단층촬영인 CT였는지,"},{"start":40.9,"end":43.4,"text":"자기공명영상인 MRI였는지 알면"},{"start":43.4,"end":45.3,"text":"어떤 반응이 있었는지"},{"start":45.3,"end":47.9,"text":"확인하는 데 도움이 됩니다."},{"start":47.9,"end":50.2,"text":"몸이 잠깐 따뜻해졌을 때와"},{"start":50.2,"end":53.1,"text":"두드러기가 나거나 숨이 찼을 때는"},{"start":53.1,"end":55.9,"text":"검사 계획이 달라질 수 있어요."},{"start":55.9,"end":58.2,"text":"검사 이름이나 조영제 이름,"},{"start":58.2,"end":60.9,"text":"반응이 시작된 때와 어떤 치료를"},{"start":60.9,"end":63.0,"text":"받았는지 알려 주세요."},{"start":63.0,"end":65.8,"text":"이름은 몰라도 당시 검사를 받은"},{"start":65.8,"end":68.5,"text":"병원과 날짜는 단서가 됩니다."},{"start":68.5,"end":70.6,"text":"새우 알레르기가 있다는"},{"start":70.6,"end":73.0,"text":"사실도 같이 알려 주세요."}]},{"start":73,"end":82,"text":"조영제 검사를 앞두고 있다면 지난번 조영제를 맞은 뒤 언제 어떤 증상이 생겼는지 꼭 알려 주세요.","cues":[{"start":73.0,"end":75.7,"text":"조영제 검사를 앞두고 있다면"},{"start":75.7,"end":78.3,"text":"지난번 조영제를 맞은 뒤 언제"},{"start":78.3,"end":82.0,"text":"어떤 증상이 생겼는지 꼭 알려 주세요."}]}],"sources":[{"title":"Management and Prevention of Hypersensitivity Reactions to Radiocontrast Media: A Consensus Statement from the ACR and AAAAI","url":"https://pubs.rsna.org/doi/10.1148/radiol.240100"},{"title":"Radiocontrast Media Hypersensitivity","url":"https://www.allergy.org.au/hp/drug-allergy/radiocontrast-media"},{"title":"Radiocontrast Material and Seafood Allergy","url":"https://education.aaaai.org/sites/default/files/scorm_engine/Applying%20Choosing%20Wisely%20Recommendations%20Seafood%20Allergy%20and%20Radiocontrast_1-1550244683/story_ "start":32,"end":39,"text":"기록이 안 나온다고 바로 운동을 더 하면 무엇 때문인지 가리기 어려워져요.","cues":[{"start":32.0,"end":35.6,"text":"기록이 안 나온다고 바로 운동을 더 하면"},{"start":35.6,"end":39.0,"text":"무엇 때문인지 가리기 어려워져요."}]},{"start":39,"end":75,"text":"전에 주 세 번 했던 운동을 이번엔 며칠 연속으로 했다고 해볼게요. 무게를 낮췄는데도 평소보다 힘들었어요. 운동을 더 세게 해야 할지 정하기 전에 운동한 날 사이에 얼마나 쉬고 회복했는지 돌아봐야 해요. 최근 운동량이 달라졌는지, 며칠 쉬었고 어떻게 먹고 잤는지 보세요. 운동할 때만 힘이 안 났나요? 물건을 들거나 계단을 오를 때도 그랬나요? 평소 하던 동작에서 새로 힘이 빠진다면 진료에서 확인하세요.","cues":[{"start":39.0,"end":41.8,"text":"전에 주 세 번 했던 운동을 이번엔"},{"start":41.8,"end":44.9,"text":"며칠 연속으로 했다고 해볼게요."},{"start":44.9,"end":47.4,"text":"무게를 낮췄는데도 평소보다"},{"start":47.4,"end":49.8,"text":"힘들었어요. 운동을 더 세게"},{"start":49.8,"end":52.4,"text":"해야 할지 정하기 전에 운동한"},{"start":52.4,"end":54.3,"text":"날 사이에 얼마나 쉬고"},{"start":54.3,"end":57.0,"text":"회복했는지 돌아봐야 해요."},{"start":57.0,"end":59.3,"text":"최근 운동량이 달라졌는지,"},{"start":59.3,"end":63.0,"text":"며칠 쉬었고 어떻게 먹고 잤는지 보세요."},{"start":63.0,"end":66.0,"text":"운동할 때만 힘이 안 났나요? 물건을"},{"start":66.0,"end":69.3,"text":"들거나 계단을 오를 때도 그랬나요?"},{"start":69.3,"end":71.9,"text":"평소 하던 동작에서 새로 힘이"},{"start":71.9,"end":75.0,"text":"빠진다면 진료에서 확인하세요."}]},{"start":75,"end":84,"text":"운동을 더 할지 쉬어 갈지 정할 땐 기록이 떨어진 것과 이번 주에 얼마나 피로했는지를 같이 보세요.","cues":[{"start":75.0,"end":77.7,"text":"운동을 더 할지 쉬어 갈지 정할"},{"start":77.7,"end":80.6,"text":"땐 기록이 떨어진 것과 이번 주에"},{"start":80.6,"end":84.0,"text":"얼마나 피로했는지를 같이 보세요."}]}],"sources":[{"title":"Prevention, diagnosis, and treatment of the overtraining syndrome: joint consensus statement of the ECSS and ACSM","url":"https://pubmed.ncbi.nlm.nih.gov/23247672/"},{"title":"2023 International Olympic Committee’s consensus statement on Relative Energy Deficiency in Sport (REDs)","url":"https://bjsm.bmj.com/content/57/17/1073"},{"title":"Position of the Academy of Nutrition and Dietetics, Dietitians of Canada, and ACSM: Nutrition and Athletic Performance","url":"https://www.andeal.org/files/files/Collaborations/Position_Athletic-Performance_2016March.pdf"},{"title":"Weakness — MedlinePlus Medical Encyclopedia","url":"https://medlineplus.gov/ency/article/003174.htm"},{"title":"Signs and Symptoms of Rhabdomyolysis","url":"https://www.cdc.gov/niosh/rhabdo/signs-symptoms/index.html"}]},{"id":92,"title":"인바디에서 근육량이 갑자기 줄었다면","category":"운동","original":"인바디에서 근육량이 줄었다면 실제로 근육이 빠진 걸까요?","length":77,"parts":[{"start":0,"end":2,"text":"인바디 근육량이 줄었나요?","cues":[{"start":0.0,"end":2.0,"text":"인바디 근육량이 줄었나요?"}]},{"start":2,"end":8,"text":"근육량 숫자를 비교하기 전에 두 번 다 같은 상태에서 쟀는지 보세요.","cues":[{"start":2.0,"end":5.2,"text":"근육량 숫자를 비교하기 전에 두 번 다"},{"start":5.2,"end":8.0,"text":"같은 상태에서 쟀는지 보세요."}]},{"start":8,"end":29,"text":"인바디 같은 기계는 몸에 약한 전류를 흘려 전기 신호를 재요. 그 값으로 몸 안의 물과 여러 성분을 추정해 근육량을 계산하죠. 첫 검사는 아침에 하고 두 번째는 운동해서 땀을 뺀 뒤에 했다면 몸속 수분 상태가 달라져 결과에도 영향을 줄 수 있어요.","cues":[{"start":8.0,"end":10.5,"text":"인바디 같은 기계는 몸에 약한"},{"start":10.5,"end":13.3,"text":"전류를 흘려 전기 신호를 재요."},{"start":13.3,"end":16.3,"text":"그 값으로 몸 안의 물과 여러 성분을"},{"start":16.3,"end":18.9,"text":"추정해 근육량을 계산하죠."},{"start":18.9,"end":21.6,"text":"첫 검사는 아침에 하고 두 번째는"},{"start":21.6,"end":24.1,"text":"운동해서 땀을 뺀 뒤에 했다면"},{"start":24.1,"end":26.2,"text":"몸속 수분 상태가 달라져"},{"start":26.2,"end":29.0,"text":"결과에도 영향을 줄 수 있어요."}]},{"start":29,"end":35,"text":"기계가 매번 비슷한 값을 내더라도 근육량 자체를 직접 재는 건 아니에요.","cues":[{"start":29.0,"end":31.8,"text":"기계가 매번 비슷한 값을 내더라도"},{"start":31.8,"end":35.0,"text":"근육량 자체를 직접 재는 건 아니에요."}]},{"start":35,"end":71,"text":"지난번과 숫자는 크게 달라졌는데 계단도 평소처럼 오르고 장바구니도 똑같이 들었다고 해볼게요. 반대로 결과지 수치는 비슷해도 의자에서 일어나는 힘이 떨어질 수 있어요. 결과지는 비슷한 시간과 조건에서 쟀을 때 값이 어떻게 바뀌는지 보세요. 계단을 오르거나 물건을 들 때 실제로 힘이 달라졌는지도 따로 살피고요. 수치가 계속 달라지고 일상에서 힘도 떨어진다면 두 가지를 모두 가져가서 진료받으세요.","cues":[{"start":35.0,"end":38.0,"text":"지난번과 숫자는 크게 달라졌는데"},{"start":38.0,"end":40.1,"text":"계단도 평소처럼 오르고"},{"start":40.1,"end":42.6,"text":"장바구니도 똑같이 들었다고"},{"start":42.6,"end":44.8,"text":"해볼게요. 반대로 결과지"},{"start":44.8,"end":47.1,"text":"수치는 비슷해도 의자에서"},{"start":47.1,"end":50.2,"text":"일어나는 힘이 떨어질 수 있어요."},{"start":50.2,"end":53.1,"text":"결과지는 비슷한 시간과 조건에서"},{"start":53.1,"end":56.6,"text":"쟀을 때 값이 어떻게 바뀌는지 보세요."},{"start":56.6,"end":59.8,"text":"계단을 오르거나 물건을 들 때 실제로"},{"start":59.8,"end":63.1,"text":"힘이 달라졌는지도 따로 살피고요."},{"start":63.1,"end":65.8,"text":"수치가 계속 달라지고 일상에서"},{"start":65.8,"end":68.2,"text":"힘도 떨어진다면 두 가지를"},{"start":68.2,"end":71.0,"text":"모두 가져가서 진료받으세요."}]},{"start":71,"end":77,"text":"두 결과지를 비교할 땐 언제 어떤 상태에서 쟀는지 먼저 보세요.","cues":[{"start":71.0,"end":73.5,"text":"두 결과지를 비교할 땐 언제"},{"start":73.5,"end":77.0,"text":"어떤 상태에서 쟀는지 먼저 보세요."}]}],"sources":[{"title":"Methodological standards for body composition assessment—an expert-endorsed guide for research and clinical applications: bioimpedance, dual-energy X-ray absorptiometry, computerized tomography, and ultrasound methods","url":"https://ajcn.nutrition.org/article/S0002-9165%2826%2900092-4/fulltext"},{"title":"Bioelectrical impedance analysis—part II: utilization in clinical practice","url":"https://academy.espen.org/documents/BIA2.pdf"},{"title":"Acute Fluid Intake Impacts Assessment of Body Composition via Bioelectrical Impedance Analysis. A Randomized, Controlled Crossover Pilot Trial","url":"https://www.mdpi.com/2218-1989/13/4/473"},{"title":"A focus shift from sarcopenia to muscle health in the Asian Working Group for Sarcopenia 2025 Consensus Update","url":"https://pubmed.ncbi.nlm.nih.gov/41188603/"},{"title":"Weakness — MedlinePlus Medical Encyclopedia","url":"https://medlineplus.gov/ency/article/003174.htm"},{"title":"Methodological standards for body composition—an expert-endorsed guide for research and clinical applications: levels, models, and terminology","url":"https://ajcn.nutrition.org/article/S0002-9165%2825%2900277-1/fulltext"}]},{"id":93,"title":"근육통이 줄었다고 운동 효과도 줄진 않는 이유","category":"운동","original":"같은 운동을 해도 근육통이 줄었다면 운동 효과도 줄었을까요?","length":83,"parts":[{"start":0,"end":2,"text":"근육통 없어도 운동은 돼요.","cues":[{"start":0.0,"end":2.0,"text":"근육통 없어도 운동은 돼요."}]},{"start":2,"end":7,"text":"같은 운동을 해도 예전만큼 뻐근하지 않은 이유부터 볼게요.","cues":[{"start":2.0,"end":4.2,"text":"같은 운동을 해도 예전만큼"},{"start":4.2,"end":7.0,"text":"뻐근하지 않은 이유부터 볼게요."}]},{"start":7,"end":34,"text":"처음 내리막을 오래 걷거나 새 동작을 하면 다음 날 많이 쓴 근육이 아플 수 있어요. 같은 동작을 거듭하면 몸이 그 정도 힘을 쓰는 데 적응해서 비슷하게 운동해도 예전만큼 뻐근하지 않을 수 있죠. 근육통은 낯선 운동에 몸이 반응했다는 걸 알려줄 수 있어요. 근육이 얼마나 자랐는지까지 알려 주는 건 아니에요.","cues":[{"start":7.0,"end":9.3,"text":"처음 내리막을 오래 걷거나"},{"start":9.3,"end":11.7,"text":"새 동작을 하면 다음 날 많이"},{"start":11.7,"end":14.1,"text":"쓴 근육이 아플 수 있어요."},{"start":14.1,"end":16.5,"text":"같은 동작을 거듭하면 몸이"},{"start":16.5,"end":19.0,"text":"그 정도 힘을 쓰는 데 적응해서"},{"start":19.0,"end":21.6,"text":"비슷하게 운동해도 예전만큼"},{"start":21.6,"end":23.8,"text":"뻐근하지 않을 수 있죠."},{"start":23.8,"end":26.2,"text":"근육통은 낯선 운동에 몸이"},{"start":26.2,"end":29.2,"text":"반응했다는 걸 알려줄 수 있어요."},{"start":29.2,"end":31.8,"text":"근육이 얼마나 자랐는지까지"},{"start":31.8,"end":34.0,"text":"알려 주는 건 아니에요."}]},{"start":34,"end":39,"text":"그래서 어제보다 아파야 효과도 더 큰 건 아니에요.","cues":[{"start":34.0,"end":36.3,"text":"그래서 어제보다 아파야"},{"start":36.3,"end":39.0,"text":"효과도 더 큰 건 아니에요."}]},{"start":39,"end":75,"text":"새로운 스쿼트 동작을 처음 한 다음 날엔 계단 오르기가 불편했어요. 몇 주 뒤 같은 동작을 더 안정적으로 했는데도 덜 아팠고요. 얼마나 아팠는지만 보면 동작이 익숙해진 걸 놓쳐요. 같은 무게를 더 안정적으로 드는지, 같은 횟수를 더 수월하게 해내는지 몇 주에 걸쳐 보세요. 운동 다음 날 뻐근한 것과 운동 중 갑자기 찌르는 듯 아프거나 힘이 빠지는 건 따로 봐야 해요. 날카로운 통증이 생기면 그 동작은 멈추고 확인하세요.","cues":[{"start":39.0,"end":41.9,"text":"새로운 스쿼트 동작을 처음 한 다음"},{"start":41.9,"end":44.9,"text":"날엔 계단 오르기가 불편했어요."},{"start":44.9,"end":47.8,"text":"몇 주 뒤 같은 동작을 더 안정적으로"},{"start":47.8,"end":50.0,"text":"했는데도 덜 아팠고요."},{"start":50.0,"end":52.0,"text":"얼마나 아팠는지만 보면"},{"start":52.0,"end":54.6,"text":"동작이 익숙해진 걸 놓쳐요."},{"start":54.6,"end":57.5,"text":"같은 무게를 더 안정적으로 드는지,"},{"start":57.5,"end":59.6,"text":"같은 횟수를 더 수월하게"},{"start":59.6,"end":62.4,"text":"해내는지 몇 주에 걸쳐 보세요."},{"start":62.4,"end":65.1,"text":"운동 다음 날 뻐근한 것과 운동 중"},{"start":65.1,"end":67.4,"text":"갑자기 찌르는 듯 아프거나"},{"start":67.4,"end":70.1,"text":"힘이 빠지는 건 따로 봐야 해요."},{"start":70.1,"end":72.2,"text":"날카로운 통증이 생기면"},{"st 3389/fphys.2018.00639/full"},{"title":"Top Things to Know: 2021 Guideline for the Evaluation and Diagnosis of Chest Pain","url":"https://professional.heart.org/en/science-news/2021-guideline-for-the-evaluation-and-diagnosis-of-chest-pain/top-things-to-know"}]},{"id":95,"title":"같은 산책길인데 심박수가 높은 날","category":"운동","original":"천천히 걷는데도 심박수가 높게 나오는 날, 몸 상태와 워치에서 뭘 볼까요?","length":85,"parts":[{"start":0,"end":2,"text":"산책만 하는데 맥박이 뛰어요?","cues":[{"start":0.0,"end":2.0,"text":"산책만 하는데 맥박이 뛰어요?"}]},{"start":2,"end":7,"text":"어제도 걸었던 길이라면 속도 외에 바뀐 걸 찾아보세요.","cues":[{"start":2.0,"end":4.1,"text":"어제도 걸었던 길이라면"},{"start":4.1,"end":7.0,"text":"속도 외에 바뀐 걸 찾아보세요."}]},{"start":7,"end":47,"text":"더운 날엔 열을 내보내려고 피부 쪽으로 피가 더 가요. 땀을 흘려 수분도 빠질 수 있고요. 이런 날엔 같은 속도로 걸어도 심장이 더 자주 뛸 수도 있어요. 스마트워치가 손목에서 흔들리거나 피부에 잘 닿지 않으면 수치가 다르게 나올 때도 있죠. 숫자만 보고 갑자기 체력이 떨어졌다고 단정하긴 어려워요. 한 번 높게 나왔다가 시계를 고쳐 찬 뒤 원래대로 돌아올 수 있어요. 쉬어도 심장이 불규칙하게 뛰는 느낌이 반복된다면 화면과 실제로 느낀 증상을 같이 봐야 해요.","cues":[{"start":7.0,"end":9.3,"text":"더운 날엔 열을 내보내려고"},{"start":9.3,"end":11.7,"text":"피부 쪽으로 피가 더 가요."},{"start":11.7,"end":14.7,"text":"땀을 흘려 수분도 빠질 수 있고요."},{"start":14.7,"end":17.2,"text":"이런 날엔 같은 속도로 걸어도"},{"start":17.2,"end":20.0,"text":"심장이 더 자주 뛸 수도 있어요."},{"start":20.0,"end":22.1,"text":"스마트워치가 손목에서"},{"start":22.1,"end":25.0,"text":"흔들리거나 피부에 잘 닿지 않으면"},{"start":25.0,"end":27.8,"text":"수치가 다르게 나올 때도 있죠."},{"start":27.8,"end":30.1,"text":"숫자만 보고 갑자기 체력이"},{"start":30.1,"end":33.1,"text":"떨어졌다고 단정하긴 어려워요."},{"start":33.1,"end":35.8,"text":"한 번 높게 나왔다가 시계를 고쳐"},{"start":35.8,"end":38.8,"text":"찬 뒤 원래대로 돌아올 수 있어요."},{"start":38.8,"end":41.1,"text":"쉬어도 심장이 불규칙하게"},{"start":41.1,"end":43.8,"text":"뛰는 느낌이 반복된다면 화면과"},{"start":43.8,"end":47.0,"text":"실제로 느낀 증상을 같이 봐야 해요."}]},{"start":47,"end":52,"text":"맥박이 빠른지, 뛰는 박자가 불규칙한지도 따로 보세요.","cues":[{"start":47.0,"end":49.4,"text":"맥박이 빠른지, 뛰는 박자가"},{"start":49.4,"end":52.0,"text":"불규칙한지도 따로 보세요."}]},{"start":52,"end":76,"text":"걸음을 멈춘 뒤에도 심장이 빨리 뛰는지, 박자가 불규칙한지, 다른 증상이 있는지 살펴보세요. 가슴이 아프  전달해요. 발을 딛고 몸을 앞으로 밀 때 쓰는 힘줄이죠. 처음엔 걸을 때 아파도 몸이 풀리면서 덜 아프게 느낄 수 있어요. 잠깐 덜 아팠다고 힘줄이 그날 받은 부담을 다 견뎠다고 볼 순 없어요. 뛰다가 통증이 줄어 평소보다 오래 달렸다고 해볼게요. 저녁까진 괜찮다가 다음 날 신발을 신고 처음 딛는 순간엔 더 뻣뻣할 수 있죠. 달리는 동안 어땠는지만 적으면 다음 날 상태는 놓쳐요.","cues":[{"start":8.0,"end":11.0,"text":"뒤꿈치 뒤의 아킬레스건은 종아리"},{"start":11.0,"end":13.6,"text":"힘을 발에 전달해요. 발을 딛고"},{"start":13.6,"end":16.7,"text":"몸을 앞으로 밀 때 쓰는 힘줄이죠."},{"start":16.7,"end":19.1,"text":"처음엔 걸을 때 아파도 몸이"},{"start":19.1,"end":22.4,"text":"풀리면서 덜 아프게 느낄 수 있어요."},{"start":22.4,"end":25.4,"text":"잠깐 덜 아팠다고 힘줄이 그날 받은"},{"start":25.4,"end":28.5,"text":"부담을 다 견뎠다고 볼 순 없어요."},{"start":28.5,"end":31.1,"text":"뛰다가 통증이 줄어 평소보다"},{"start":31.1,"end":34.1,"text":"오래 달렸다고 해볼게요. 저녁까진"},{"start":34.1,"end":36.7,"text":"괜찮다가 다음 날 신발을 신고"},{"start":36.7,"end":40.0,"text":"처음 딛는 순간엔 더 뻣뻣할 수 있죠."},{"start":40.0,"end":42.8,"text":"달리는 동안 어땠는지만 적으면"},{"start":42.8,"end":45.0,"text":"다음 날 상태는 놓쳐요."}]},{"start":45,"end":50,"text":"뛴 거리 외에 하루 동안 얼마나 서 있고 움직였는지도 봐요.","cues":[{"start":45.0,"end":47.7,"text":"뛴 거리 외에 하루 동안 얼마나 서"},{"start":47.7,"end":50.0,"text":"있고 움직였는지도 봐요."}]},{"start":50,"end":71,"text":"계단을 많이 올랐거나 오래 서 있었는지도 보세요. 그날 저녁과 다음 날 아침에 뒤꿈치가 얼마나 뻣뻣했는지도 살펴보시고요. 갑자기 뒤에서 맞은 듯하거나 뭔가 끊어진 느낌이 난 뒤 발을 딛거나 밀기 어렵다면 운동을 멈추고 신속히 진료받으세요.","cues":[{"start":50.0,"end":52.5,"text":"계단을 많이 올랐거나 오래 서"},{"start":52.5,"end":55.2,"text":"있었는지도 보세요. 그날 저녁과"},{"start":55.2,"end":57.9,"text":"다음 날 아침에 뒤꿈치가 얼마나"},{"start":57.9,"end":60.7,"text":"뻣뻣했는지도 살펴보시고요."},{"start":60.7,"end":63.2,"text":"갑자기 뒤에서 맞은 듯하거나"},{"start":63.2,"end":65.7,"text":"뭔가 끊어진 느낌이 난 뒤 발을"},{"start":65.7,"end":68.2,"text":"딛거나 밀기 어렵다면 운동을"},{"start":68.2,"end":71.0,"text":"멈추고 신속히 진료받으세요."}]},{"start":71,"end":77,"text":"운동량이 내게 맞았는지 다음 날 아침 첫발을 디딜 때도 살펴보세요.","cues":[{"start":71.0,"end":73.7,"text":"운동량이 내게 맞았는지 다음 날"},{"start":73.7,"end":77.0,"text":"아침 첫발을 디딜 때도 살펴보세요."}]}],"sources":[{"title":"Achilles Pain, Stiffness, and Muscle Power Deficits: Midportion Achilles Tendinopathy Revision – 2024","url":"https://orthopt.org/uploads/content_files/files/chimenti_et_al_2024_achilles_pain_stiffness_and_muscle_power_deficits_midportion_achilles_tendinopathy_revision_2024.pdf"},{"title":"Achilles tendinopathy management advice","url":"https://www.cuh.nhs.uk/patient-information/achilles-tendinopathy-management-advice/"},{"title":"Achilles Tendinitis","url":"https://www.orthoinfo.org/bodypart/foot-ankle/achilles-tendinitis/"}]},{"id":97,"title":"밤 운동 후 피곤한데 잠은 안 오는 이유","category":"운동","original":"밤 운동 뒤 몸은 지쳤는데 잠은 안 오는 이유","length":79,"parts":[{"start":0,"end":2,"text":"밤에 운동하면 잠이 안 와요?","cues":[{"start":0.0,"end":2.0,"text":"밤에 운동하면 잠이 안 와요?"}]},{"start":2,"end":8,"text":"운동하고 바로 누워도 잠들 준비가 되는 데는 시간이 더 걸릴 수 있어요.","cues":[{"start":2.0,"end":4.9,"text":"운동하고 바로 누워도 잠들 준비가"},{"start":4.9,"end":8.0,"text":"되는 데는 시간이 더 걸릴 수 있어요."}]},{"start":8,"end":33,"text":"밤에 강하게 운동하고 집에 옵니다. 다리는 무거운데 심장은 아직 빨리 뛰고 몸엔 열기가 남은 것 같아요. 운동은 끝났지만 몸이 회복하는 과정은 계속되죠. 피곤하다고 해서 곧 잠들 수 있을지는 알기 어려워요. 반대로 저녁에 가볍게 운동해도 잠에 별 영향이 없는 사람도 있습니다.","cues":[{"start":8.0,"end":11.3,"text":"밤에 강하게 운동하고 집에 옵니다."},{"start":11.3,"end":14.4,"text":"다리는 무거운데 심장은 아직 빨리"},{"start":14.4,"end":17.5,"text":"뛰고 몸엔 열기가 남은 것 같아요."},{"start":17.5,"end":20.3,"text":"운동은 끝났지만 몸이 회복하는"},{"start":20.3,"end":23.3,"text":"과정은 계속되죠. 피곤하다고 해서"},{"start":23.3,"end":26.6,"text":"곧 잠들 수 있을지는 알기 어려워요."},{"start":26.6,"end":29.5,"text":"반대로 저녁에 가볍게 운동해도"},{"start":29.5,"end":33.0,"text":"잠에 별 영향이 없는 사람도 있습니다."}]},{"start":33,"end":39,"text":"운동을 끝낸 때와 실제로 잠든 때가 얼마나 떨어져 있었는지 보세요.","cues":[{"start":33.0,"end":36.0,"text":"운동을 끝낸 때와 실제로 잠든 때가"},{"start":36.0,"end":39.0,"text":"얼마나 떨어져 있었는지 보세요."}]},{"start":39,"end":74,"text":"같은 저녁 운동이어도 여덟 시에 산책을 끝낸 날과 자정 직전에 힘든 운동을 마친 날은 잠을 준비할 시간이 달라요. 두 날 다 몸은 피곤했어도 잠드는 때는 다를 수 있죠. 시간을 적어 보면 운동의 영향인지, 일정이 밀려 잘 시간 자체가 짧았는지 구분할 수 있어요. 끝낸 시각과 강도를 적고 씻고 누운 시각과 실제로 잠든 때를 비교해 보세요. 운동을 빼기 전에 여건이 되는 날 강도나 시간 중 하나만 바꿔 보면 알기 쉬워요.","cues":[{"start":39.0,"end":41.3,"text":"같은 저녁 운동이어도 여덟"},{"start":41.3,"end":43.6,"text":"시에 산책을 끝낸 날과 자정"},{"start":43.6,"end":46.1,"text":"직전에 힘든 운동을 마친 날은"},{"start":46.1,"end":48.7,"text":"잠을 준비할 시간이 달라요."},{"start":48.7,"end":50.8,"text":"두 날 다 몸은 피곤했어도"},{"start":50.8,"end":53.2,"text":"잠드는 때는 다를 수 있죠."},{"start":53.2,"end":56.1,"text":"시간을 적어 보면 운동의 영향인지,"},{"start":56.1,"end":58.4,"text":"일정이 밀려 잘 시간 자체가"},{"start":58.4,"end":61.0,"text":"짧았는지 구분할 수 있어요."},{"start":61.0,"end":63.5,"text":"끝낸 시각과 강도를 적고 씻고"},{"start":63.5,"end":66.0,"text":"누운 시각과 실제로 잠든 때를"},{"start":66.0,"end":68.7,"text":"비교해 보세요. 운동을 빼기 전에"},{"start":68.7,"end":71.2,"text":"여건이 되는 날 강도나 시간 중"},{"start":71.2,"end":74.0,"text":"하나만 바꿔 보면 알기 쉬워요."}]},{"start":74,"end":79,"text":"운동을 몇 시에 끝냈고 몇 시쯤 잠들었는지 적어 보세요.","cues":[{"start":74.0,"end":75.9,"text":"운동을 몇 시에 끝냈고"},{"start":75.9,"end":79.0,"text":"몇 시쯤 잠들었는지 적어 보세요."}]}],"sources":[{"title":"How Sleep Works — Your Sleep/Wake Cycle","url":"https://www.nhlbi.nih.gov/health/sleep/sleep-wake-cycle"},{"title":"Dose-response relationship between evening exercise and sleep","url":"https://www.nature.com/articles/s41467-025-58271-x"},{"title":"Effects of Evening Exercise on Sleep in Healthy Participants: A Systematic Review and Meta-Analysis","url":"https://pubmed.ncbi.nlm.nih.gov/30374942/"},{"title":"Effects of morning versus evening exercise on sleep: a systematic review of comparative studies with a meta-analysis of randomized controlled trials","url":"https://pubmed.ncbi.nlm.nih.gov/42632303/"},{"title":"How Sleep Works — Why Is Sleep Important?","url":"https://www.nhlbi.nih.gov/health/sleep/why-sleep-important"}]},{"id":98,"title":"강하게 운동한 직후 혈당이 오르는 이유","category":"운동","original":"운동했는데 왜 혈당이 오를까? 운동할 때 간이 하는 일","length":83,"parts":[{"start":0,"end":2,"text":"운동 직후, 혈당이 올랐어요.","cues":[{"start":0.0,"end":2.0,"text":"운동 직후, 혈당이 올랐어요."}]},{"start":2,"end":8,"text":"운동할 때 근육은 포도당을 쓰고 간은 포도당을 혈액으로 보낼 수 있어요.","cues":[{"start":2.0,"end":4.6,"text":"운동할 때 근육은 포도당을 쓰고"},{"start":4.6,"end":8.0,"text":"간은 포도당을 혈액으로 보낼 수 있어요."}]},{"start":8,"end":44,"text":"운동하는 근육은 포도당을 더 가져다 쓸 수 있어요. 동시에 힘든 운동을 할 때는 간도 저장한 연료를 혈액으로 더 보낼 수 있습니다. 간에서 내보내는 쪽이 앞서면 운동 직후 혈당이 잠깐 오를 수 있어요. 연속혈당측정기 수치는 혈액 검사와 시간차가 있을 수 있어요. 예를 들어 같은 날 산책을 했을 때와 전력으로 힘을 썼을 때 센서가 다르게 찍힐 수 있어요. 운동 전 수치와 끝난 뒤 수치가 어떻게 바뀌었는지도 보세요.","cues":[{"start":8.0,"end":11.2,"text":"운동하는 근육은 포도당을 더 가져다"},{"start":11.2,"end":14.0,"text":"쓸 수 있어요. 동시에 힘든 운동을"},{"start":14.0,"end":16.3,"text":"할 때는 간도 저장한 연료를"},{"start":16.3,"end":19.2,"text":"혈액으로 더 보낼 수 있습니다."},{"start":19.2,"end":21.7,"text":"간에서 내보내는 쪽이 앞서면"},{"start":21.7,"end":25.2,"text":"운동 직후 혈당이 잠깐 오를 수 있어요."},{"start":25.2,"end":27.8,"text":"연속혈당측정기 수치는 혈액"},{"start":27.8,"end":30.8,"text":"검사와 시간차가 있을 수 있어요."},{"start":30.8,"end":33.4,"text":"예를 들어 같은 날 산책을 했을"},{"start":33.4,"end":35.7,"text":"때와 전력으로 힘을 썼을 때"},{"start":35.7,"end":38.6,"text":"센서가 다르게 찍힐 수 있어요."},{"start":38.6,"end":41.1,"text":"운동 전 수치와 끝난 뒤 수치가"},{"start":41.1,"end":44.0,"text":"어떻게 바뀌었는지도 보세요."}]},{"start":44,"end":49,"text":"운동 직후에 혈당이 올라도 시간이 지나 떨어질 수 있어요.","cues":[{"start":44.0,"end":46.3,"text":"운동 직후에 혈당이 올라도"},{"start":46.3,"end":49.0,"text":"시간이 지나 떨어질 수 있어요."}]},{"start":49,"end":76,"text":"인슐린을 쓰는 분은 운동 뒤 저혈당 위험에 대해서도 본인에게 맞는 치료 계획을 따라야 해요. 제 일형 당뇨가 있는 분은 혈당이 높고 케톤도 확인되면 운동으로 낮추려 하지 말고 의료진과 정한 대응을 따르세요. 운동 전후 몇 시간 동안 혈당이 어땠는지, 약을 쓴 때와 식사 시각은 언제였는지 함께 보면 판단에 도움이 됩니다.","cues":[{"start":49.0,"end":51.3,"text":"인슐린을 쓰는 분은 운동 뒤"},{"start":51.3,"end":54.1,"text":"저혈당 위험에 대해서도 본인에게"},{"start":54.1,"end":56.9,"text":"맞는 치료 계획을 따라야 해요."},{"start":56.9,"end":59.0,"text":"제 일형 당뇨가 있는 분은"},{"start":59.0,"end":61.4,"text":"혈당이 높고 케톤도 확인되면"},{"start":61.4,"end":63.7,"text":"운동으로 낮추려 하지 말고"},{"start":63.7,"end":66.7,"text":"의료진과 정한 대응을 따르세요."},{"start":66.7,"end":69.9,"text":"운동 전후 몇 시간 동안 혈당이 어땠는지,"},{"start":69.9,"end":73.0,"text":"약을 쓴 때와 식사 시각은 언제였는지"},{"start":73.0,"end":76.0,"text":"함께 보면 판단에 도움이 됩니다."}]},{"start":76,"end":83,"text":"운동 직후 혈당 한 점에는 간에서 내보낸 양과 근육이 쓴 양이 함께 반영돼요.","cues":[{"start":76.0,"end":79.6,"text":"운동 직후 ":20.2,"text":"근육에 힘을 쓸 기회도 줄어요."},{"start":20.2,"end":23.2,"text":"힘이 줄거나 동작이 덜 익숙해지면"},{"start":23.2,"end":25.6,"text":"무릎을 덜 쓰고도 의자에서"},{"start":25.6,"end":29.0,"text":"몸을 일으키기가 더 힘들 수 있어요."}]},{"start":29,"end":35,"text":"그렇다고 아픈 걸 참으며 예전 운동으로 바로 돌아갈 필요는 없습니다.","cues":[{"start":29.0,"end":31.4,"text":"그렇다고 아픈 걸 참으며 예전"},{"start":31.4,"end":35.0,"text":"운동으로 바로 돌아갈 필요는 없습니다."}]},{"start":35,"end":74,"text":"쉬고 나서 평지에선 덜 불편한데 낮은 의자에선 두 손을 짚어야 일어날 수도 있어요. 그럼 어떤 동작부터 되찾아야 하는지가 보이죠. 아픈 날이 줄어드는지, 일어나는 동작이 편해지는지를 함께 볼 수 있어요. 되찾고 싶은 동작을 정하고 지금 몸에 맞게 부담을 조절해 보세요. 무릎이 새로 뜨겁게 붓거나 심한 통증이 생기면 운동 계획을 세우기 전에 원인부터 확인해야 해요. 진료에서 사진 결과뿐 아니라 팔을 짚어야 일어나는지 같은 변화도 알려 주세요.","cues":[{"start":35.0,"end":36.9,"text":"쉬고 나서 평지에선 덜"},{"start":36.9,"end":39.2,"text":"불편한데 낮은 의자에선 두"},{"start":39.2,"end":42.3,"text":"손을 짚어야 일어날 수도 있어요."},{"start":42.3,"end":44.8,"text":"그럼 어떤 동작부터 되찾아야"},{"start":44.8,"end":47.1,"text":"하는지가 보이죠. 아픈 날이"},{"start":47.1,"end":49.6,"text":"줄어드는지, 일어나는 동작이"},{"start":49.6,"end":52.7,"text":"편해지는지를 함께 볼 수 있어요."},{"start":52.7,"end":55.4,"text":"되찾고 싶은 동작을 정하고 지금"},{"start":55.4,"end":58.4,"text":"몸에 맞게 부담을 조절해 보세요."},{"start":58.4,"end":61.2,"text":"무릎이 새로 뜨겁게 붓거나 심한"},{"start":61.2,"end":64.1,"text":"통증이 생기면 운동 계획을 세우기"},{"start":64.1,"end":67.0,"text":"전에 원인부터 확인해야 해요."},{"start":67.0,"end":69.5,"text":"진료에서 사진 결과뿐 아니라"},{"start":69.5,"end":71.6,"text":"팔을 짚어야 일어나는지"},{"start":71.6,"end":74.0,"text":"같은 변화도 알려 주세요."}]},{"start":74,"end":82,"text":"쉬고 나서 무릎이 얼마나 편해졌는지 보고 다시 편하게 하고 싶은 동작도 하나 정해 보세요.","cues":[{"start":74.0,"end":76.1,"text":"쉬고 나서 무릎이 얼마나"},{"start":76.1,"end":79.1,"text":"편해졌는지 보고 다시 편하게 하고"},{"start":79.1,"end":82.0,"text":"싶은 동작도 하나 정해 보세요."}]}],"sources":[{"title":"Osteoarthritis in over 16s: diagnosis and management (NG226)","url":"https://www.nice.org.uk/guidance/ng226/chapter/Recommendations"},{"title":"Osteoarthritis","url":"https://www.niams.nih.gov/health-topics/osteoarthritis"},{"title":"Osteoarthritis: Diagnosis, Treatment, and Steps t .9,"text":"큰 부담일 수 있어요. 같은 무게를"},{"start":53.9,"end":57.2,"text":"편하게 몇 번 드는 경우와는 다르죠."},{"start":57.2,"end":59.6,"text":"평소 혈압이 잘 조절되는지,"},{"start":59.6,"end":62.0,"text":"운동할 때 증상이 있었는지,"},{"start":62.0,"end":65.0,"text":"얼마나 힘을 썼고 숨을 참았는지를"},{"start":65.0,"end":67.5,"text":"같이 봐요. 혈압이 잘 조절되지"},{"start":67.5,"end":70.8,"text":"않거나 운동 중 새로 가슴이 아프거나"},{"start":70.8,"end":73.1,"text":"숨이 심하게 차면 무리해서"},{"start":73.1,"end":76.0,"text":"운동하지 말고 진료받으세요."}]},{"start":76,"end":82,"text":"덤벨이 몇 킬로인지와 함께 내가 얼마나 힘줘야 하는 동작인지 보세요.","cues":[{"start":76.0,"end":78.7,"text":"덤벨이 몇 킬로인지와 함께 내가"},{"start":78.7,"end":82.0,"text":"얼마나 힘줘야 하는 동작인지 보세요."}]}],"sources":[{"title":"Resistance Exercise Training in Individuals With and Without Cardiovascular Disease: 2023 Update: A Scientific Statement From the American Heart Association","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11209834/"},{"title":"Intra-Arterial Blood Pressure Response in Hypertensive Subjects during Low- and High-Intensity Resistance Exercise","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2845767/"},{"title":"Getting Active to Control High Blood Pressure","url":"https://www.heart.org/en/health-topics/high-blood-pressure/changes-you-can-make-to-manage-high-blood-pressure/getting-active-to-control-high-blood-pressure"},{"title":"Home Blood Pressure Monitoring","url":"https://www.heart.org/en/health-topics/high-blood-pressure/understanding-blood-pressure-readings/monitoring-your-blood-pressure-at-home"},{"title":"Exercise Prescriptions for Cardiovascular Health in Adults: 2026 ACC Scientific Statement","url":"https://www.jacc.org/doi/full/10.1016/j.jacc.2026.09.008"},{"title":"2025 AHA/ACC Multisociety Guideline for the Prevention, Detection, Evaluation and Management of High Blood Pressure in Adults","url":"https://www.ahajournals.org/doi/10.1161/CIR.0000000000001356"}]}]</script>
<script>
"use strict";
const episodes = JSON.parse(document.getElementById("episodes").textContent);
const episodeById = new Map(episodes.map(episode => [episode.id, episode]));
const $ = selector => document.querySelector(selector);
const number = id => String(id).padStart(3, "0");
const time = sec => String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
const subTime = sec => time(Math.floor(sec)) + "." + Math.round((sec - Math.floor(sec)) * 10);
const range = (start, end) => time(start) + "–" + time(end);
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
}[char]));
const statuses = {todo:"미검토", revise:"수정 필요", done:"검토 완료"};
const storageKey = "onbom-shorts-review-2026-11-20";
const isNarrow = matchMedia("(max-width:760px)");
const originalBase = "https://gusrtavedarw.github.io/onbom-youtube-review/";
let reviews = {};
let storageAvailable = true;

try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
  if (saved && typeof saved === "object" && !Array.isArray(saved)) reviews = saved;
  localStorage.setItem(storageKey, JSON.stringify(reviews));
} catch {
  storageAvailable = false;
}
const marks = id => ({
  status: Object.hasOwn(statuses, reviews[id]?.status) ? reviews[id].status : "todo",
  memo: typeof reviews[id]?.memo === "string" ? reviews[id].memo : ""
});
const initialId = Number(location.hash.match(/^#short-(\d{1,3})$/)?.[1]);
let currentId = episodeById.has(initialId) ? initialId : episodes[0].id;
let matching = episodes;
let cutMode = false;
let toastTimer;

$("#library").open = !isNarrow.matches;
for (const category of new Set(episodes.map(episode => episode.category))) {
  $("#category").add(new Option(category, category));
}
function announce(message) {
  const element = $("#notice");
  clearTimeout(toastTimer);
  element.textContent = message;
  element.hidden = false;
  toastTimer = setTimeout(() => { element.hidden = true; }, 2300);
}
function save(id, update) {
  const next = {...marks(id), ...update};
  if (next.status === "todo" && !next.memo) delete reviews[id];
  else reviews[id] = next;
  try {
    localStorage.setItem(storageKey, JSON.stringify(reviews));
  } catch {
    storageAvailable = false;
    $("#save-hint").textContent = "현재 브라우저에서 저장이 제한되어 이 탭을 닫으면 메모가 사라집니다.";
  }
}
function updateProgress() {
  const count = episodes.filter(episode => marks(episode.id).status === "done").length;
  $("#done").textContent = count;
  $("#progress").value = count;
}
function renderList() {
  const query = $("#search").value.trim().normalize("NFC").toLowerCase();
  const category = $("#category").value;
  const status = $("#status-filter").value;
  matching = episodes.filter(episode => {
    if (category && episode.category !== category) return false;
    if (status && marks(episode.id).status !== status) return false;
    if (!query) return true;
    if (/^#?\d{1,3}$/.test(query)) return episode.id === Number(query.replace("#",""));
    return [episode.title, episode.original, episode.category, ...episode.parts.map(part => part.text)]
      .join(" ").toLowerCase().includes(query);
  });
  $("#count").textContent = matching.length + "편";
  const list = $("#list");
  if (!matching.length) {
    list.innerHTML = '<p class="empty">검색 조건에 맞는 대본이 없습니다.</p>';
    return;
  }
  list.innerHTML = matching.map(episode => {
    const status = marks(episode.id).status;
    return `<button type="button" class="entry" data-episode="${episode.id}" aria-current="${episode.id === currentId}">
      <span class="entry-num">${number(episode.id)}</span>
      <span><span class="entry-title">${escapeHtml(episode.title)}</span>
      <span class="entry-hook">${escapeHtml(episode.parts[0].text)}</span>
      ${status === "todo" ? "" : `<span class="entry-state">${statuses[status]}</span>`}</span>
    </button>`;
  }).join("");
}
function neighbors() {
  const position = matching.findIndex(episode => episode.id === currentId);
  if (position < 0) return [null, matching[0]?.id];
  return [matching[position - 1]?.id, matching[position + 1]?.id];
}
function updateNavigation() {
  const [before, after] = neighbors();
  $("#previous").disabled = !before;
  $("#next").disabled = !after;
}
function syncSelection() {
  for (const button of document.querySelectorAll(".entry")) {
    button.setAttribute("aria-current", String(Number(button.dataset.episode) === currentId));
  }
}
const sectionLabels = ["첫 훅", "시청 이유", "본문", "중간 훅", "본문", "결말"];
const sectionClasses = ["hook", "beat", "beat", "beat pivot", "beat", "beat ending"];
function episodeNarration(episode) {
  return episode.parts.map((part, index) =>
    `<section class="${sectionClasses[index]}">
      <h3>${sectionLabels[index]} <span class="track">${range(part.start, part.end)}</span></h3>
      <p>${escapeHtml(part.text)}</p>
    </section>`
  ).join("");
}
function episodeCues(episode) {
  return episode.parts.flatMap((part, index) => part.cues.map(cue =>
    `<div class="cue"><time>${subTime(cue.start)}–${subTime(cue.end)} · ${sectionLabels[index]}</time><p>${escapeHtml(cue.text)}</p></div>`
  )).join("");
}
function episodeSourceLinks(episode) {
  return episode.sources.map(source =>
    `<li><a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.title)}</a></li>`
  ).join("");
}
function renderReader() {
  const episode = episodeById.get(currentId);
  const selected = marks(currentId);
  const narration = episodeNarration(episode);
  const cues = episodeCues(episode);
  const links = episodeSourceLinks(episode);
  const id = number(currentId);
  $("#reader").innerHTML = `
    <div class="reader-header">
      <div class="episode-meta"><span class="num">${id}</span><span>${escapeHtml(episode.category)}</span><time title="녹음 전 예상 길이" datetime="PT${episode.length}S">약 ${time(episode.length)}</time></div>
      <h2 tabindex="-1" id="script-title">${escapeHtml(episode.title)}</h2>
      <div class="actions">
        <button type="button" class="primary" id="copy">이 편 대본 전체 복사</button>
        <button type="button" id="download-html">이 편 HTML 다운로드</button>
        <button type="button" id="toggle-cuts" aria-pressed="${cutMode}">컷 타임라인</button>
        <label>검토 상태 <select id="episode-status">${Object.entries(statuses).map(([key, value]) =>
          `<option value="${key}" ${selected.status === key ? "selected" : ""}>${value}</option>`
        ).join("")}</select></label>
      </div>
    </div>
    <div class="content">
      <div id="reading" ${cutMode ? "hidden" : ""}>${narration}</div>
      <div id="cut-view" class="switch-panel" ${cutMode ? "" : "hidden"}><p class="cuts-head">문장 흐름에 맞춘 자막·화면 전환 지점입니다. 실제 녹음에 맞춰 시간을 조정하세요.</p><div class="cuts">${cues}</div></div>
      <div class="review">
        <div><label for="memo">검토 메모</label><textarea id="memo" placeholder="훅, 표현, 길이 등 수정할 점" aria-describedby="save-hint"></textarea>
        <p class="hint" id="save-hint">${storageAvailable ? "메모와 상태는 이 브라우저에 자동 저장됩니다." : "현재 브라우저에서 저장이 제한되어 이 탭을 닫으면 메모가 사라집니다."}</p></div>
        <details class="sources"><summary>원본 대본과 근거</summary><div class="source-body">
          <p><a href="${originalBase}#topic-${id}/script" target="_blank" rel="noopener noreferrer">원본 ${id}편 · ${escapeHtml(episode.original)}</a></p>
          <ul>${links}</ul>
        </div></details>
        <nav class="move" aria-label="검색 결과 안에서 이동"><button id="previous" type="button">← 이전 편</button><button id="next" type="button">다음 편 →</button></nav>
      </div>
    </div>`;
  $("#memo").value = selected.memo;
  updateNavigation();
}
function openEpisode(id, {user = false, updateHash = true} = {}) {
  if (!episodeById.has(id)) return;
  currentId = id;
  if (updateHash) history.replaceState(null, "", "#short-" + number(id));
  syncSelection();
  renderReader();
  if (user && isNarrow.matches) $("#library").open = false;
  if (user) {
    $("#script-title").focus({preventScroll:true});
    $("#reader").scrollIntoView({block:"start"});
  }
}
async function copyNarration() {
  const text = episodeById.get(currentId).parts.map(part => part.text).join("\n\n");
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const field = document.createElement("textarea");
    field.value = text;
    field.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.append(field);
    field.select();
    let copied = false;
    try { copied = document.execCommand("copy"); } catch {}
    field.remove();
    $("#copy")?.focus({preventScroll:true});
    if (!copied) {
      const dialog = $("#copy-fallback");
      const fullScript = $("#copy-text");
      fullScript.value = text;
      if (!dialog.open) dialog.showModal();
      fullScript.focus();
      fullScript.select();
      fullScript.setSelectionRange(0, text.length);
      return;
    }
  }
  announce("이 편의 낭독문 전체를 복사했습니다.");
}
function episodeHtml(episode) {
  const id = number(episode.id);
  const title = escapeHtml(episode.title);
  return `<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온봄 쇼츠 ${id}편 · ${title}</title>
<style>
  :root {font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#182c27;background:#eef3f0}
  body {max-width:840px;margin:auto;padding:24px;line-height:1.65;box-sizing:border-box}
  main {background:#fff;padding:clamp(16px,4vw,40px);border:1px solid #dce6df;border-radius:14px;overflow-wrap:anywhere}
  header {border-bottom:1px solid #dce6df;padding-bottom:18px}
  h1 {line-height:1.25;font-size:clamp(1.4rem,5vw,2.1rem);margin:8px 0}
  h2 {font-size:1.25rem;margin-top:28px}
  h3 {font-size:.95rem;margin:.65em 0 .2em}
  p {margin:.3em 0 .8em}
  .meta,.track,.cue time {color:#4c635b;font-size:.85rem;font-variant-numeric:tabular-nums}
  .hook {background:#e2f0e8;border-radius:8px;padding:8px 14px}
  .cue {border-top:1px solid #dce6df;padding-block:6px}
  .cue p {margin:.15em 0}
  a {color:#1c5242;text-underline-offset:3px}
  @media print {body,main {background:white;padding:0;border:0} .cue,section {break-inside:avoid}}
</style>
</head>
<body>
<main>
  <header>
    <p class="meta">온봄의원 쇼츠 ${id}편 · ${escapeHtml(episode.category)} · 약 ${time(episode.length)}</p>
    <h1>${title}</h1>
  </header>
  <section aria-labelledby="narration-title">
    <h2 id="narration-title">낭독 대본</h2>
    ${episodeNarration(episode)}
  </section>
  <section aria-labelledby="captions-title">
    <h2 id="captions-title">자막 타임코드</h2>
    <p class="meta">타임코드는 녹음 전 가안입니다.</p>
    ${episodeCues(episode)}
  </section>
  <section aria-labelledby="sources-title">
    <h2 id="sources-title">원본 대본과 근거</h2>
    <p><a href="${originalBase}#topic-${id}/script">${escapeHtml(episode.original)}</a></p>
    <ul>${episodeSourceLinks(episode)}</ul>
  </section>
</main>
</body>
</html>`;
}
function downloadEpisode() {
  const episode = episodeById.get(currentId);
  const file = new Blob([episodeHtml(episode)], {type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(file);
  const link = document.createElement("a");
  link.href = url;
  link.download = "onbom-short-" + number(episode.id) + ".html";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  announce(number(episode.id) + "편 HTML 다운로드를 시작했습니다.");
}
function applyFilters() {
  renderList();
  if (matching.length && !matching.some(episode => episode.id === currentId)) openEpisode(matching[0].id);
  else updateNavigation();
}
$("#search").addEventListener("input", applyFilters);
$("#category").addEventListener("change", applyFilters);
$("#status-filter").addEventListener("change", applyFilters);
$("#reset").addEventListener("click", () => {
  for (const selector of ["#search", "#category", "#status-filter"]) $(selector).value = "";
  applyFilters();
  $("#search").focus();
});
$("#list").addEventListener("click", event => {
  const button = event.target.closest("[data-episode]");
  if (button) openEpisode(Number(button.dataset.episode), {user:true});
});
$("#reader").addEventListener("click", event => {
  const id = event.target.closest("button")?.id;
  switch (id) {
    case "copy": copyNarration(); break;
    case "download-html": downloadEpisode(); break;
    case "toggle-cuts":
      cutMode = !cutMode;
      $("#toggle-cuts").setAttribute("aria-pressed", String(cutMode));
      $("#reading").hidden = cutMode;
      $("#cut-view").hidden = !cutMode;
      break;
    case "previous": openEpisode(neighbors()[0], {user:true}); break;
    case "next": openEpisode(neighbors()[1], {user:true}); break;
  }
});
$("#reader").addEventListener("input", event => {
  if (event.target.id === "memo") save(currentId, {memo:event.target.value});
});
$("#reader").addEventListener("change", event => {
  if (event.target.id !== "episode-status") return;
  save(currentId, {status:event.target.value});
  updateProgress();
  renderList();
  updateNavigation();
  announce(storageAvailable ? "검토 상태를 저장했습니다." : "이 탭에 검토 상태를 반영했습니다.");
});
window.addEventListener("hashchange", () => {
  const match = location.hash.match(/^#short-(\d{1,3})$/);
  if (match) openEpisode(Number(match[1]), {updateHash:false});
});
renderList();
renderReader();
updateProgress();
</script>
</body>
</html>
